<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

        ::-webkit-scrollbar { width: 8px; height: 8px; }

<!-- EK:INICIO estilos -->
<style id="ek-kit-css">
/* ==== ENTALPÍA LAB · Kit estándar de aplicativos (Tecnologías Básicas) ====
   Fuente única: AppsPlataforma/_kit/entalpia-kit.css — se inserta en línea con _kit/aplicar_kit.py.
   Todas las clases llevan prefijo ek- para no chocar con Tailwind ni con el CSS propio de cada app. */
:root{
  --ek-bg:#0a0d12;--ek-pn:#141922;--ek-pn2:#10151d;--ek-tx:#e4eefa;--ek-mu:#8fa3bd;
  --ek-ac:#2f86e8;--ek-ac2:#62b0ff;--ek-bd:#2a3648;--ek-ok:#3fbf7f;--ek-wa:#e8b23a;--ek-er:#ef5b5b;
  --ek-metal:linear-gradient(135deg,#9bd0ff 0%,#2f6fc8 45%,#173a6b 100%);
  --ek-hdr:52px;--ek-ftr:30px;
}
html.ek body{padding-top:var(--ek-hdr)!important;padding-bottom:var(--ek-ftr)!important;box-sizing:border-box}
html.ek.ek-sinpie body{padding-bottom:0!important}
/* Las vistas a pantalla completa descuentan la cabecera y el pie del kit */
html.ek .h-screen{height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important}
html.ek .min-h-screen{min-height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important}
html.ek .h-\[100dvh\]{height:calc(100dvh - var(--ek-hdr) - var(--ek-ftr))!important}

/* ---------- cabecera ---------- */
.ek-hdr{position:fixed;top:0;left:0;right:0;height:var(--ek-hdr);z-index:2147483000;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,#121924,#0c1118);border-bottom:1px solid var(--ek-bd);color:var(--ek-tx);
  font:14px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;min-width:0}
.ek-hdr *{box-sizing:border-box}
.ek-hdr .ek-logo{height:38px;width:auto;border-radius:6px;flex:none;display:block}
.ek-hdr .ek-tit{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.ek-hdr .ek-tit b{font-size:16px;letter-spacing:.3px;background:var(--ek-metal);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ek-hdr .ek-tit span{font-size:11.5px;color:var(--ek-mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-hdr .ek-sp{flex:1;min-width:6px}
.ek-hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ek-bd);background:#18202c;color:var(--ek-tx);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;font:13px/1.2 Inter,system-ui,sans-serif;text-decoration:none}
.ek-hbtn:hover{border-color:var(--ek-ac)}
.ek-hbtn.pri{background:var(--ek-ac);border-color:var(--ek-ac);color:#fff}

/* ---------- pie ---------- */
.ek-ftr{position:fixed;left:0;right:0;bottom:0;height:var(--ek-ftr);z-index:2147482999;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-top:1px solid var(--ek-bd);background:#0c1118;color:var(--ek-mu);font:11.5px/1.2 Inter,system-ui,sans-serif;box-sizing:border-box;min-width:0}
.ek-ftr img{height:22px;width:auto;border-radius:4px;flex:none}
.ek-ftr .ek-sp{flex:1}
.ek-ftr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- modales ---------- */
.ek-modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;align-items:center;justify-content:center;z-index:2147483100;padding:12px;
  font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ek-tx)}
.ek-modal.on{display:flex}
.ek-mbox{position:relative;background:var(--ek-pn);border:1px solid var(--ek-bd);border-radius:12px;max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:left}
.ek-mhd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ek-bd);cursor:move;user-select:none;flex:none}
.ek-mhd b{font-size:15px;font-weight:700}.ek-mhd .ek-sp{flex:1}
.ek-mbd{padding:12px 14px;overflow:auto;min-height:0}
.ek-mbd h3{font-size:14px;margin:14px 0 6px;color:var(--ek-ac2);font-weight:700}
.ek-mbd h3:first-child{margin-top:2px}
.ek-mbd p,.ek-mbd li{color:#cfdcec;margin:4px 0}
.ek-mbd ul,.ek-mbd ol{padding-left:22px;margin:4px 0}.ek-mbd ul{list-style:disc}.ek-mbd ol{list-style:decimal}
.ek-mbd code,.ek-mbd .ek-f{font-family:Consolas,"JetBrains Mono",monospace;background:#0d1219;border:1px solid var(--ek-bd);border-radius:5px;padding:1px 5px;font-size:12.5px;color:#cfe6ff}
.ek-mbd .ek-f{display:block;padding:6px 9px;margin:6px 0;white-space:pre-wrap}
.ek-mbd table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.ek-mbd th,.ek-mbd td{border-bottom:1px solid #1d2734;padding:5px 6px;text-align:left}
.ek-mbd th{color:var(--ek-mu);font-weight:600}
.ek-mft{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--ek-bd);flex:none;flex-wrap:wrap}
.ek-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ek-bd);background:#1a2330;color:var(--ek-tx);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font:13px/1.2 Inter,system-ui,sans-serif}
.ek-btn:hover{border-color:var(--ek-ac)}
.ek-btn.pri{background:var(--ek-ac);border-color:var(--ek-ac);color:#fff}
.ek-btn.dan{border-color:#6b2a2a;color:#ffb3b3}
.ek-btn.sm{padding:4px 8px;font-size:12.5px}
.ek-x{border:0;background:none;color:var(--ek-mu);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.ek-x:hover{color:#fff}
.ek-note{font-size:12.5px;border-left:3px solid var(--ek-ac);background:#0f1724;padding:6px 9px;border-radius:0 6px 6px 0;margin:8px 0;color:#c4d4ea}
.ek-note.wa{border-color:var(--ek-wa)}.ek-note.er{border-color:var(--ek-er)}.ek-note.ok{border-color:var(--ek-ok)}
#ek-toast{position:fixed;left:50%;bottom:calc(var(--ek-ftr) + 14px);transform:translateX(-50%);background:#16243a;color:var(--ek-tx);border:1px solid var(--ek-ac);border-radius:8px;padding:8px 12px;z-index:2147483200;display:none;max-width:min(92vw,560px);font:13px/1.4 Inter,system-ui,sans-serif;word-break:break-word;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* bloques que solo existen en impresión */
.ek-print{display:none}
#ek-reporte{display:none}

@media (max-width:720px){
  :root{--ek-hdr:48px;--ek-ftr:26px}
  .ek-hdr .ek-tit span{display:none}
  .ek-hdr .ek-logo{height:32px}
  .ek-hbtn .ek-lbl{display:none}
  .ek-ftr .ek-hide-m{display:none}
}

/* ---------- impresión / PDF del navegador ---------- */
@media print{
  html.ek body{padding:0!important}
  .ek-hdr,.ek-ftr,.ek-modal,#ek-toast{display:none!important}
  .ek-print{display:block!important;visibility:visible!important;color:#111;font:9.5pt/1.35 "Segoe UI",Arial,sans-serif;position:static!important}
  .ek-print *{visibility:visible!important}
  .ek-print-cab{display:flex!important;align-items:center;gap:12px;border-bottom:2px solid #1d4f8f;padding:0 0 6px;margin:0 0 10px;break-inside:avoid}
  .ek-print-cab img{height:44px;width:auto}
  .ek-print-cab h1{font-size:14pt;margin:0;color:#173a6b;font-weight:700}
  .ek-print-cab div div{font-size:9pt;color:#444}
  .ek-print-pie{display:flex!important;align-items:center;gap:8px;margin-top:14px;border-top:1px solid #c8d3e2;padding-top:6px;font-size:8pt;color:#555;break-inside:avoid}
  .ek-print-pie img{height:26px;width:auto}
  .ek-print-pie span{flex:1}
  html.ek .h-screen,html.ek .min-h-screen{height:auto!important;min-height:0!important}
  /* informe estándar EK.informe(): solo se imprime el informe */
  html.ek-informe body>*:not(#ek-reporte){display:none!important}
  html.ek-informe body{background:#fff!important;color:#111!important}
  html.ek-informe #ek-reporte{display:block!important;visibility:visible!important;color:#111;font:9.6pt/1.4 "Segoe UI",Arial,sans-serif}
  html.ek-informe #ek-reporte *{visibility:visible!important}
  #ek-reporte .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1d4f8f;padding-bottom:6px;margin-bottom:8px}
  #ek-reporte .rh img{height:46px;width:auto}
  #ek-reporte h1{font-size:14.5pt;margin:0;color:#173a6b;font-weight:700}
  #ek-reporte ul{list-style:disc;padding-left:18px;margin:4px 0}#ek-reporte ol{list-style:decimal;padding-left:18px}
  #ek-reporte .rh div div{font-size:9pt;color:#444}
  #ek-reporte h2{font-size:11pt;font-weight:700;color:#173a6b;margin:12px 0 4px;border-bottom:1px solid #c8d3e2;padding-bottom:2px;break-after:avoid}
  #ek-reporte table{width:100%;border-collapse:collapse;font-size:8.8pt;margin:2px 0 4px}
  #ek-reporte th,#ek-reporte td{border:1px solid #c8d3e2;padding:3px 5px;text-align:left;background:#fff;color:#111;vertical-align:top}
  #ek-reporte th{background:#eaf1fa!important;font-weight:600}
  #ek-reporte td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #ek-reporte tr{break-inside:avoid}
  #ek-reporte .ok{color:#17663f;font-weight:700}#ek-reporte .no{color:#a3161d;font-weight:700}#ek-reporte .wa{color:#8a5a00;font-weight:700}
  #ek-reporte .ver{border:1.5px solid #1d4f8f;border-radius:6px;padding:7px 10px;margin:10px 0;font-size:10.5pt;break-inside:avoid}
  #ek-reporte .ver.ok{border-color:#17663f;background:#effaf3!important}#ek-reporte .ver.no{border-color:#a3161d;background:#fdf0f0!important}#ek-reporte .ver.wa{border-color:#8a5a00;background:#fdf8ea!important}
  #ek-reporte .txt{margin:4px 0;white-space:pre-wrap}
  #ek-reporte .fm{font-family:Consolas,monospace;font-size:8.6pt;background:#f4f7fb!important;border:1px solid #d5dfec;padding:4px 7px;margin:4px 0;white-space:pre-wrap}
  #ek-reporte .firmas td{height:48px;vertical-align:bottom;text-align:center;font-size:8.6pt;color:#444}
  #ek-reporte .pie{margin-top:14px;border-top:1px solid #c8d3e2;padding-top:6px;font-size:8pt;color:#555;display:flex;align-items:center;gap:8px;break-inside:avoid}
  #ek-reporte .pie img{height:28px;width:auto}
  #ek-reporte img.fig{max-width:100%;max-height:120mm;display:block;margin:6px auto;border:1px solid #c8d3e2}
  html.ek-informe .ek-print{display:none!important}
  @page{margin:12mm 12mm 14mm;@bottom-right{content:"Pág. " counter(page) " / " counter(pages);font:8pt Arial,sans-serif;color:#555}}
}

/* ajustes propios del aplicativo */
#root>div{height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important;min-height:0!important}
</style>
<!-- EK:FIN estilos -->
</head>

          const [documents, setDocuments] = useState([]);
          const [categories, setCategories] = useState(['Todos']);
          const [activeCategory, setActiveCategory] = useState('Todos');
          const [searchTerm, setSearchTerm] = useState('');
          const [currentTime, setCurrentTime] = useState(new Date());
          const [sidebarOpen, setSidebarOpen] = useState(true);
          const [viewMode, setViewMode] = useState('grid');
          const [currentPage, setCurrentPage] = useState(1);
          const itemsPerPage = 12;

          useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 1000);

            // CARGA DE BASE DE DATOS
            if (csvData) {
                Papa.parse(csvData, {
                    header: true,
                    delimiter: ";",
                    skipEmptyLines: true,
                    complete: (results) => {
                        const parsedDocs = results.data.map((row, index) => {
                            const rawCat = row['Carpeta Actual'] || 'General';
                            const cleanCat = rawCat.replace(/^\d+\.\s*/, '').trim(); 
                            const rawName = row['Nombre del Archivo'] || 'Documento sin nombre';
                            const title = rawName.replace(/\.pdf$/i, '');
                            const url = row['Enlace (URL)'];
                            if (!url || url.length < 5) return null;

                            return {
                                id: `DOC-${String(index + 1).padStart(3, '0')}`,
                                code: rawName,
                                title: title,
                                category: cleanCat || 'Sin Categoría',
                                originalCategory: rawCat,
                                date: row['Fecha Creación'] || 'N/A',
                                status: 'VIGENTE',
                                url: url,
                                type: row['Tipo'] || 'Archivo'
                            };
                        }).filter(doc => doc !== null);

                        setDocuments(parsedDocs);
                        const cats = [...new Set(parsedDocs.map(d => d.category))].sort();
                        setCategories(['Todos', ...cats]);
                    },
                    error: (err) => console.error("Error CSV:", err)
                });
            }
            return () => clearInterval(timer);
          }, []);

          // Filtrado
          const filteredDocs = useMemo(() => {
            // Búsqueda sin distinguir mayúsculas ni tildes ("resolucion" encuentra "Resolución")
            const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            const q = norm(searchTerm.trim());
            return documents.filter(doc => {
                const matchesCategory = activeCategory === 'Todos' || doc.category === activeCategory;
                const matchesSearch = norm(doc.title).includes(q) || norm(doc.code).includes(q);
                return matchesCategory && matchesSearch;
            });
          }, [documents, activeCategory, searchTerm]);

          // Paginación
          const totalPages = Math.ceil(filteredDocs.length / itemsPerPage);
          const currentDocs = filteredDocs.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

          useEffect(() => {
              setCurrentPage(1);
          }, [activeCategory, searchTerm]);

          const getCategoryIcon = (cat) => {
             const lower = cat.toLowerCase();
             if (lower.includes('resol')) return <Icons.BookOpen size={12} className="text-purple-500" />;
             if (lower.includes('certif')) return <Icons.Shield size={12} className="text-emerald-500" />;
             if (lower.includes('libreria')) return <Icons.Database size={12} className="text-blue-500" />;
             if (lower.includes('ing') || lower.includes('man')) return <Icons.Cpu size={12} className="text-cyan-500" />;
             return <Icons.FileText size={12} className="text-slate-400" />;
          };

          return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-mono flex flex-col overflow-hidden selection:bg-cyan-500/30">
              
              {/* --- HEADER --- */}
              <header className="h-16 border-b border-slate-700 bg-slate-950 flex items-center justify-between px-4 z-20 shadow-lg shadow-black/20">
                <div className="flex items-center gap-3">
                  <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 hover:bg-slate-800 rounded border border-slate-700 transition-colors">
                    {sidebarOpen ? <Icons.X size={20} className="text-cyan-400" /> : <Icons.Menu size={20} className="text-cyan-400" />}
                  </button>
                  <div className="flex items-center gap-2">
                    <Icons.Database className="text-cyan-500" size={24} />
                    <div>
                      <h1 className="text-lg font-bold tracking-wider text-cyan-50 uppercase">Gestor Normativo</h1>
                      <div className="text-[10px] text-cyan-600 leading-none tracking-[0.2em]">
                        LIBRERÍA CENTRAL ({documents.length} DOCS)
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-4">
                  <div className="hidden md:flex items-center gap-2 text-xs text-slate-500 border-l border-slate-800 pl-4">
                    <Icons.Clock size={14} />
                    <span>{currentTime.toLocaleTimeString('es-ES', { hour12: false })}</span>
                  </div>
                </div>
              </header>

              <div className="flex flex-1 overflow-hidden relative">
                
                {/* --- SIDEBAR --- */}
                <aside className={`${sidebarOpen ? 'w-72' : 'w-0'} bg-slate-950 border-r border-slate-800 transition-all duration-300 flex flex-col overflow-hidden relative`}>
                  <div className="absolute inset-0 opacity-[0.03] pointer-events-none" 
                       style={{ backgroundImage: 'linear-gradient(#00ffff 1px, transparent 1px), linear-gradient(90deg, #00ffff 1px, transparent 1px)', backgroundSize: '20px 20px' }}>
                  </div>

                  <div className="p-4 space-y-6 z-10 overflow-y-auto h-full pb-20 custom-scrollbar">
                    <div>
                      <h3 className="text-xs font-bold text-slate-500 mb-3 px-2 flex items-center gap-2 uppercase">
                        <Icons.Filter size={12} />
                        CARPETAS
                      </h3>
                      <nav className="space-y-1">
                        {categories.map(cat => (
                          <button
                            key={cat}
                            onClick={() => setActiveCategory(cat)}
                            className={`w-full text-left px-3 py-2 text-xs uppercase tracking-wide border-l-2 transition-all duration-200 flex items-center justify-between group
                              ${activeCategory === cat 
                                ? 'border-cyan-500 bg-cyan-950/30 text-cyan-300 shadow-[0_0_10px_rgba(6,182,212,0.1)]' 
                                : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                              }`}
                          >
                            <span className="truncate pr-2">{cat}</span>
                            {activeCategory === cat && getCategoryIcon(cat)}
                          </button>
                        ))}
                      </nav>
                    </div>
                  </div>
                </aside>

                {/* --- MAIN --- */}
                <main className="flex-1 flex flex-col relative overflow-hidden bg-slate-900">
                  <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent opacity-30 scanline-effect"></div>
                  
                  {/* SEARCH & CONTROLS */}
                  <div className="p-4 md:p-6 border-b border-slate-800 bg-slate-900/50 backdrop-blur-sm z-10 flex flex-col md:flex-row gap-4 justify-between items-center">
                    <div className="relative w-full max-w-xl">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <Icons.Search className="h-5 w-5 text-slate-500" />
                      </div>
                      <input
                        type="text"
                        placeholder="BUSCAR DOCUMENTO..."
                        className="block w-full pl-10 pr-3 py-3 border border-slate-700 bg-slate-950/50 text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-cyan-500 focus:border-cyan-500 sm:text-sm uppercase tracking-wider rounded-sm shadow-inner"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                      />
                    </div>
                    
                    <div className="flex bg-slate-950 border border-slate-700 rounded p-1">
                        <button onClick={() => setViewMode('grid')} className={`p-2 rounded ${viewMode === 'grid' ? 'bg-cyan-900/50 text-cyan-400' : 'text-slate-500 hover:text-slate-300'}`}><Icons.Grid size={18} /></button>
                        <button onClick={() => setViewMode('list')} className={`p-2 rounded ${viewMode === 'list' ? 'bg-cyan-900/50 text-cyan-400' : 'text-slate-500 hover:text-slate-300'}`}><Icons.List size={18} /></button>
                    </div>
                  </div>

                  {/* CONTENT AREA */}
                  <div className="flex-1 overflow-y-auto p-4 md:p-6">
                    
                    {/* GRID VIEW */}
                    {viewMode === 'grid' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {currentDocs.map((doc) => (
                            <div key={doc.id} className="group relative bg-slate-950 border border-slate-800 hover:border-cyan-500/50 transition-all duration-300 overflow-hidden flex flex-col h-48">
                                <div className="absolute top-0 right-0 w-4 h-4 border-t border-r border-slate-600 group-hover:border-cyan-500 transition-colors"></div>
                                <div className="absolute bottom-0 left-0 w-4 h-4 border-b border-l border-slate-600 group-hover:border-cyan-500 transition-colors"></div>
                                <div className="p-4 flex flex-col h-full">
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="flex items-center gap-2">
                                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">{doc.id}</span>
                                        </div>
                                        <span className="text-[9px] px-2 py-0.5 border rounded-sm font-bold tracking-wider text-emerald-400 border-emerald-400 bg-emerald-400/10">VIGENTE</span>
                                    </div>
                                    <h4 className="text-xs text-cyan-100 font-bold mb-1 leading-tight group-hover:text-cyan-400 transition-colors uppercase truncate" title={doc.code}>{doc.code}</h4>
                                    <p className="text-[11px] text-slate-400 mb-2 flex-grow line-clamp-3 leading-relaxed border-t border-slate-900 pt-2">{doc.title}</p>
                                    <div className="flex items-center justify-between mt-auto">
                                        <span className="text-[9px] text-slate-600 bg-slate-900 px-1 rounded">{doc.date}</span>
                                        <a href={doc.url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 text-[10px] text-cyan-500 hover:text-cyan-300 hover:underline uppercase tracking-wide font-bold">ABRIR <Icons.ExternalLink size={10} /></a>
                                    </div>
                                </div>
                            </div>
                        ))}
                        </div>
                    )}

                    {/* LIST VIEW */}
                    {viewMode === 'list' && (
                        <div className="bg-slate-950 border border-slate-800 rounded overflow-hidden">
                            <table className="w-full text-left text-xs">
                                <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                                    <tr>
                                        <th className="p-3 uppercase tracking-wider font-medium">ID</th>
                                        <th className="p-3 uppercase tracking-wider font-medium">Nombre / Archivo</th>
                                        <th className="p-3 uppercase tracking-wider font-medium">Categoría</th>
                                        <th className="p-3 uppercase tracking-wider font-medium">Fecha</th>
                                        <th className="p-3 uppercase tracking-wider font-medium text-right">Link</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {currentDocs.map(doc => (
                                        <tr key={doc.id} className="hover:bg-slate-900/50 transition-colors group">
                                            <td className="p-3 font-mono text-slate-500">{doc.id}</td>
                                            <td className="p-3 font-bold text-cyan-100 group-hover:text-cyan-400">{doc.title}</td>
                                            <td className="p-3 text-slate-500">{doc.category}</td>
                                            <td className="p-3 text-slate-500">{doc.date}</td>
                                            <td className="p-3 text-right"><a href={doc.url} target="_blank" className="text-cyan-600 hover:text-cyan-400"><Icons.ExternalLink size={14} /></a></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                    
                    {filteredDocs.length === 0 && (
                      <div className="h-full flex flex-col items-center justify-center text-slate-600 opacity-50 py-12">
                        <Icons.List size={48} className="mb-4" />
                        <p className="text-lg uppercase tracking-widest">No se encontraron registros</p>
                      </div>
                    )}
                  </div>
                  
                  {/* FOOTER */}
                  <footer className="h-12 bg-slate-950 border-t border-slate-800 flex items-center justify-between px-4 text-[10px] text-slate-500 z-10">
                    <div className="flex items-center gap-4">
                        <span>PÁGINA {currentPage} DE {totalPages || 1}</span>
                        <span className="hidden md:inline text-slate-600">|</span>
                        <span>REGISTROS: {filteredDocs.length}</span>
                    </div>
                    <div className="flex gap-2">
                        <button disabled={currentPage === 1} onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} className="p-1.5 border border-slate-700 rounded hover:bg-slate-800 disabled:opacity-30 transition-colors"><Icons.ChevronLeft size={14} /></button>
                        <button disabled={currentPage === totalPages} onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} className="p-1.5 border border-slate-700 rounded hover:bg-slate-800 disabled:opacity-30 transition-colors"><Icons.ChevronRight size={14} /></button>
                    </div>
                  </footer>
                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GestorNormativo />);
    </script>
</body>
</html>
