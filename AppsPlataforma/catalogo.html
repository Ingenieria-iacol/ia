<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entalpia | Hub de Ingeniería</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0071eb;--blue-d:#005bb5;--bg:#141414;--text:#fff;--gray:#b3b3b3;--green:#46d369;--gold:#ffd700;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto','Helvetica Neue',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:url('logo_entalpia.png') center/80% no-repeat;opacity:.05;z-index:-1;pointer-events:none}
.hidden{display:none!important}
a{text-decoration:none;color:inherit;cursor:pointer}
button{font:inherit}
:focus-visible{outline:2px solid #6db3ff;outline-offset:2px}
.btn{cursor:pointer;border:none;font-weight:500;border-radius:6px;transition:transform .2s,filter .2s}
.btn:hover{transform:scale(1.02);filter:brightness(1.1)}

/* NAVBAR */
.navbar{position:fixed;top:0;width:100%;padding:15px 4%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);z-index:1000;transition:background-color .3s,backdrop-filter .3s}
.navbar.scrolled{background:rgba(20,20,20,.88);backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.nav-logo{color:var(--blue);font-size:1.8rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;text-shadow:0 0 12px rgba(0,113,235,.45)}
.nav-links{display:flex;gap:25px;font-size:.95rem;font-weight:500;color:var(--gray);align-items:center}
.nav-item{cursor:pointer;transition:color .3s;background:none;border:0;color:inherit;font-size:inherit}
.nav-item:hover,.nav-item.active{color:#fff}
.nav-item.active{font-weight:700}
.nav-item i{display:none}
.nav-btn-planes{background:var(--blue);color:#fff!important;padding:5px 15px;border-radius:6px;font-weight:600;transition:.3s}
.nav-btn-planes:hover{background:var(--blue-d);box-shadow:0 0 14px rgba(0,113,235,.6);transform:scale(1.05)}
.user-menu{display:flex;align-items:center;gap:20px;font-size:1.1rem}
.icon-btn{background:none;border:0;color:#ccc;font-size:1.1rem;cursor:pointer;transition:color .2s}
.icon-btn:hover{color:#fff}
.profile-badge{border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:4px;font-size:.7rem;font-weight:700;letter-spacing:1px}
.search-box{display:flex;align-items:center;border:1px solid transparent;padding:5px;transition:all .3s var(--ease);overflow:hidden;width:32px;border-radius:6px}
.search-box.active{background:rgba(20,20,20,.92);border-color:var(--blue);width:280px;box-shadow:0 0 12px rgba(0,113,235,.25)}
.search-input{background:transparent;border:0;color:#fff;outline:none;width:0;opacity:0;padding-left:10px;font-size:.9rem;transition:width .3s}
.search-box.active .search-input{width:100%;opacity:1}
.nav-avatar{width:35px;height:35px;border-radius:6px;background:linear-gradient(135deg,#1f1f1f,#333);display:flex;justify-content:center;align-items:center}

/* HERO */
.hero{height:80vh;min-height:460px;width:100%;position:relative;background:#0d0d0d center top/cover;display:flex;align-items:center;padding-left:4%;transition:background-image .8s;z-index:10}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,#141414 10%,rgba(20,20,20,.4) 60%,transparent);z-index:1}
.hero-overlay-btm{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(to top,#141414,transparent);z-index:1}
.hero-content{position:relative;z-index:10;max-width:650px;padding-top:60px;transition:opacity .5s,transform .5s}
.hero-content.fade-out{opacity:0;transform:translateY(8px)}
.hero-meta{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:500;backdrop-filter:blur(4px)}
.chip.stars{color:var(--gold);border-color:rgba(255,215,0,.3)}
.hero-title{font-size:clamp(2.2rem,5vw,4rem);font-weight:900;margin-bottom:1rem;text-transform:uppercase;line-height:1.1;text-shadow:0 4px 8px rgba(0,0,0,.6)}
.hero-desc{font-size:1.2rem;margin-bottom:2rem;color:#e5e5e5;text-shadow:0 2px 4px rgba(0,0,0,.8);max-width:550px;line-height:1.5;font-weight:300;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero-buttons{display:flex;gap:1rem}
.btn-play{background:#fff;color:#000;padding:.9rem 2.2rem;font-size:1.15rem;display:flex;align-items:center;gap:12px}
.btn-info{background:rgba(109,109,110,.7);color:#fff;padding:.9rem 2.2rem;font-size:1.15rem;display:flex;align-items:center;gap:12px;backdrop-filter:blur(5px)}
.hero-dots{position:absolute;bottom:110px;left:4%;display:flex;gap:8px;z-index:10}
.hero-dot{width:28px;height:4px;border:0;border-radius:2px;background:rgba(255,255,255,.3);cursor:pointer;overflow:hidden;position:relative;padding:0}
.hero-dot.active::after{content:"";position:absolute;inset:0;background:var(--blue);transform-origin:left;animation:prog 8s linear forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* FILAS */
.content-container{position:relative;z-index:20;margin-top:-100px;padding-bottom:50px;min-height:400px}
.row{margin-bottom:3rem}
.row-title{font-size:1.5rem;font-weight:700;color:#e5e5e5;margin-bottom:.5rem;padding-left:4%}
.row-scroller{display:flex;gap:14px;overflow-x:auto;padding:20px 4%;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.row-scroller::-webkit-scrollbar{height:8px}
.row-scroller::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:4px;margin:0 4%}
.row-scroller::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:4px}
.search-results-grid{display:flex;flex-wrap:wrap;gap:20px;padding:0 4%}
.tool-card{min-width:280px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.tile{width:100%;height:160px;border-radius:8px;position:relative;overflow:hidden;cursor:pointer;background:linear-gradient(110deg,#222 30%,#2c2c2c 50%,#222 70%) 0 0/200% 100%;animation:shimmer 1.4s infinite linear;transition:transform .3s var(--ease),box-shadow .3s}
@keyframes shimmer{to{background-position:-200% 0}}
.tile.loaded{animation:none;background:#252525}
.tile:hover,.tile:focus-visible{transform:scale(1.05);z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 0 1px rgba(0,113,235,.6),0 0 22px rgba(0,113,235,.25)}
.tile-img{width:100%;height:100%;object-fit:cover;opacity:.92;transition:opacity .3s;position:relative;z-index:1}
.tile:hover .tile-img{opacity:.45}
.tile-content{position:absolute;inset:0;opacity:0;background:linear-gradient(to top,#141414 10%,rgba(20,20,20,.4));display:flex;justify-content:center;align-items:center;transition:opacity .3s;z-index:2}
.tile:hover .tile-content,.tile:focus-within .tile-content{opacity:1}
.tile-actions{display:flex;gap:15px}
.tile-icon{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;background:rgba(30,30,30,.6);color:#fff;cursor:pointer;transition:.2s}
.tile-icon:hover{background:#fff;color:#000;border-color:#fff;transform:scale(1.1)}
.tile-icon.play{background:#fff;color:#000;border-color:#fff}
.valia-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:12px;font-size:.72rem;color:var(--gold);display:flex;gap:2px;z-index:5;backdrop-filter:blur(4px);border:1px solid rgba(255,215,0,.2)}
.sub-chip{position:absolute;left:10px;bottom:10px;z-index:5;background:rgba(0,113,235,.85);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:4px}
.tool-name-external{font-size:.95rem;font-weight:500;color:#d1d1d1;line-height:1.2;padding:0 2px}
.tool-card:hover .tool-name-external{color:#fff}

/* CHATBOT */
.chatbot-fab{position:fixed;bottom:30px;right:30px;width:70px;height:70px;border-radius:50%;cursor:pointer;z-index:900;box-shadow:0 4px 15px rgba(0,0,0,.7);transition:transform .3s;padding:0;overflow:hidden;border:2px solid var(--blue);background:#000}
.chatbot-fab:hover{transform:scale(1.1)}
.chatbot-fab video{width:100%;height:100%;max-width:none;border-radius:0;box-shadow:none;object-fit:cover}

/* MODALES */
.modal-base{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);z-index:6000;justify-content:center;align-items:center;animation:fadeIn .3s;overflow-y:auto;padding:20px}
@keyframes fadeIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:scale(1)}}
.all-tools-box{background:#0b0b0b;width:95%;max-width:1200px;height:90vh;border-radius:12px;position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,113,235,.15);border:1px solid #333;overflow:hidden}
.all-tools-box::before{content:"";position:absolute;inset:0;background:url('logo_entalpia.png') center/60% no-repeat;opacity:.15;pointer-events:none}
.all-tools-header-area{padding:25px 40px;background:linear-gradient(#111,rgba(17,17,17,.8));display:flex;justify-content:space-between;align-items:center;z-index:2;border-bottom:1px solid rgba(255,255,255,.08)}
.all-tools-search-container{flex:1;max-width:600px;margin:0 30px;position:relative}
.all-tools-search{width:100%;padding:14px 20px 14px 50px;background:rgba(255,255,255,.07);border:1px solid transparent;border-radius:6px;color:#fff;font-size:1.05rem;transition:.3s}
.all-tools-search:focus{border-color:var(--blue);background:#000;box-shadow:0 0 20px rgba(0,113,235,.4);outline:none}
.search-icon-modal{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#888}
.all-tools-scroll-area{overflow-y:auto;flex:1;padding:30px 40px;z-index:1}
.all-tools-scroll-area::-webkit-scrollbar{width:8px}
.all-tools-scroll-area::-webkit-scrollbar-thumb{background:#444;border-radius:4px}
.all-tools-category-header{color:var(--blue);font-size:1.4rem;font-weight:800;margin:35px 0 15px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid rgba(0,113,235,.3);padding-bottom:10px}
.all-tools-category-header:first-child{margin-top:0}
.tool-list-item{display:flex;align-items:center;background:rgba(30,30,30,.7);margin-bottom:12px;padding:15px;border-radius:8px;transition:all .3s var(--ease);cursor:pointer;border:1px solid transparent;backdrop-filter:blur(5px)}
.tool-list-item:hover,.tool-list-item:focus-visible{background:rgba(50,50,50,.9);border-color:var(--blue);transform:translateX(5px);box-shadow:0 5px 20px rgba(0,0,0,.5)}
.tool-list-thumb{width:80px;height:60px;border-radius:6px;object-fit:cover;margin-right:20px;background:#111;border:1px solid #444;flex-shrink:0}
.tool-list-details{flex:1;min-width:0}
.tool-list-name{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:12px;margin-bottom:5px;flex-wrap:wrap}
.tool-list-sub{font-size:.9rem;color:#bbb}
.tool-list-valia{font-size:.8rem;color:var(--gold);display:inline-flex;gap:2px}
.close-modal-btn{background:none;border:0;color:#888;font-size:2.5rem;cursor:pointer;line-height:1;transition:color .2s}
.close-modal-btn:hover{color:#fff}
#video-modal{background:#000;z-index:5000;flex-direction:column}
#details-modal{background:rgba(0,0,0,.8);z-index:4200}
#viewer{background:#000;z-index:5500;flex-direction:column;padding:0;overflow:hidden}
#app-frame{width:100%;height:100%;border:0;background:#fff}
video{width:90%;max-width:1000px;outline:none;border-radius:8px;box-shadow:0 0 50px rgba(0,0,0,.8)}
.details-box{background:#181818;width:100%;max-width:850px;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.8)}
#modal-banner{height:250px;background:#202020 center/cover;position:relative}
.viewer-bar{width:100%;padding:10px 15px;background:#141414;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;height:50px}

/* INSTALAR */
#install-modal{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;background:#252525;z-index:7000;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.8);border:1px solid #444;overflow:hidden;animation:slideUp .5s ease;flex-direction:column}
.install-header{background:linear-gradient(90deg,var(--blue),var(--blue-d));padding:15px;display:flex;align-items:center;gap:15px}
.install-body{padding:20px;color:#ddd;font-size:.95rem;line-height:1.5;text-align:center}
.install-footer{padding:0 20px 20px;display:flex;gap:10px}
.btn-install{flex:1;padding:12px;font-weight:700;background:#fff;color:var(--blue)}
.btn-cancel{flex:1;padding:12px;font-weight:700;background:transparent;border:1px solid #555;color:#aaa}
@keyframes slideUp{from{transform:translate(-50%,100%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
footer{margin-top:80px;padding:40px;text-align:center;color:#666;font-size:.9rem;border-top:1px solid #222}

@media(max-width:768px){
.navbar{padding:10px 5%}.nav-logo{font-size:1.4rem}
.nav-links{position:fixed;bottom:0;left:0;width:100%;background:rgba(26,26,26,.95);backdrop-filter:blur(10px);border-top:1px solid #333;padding:10px 10px calc(10px + env(safe-area-inset-bottom));justify-content:space-around;gap:0;z-index:1001}
.nav-item{font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:4px;color:#888}
.nav-item i{display:block;font-size:1.2rem}
.nav-btn-planes{background:transparent;color:#888!important;padding:0;box-shadow:none;font-weight:500}
.nav-btn-planes:hover{transform:none;background:transparent;box-shadow:none}
.user-menu{gap:15px}.profile-badge{display:none}
.search-box.active{width:180px;position:absolute;right:60px;top:10px;background:#141414;z-index:1002}
.hero{padding:0 5%;justify-content:center;text-align:center}
.hero-content{padding-top:0;max-width:100%;display:flex;flex-direction:column;align-items:center}
.hero-desc{-webkit-line-clamp:3;font-size:1rem}
.hero-dots{left:50%;transform:translateX(-50%)}
.btn-play,.btn-info{padding:.8rem 1.5rem;font-size:1rem}
.row-title{font-size:1.2rem}
.tool-card{min-width:160px}.tile{height:220px}
#modal-banner{height:200px}
.all-tools-box{width:100%;height:100vh;border-radius:0;border:0}
.all-tools-header-area{padding:15px;flex-wrap:wrap;gap:10px}
.all-tools-search-container{margin:0;width:100%;max-width:none;order:3}
.all-tools-scroll-area{padding:10px 15px 100px}
.tool-list-thumb{width:60px;height:60px}
.chatbot-fab{bottom:80px;right:20px;width:55px;height:55px}
.content-container{padding-bottom:80px}footer{margin-bottom:60px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<audio id="bg-music" loop></audio>

<div id="main-interface">
  <nav id="navbar" class="navbar">
    <div class="nav-logo" onclick="location.reload()">Entalpia</div>
    <div class="nav-links">
      <a href="../index.html" class="nav-item"><i class="fas fa-home"></i>Inicio</a>
      <button class="nav-item active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-th-large"></i>Aplicaciones</button>
      <button class="nav-item" onclick="mostrarRecientesScroll()"><i class="fas fa-history"></i>Recientes</button>
      <button class="nav-item" onclick="mostrarTodasLasHerramientas()"><i class="fas fa-th"></i>Ver todas</button>
      <a href="../Modales Plataforma/modal_precios.html" class="nav-item nav-btn-planes"><i class="fas fa-crown"></i>Planes</a>
    </div>
    <div class="user-menu">
      <button id="audio-toggle" class="icon-btn" onclick="toggleAudio()" aria-label="Sonido"><i class="fas fa-volume-up"></i></button>
      <div class="search-box" id="search-box">
        <button class="icon-btn" onclick="toggleBuscador()" aria-label="Buscar"><i class="fas fa-search"></i></button>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar..." oninput="filtrarContenido(this.value)">
      </div>
      <span id="profile-indicator" class="profile-badge">GENERAL</span>
      <div id="nav-avatar-icon" class="nav-avatar"><i class="fas fa-user"></i></div>
      <a href="../index.html" onclick="limpiarSesion()" title="Cerrar Sesión" class="icon-btn"><i class="fas fa-sign-out-alt"></i></a>
    </div>
  </nav>

  <div class="hero" id="hero-section">
    <div class="hero-overlay"></div><div class="hero-overlay-btm"></div>
    <div class="hero-content" id="hero-content">
      <div class="hero-meta" id="hero-meta"></div>
      <h1 class="hero-title" id="hero-title">Cargando...</h1>
      <p class="hero-desc" id="hero-desc">...</p>
      <div class="hero-buttons">
        <button class="btn btn-play" id="hero-btn-play"><i class="fas fa-play"></i> Abrir</button>
        <button class="btn btn-info" id="hero-btn-details"><i class="fas fa-info-circle"></i> Info</button>
      </div>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </div>

  <div class="content-container" id="content-rows"></div>

  <footer>
    <div style="margin-bottom:20px;font-size:1.2rem"><i class="fab fa-facebook-f" style="margin:0 15px"></i><i class="fab fa-instagram" style="margin:0 15px"></i></div>
    <p>&copy; Software de Inteligencia Artificial - SofI.A. 2025 - Engineering Git.</p>
  </footer>
</div>

<button class="chatbot-fab" onclick="abrirChatbot()" aria-label="Abrir asistente">
  <video autoplay loop muted playsinline><source src="../Videos Plataforma/Video_de_Bienvenida_IA_Sofia.mp4" type="video/mp4"></video>
</button>

<div id="install-modal">
  <div class="install-header">
    <div style="background:#fff;border-radius:8px;padding:5px"><i class="fas fa-bolt" style="color:var(--blue);font-size:1.5rem"></i></div>
    <div style="font-weight:700">Instalar Entalpia</div>
  </div>
  <div class="install-body" id="install-body-text">Instala nuestra aplicación en tu pantalla de inicio para un acceso rápido y una experiencia a pantalla completa.</div>
  <div class="install-footer">
    <button class="btn btn-cancel" onclick="cerrarInstallModal()">Ahora no</button>
    <button class="btn btn-install" id="btn-install-trigger" onclick="instalarApp()">Instalar</button>
  </div>
</div>

<div id="all-tools-modal" class="modal-base">
  <div class="all-tools-box">
    <div class="all-tools-header-area">
      <h2 style="font-weight:800;font-size:2rem;text-transform:uppercase">Catálogo</h2>
      <div class="all-tools-search-container">
        <i class="fas fa-search search-icon-modal"></i>
        <input type="text" class="all-tools-search" placeholder="Buscar título, descripción..." oninput="filtrarCatalogo(this.value)">
      </div>
      <button class="close-modal-btn" onclick="cerrarTodasLasHerramientas()" aria-label="Cerrar">&times;</button>
    </div>
    <div id="all-tools-container" class="all-tools-scroll-area"></div>
  </div>
</div>

<div id="video-modal" class="modal-base" onclick="cerrarVideo()">
  <button class="close-modal-btn" style="position:absolute;top:20px;right:20px;color:#fff" aria-label="Cerrar">&times;</button>
  <video id="promo-video" controls src="VideoSaberMas.mp4" onclick="event.stopPropagation()"></video>
</div>

<div id="details-modal" class="modal-base" onclick="cerrarDetalles(event)">
  <div class="details-box" onclick="event.stopPropagation()">
    <div id="modal-banner">
      <div style="position:absolute;inset:0;background:linear-gradient(to top,#181818 5%,transparent 60%)"></div>
      <button onclick="cerrarDetalles(null)" aria-label="Cerrar" style="position:absolute;top:15px;right:15px;width:35px;height:35px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:1.2rem;cursor:pointer">&times;</button>
    </div>
    <div style="padding:25px">
      <h1 id="modal-title" style="margin-bottom:10px;font-size:2rem;font-weight:800;line-height:1.1">Titulo</h1>
      <div style="display:flex;gap:10px;margin-bottom:20px;font-size:.9rem;align-items:center;flex-wrap:wrap">
        <span style="color:var(--green);font-weight:700">Conoce Mas...</span>
        <span id="modal-cat" class="chip">Cat</span>
        <span id="modal-sub" class="chip" style="background:rgba(0,113,235,.4)"></span>
        <span id="modal-stars" class="chip stars"></span>
      </div>
      <p id="modal-desc" style="color:#ccc;line-height:1.6;margin-bottom:30px"></p>
      <button class="btn btn-play" id="modal-btn-open" style="width:100%;justify-content:center;padding:12px"><i class="fas fa-play"></i> Abrir Herramienta</button>
    </div>
  </div>
</div>

<div id="viewer" class="modal-base">
  <div class="viewer-bar">
    <span id="viewer-title" style="font-weight:700;color:var(--blue);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:70%">App</span>
    <button class="btn" style="background:transparent;border:1px solid #555;color:#fff;padding:5px 15px;font-size:.8rem" onclick="cerrarVisor()">CERRAR</button>
  </div>
  <div style="flex:1;width:100%;position:relative"><iframe id="app-frame" title="Aplicación"></iframe></div>
</div>

<script>
const $ = id => document.getElementById(id);
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

// --- STORAGE SEGURO ---
const safeGetItem = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const safeSetItem = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const safeParse = (k, def) => { try { const v = JSON.parse(safeGetItem(k)); return v ?? def; } catch (e) { return def; } };

// --- DATA ---
const DATOS_INICIALES = [{ u: "guest", p: "", n: "Invitado", apellido: "Entalpia", f: "29/11/2025", img: "", profesion: "", area: "", telefono: "", ubicacion: "" }];
let dbUsuarios = safeParse('sofia_users', null);
if (!Array.isArray(dbUsuarios) || !dbUsuarios.length) dbUsuarios = DATOS_INICIALES;

const HERRAMIENTAS = [
  { id: 1, nombre: "Modelador de sistemas ramificados", url: "../AppsPlataforma/CadgasV2/Isoflux_V16_Entalpia_Lab.html", imagen: "../ImagenesPlataformas/Icono_ModeladorMuellerPremiumV1_Entalpia.png", descripcion: "El Modelador de Sistemas Ramificados es una aplicación web monolítica que permite modelar redes de gas en proyección isométrica ajustable, calcular caudales, velocidades y caídas de presión en redes ramificadas (no mallas), generar el despiece y presupuesto, definir la soportería, programar el mantenimiento y emitir informes técnicos. La versión incorpora bloques (agrupaciones persistentes de tuberías, componentes y anotaciones que pueden moverse, girarse, desacoplarse y volver a acoplarse indefinidamente), un conjunto de controles de vista (zoom, ejes X-Y-Z permanentes y una coordenada polar de cámara que puede fijarse) e informes con análisis gráfico", categoria: "Herramientas para el modelado de fluidos en Matrices y Ramificaciones de Alta / Media Presión", subtitulo: "GN/GLP", valia: "Premium" },
  { id: 2, nombre: "Selector de regulacion", url: "../AppsPlataforma/CadgasV2/Selector_de_Reguladores_GN_GLP_Pioneer's_V1.html", imagen: "../ImagenesPlataformas/Icono_selectorreguladoresV02_entalpia.png", descripcion: "Aplicación interactiva para ingenieros de Entalpía para el dimensionamiento, cálculo de caudal, conversión de unidades y selección de reguladores de gas Humcar según catálogo.", categoria: "Herramientas para el modelado de fluidos en Matrices y Ramificaciones de Alta / Media Presión", subtitulo: "GN/GLP", valia: "Premium" },
  { id: 3, nombre: "Programa de Ingenieria I.A.", url: "../CursosPlataforma/Synapsis_programa_de_Ingeniería_en_IA.html", imagen: "../ImagenesPlataformas/img_escuela_entrenamiento_ia_interfaopciondeinicio.jfif", descripcion: "Aplicación interactiva para ingenieros de Entalpía para el dimensionamiento, cálculo de caudal, conversión de unidades y selección de reguladores de gas Humcar según catálogo.", categoria: "Programas de formacion para alta ingenieria", subtitulo: "Psynpsis: Campus de Alta Ingenieria", valia: "Premium" },
  { id: 4, nombre: "Simulador De Vaporizacion GLP", url: "../AppsPlataforma/CadgasV2/Vaporizador_V5.html", imagen: "../ImagenesPlataformas/imgcalculadoradevaporizacionglp_v1.png", descripcion: "Herramienta industrial para el cálculo de vaporización natural en tanques de Gas LP, con equivalencias de unidades (m³/h, kW, BTU/h), curvas dinámicas de rendimiento y reportes de ingeniería exportables en PDF.", categoria: "Herramientas para el modelado de fluidos en Matrices y Ramificaciones de Alta / Media Presión", subtitulo: "GLP", valia: "Pro" }
];
const STAR_COUNT = { Libre: 1, Plus: 2, Pro: 3, Premium: 4 };
const fallbackImg = "https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop";
const imgOf = t => t.imagen.includes('.') ? t.imagen : t.imagen + '.jpg';
const starsHTML = v => '<i class="fas fa-star"></i>'.repeat(STAR_COUNT[v] || 0);

let usuarioActivo = DATOS_INICIALES[0];
let recientes = safeParse('sofia_recents', []);
if (!Array.isArray(recientes)) recientes = [];
let ordenCategorias = null;

// --- AUDIO ---
const NATURE_TRACKS = [
  "https://actions.google.com/sounds/v1/water/waves_crashing.ogg",
  "https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg",
  "https://actions.google.com/sounds/v1/weather/strong_wind_whistling.ogg",
  "https://actions.google.com/sounds/v1/ambiences/night_crickets_water_lapping.ogg"
];
const audioPlayer = $('bg-music');
let isMuted = false, rotacionIntervalo, lastSave = 0;

function gestionarMusica() {
  const savedTrack = safeGetItem('audio_track');
  if (savedTrack && NATURE_TRACKS.includes(savedTrack)) {
    audioPlayer.src = savedTrack;
    const t = parseFloat(safeGetItem('audio_time'));
    if (!isNaN(t)) audioPlayer.addEventListener('loadedmetadata', () => { audioPlayer.currentTime = t; }, { once: true });
  } else cambiarPistaAleatoria();
  const p = audioPlayer.play();
  if (p) p.catch(() => { isMuted = true; actualizarIconoAudio(); });
  clearInterval(rotacionIntervalo);
  rotacionIntervalo = setInterval(() => { if (!audioPlayer.paused && !isMuted) cambiarPistaAleatoria(); }, 720000);
}
function cambiarPistaAleatoria() {
  const t = NATURE_TRACKS[Math.floor(Math.random() * NATURE_TRACKS.length)];
  audioPlayer.src = t; safeSetItem('audio_track', t);
  audioPlayer.play().catch(() => {});
}
function toggleAudio() {
  if (audioPlayer.paused || isMuted) {
    audioPlayer.play().then(() => { isMuted = false; actualizarIconoAudio(); }).catch(console.error);
  } else { audioPlayer.pause(); isMuted = true; actualizarIconoAudio(); }
}
function actualizarIconoAudio() {
  const i = $('audio-toggle').firstElementChild;
  i.className = isMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
  $('audio-toggle').style.color = isMuted ? '#777' : '#ccc';
}
audioPlayer.addEventListener('timeupdate', () => {
  const now = Date.now();
  if (now - lastSave > 3000) { lastSave = now; safeSetItem('audio_time', audioPlayer.currentTime); }
});

// --- INSTALACIÓN PWA ---
let deferredPrompt;
const installModal = $('install-modal');
const isIos = () => /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; mostrarModalInstalacion(); });
function mostrarModalInstalacion() {
  if (safeGetItem('app_install_dismissed') || isStandalone()) return;
  if (isIos()) {
    $('install-body-text').innerHTML = "Para instalar en iOS:<br>1. Pulsa el botón <strong>Compartir</strong> <i class='fas fa-share-square'></i><br>2. Selecciona <strong>'Agregar a Inicio'</strong> <i class='fas fa-plus-square'></i>";
    $('btn-install-trigger').style.display = 'none';
    installModal.style.display = 'flex';
  } else if (deferredPrompt) installModal.style.display = 'flex';
}
function instalarApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; cerrarInstallModal(); });
  } else { alert("Busca la opción 'Instalar aplicación' en el menú de tu navegador."); cerrarInstallModal(); }
}
function cerrarInstallModal() { installModal.style.display = 'none'; safeSetItem('app_install_dismissed', 'true'); }

function limpiarSesion() { try { localStorage.removeItem('sofia_session'); } catch (e) {} }
function mostrarRecientesScroll() {
  const r = $('row-recientes');
  if (r) r.scrollIntoView({ behavior: 'smooth', block: 'center' });
  else $('content-rows').scrollIntoView({ behavior: 'smooth' });
}
function registrarUso(id) {
  recientes = [id, ...recientes.filter(x => x !== id)].slice(0, 10);
  safeSetItem('sofia_recents', JSON.stringify(recientes));
}

// --- CATÁLOGO ---
function mostrarTodasLasHerramientas() { renderizarCatalogoCompleto(HERRAMIENTAS); $('all-tools-modal').style.display = 'flex'; }
function cerrarTodasLasHerramientas() { $('all-tools-modal').style.display = 'none'; }
const coincide = (h, t) => norm(h.nombre).includes(t) || norm(h.descripcion).includes(t) || norm(h.categoria).includes(t) || norm(h.subtitulo).includes(t);
function filtrarCatalogo(texto) {
  const t = norm(texto.trim());
  renderizarCatalogoCompleto(t ? HERRAMIENTAS.filter(h => coincide(h, t)) : HERRAMIENTAS);
}
function renderizarCatalogoCompleto(items) {
  const c = $('all-tools-container');
  c.innerHTML = '';
  if (!items.length) { c.innerHTML = '<div style="text-align:center;padding:40px;color:#666">Sin resultados</div>'; return; }
  [...new Set(items.map(h => h.categoria))].sort().forEach(cat => {
    const tools = items.filter(h => h.categoria === cat);
    const header = document.createElement('div');
    header.className = 'all-tools-category-header';
    header.innerHTML = `<span>${cat}</span><span style="font-size:.8rem;color:#666;font-weight:400;margin-left:10px">(${tools.length})</span>`;
    c.appendChild(header);
    tools.forEach(tool => {
      const item = document.createElement('div');
      item.className = 'tool-list-item'; item.tabIndex = 0; item.setAttribute('role', 'button');
      item.innerHTML = `
        <img src="${imgOf(tool)}" class="tool-list-thumb" alt="">
        <div class="tool-list-details">
          <div class="tool-list-name"><span class="tn"></span><span class="tool-list-valia">${starsHTML(tool.valia)}</span></div>
          <div class="tool-list-sub">${tool.subtitulo || ''}</div>
        </div>
        <button class="btn" style="background:var(--blue);color:#fff;padding:8px 15px;font-size:.9rem" aria-label="Abrir"><i class="fas fa-play"></i></button>`;
      item.querySelector('.tn').textContent = tool.nombre;
      item.querySelector('img').onerror = function () { this.onerror = null; this.src = fallbackImg; };
      const ver = () => { cerrarTodasLasHerramientas(); verDetalles(tool.id); };
      item.onclick = ver;
      item.onkeydown = e => { if (e.key === 'Enter') ver(); };
      item.querySelector('button').onclick = e => { e.stopPropagation(); cerrarTodasLasHerramientas(); abrirApp(tool.id, tool.nombre, tool.url); };
      c.appendChild(item);
    });
  });
}

// --- CHATBOT ---
function abrirChatbot() {
  const w = 700, h = 500;
  window.open('https://gemini.google.com/gem/1JQ_urpDOJs8DOQBtFYMCoF2gwakXwGD8?usp=sharing', '_blank',
    `noopener,scrollbars=yes,toolbar=no,width=${w},height=${h},top=${Math.round(window.outerHeight / 2 - h / 2)},left=${Math.round(window.outerWidth / 2 - w / 2)}`);
}

// --- INIT ---
window.addEventListener('load', () => {
  gestionarMusica();
  const sessionUser = safeParse('sofia_session', null);
  if (sessionUser) usuarioActivo = dbUsuarios.find(u => u.u === sessionUser.u) || sessionUser;
  else safeSetItem('sofia_session', JSON.stringify(usuarioActivo));
  renderizarFilas();
  iniciarCarrusel();
  setTimeout(mostrarModalInstalacion, 3000);
});

// --- BÚSQUEDA ---
function toggleBuscador() {
  const box = $('search-box');
  box.classList.toggle('active');
  if (box.classList.contains('active')) $('search-input').focus();
  else { $('search-input').value = ''; renderizarFilas(); }
}
function filtrarContenido(texto) {
  const t = norm(texto.trim());
  if (!t) { renderizarFilas(); return; }
  const c = $('content-rows');
  const res = HERRAMIENTAS.filter(h => coincide(h, t));
  c.innerHTML = '';
  if (!res.length) {
    const d = document.createElement('div');
    d.style.cssText = 'padding:40px;color:#888;text-align:center';
    d.innerHTML = '<i class="fas fa-search" style="font-size:2rem;margin-bottom:10px"></i><br>';
    d.appendChild(document.createTextNode(`Sin resultados para "${texto}"`));
    c.appendChild(d); return;
  }
  const title = document.createElement('h3'); title.className = 'row-title'; title.textContent = `Resultados (${res.length})`;
  const grid = document.createElement('div'); grid.className = 'search-results-grid';
  res.forEach(tool => grid.appendChild(crearElementoTile(tool)));
  c.append(title, grid);
}

// --- TILES / FILAS ---
function crearElementoTile(tool) {
  const card = document.createElement('div'); card.className = 'tool-card';
  const tile = document.createElement('div'); tile.className = 'tile';
  tile.tabIndex = 0; tile.setAttribute('role', 'button'); tile.setAttribute('aria-label', 'Ver detalles de ' + tool.nombre);
  tile.innerHTML = `
    <img src="${imgOf(tool)}" class="tile-img" alt="">
    ${tool.valia ? `<div class="valia-badge" title="${tool.valia}">${starsHTML(tool.valia)}</div>` : ''}
    ${tool.subtitulo ? `<div class="sub-chip">${tool.subtitulo}</div>` : ''}
    <div class="tile-content"><div class="tile-actions">
      <div class="tile-icon play" role="button" tabindex="0" aria-label="Abrir"><i class="fas fa-play"></i></div>
      <div class="tile-icon info" role="button" tabindex="0" aria-label="Detalles"><i class="fas fa-chevron-down"></i></div>
    </div></div>`;
  const img = tile.querySelector('img');
  img.onload = () => tile.classList.add('loaded');
  img.onerror = function () { this.onerror = null; this.src = fallbackImg; };
  const abrir = e => { e.stopPropagation(); abrirApp(tool.id, tool.nombre, tool.url); };
  const info = e => { e.stopPropagation(); verDetalles(tool.id); };
  const key = fn => e => { if (e.key === 'Enter') fn(e); };
  const p = tile.querySelector('.play'), i = tile.querySelector('.info');
  p.onclick = abrir; p.onkeydown = key(abrir);
  i.onclick = info; i.onkeydown = key(info);
  tile.onclick = info;
  tile.onkeydown = e => { if (e.key === 'Enter' && e.target === tile) info(e); };
  const name = document.createElement('div'); name.className = 'tool-name-external'; name.textContent = tool.nombre;
  card.append(tile, name);
  return card;
}
function crearFila(cont, tit, items, id) {
  const row = document.createElement('div'); row.className = 'row'; if (id) row.id = id;
  const t = document.createElement('h3'); t.className = 'row-title'; t.textContent = tit;
  const s = document.createElement('div'); s.className = 'row-scroller';
  items.forEach(tool => s.appendChild(crearElementoTile(tool)));
  row.append(t, s); cont.appendChild(row);
}
function renderizarFilas() {
  const c = $('content-rows'); if (!c) return;
  c.innerHTML = '';
  const rec = recientes.map(id => HERRAMIENTAS.find(h => h.id === id)).filter(Boolean);
  if (rec.length) crearFila(c, 'Recientes', rec, 'row-recientes');
  // El orden se sortea una sola vez por sesión: no se reordena al cerrar una app
  if (!ordenCategorias) ordenCategorias = [...new Set(HERRAMIENTAS.map(h => h.categoria))].sort(() => Math.random() - .5);
  ordenCategorias.forEach(cat => crearFila(c, cat, HERRAMIENTAS.filter(h => h.categoria === cat)));
}

// --- HERO ---
let hIdx = 0, hInt;
function iniciarCarrusel() {
  if (hInt) return;
  const dots = $('hero-dots');
  HERRAMIENTAS.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'hero-dot'; b.setAttribute('aria-label', 'Ir a ' + t.nombre);
    b.onclick = () => { hIdx = i; actHero(); reiniciarTimer(); };
    dots.appendChild(b);
  });
  actHero(); reiniciarTimer();
  document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(hInt) : reiniciarTimer());
}
function reiniciarTimer() {
  clearInterval(hInt);
  hInt = setInterval(() => { hIdx = (hIdx + 1) % HERRAMIENTAS.length; actHero(); }, 8000);
}
function actHero() {
  const t = HERRAMIENTAS[hIdx], c = $('hero-content'), s = $('hero-section');
  c.classList.add('fade-out');
  document.querySelectorAll('.hero-dot').forEach((d, i) => { d.classList.remove('active'); if (i === hIdx) { void d.offsetWidth; d.classList.add('active'); } });
  setTimeout(() => {
    $('hero-title').textContent = t.nombre;
    $('hero-desc').textContent = t.descripcion;
    $('hero-meta').innerHTML = `${t.subtitulo ? `<span class="chip">${t.subtitulo}</span>` : ''}<span class="chip stars">${starsHTML(t.valia)}</span><span class="chip">${t.categoria}</span>`;
    $('hero-btn-play').onclick = () => abrirApp(t.id, t.nombre, t.url);
    $('hero-btn-details').onclick = () => verDetalles(t.id);
    const l = new Image();
    l.onload = () => { s.style.backgroundImage = `url('${imgOf(t)}')`; };
    l.onerror = () => { s.style.backgroundImage = `url('${fallbackImg}')`; };
    l.src = imgOf(t);
    c.classList.remove('fade-out');
  }, 400);
}

// --- MODALES ---
function cerrarVideo() { $('video-modal').style.display = 'none'; $('promo-video').pause(); }
function verDetalles(id) {
  const t = HERRAMIENTAS.find(h => h.id === id); if (!t) return;
  $('modal-title').textContent = t.nombre;
  $('modal-cat').textContent = t.categoria;
  $('modal-sub').textContent = t.subtitulo || ''; $('modal-sub').classList.toggle('hidden', !t.subtitulo);
  $('modal-stars').innerHTML = starsHTML(t.valia);
  $('modal-desc').textContent = t.descripcion;
  $('modal-btn-open').onclick = () => abrirApp(t.id, t.nombre, t.url);
  const banner = $('modal-banner');
  banner.style.backgroundImage = `url('${fallbackImg}')`;
  const l = new Image(); l.onload = () => { banner.style.backgroundImage = `url('${imgOf(t)}')`; }; l.src = imgOf(t);
  $('details-modal').style.display = 'flex';
}
function cerrarDetalles(e) { if (!e || e.target.id === 'details-modal') $('details-modal').style.display = 'none'; }
function abrirApp(id, titulo, url) {
  registrarUso(id);
  $('details-modal').style.display = 'none';
  $('viewer-title').textContent = titulo;
  if (!url || url === '#' || !url.trim()) console.warn('URL de App vacía');
  $('app-frame').src = url;
  $('viewer').style.display = 'flex';
}
function cerrarVisor() {
  $('viewer').style.display = 'none';
  $('app-frame').src = 'about:blank';
  if (!$('search-input').value) renderizarFilas();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('viewer').style.display === 'flex') cerrarVisor();
  else if ($('details-modal').style.display === 'flex') cerrarDetalles(null);
  else if ($('all-tools-modal').style.display === 'flex') cerrarTodasLasHerramientas();
  else if ($('video-modal').style.display === 'flex') cerrarVideo();
});
window.addEventListener('scroll', () => $('navbar').classList.toggle('scrolled', window.scrollY > 50), { passive: true });
</script>
</body>
</html>
