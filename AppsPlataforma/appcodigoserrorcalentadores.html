<!-- EK:INICIO estilos -->
<style id="ek-kit-css">
/* ==== ENTALPÍA LAB · Kit estándar de aplicativos (Tecnologías Básicas) ====
   Fuente única: AppsPlataforma/_kit/entalpia-kit.css — se inserta en línea con _kit/aplicar_kit.py.
   Todas las clases llevan prefijo ek- para no chocar con Tailwind ni con el CSS propio de cada app. */
:root{
  --ek-bg:#0a0d12;--ek-pn:#141922;--ek-pn2:#10151d;--ek-tx:#e4eefa;--ek-mu:#8fa3bd;
  --ek-ac:#2f86e8;--ek-ac2:#62b0ff;--ek-bd:#2a3648;--ek-ok:#3fbf7f;--ek-wa:#e8b23a;--ek-er:#ef5b5b;
  --ek-metal:linear-gradient(135deg,#9bd0ff 0%,#2f6fc8 45%,#173a6b 100%);
  --ek-hdr:52px;--ek-ftr:30px;
}
html.ek body{padding-top:var(--ek-hdr)!important;padding-bottom:var(--ek-ftr)!important;box-sizing:border-box}
html.ek.ek-sinpie body{padding-bottom:0!important}
/* Las vistas a pantalla completa descuentan la cabecera y el pie del kit */
html.ek .h-screen{height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important}
html.ek .min-h-screen{min-height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important}
html.ek .h-\[100dvh\]{height:calc(100dvh - var(--ek-hdr) - var(--ek-ftr))!important}

/* ---------- cabecera ---------- */
.ek-hdr{position:fixed;top:0;left:0;right:0;height:var(--ek-hdr);z-index:2147483000;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,#121924,#0c1118);border-bottom:1px solid var(--ek-bd);color:var(--ek-tx);
  font:14px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;min-width:0}
.ek-hdr *{box-sizing:border-box}
.ek-hdr .ek-logo{height:38px;width:auto;border-radius:6px;flex:none;display:block}
.ek-hdr .ek-tit{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.ek-hdr .ek-tit b{font-size:16px;letter-spacing:.3px;background:var(--ek-metal);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ek-hdr .ek-tit span{font-size:11.5px;color:var(--ek-mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-hdr .ek-sp{flex:1;min-width:6px}
.ek-hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ek-bd);background:#18202c;color:var(--ek-tx);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;font:13px/1.2 Inter,system-ui,sans-serif;text-decoration:none}
.ek-hbtn:hover{border-color:var(--ek-ac)}
.ek-hbtn.pri{background:var(--ek-ac);border-color:var(--ek-ac);color:#fff}

/* ---------- pie ---------- */
.ek-ftr{position:fixed;left:0;right:0;bottom:0;height:var(--ek-ftr);z-index:2147482999;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-top:1px solid var(--ek-bd);background:#0c1118;color:var(--ek-mu);font:11.5px/1.2 Inter,system-ui,sans-serif;box-sizing:border-box;min-width:0}
.ek-ftr img{height:22px;width:auto;border-radius:4px;flex:none}
.ek-ftr .ek-sp{flex:1}
.ek-ftr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- modales ---------- */
.ek-modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;align-items:center;justify-content:center;z-index:2147483100;padding:12px;
  font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ek-tx)}
.ek-modal.on{display:flex}
.ek-mbox{position:relative;background:var(--ek-pn);border:1px solid var(--ek-bd);border-radius:12px;max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:left}
.ek-mhd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ek-bd);cursor:move;user-select:none;flex:none}
.ek-mhd b{font-size:15px;font-weight:700}.ek-mhd .ek-sp{flex:1}
.ek-mbd{padding:12px 14px;overflow:auto;min-height:0}
.ek-mbd h3{font-size:14px;margin:14px 0 6px;color:var(--ek-ac2);font-weight:700}
.ek-mbd h3:first-child{margin-top:2px}
.ek-mbd p,.ek-mbd li{color:#cfdcec;margin:4px 0}
.ek-mbd ul,.ek-mbd ol{padding-left:22px;margin:4px 0}.ek-mbd ul{list-style:disc}.ek-mbd ol{list-style:decimal}
.ek-mbd code,.ek-mbd .ek-f{font-family:Consolas,"JetBrains Mono",monospace;background:#0d1219;border:1px solid var(--ek-bd);border-radius:5px;padding:1px 5px;font-size:12.5px;color:#cfe6ff}
.ek-mbd .ek-f{display:block;padding:6px 9px;margin:6px 0;white-space:pre-wrap}
.ek-mbd table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.ek-mbd th,.ek-mbd td{border-bottom:1px solid #1d2734;padding:5px 6px;text-align:left}
.ek-mbd th{color:var(--ek-mu);font-weight:600}
.ek-mft{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--ek-bd);flex:none;flex-wrap:wrap}
.ek-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ek-bd);background:#1a2330;color:var(--ek-tx);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font:13px/1.2 Inter,system-ui,sans-serif}
.ek-btn:hover{border-color:var(--ek-ac)}
.ek-btn.pri{background:var(--ek-ac);border-color:var(--ek-ac);color:#fff}
.ek-btn.dan{border-color:#6b2a2a;color:#ffb3b3}
.ek-btn.sm{padding:4px 8px;font-size:12.5px}
.ek-x{border:0;background:none;color:var(--ek-mu);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.ek-x:hover{color:#fff}
.ek-note{font-size:12.5px;border-left:3px solid var(--ek-ac);background:#0f1724;padding:6px 9px;border-radius:0 6px 6px 0;margin:8px 0;color:#c4d4ea}
.ek-note.wa{border-color:var(--ek-wa)}.ek-note.er{border-color:var(--ek-er)}.ek-note.ok{border-color:var(--ek-ok)}
#ek-toast{position:fixed;left:50%;bottom:calc(var(--ek-ftr) + 14px);transform:translateX(-50%);background:#16243a;color:var(--ek-tx);border:1px solid var(--ek-ac);border-radius:8px;padding:8px 12px;z-index:2147483200;display:none;max-width:min(92vw,560px);font:13px/1.4 Inter,system-ui,sans-serif;word-break:break-word;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* bloques que solo existen en impresión */
.ek-print{display:none}
#ek-reporte{display:none}

@media (max-width:720px){
  :root{--ek-hdr:48px;--ek-ftr:26px}
  .ek-hdr .ek-tit span{display:none}
  .ek-hdr .ek-logo{height:32px}
  .ek-hbtn .ek-lbl{display:none}
  .ek-ftr .ek-hide-m{display:none}
}

/* ---------- impresión / PDF del navegador ---------- */
@media print{
  html.ek body{padding:0!important}
  .ek-hdr,.ek-ftr,.ek-modal,#ek-toast{display:none!important}
  .ek-print{display:block!important;visibility:visible!important;color:#111;font:9.5pt/1.35 "Segoe UI",Arial,sans-serif;position:static!important}
  .ek-print *{visibility:visible!important}
  .ek-print-cab{display:flex!important;align-items:center;gap:12px;border-bottom:2px solid #1d4f8f;padding:0 0 6px;margin:0 0 10px;break-inside:avoid}

  .ek-print-cab h1{font-size:14pt;margin:0;color:#173a6b;font-weight:700}

  .ek-print-pie{display:flex!important;align-items:center;gap:8px;margin-top:14px;border-top:1px solid #c8d3e2;padding-top:6px;font-size:8pt;color:#555;break-inside:avoid}
  .ek-print-pie img{height:26px;width:auto}
  .ek-print-pie span{flex:1}
  html.ek .h-screen,html.ek .min-h-screen{height:auto!important;min-height:0!important}
  /* informe estándar EK.informe(): solo se imprime el informe */
  html.ek-informe body>*:not(#ek-reporte){display:none!important}
  html.ek-informe body{background:#fff!important;color:#111!important}
  html.ek-informe #ek-reporte{display:block!important;visibility:visible!important;color:#111;font:9.6pt/1.4 "Segoe UI",Arial,sans-serif}
  html.ek-informe #ek-reporte *{visibility:visible!important}
  #ek-reporte .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1d4f8f;padding-bottom:6px;margin-bottom:8px}
  #ek-reporte .rh img{height:46px;width:auto}
  #ek-reporte h1{font-size:14.5pt;margin:0;color:#173a6b;font-weight:700}
  #ek-reporte ul{list-style:disc;padding-left:18px;margin:4px 0}#ek-reporte ol{list-style:decimal;padding-left:18px}
  #ek-reporte .rh div div{font-size:9pt;color:#444}
  #ek-reporte h2{font-size:11pt;font-weight:700;color:#173a6b;margin:12px 0 4px;border-bottom:1px solid #c8d3e2;padding-bottom:2px;break-after:avoid}
  #ek-reporte table{width:100%;border-collapse:collapse;font-size:8.8pt;margin:2px 0 4px}
  #ek-reporte th,#ek-reporte td{border:1px solid #c8d3e2;padding:3px 5px;text-align:left;background:#fff;color:#111;vertical-align:top}
  #ek-reporte th{background:#eaf1fa!important;font-weight:600}
  #ek-reporte td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #ek-reporte tr{break-inside:avoid}
  #ek-reporte .ok{color:#17663f;font-weight:700}#ek-reporte .no{color:#a3161d;font-weight:700}#ek-reporte .wa{color:#8a5a00;font-weight:700}
  #ek-reporte .ver{border:1.5px solid #1d4f8f;border-radius:6px;padding:7px 10px;margin:10px 0;font-size:10.5pt;break-inside:avoid}
  #ek-reporte .ver.ok{border-color:#17663f;background:#effaf3!important}#ek-reporte .ver.no{border-color:#a3161d;background:#fdf0f0!important}#ek-reporte .ver.wa{border-color:#8a5a00;background:#fdf8ea!important}
  #ek-reporte .txt{margin:4px 0;white-space:pre-wrap}
  #ek-reporte .fm{font-family:Consolas,monospace;font-size:8.6pt;background:#f4f7fb!important;border:1px solid #d5dfec;padding:4px 7px;margin:4px 0;white-space:pre-wrap}
  #ek-reporte .firmas td{height:48px;vertical-align:bottom;text-align:center;font-size:8.6pt;color:#444}
  #ek-reporte .pie{margin-top:14px;border-top:1px solid #c8d3e2;padding-top:6px;font-size:8pt;color:#555;display:flex;align-items:center;gap:8px;break-inside:avoid}
  #ek-reporte .pie img{height:28px;width:auto}
  #ek-reporte img.fig{max-width:100%;max-height:120mm;display:block;margin:6px auto;border:1px solid #c8d3e2}
  html.ek-informe .ek-print{display:none!important}
  @page{margin:12mm 12mm 14mm;@bottom-right{content:"Pág. " counter(page) " / " counter(pages);font:8pt Arial,sans-serif;color:#555}}
}

window.EK_CFG={"app": "ThermoDiag · Códigos de error", "sub": "Diagnóstico de calentadores a gas", "ver": "2.0", "informe": "Reporte de diagnóstico técnico — calentadores", "oscuro": true, "pdf": false, "ayuda": "<h3>¿Para qué sirve?<\/h3>\n<p>Asistente de diagnóstico de calentadores de agua a gas: interpreta códigos de error por marca o plataforma y propone causa raíz y protocolo de solución.<\/p>\n<h3>Cómo usarlo<\/h3>\n<ol><li>Diligencie los datos del proyecto y del equipo.<\/li>\n<li>Seleccione la plataforma o marca e ingrese el código de error que muestra el equipo.<\/li>\n<li>Confirme las condiciones de instalación verificadas (presión dinámica, ventilación, puesta a tierra).<\/li>\n<li>Revise el diagnóstico, adjunte una foto de evidencia si la tiene y genere el <b>Informe PDF<\/b>.<\/li><\/ol>\n<div class=\"ek-note\">Referencias de presión dinámica usadas en los protocolos: gas natural mayor que 5\" c.a.; GLP mayor que 10\" c.a.<\/div>\n<div class=\"ek-note wa\">Guía de asistencia: no reemplaza el manual del fabricante.<\/div>\n"};

/* ==== ENTALPÍA LAB · Kit estándar de aplicativos (Tecnologías Básicas) ====

     app     nombre del aplicativo            sub     subtítulo de la cabecera
     ver     versión mostrada en el pie       norma   referencia normativa (texto)
     ayuda   HTML de la guía de uso           raiz    ruta relativa a la raíz del sitio ("../")
     alerta  false para conservar window.alert nativo
     pdf     false para no enmarcar los PDF de jsPDF
     marcoImpresion false si la app ya imprime su propio encabezado
     oscuro  true para aplicar el tema oscuro estándar a apps Tailwind claras

(function () {
  'use strict';
  if (window.EK && window.EK.__v) return;
  var C = window.EK_CFG || {};
  var LOGO_ENT = window.EK_LOGO_ENT, LOGO_PIO = window.EK_LOGO_PIO;
  var PIE = "Hub de Ingeniería Pioneer's · un desarrollo de Industrias I.A. Col";
  var d = document;
  var EK = { __v: '1.0', cfg: C, LOGO_ENT: LOGO_ENT, LOGO_PIO: LOGO_PIO, PIE: PIE };
  window.EK = EK;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fecha() { var f = new Date(); return f.toLocaleDateString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit' }) + ' ' + f.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }); }
  EK.esc = esc; EK.fecha = fecha;

  /* ---------- cabecera y pie ---------- */

                codes: ['90', '99', '10', 'E110'],
                symptom: 'Bloqueo de Flujo de Aire / Escape',
                rootCause: 'Mallas anti-pájaros sucias, ducto muy largo, condensado acumulado en trampa.',
                solution: [
                    'Verificar obstrucciones físicas en terminales.',
                    'Revisar trampa de condensados (si el agua sube, bloquea humos).',
                    'Validar longitud máxima de tubería según manual.'
                ],
                reference: 'Sección 2.2 - Patologías de Sensores'
            },
            {
                id: 'euro_ea',
                platforms: ['Bosch', 'Junkers'],
                codes: ['EA'],
                symptom: 'No hay llama / Falla de Ionización',
                rootCause: 'Humedad en electrodos, grietas en cerámica, presión de CO2 incorrecta.',
                solution: [
                    'Reemplazar set de electrodos (suelen derivar chispa a tierra).',
                    'Verificar presión de CO2 en modelos de condensación.',
                    'Asegurar fase y neutro correctos (polaridad).'
                ],
                reference: 'Sección 3.1 - La Pesadilla de la Ionización'
            },
            {
                id: 'euro_e9',
                platforms: ['Bosch', 'Junkers'],
                codes: ['E9'],
                symptom: 'Limitador de seguridad disparado (>105°C)',
                rootCause: 'Bomba de circulación trabada, aire en el sistema.',
                solution: [
                    'Desbloquear la bomba (girar eje manualmente).',
                    'Purgar aire del sistema.',
                    'Verificar resistencia del limitador (debe ser casi 0 ohms).'
                ],
                reference: 'Sección 3.2 - Protección Térmica'
            },
            {
                id: 'latam_e1',
                platforms: ['Haceb', 'Challenger', 'Calorex', 'Midea', 'OEM Chino'],
                codes: ['E1'],
                symptom: 'Falla de Encendido (Ignition Failure)',
                rootCause: 'Válvula solenoide defectuosa (bobina abierta), falta de gas.',
                solution: [
                    'Verificar suministro de gas.',
                    'Revisar continuidad en bobinas de solenoides.',
                    'Verificar estado de pilas (si es tiro natural).'
                ],
                reference: 'Sección 4.1 - Desambiguación Códigos'
            },
            {
                id: 'latam_e4_challenger',
                platforms: ['Challenger', 'Calorex'],
                codes: ['E4'],
                symptom: 'Sobrecalentamiento (>80°C)',
                rootCause: 'Caudal de agua bajo o sensor NTC detecta exceso.',
                solution: [
                    'Aumentar caudal de agua.',
                    'Bajar potencia de gas.',
                    'Revisar sensor NTC de salida.'
                ],
                reference: 'Sección 4.2 - El Confuso Caso del Error E4'
            },
            {
                id: 'latam_e4_haceb',
                platforms: ['Haceb', 'Midea (Tiro Forzado)'],
                codes: ['E4'],
                symptom: 'Falla Sensor Hall del Ventilador',
                rootCause: 'El ventilador gira pero la tarjeta no recibe señal de RPM.',
                solution: [
                    'Medir voltaje en cable de señal (blanco/amarillo). Debe ser pulsante (aprox 2.5V DC).',
                    'Si hay 0V o 5V fijos girando, cambiar sensor Hall o ventilador.'
                ],
                reference: 'Sección 4.2 - El Confuso Caso del Error E4'
            },
            {
                id: 'tank_pilot',
                platforms: ['Rheem Depósito', 'Calorex Depósito'],
                codes: ['Piloto se apaga', 'Sin Código'],
                symptom: 'El piloto enciende pero se apaga al soltar perilla',
                rootCause: 'Termocupla genera <10mV, o Interruptor Térmico (ECO) abierto por retorno de llama.',
                solution: [
                    'CRÍTICO: Verificar interruptor térmico en cámara antes de cambiar termocupla.',
                    'Medir voltaje termocupla (min 12mV bajo carga).',
                    'Si >20mV y switch cerrado, cambiar válvula de gas.'
                ],
                reference: 'Sección 5.1 - La Termocupla'
            },
             {
                id: 'industrial_blink',
                platforms: ['Honeywell S8610U', 'Industrial'],
                codes: ['2 Flashes', '2 Parpadeos'],
                symptom: 'Piloto no encendió (Retry)',
                rootCause: 'Inyector piloto sucio, cable alta tensión aterrizado.',
                solution: [
                    'Limpiar inyector del piloto.',
                    'Revisar aislamiento del cable de bujía.',
                    'Verificar tierra del módulo.'
                ],
                reference: 'Sección 7.1 - Módulo Honeywell'
            }
        ];

        // --- COMPONENTS ---

        const Icon = ({ name, size = 24, color = "currentColor" }) => {
            React.useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} style={{color: color}}></i>;
        };

        const App = () => {
            const [step, setStep] = useState(1);
            const [projectData, setProjectData] = useState({
                techName: '',
                clientName: '',
                date: new Date().toISOString().split('T')[0],
                model: '',
                serial: ''
            });
            const [diagnosis, setDiagnosis] = useState({
                platform: '',
                code: '',
                conditions: {
                    gasPressure: false,
                    venting: false,
                    grounding: false
                }
            });
            const [result, setResult] = useState(null);
            const [image, setImage] = useState(null);

            const handleProjectChange = (e) => {
                setProjectData({ ...projectData, [e.target.name]: e.target.value });
            };

            const diagnose = () => {
                // Logic engine based on PDF
                let findings = KNOWLEDGE_BASE.filter(k => 
                    k.platforms.some(p => p.toLowerCase().includes(diagnosis.platform.toLowerCase())) || 
                    diagnosis.platform === 'Todas'
                );

                if (diagnosis.code) {
                    const exactMatch = findings.find(k => k.codes.includes(diagnosis.code.trim().toUpperCase()));
                    // Fuzzy match for specific edge cases (like E4 in different brands)
                    if (diagnosis.code.trim().toUpperCase() === 'E4') {
                        if (['Haceb', 'Midea'].some(p => diagnosis.platform.includes(p))) {
                            setResult(KNOWLEDGE_BASE.find(k => k.id === 'latam_e4_haceb'));
                            setStep(3);
                            return;
                        } else if (['Challenger', 'Calorex'].some(p => diagnosis.platform.includes(p))) {
                            setResult(KNOWLEDGE_BASE.find(k => k.id === 'latam_e4_challenger'));
                            setStep(3);
                            return;
                        }
                    }
                    
                    if (exactMatch) {
                        setResult(exactMatch);
                    } else {
                        // Generic Fallback if code not found but platform selected
                        setResult({
                            symptom: 'Código no documentado específicamente en esta BD.',
                            rootCause: 'Posible falla electrónica o de sensores no estándar.',
                            solution: ['Realizar inspección visual de placa.', 'Verificar voltajes de entrada.', 'Consultar manual específico del fabricante.'],
                            reference: 'Diagnóstico Genérico'
                        });
                    }
                } else {
                    // Manual selection or keyword search logic could go here
                     setResult({
                            symptom: 'Diagnóstico Manual Requerido',
                            rootCause: 'No se ingresó código de error.',
                            solution: ['Revise la tabla de códigos en el manual físico.', 'Verifique condiciones básicas de instalación.'],
                            reference: 'General'
                        });
                }
                setStep(3);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Informe estándar ENTALPÍA LAB (Imprimir / Guardar como PDF)
            const generatePDF = () => {
                if (!result) return;
                const ok = v => v ? { v: 'VERIFICADA', cls: 'ok' } : { v: 'NO VERIFICADA', cls: 'wa' };
                EK.informe({
                    titulo: 'Reporte de diagnóstico técnico — calentadores',
                    archivo: 'Diagnostico_' + (projectData.clientName || 'cliente').replace(/[^\w]+/g, '_'),
                    datos: [['Cliente / ubicación', projectData.clientName], ['Técnico', projectData.techName], ['Fecha', projectData.date],
                            ['Modelo / serie', (projectData.model || '—') + ' / ' + (projectData.serial || '—')], ['Plataforma / marca', diagnosis.platform], ['Código o síntoma', diagnosis.code || 'Sin código']],
                    secciones: [
                        { titulo: 'Diagnóstico', cabeza: ['Concepto', 'Detalle'], filas: [['Síntoma', result.symptom], ['Causa raíz probable', result.rootCause]] },
                        { titulo: 'Protocolo de solución sugerido', cabeza: ['#', 'Acción'], filas: result.solution.map((s, i) => [String(i + 1), s]) },
                        { titulo: 'Condiciones de instalación', cabeza: ['Condición', 'Estado'], filas: [
                            ['Presión dinámica de gas', ok(diagnosis.conditions.gasPressure)], ['Ventilación / recirculación', ok(diagnosis.conditions.venting)], ['Puesta a tierra', ok(diagnosis.conditions.grounding)]] },
                        image ? { titulo: 'Evidencia fotográfica', html: '<img class="fig" src="' + image + '" alt="Evidencia">' } : null
                    ],
                    notas: ['Referencia técnica: ' + result.reference, 'Este reporte es una guía de asistencia y no reemplaza el manual del fabricante.'],
                    firmas: ['Técnico', 'Cliente']
                });
            };

            return (
                <div className="min-h-screen pb-10">
                    {/* Header */}
                    <div className="bg-blue-700 text-white p-4 shadow-lg">
                        <div className="container mx-auto flex items-center gap-3">
                            <Icon name="flame" size={32} />
                            <div>
                                <h1 className="text-2xl font-bold">ThermoDiag Pro</h1>
                                <p className="text-xs opacity-80">Sistema Experto de Diagnóstico Térmico</p>
                            </div>
                        </div>
                    </div>

                    <div className="container mx-auto mt-8 px-4 max-w-2xl">
                        
                        {/* Step 1: Traceability */}
                        {step === 1 && (
                            <div className="glass-panel p-6 rounded-xl shadow-md slide-in">
                                <h2 className="text-xl font-semibold mb-4 text-gray-800 flex items-center gap-2">
                                    <Icon name="clipboard-list" className="text-blue-600"/> 
                                    Datos del Proyecto
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Técnico Responsable</label>
                                        <input type="text" name="techName" value={projectData.techName} onChange={handleProjectChange} className="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500" placeholder="Nombre del técnico" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Cliente / Ubicación</label>
                                        <input type="text" name="clientName" value={projectData.clientName} onChange={handleProjectChange} className="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500" placeholder="Ej. Familia Pérez" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Modelo Equipo</label>
                                        <input type="text" name="model" value={projectData.model} onChange={handleProjectChange} className="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500" placeholder="Ej. Rinnai R75" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Serie / ID</label>
                                        <input type="text" name="serial" value={projectData.serial} onChange={handleProjectChange} className="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500" placeholder="S/N" />
                                    </div>
                                </div>
                                <button 
                                    onClick={() => setStep(2)}
                                    className="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all flex justify-center items-center gap-2"
                                >
                                    Iniciar Diagnóstico <Icon name="arrow-right" size={18} />
                                </button>
                            </div>
                        )}

                        {/* Step 2: Symptom Input */}
                        {step === 2 && (
                            <div className="glass-panel p-6 rounded-xl shadow-md slide-in">
                                <h2 className="text-xl font-semibold mb-4 text-gray-800 flex items-center gap-2">
                                    <Icon name="stethoscope" className="text-red-600"/> 
                                    Triaje Técnico
                                </h2>
                                
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Plataforma / Marca del Equipo</label>
                                    <select 
                                        className="w-full p-3 border rounded-lg bg-white"
                                        value={diagnosis.platform}
                                        onChange={(e) => setDiagnosis({...diagnosis, platform: e.target.value})}
                                    >
                                        <option value="">Seleccione Plataforma...</option>
                                        <option value="Rinnai">Asiática (Rinnai, Rheem, Navien)</option>
                                        <option value="Bosch">Europea (Bosch, Junkers)</option>
                                        <option value="Haceb">Latinoamericana (Haceb, Midea)</option>
                                        <option value="Challenger">OEM/Challenger/Calorex</option>
                                        <option value="Industrial">Industrial/Comercial</option>
                                    </select>
                                </div>

                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Código de Error o Síntoma</label>
                                    <input 
                                        type="text" 
                                        className="w-full p-3 border rounded-lg text-lg font-mono uppercase" 
                                        placeholder="Ej. 11, E4, EA, Piloto"
                                        value={diagnosis.code}
                                        onChange={(e) => setDiagnosis({...diagnosis, code: e.target.value})}
                                    />
                                    <p className="text-xs text-gray-500 mt-1">Ingrese el código tal cual aparece en el display.</p>
                                </div>

                                <div className="bg-yellow-50 p-4 rounded-lg mb-6 border border-yellow-200">
                                    <h3 className="font-semibold text-yellow-800 text-sm mb-2">Condiciones de Instalación (Checklist)</h3>
                                    <div className="space-y-2">
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={diagnosis.conditions.gasPressure} onChange={(e) => setDiagnosis({...diagnosis, conditions: {...diagnosis.conditions, gasPressure: e.target.checked}})} />
                                            <span className="text-sm text-gray-700">Presión Dinámica de Gas Verificada</span>
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={diagnosis.conditions.venting} onChange={(e) => setDiagnosis({...diagnosis, conditions: {...diagnosis.conditions, venting: e.target.checked}})} />
                                            <span className="text-sm text-gray-700">Ducto de Ventilación sin obstrucción/fugas</span>
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={diagnosis.conditions.grounding} onChange={(e) => setDiagnosis({...diagnosis, conditions: {...diagnosis.conditions, grounding: e.target.checked}})} />
                                            <span className="text-sm text-gray-700">Puesta a tierra física &lt; 2 Ohms</span>
                                        </label>
                                    </div>
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setStep(1)} className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-medium">Atrás</button>
                                    <button onClick={diagnose} className="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-bold shadow-md">Diagnosticar</button>
                                </div>
                            </div>
                        )}

                        {/* Step 3: Results */}
                        {step === 3 && result && (
                            <div className="glass-panel p-6 rounded-xl shadow-md slide-in">
                                <div className="flex justify-between items-start mb-4">
                                    <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                        <Icon name="activity" className="text-green-600"/> 
                                        Diagnóstico
                                    </h2>
                                    <span className="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold border border-gray-300">
                                        Ref: {result.reference}
                                    </span>
                                </div>

                                <div className="mb-6">
                                    <p className="text-sm text-gray-500 uppercase font-bold tracking-wider">Síntoma Detectado</p>
                                    <p className="text-lg text-gray-900 font-medium border-l-4 border-red-500 pl-3 my-2">{result.symptom}</p>
                                </div>

                                <div className="mb-6">
                                    <p className="text-sm text-gray-500 uppercase font-bold tracking-wider">Causa Raíz Probable</p>
                                    <p className="text-gray-700 mt-1">{result.rootCause}</p>
                                </div>

                                <div className="bg-blue-50 p-5 rounded-lg border border-blue-100 mb-6">
                                    <h3 className="font-bold text-blue-800 mb-3 flex items-center gap-2"><Icon name="wrench" size={16}/> Solución Sugerida</h3>
                                    <ul className="list-disc pl-5 space-y-2">
                                        {result.solution.map((sol, idx) => (
                                            <li key={idx} className="text-gray-700 text-sm">{sol}</li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-2">
                                        <Icon name="camera" size={16}/> Adjuntar Foto (Opcional)
                                    </label>
                                    <input type="file" accept="image/*" onChange={handleImageUpload} className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                                    {image && <img src={image} alt="Evidencia" className="mt-4 h-32 object-cover rounded-lg border" />}
                                </div>

                                <div className="flex flex-col gap-3">
                                    <button 
                                        onClick={generatePDF}
                                        className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md flex justify-center items-center gap-2"
                                    >
                                        <Icon name="download" size={20}/> Informe PDF
                                    </button>
                                    <button 
                                        onClick={() => {setStep(2); setResult(null); setImage(null);}}
                                        className="w-full bg-white border border-gray-300 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-50"
                                    >
                                        Nueva Consulta
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
