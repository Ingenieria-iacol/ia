<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor CAD Gas Pro - Etiquetas Inteligentes</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <style>
        :root { --bg: #0f0f0f; --panel: #1a1a1a; --border: #333; --accent: #0071eb; --text: #d1d1d1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #000; height: 50px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 15px; z-index: 100; }
        #workspace { flex-grow: 1; display: flex; position: relative; }
        #main-area { flex-grow: 1; position: relative; background: #0a0a0a; overflow: hidden; }
        svg { width: 100%; height: 100%; cursor: grab; }
        
        /* Panel de Propiedades Profesional */
        #prop-card { position: absolute; right: 20px; top: 20px; width: 280px; background: rgba(20,20,20,0.95); border: 1px solid var(--border); border-top: 4px solid var(--accent); display: none; z-index: 1000; padding: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .prop-title { margin: 0 0 15px 0; font-size: 0.9rem; color: var(--accent); border-bottom: 1px solid #333; padding-bottom: 5px; font-weight: bold; }
        .prop-row { margin-bottom: 12px; }
        .prop-row label { display: block; font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 3px; }
        .prop-val { background: #000; border: 1px solid #222; color: #00f2ff; padding: 8px; font-family: 'Consolas', monospace; font-size: 0.85rem; border-radius: 3px; }

        .btn { background: #222; color: #eee; border: 1px solid #444; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .btn.primary { background: var(--accent); border: none; font-weight: bold; }
        .hud { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 4px; font-size: 0.7rem; font-family: monospace; border-left: 3px solid var(--accent); pointer-events: none; line-height: 1.4; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold; color:#fff;">CAD GAS <span style="color:var(--accent); font-size:0.7rem; border:1px solid; padding:2px 4px; border-radius:3px; margin-left:5px;">VISOR PRO</span></div>
    <div style="flex-grow: 1;"></div>
    <button class="btn" onclick="document.getElementById('file-input').click()">📂 Cargar Proyecto</button>
    <input type="file" id="file-input" style="display:none" onchange="window.AppFiles.cargar(this)">
    <button class="btn" onclick="window.AppCore.centrar()">🎯 Centrar</button>
    <button class="btn" onclick="window.UI.toggleTags()">🏷️ Alternar Etiquetas</button>
</header>

<div id="workspace">
    <div id="main-area">
        <svg id="canvas">
            <g id="viewport">
                <g id="layer-grid"></g>
                <g id="layer-elements"></g>
                <g id="layer-tags"></g>
            </g>
        </svg>

        <div id="prop-card">
            <div id="prop-content"></div>
            <button class="btn" style="width:100%; margin-top:15px; background:#333;" onclick="window.Props.cerrar()">Cerrar Visor</button>
        </div>

        <div class="hud">
            COORDENADAS: ISOMÉTRICAS<br>
            ESTADO: <span style="color:#0f0">SOLO LECTURA</span><br>
            ZOOM: <span id="hud-zoom">100</span>%
        </div>
    </div>
</div>

<script>
/**
 * LÓGICA DE VISUALIZACIÓN TÉCNICA
 */

window.estado = {
    view: { x: 0, y: 0, scale: 1, angle: Math.PI / 6 },
    lastMouse: { x: 0, y: 0 },
    isPanning: false,
    isRotating: false,
    showTags: true
};

window.CADMath = {
    isoToScreen: (x, y, z) => {
        const angle = window.estado.view.angle;
        const nx = x * Math.cos(angle) - y * Math.sin(angle);
        const ny = x * Math.sin(angle) + y * Math.cos(angle);
        return { x: nx * 100, y: (ny * 50) - (z * 70) };
    }
};

window.AppCore = {
    elementos: [],
    seleccionado: null,
    centrar: function() {
        window.estado.view.x = window.innerWidth / 2;
        window.estado.view.y = window.innerHeight / 2;
        window.estado.view.scale = 1;
        window.Renderer.actualizar();
    }
};

window.Renderer = {
    actualizar: function() {
        const elLayer = document.getElementById('layer-elements');
        const tagLayer = document.getElementById('layer-tags');
        elLayer.innerHTML = '';
        tagLayer.innerHTML = '';

        window.AppCore.elementos.forEach(el => {
            // Dibujar Geometría
            if (el.tipo === 'tuberia') this.drawPipe(el, elLayer);
            else this.drawEquip(el, elLayer);
            
            // Dibujar Etiquetas con información real
            if (window.estado.showTags) this.drawTechnicalTag(el, tagLayer);
        });

        const v = window.estado.view;
        document.getElementById('viewport').setAttribute("transform", `translate(${v.x}, ${v.y}) scale(${v.scale})`);
        document.getElementById('hud-zoom').innerText = Math.round(v.scale * 100);
    },

    drawPipe: function(el, container) {
        const s = window.CADMath.isoToScreen(el.x, el.y, el.z);
        const e = window.CADMath.isoToScreen(el.x + (el.dx||0), el.y + (el.dy||0), el.z + (el.dz||0));
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", s.x); line.setAttribute("y1", s.y);
        line.setAttribute("x2", e.x); line.setAttribute("y2", e.y);
        line.setAttribute("stroke", window.AppCore.seleccionado === el.id ? "#0071eb" : "#ffd700");
        line.setAttribute("stroke-width", "5");
        line.setAttribute("stroke-linecap", "round");
        line.style.cursor = "pointer";
        line.onclick = (ev) => { ev.stopPropagation(); window.Props.ver(el); };
        container.appendChild(line);
    },

    drawEquip: function(el, container) {
        const p = window.CADMath.isoToScreen(el.x, el.y, el.z);
        const g = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        g.setAttribute("cx", p.x); g.setAttribute("cy", p.y);
        g.setAttribute("r", 8 * (el.props.escala || 1));
        g.setAttribute("fill", window.AppCore.seleccionado === el.id ? "#0071eb" : "#00d4ff");
        g.style.cursor = "pointer";
        g.onclick = (ev) => { ev.stopPropagation(); window.Props.ver(el); };
        container.appendChild(g);
    },

    drawTechnicalTag: function(el, container) {
        // Posicionamiento en el centro del tramo o sobre el equipo
        const px = el.x + (el.dx || 0) / 2;
        const py = el.y + (el.dy || 0) / 2;
        const pz = el.z + (el.dz || 0) / 2;
        const pos = window.CADMath.isoToScreen(px, py, pz);

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `translate(${pos.x}, ${pos.y - 20})`);
        g.setAttribute("style", "pointer-events:none;");

        // Construcción de la etiqueta multilínea con datos reales
        const tagText = el.props.tag || (el.tipo === 'tuberia' ? 'TRAMO' : 'EQ');
        const infoExtra = el.tipo === 'tuberia' 
            ? `${el.props.diamNominal || '1/2"'} | L:${(el.props.longitudManual || 0).toFixed(2)}m`
            : `Elev: ${el.z.toFixed(2)}m`;

        const txtMain = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txtMain.setAttribute("fill", "#00f2ff");
        txtMain.setAttribute("font-size", "9px");
        txtMain.setAttribute("font-weight", "bold");
        txtMain.setAttribute("text-anchor", "middle");
        txtMain.textContent = tagText;

        const txtSub = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txtSub.setAttribute("y", "10");
        txtSub.setAttribute("fill", "#aaa");
        txtSub.setAttribute("font-size", "7px");
        txtSub.setAttribute("text-anchor", "middle");
        txtSub.textContent = infoExtra;

        g.appendChild(txtMain);
        g.appendChild(txtSub);
        container.appendChild(g);
    }
};

window.Props = {
    ver: function(el) {
        window.AppCore.seleccionado = el.id;
        window.Renderer.actualizar();
        const card = document.getElementById('prop-card');
        card.style.display = 'block';

        let html = `<div class="prop-title">${el.tipo.toUpperCase()}</div>`;
        html += `<div class="prop-row"><label>Tag / ID</label><div class="prop-val">${el.props.tag || 'N/A'}</div></div>`;
        html += `<div class="prop-row"><label>Elevación Z</label><div class="prop-val">${el.z.toFixed(2)} m</div></div>`;
        
        if (el.tipo === 'tuberia') {
            html += `<div class="prop-row"><label>Diámetro Nominal</label><div class="prop-val">${el.props.diamNominal || '1/2"'}</div></div>`;
            html += `<div class="prop-row"><label>Longitud Real</label><div class="prop-val">${(el.props.longitudManual || 0).toFixed(2)} m</div></div>`;
            // Memoria de cálculo resumida
            html += `<div style="margin-top:10px; padding:8px; background:#002200; border:1px solid #004400; font-size:0.7rem; color:#0f0;">CÁLCULO OK (MUELLER)</div>`;
        }

        document.getElementById('prop-content').innerHTML = html;
    },
    cerrar: function() {
        document.getElementById('prop-card').style.display = 'none';
        window.AppCore.seleccionado = null;
        window.Renderer.actualizar();
    }
};

// --- INTERACCIÓN Y CARGA ---
const svg = document.getElementById('canvas');
svg.onmousedown = (e) => {
    window.estado.lastMouse = { x: e.clientX, y: e.clientY };
    if (e.button === 0) window.estado.isPanning = true;
    if (e.button === 2) window.estado.isRotating = true;
};
window.onmousemove = (e) => {
    const dx = e.clientX - window.estado.lastMouse.x;
    const dy = e.clientY - window.estado.lastMouse.y;
    if (window.estado.isPanning) { window.estado.view.x += dx; window.estado.view.y += dy; }
    if (window.estado.isRotating) { window.estado.view.angle += dx * 0.01; window.Renderer.actualizar(); }
    window.estado.lastMouse = { x: e.clientX, y: e.clientY };
    if (window.estado.isPanning) window.Renderer.actualizar();
};
window.onmouseup = () => { window.estado.isPanning = false; window.estado.isRotating = false; };
svg.onwheel = (e) => { e.preventDefault(); window.estado.view.scale *= (e.deltaY > 0 ? 0.9 : 1.1); window.Renderer.actualizar(); };
svg.oncontextmenu = (e) => e.preventDefault();

window.AppFiles = {
    cargar: function(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            window.AppCore.elementos = data.elementos || [];
            window.AppCore.centrar();
        };
        reader.readAsText(input.files[0]);
    }
};

window.UI = {
    toggleTags: () => { window.estado.showTags = !window.estado.showTags; window.Renderer.actualizar(); }
};

window.onload = () => window.AppCore.centrar();
</script>
</body>
</html>
