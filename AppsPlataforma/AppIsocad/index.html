<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CAD Gas v8 - Ingeniería Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <style>
        :root { --bg: #141414; --panel: #1f1f1f; --border: #333; --accent: #0071eb; --text: #e5e5e5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #000; height: 45px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; padding: 0 15px; z-index: 100; }
        .btn { background: #333; color: #eee; border: 1px solid #444; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn.primary { background: var(--accent); border-color: #005a9e; }
        .btn.active { border-color: var(--accent); box-shadow: 0 0 5px var(--accent); }
        #workspace { flex-grow: 1; display: flex; position: relative; }
        #left-panel { width: 250px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; }
        #main-area { flex-grow: 1; position: relative; background: #111; overflow: hidden; }
        svg { width: 100%; height: 100%; cursor: crosshair; }
        #prop-card { position: absolute; right: 20px; top: 20px; width: 280px; background: rgba(25,25,25,0.95); border: 1px solid #444; border-top: 3px solid var(--accent); display: none; z-index: 1000; padding: 15px; }
        .prop-row { margin-bottom: 10px; }
        .prop-row label { display: block; font-size: 0.7rem; color: #888; }
        .prop-row input, .prop-row select { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 5px; }
        .lib-group-title { padding: 10px; background: #252525; cursor: pointer; font-weight: bold; border-bottom: 1px solid #333; }
        .tool-item { display: flex; align-items: center; gap: 10px; padding: 8px; cursor: pointer; }
        .tool-item.active { background: #333; border-left: 3px solid var(--accent); }
        .tool-icon svg { width: 20px; height: 20px; stroke: #ccc; fill: none; }
    </style>

<!-- EK:INICIO estilos -->
<style id="ek-kit-css">
/* ==== ENTALPÍA LAB · Kit estándar de aplicativos (Tecnologías Básicas) ====
   Fuente única: AppsPlataforma/_kit/entalpia-kit.css — se inserta en línea con _kit/aplicar_kit.py.
   Todas las clases llevan prefijo ek- para no chocar con Tailwind ni con el CSS propio de cada app. */
:root{
  --ek-bg:#0a0d12;--ek-pn:#141922;--ek-pn2:#10151d;--ek-tx:#e4eefa;--ek-mu:#8fa3bd;
  --ek-ac:#2f86e8;--ek-ac2:#62b0ff;--ek-bd:#2a3648;--ek-ok:#3fbf7f;--ek-wa:#e8b23a;--ek-er:#ef5b5b;
  --ek-metal:linear-gradient(135deg,#9bd0ff 0%,#2f6fc8 45%,#173a6b 100%);
  --ek-hdr:52px;--ek-ftr:30px;
}
html.ek body{padding-top:var(--ek-hdr)!important;padding-bottom:var(--ek-ftr)!important;box-sizing:border-box}
html.ek.ek-sinpie body{padding-bottom:0!important}
/* Las vistas a pantalla completa descuentan la cabecera y el pie del kit */
html.ek .h-screen{height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important}
html.ek .min-h-screen{min-height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important}
html.ek .h-\[100dvh\]{height:calc(100dvh - var(--ek-hdr) - var(--ek-ftr))!important}

/* ---------- cabecera ---------- */
.ek-hdr{position:fixed;top:0;left:0;right:0;height:var(--ek-hdr);z-index:2147483000;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,#121924,#0c1118);border-bottom:1px solid var(--ek-bd);color:var(--ek-tx);
  font:14px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;min-width:0}
.ek-hdr *{box-sizing:border-box}
.ek-hdr .ek-logo{height:38px;width:auto;border-radius:6px;flex:none;display:block}
.ek-hdr .ek-tit{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.ek-hdr .ek-tit b{font-size:16px;letter-spacing:.3px;background:var(--ek-metal);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ek-hdr .ek-tit span{font-size:11.5px;color:var(--ek-mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-hdr .ek-sp{flex:1;min-width:6px}
.ek-hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ek-bd);background:#18202c;color:var(--ek-tx);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;font:13px/1.2 Inter,system-ui,sans-serif;text-decoration:none}
.ek-hbtn:hover{border-color:var(--ek-ac)}
.ek-hbtn.pri{background:var(--ek-ac);border-color:var(--ek-ac);color:#fff}

/* ---------- pie ---------- */
.ek-ftr{position:fixed;left:0;right:0;bottom:0;height:var(--ek-ftr);z-index:2147482999;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-top:1px solid var(--ek-bd);background:#0c1118;color:var(--ek-mu);font:11.5px/1.2 Inter,system-ui,sans-serif;box-sizing:border-box;min-width:0}
.ek-ftr img{height:22px;width:auto;border-radius:4px;flex:none}
.ek-ftr .ek-sp{flex:1}
.ek-ftr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- modales ---------- */
.ek-modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;align-items:center;justify-content:center;z-index:2147483100;padding:12px;
  font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ek-tx)}
.ek-modal.on{display:flex}
.ek-mbox{position:relative;background:var(--ek-pn);border:1px solid var(--ek-bd);border-radius:12px;max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:left}
.ek-mhd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ek-bd);cursor:move;user-select:none;flex:none}
.ek-mhd b{font-size:15px;font-weight:700}.ek-mhd .ek-sp{flex:1}
.ek-mbd{padding:12px 14px;overflow:auto;min-height:0}
.ek-mbd h3{font-size:14px;margin:14px 0 6px;color:var(--ek-ac2);font-weight:700}
.ek-mbd h3:first-child{margin-top:2px}
.ek-mbd p,.ek-mbd li{color:#cfdcec;margin:4px 0}
.ek-mbd ul,.ek-mbd ol{padding-left:22px;margin:4px 0}.ek-mbd ul{list-style:disc}.ek-mbd ol{list-style:decimal}
.ek-mbd code,.ek-mbd .ek-f{font-family:Consolas,"JetBrains Mono",monospace;background:#0d1219;border:1px solid var(--ek-bd);border-radius:5px;padding:1px 5px;font-size:12.5px;color:#cfe6ff}
.ek-mbd .ek-f{display:block;padding:6px 9px;margin:6px 0;white-space:pre-wrap}
.ek-mbd table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.ek-mbd th,.ek-mbd td{border-bottom:1px solid #1d2734;padding:5px 6px;text-align:left}
.ek-mbd th{color:var(--ek-mu);font-weight:600}
.ek-mft{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--ek-bd);flex:none;flex-wrap:wrap}
.ek-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ek-bd);background:#1a2330;color:var(--ek-tx);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font:13px/1.2 Inter,system-ui,sans-serif}
.ek-btn:hover{border-color:var(--ek-ac)}
.ek-btn.pri{background:var(--ek-ac);border-color:var(--ek-ac);color:#fff}
.ek-btn.dan{border-color:#6b2a2a;color:#ffb3b3}
.ek-btn.sm{padding:4px 8px;font-size:12.5px}
.ek-x{border:0;background:none;color:var(--ek-mu);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.ek-x:hover{color:#fff}
.ek-note{font-size:12.5px;border-left:3px solid var(--ek-ac);background:#0f1724;padding:6px 9px;border-radius:0 6px 6px 0;margin:8px 0;color:#c4d4ea}
.ek-note.wa{border-color:var(--ek-wa)}.ek-note.er{border-color:var(--ek-er)}.ek-note.ok{border-color:var(--ek-ok)}
#ek-toast{position:fixed;left:50%;bottom:calc(var(--ek-ftr) + 14px);transform:translateX(-50%);background:#16243a;color:var(--ek-tx);border:1px solid var(--ek-ac);border-radius:8px;padding:8px 12px;z-index:2147483200;display:none;max-width:min(92vw,560px);font:13px/1.4 Inter,system-ui,sans-serif;word-break:break-word;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* bloques que solo existen en impresión */
.ek-print{display:none}
#ek-reporte{display:none}

@media (max-width:720px){
  :root{--ek-hdr:48px;--ek-ftr:26px}
  .ek-hdr .ek-tit span{display:none}
  .ek-hdr .ek-logo{height:32px}
  .ek-hbtn .ek-lbl{display:none}
  .ek-ftr .ek-hide-m{display:none}
}

/* ---------- impresión / PDF del navegador ---------- */
@media print{
  html.ek body{padding:0!important}
  .ek-hdr,.ek-ftr,.ek-modal,#ek-toast{display:none!important}
  .ek-print{display:block!important;visibility:visible!important;color:#111;font:9.5pt/1.35 "Segoe UI",Arial,sans-serif;position:static!important}
  .ek-print *{visibility:visible!important}
  .ek-print-cab{display:flex!important;align-items:center;gap:12px;border-bottom:2px solid #1d4f8f;padding:0 0 6px;margin:0 0 10px;break-inside:avoid}
  .ek-print-cab img{height:44px;width:auto}
  .ek-print-cab h1{font-size:14pt;margin:0;color:#173a6b;font-weight:700}
  .ek-print-cab div div{font-size:9pt;color:#444}
  .ek-print-pie{display:flex!important;align-items:center;gap:8px;margin-top:14px;border-top:1px solid #c8d3e2;padding-top:6px;font-size:8pt;color:#555;break-inside:avoid}
  .ek-print-pie img{height:26px;width:auto}
  .ek-print-pie span{flex:1}
  html.ek .h-screen,html.ek .min-h-screen{height:auto!important;min-height:0!important}
  /* informe estándar EK.informe(): solo se imprime el informe */
  html.ek-informe body>*:not(#ek-reporte){display:none!important}
  html.ek-informe body{background:#fff!important;color:#111!important}
  html.ek-informe #ek-reporte{display:block!important;visibility:visible!important;color:#111;font:9.6pt/1.4 "Segoe UI",Arial,sans-serif}
  html.ek-informe #ek-reporte *{visibility:visible!important}
  #ek-reporte .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1d4f8f;padding-bottom:6px;margin-bottom:8px}
  #ek-reporte .rh img{height:46px;width:auto}
  #ek-reporte h1{font-size:14.5pt;margin:0;color:#173a6b;font-weight:700}
  #ek-reporte ul{list-style:disc;padding-left:18px;margin:4px 0}#ek-reporte ol{list-style:decimal;padding-left:18px}
  #ek-reporte .rh div div{font-size:9pt;color:#444}
  #ek-reporte h2{font-size:11pt;font-weight:700;color:#173a6b;margin:12px 0 4px;border-bottom:1px solid #c8d3e2;padding-bottom:2px;break-after:avoid}
  #ek-reporte table{width:100%;border-collapse:collapse;font-size:8.8pt;margin:2px 0 4px}
  #ek-reporte th,#ek-reporte td{border:1px solid #c8d3e2;padding:3px 5px;text-align:left;background:#fff;color:#111;vertical-align:top}
  #ek-reporte th{background:#eaf1fa!important;font-weight:600}
  #ek-reporte td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #ek-reporte tr{break-inside:avoid}
  #ek-reporte .ok{color:#17663f;font-weight:700}#ek-reporte .no{color:#a3161d;font-weight:700}#ek-reporte .wa{color:#8a5a00;font-weight:700}
  #ek-reporte .ver{border:1.5px solid #1d4f8f;border-radius:6px;padding:7px 10px;margin:10px 0;font-size:10.5pt;break-inside:avoid}
  #ek-reporte .ver.ok{border-color:#17663f;background:#effaf3!important}#ek-reporte .ver.no{border-color:#a3161d;background:#fdf0f0!important}#ek-reporte .ver.wa{border-color:#8a5a00;background:#fdf8ea!important}
  #ek-reporte .txt{margin:4px 0;white-space:pre-wrap}
  #ek-reporte .fm{font-family:Consolas,monospace;font-size:8.6pt;background:#f4f7fb!important;border:1px solid #d5dfec;padding:4px 7px;margin:4px 0;white-space:pre-wrap}
  #ek-reporte .firmas td{height:48px;vertical-align:bottom;text-align:center;font-size:8.6pt;color:#444}
  #ek-reporte .pie{margin-top:14px;border-top:1px solid #c8d3e2;padding-top:6px;font-size:8pt;color:#555;display:flex;align-items:center;gap:8px;break-inside:avoid}
  #ek-reporte .pie img{height:28px;width:auto}
  #ek-reporte img.fig{max-width:100%;max-height:120mm;display:block;margin:6px auto;border:1px solid #c8d3e2}
  html.ek-informe .ek-print{display:none!important}
  @page{margin:12mm 12mm 14mm;@bottom-right{content:"Pág. " counter(page) " / " counter(pages);font:8pt Arial,sans-serif;color:#555}}
}

/* ajustes propios del aplicativo */
body{height:100vh!important}
</style>
<!-- EK:FIN estilos -->
</head>

window.EK_CFG={"app": "CAD Gas Isométrico", "sub": "Dibujo isométrico con cálculo por tramo", "ver": "8.1", "informe": "Memoria técnica y de cálculo", "oscuro": false, "raiz": "../../", "ayuda": "<h3>¿Para qué sirve?<\/h3>\n<p>CAD isométrico de redes de gas con cálculo por tramo y reporte técnico con lista de materiales y memoria de cálculo.<\/p>\n<h3>Cómo usarlo<\/h3>\n<ol><li>Elija tuberías y componentes en la biblioteca y dibújelos en el lienzo; la elevación Z se ajusta en propiedades.<\/li>\n<li>Seleccione cada tubería e ingrese material, diámetro, caudal y presión de entrada: el panel muestra ΔP, velocidad y estado.<\/li>\n<li>Guarde o abra el proyecto (JSON) y genere el <b>Reporte PDF<\/b>.<\/li><\/ol>\n<h3>Método de cálculo<\/h3>\n<div class=\"ek-f\">ΔP = 2,43·10^7 · S · L · Q^1,82 / (D int^4,82 · P abs)   [mbar, m, m³/h, mm]\nV = Q real / A ,  Q real = Q · 1 013,25 / P abs\nEstado OK: ΔP ≤ 10 % de la presión de entrada y V ≤ 20 m/s<\/div>\n<div class=\"ek-note\">Los diámetros internos dependen del material (acero Sch 40/80/160, cobre K/L/M, flexible, multicapa, PE).<\/div>\n"};

/* ==== ENTALPÍA LAB · Kit estándar de aplicativos (Tecnologías Básicas) ====

   Configuración por aplicativo en window.EK_CFG (se define antes de este script):
     app     nombre del aplicativo            sub     subtítulo de la cabecera
     ver     versión mostrada en el pie       norma   referencia normativa (texto)
     ayuda   HTML de la guía de uso           raiz    ruta relativa a la raíz del sitio ("../")
     alerta  false para conservar window.alert nativo
     pdf     false para no enmarcar los PDF de jsPDF
     marcoImpresion false si la app ya imprime su propio encabezado
     oscuro  true para aplicar el tema oscuro estándar a apps Tailwind claras

(function () {
  'use strict';
  if (window.EK && window.EK.__v) return;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fecha() { var f = new Date(); return f.toLocaleDateString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit' }) + ' ' + f.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }); }

  /* ---------- cabecera y pie ---------- */

  /* ---------- modales ---------- */
  var abiertos = [];
  function arrastrable(box, asa) {
    var x0, y0, dx = 0, dy = 0, mov = false;
    asa.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button,a,input,select,textarea')) return;
      mov = true; x0 = e.clientX - dx; y0 = e.clientY - dy;
      try { asa.setPointerCapture(e.pointerId); } catch (er) {}
    });
    asa.addEventListener('pointermove', function (e) {
      if (!mov) return;
      dx = e.clientX - x0; dy = e.clientY - y0;
      box.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';

    function fin() { mov = false; }

  /* EK.modal({titulo, html|nodo, ancho, botones:[{t, cls, fn(cerrar)->false para no cerrar}], alCerrar, cerrarFondo})
     Devuelve {el, cuerpo, cerrar}. */
  EK.modal = function (o) {
    o = o || {};
    var m = d.createElement('div');
    m.className = 'ek-modal on';
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
    m.innerHTML = '<div class="ek-mbox"' + (o.ancho ? ' style="max-width:' + o.ancho + 'px"' : '') + '>' +
      '<div class="ek-mhd"><b>' + esc(o.titulo || '') + '</b><div class="ek-sp"></div><span class="ek-mhd-extra"></span><button type="button" class="ek-x" title="Cerrar" aria-label="Cerrar">×</button></div>' +
      '<div class="ek-mbd"></div>' + ((o.botones && o.botones.length) ? '<div class="ek-mft"></div>' : '') + '</div>';
    var box = m.firstChild, cuerpo = m.querySelector('.ek-mbd');
    if (o.nodo) cuerpo.appendChild(o.nodo); else cuerpo.innerHTML = o.html || '';
    var cerrado = false;
    function cerrar(v) {
      if (cerrado) return; cerrado = true;
      m.remove();
      abiertos = abiertos.filter(function (x) { return x !== api; });
      if (o.alCerrar) o.alCerrar(v);
    }
    var api = { el: m, cuerpo: cuerpo, cerrar: cerrar, cabecera: m.querySelector('.ek-mhd-extra') };
    (o.botones || []).forEach(function (b) {
      var bt = d.createElement('button');
      bt.type = 'button';
      bt.className = 'ek-btn ' + (b.cls || '');
      bt.textContent = b.t;
      bt.onclick = function () { var r = b.fn ? b.fn(cerrar) : undefined; if (r !== false) cerrar(b.v); };
      m.querySelector('.ek-mft').appendChild(bt);
    });
    m.querySelector('.ek-x').onclick = function () { cerrar(o.vCerrar); };
    if (o.cerrarFondo !== false) m.addEventListener('mousedown', function (e) { if (e.target === m) cerrar(o.vCerrar); });
    arrastrable(box, m.querySelector('.ek-mhd'));
    (d.body || d.documentElement).appendChild(m);
    abiertos.push(api);
    var f = m.querySelector('.ek-mft .pri') || m.querySelector('.ek-mft .ek-btn');
    if (f) setTimeout(function () { try { f.focus(); } catch (e) {} }, 30);
    return api;
  };
  d.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && abiertos.length) { abiertos[abiertos.length - 1].cerrar(); e.stopPropagation(); }
  }, true);

  EK.alerta = function (msg, titulo) {
    var txt = String(msg == null ? '' : msg);
    var tipo = /error|no se pudo|inválid|invalid|falt|debe|⚠|❌/i.test(txt) ? 'wa' : '';
    return new Promise(function (res) {
      EK.modal({
        titulo: titulo || C.app || 'Aviso', ancho: 460,
        html: '<div class="ek-note ' + tipo + '" style="white-space:pre-wrap;margin:0">' + esc(txt) + '</div>',
        botones: [{ t: 'Aceptar', cls: 'pri' }], alCerrar: function () { res(); }
      });
    });
  };
  EK.confirmar = function (titulo, texto, si, no) {
    return new Promise(function (res) {
      EK.modal({
        titulo: titulo || 'Confirmar', ancho: 460, vCerrar: false,
        html: '<p style="white-space:pre-wrap;margin:0">' + esc(texto || '') + '</p>',
        botones: [{ t: no || 'Cancelar', v: false }, { t: si || 'Aceptar', cls: 'pri', v: true }],
        alCerrar: function (v) { res(!!v); }
      });
    });
  };
  EK.toast = function (msg, ms) {
    var t = d.getElementById('ek-toast');
    if (!t) { t = d.createElement('div'); t.id = 'ek-toast'; d.body.appendChild(t); }
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, ms || 3500);
  };
  EK.descargar = function (nombre, contenido, tipo) {
    var b = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo || 'text/plain;charset=utf-8' });
    var a = d.createElement('a');
    a.href = URL.createObjectURL(b); a.download = nombre;
    d.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  };

  /* ---------- guía de uso ---------- */
  function guiaHTML() {
    return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guía de uso · ' + esc(C.app) + '</title>' +

    var b = d.createElement('button');

  /* ---------- informe estándar (Imprimir / Guardar como PDF) ----------
     EK.informe({
       titulo, subtitulo,
       datos:[[etiqueta, valor], ...],                       // identificación del proyecto
       secciones:[{titulo, cabeza:[...], filas:[[...],...], numeros:[índices de columnas numéricas],
                   formula:'texto', texto:'texto', html:'html propio'}],
       veredicto:{tipo:'ok'|'no'|'wa', txt:'...'},
       notas:['...'], firmas:true|['Elaboró','Revisó'] })
     Abre el diálogo de impresión del navegador; el usuario elige "Guardar como PDF". */
  EK.informe = function (o) {
    o = o || {};
    var h = [];
    h.push('<div class="rh"><img src="' + LOGO_ENT + '" alt="Entalpía"><div><h1>' + esc(o.titulo || C.informe || C.app) + '</h1><div>' +
      esc(o.subtitulo || ('ENTALPÍA LAB · ' + (C.app || '') + (C.norma ? ' · ' + C.norma : ''))) + ' · Generado: ' + fecha() + '</div></div></div>');
    if (o.datos && o.datos.length) {
      h.push('<table><tbody>');
      for (var i = 0; i < o.datos.length; i += 2) {
        var a = o.datos[i], b = o.datos[i + 1];
        h.push('<tr><th style="width:18%">' + esc(a[0]) + '</th><td style="width:32%">' + esc(a[1] == null || a[1] === '' ? '—' : a[1]) + '</td>' +
          (b ? '<th style="width:18%">' + esc(b[0]) + '</th><td style="width:32%">' + esc(b[1] == null || b[1] === '' ? '—' : b[1]) + '</td>' : '<td colspan="2"></td>') + '</tr>');
      }
      h.push('</tbody></table>');
    }
    (o.secciones || []).forEach(function (s) {
      if (!s) return;
      if (s.titulo) h.push('<h2>' + esc(s.titulo) + '</h2>');
      if (s.texto) h.push('<div class="txt">' + esc(s.texto) + '</div>');
      if (s.formula) h.push('<div class="fm">' + esc(s.formula) + '</div>');
      if (s.filas && s.filas.length) {
        var nums = s.numeros || [];
        h.push('<table>');
        if (s.cabeza) h.push('<thead><tr>' + s.cabeza.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead>');
        h.push('<tbody>' + s.filas.map(function (f) {
          return '<tr>' + f.map(function (c, j) {
            var cls = nums.indexOf(j) >= 0 ? ' class="n"' : '';
            if (c && typeof c === 'object' && 'v' in c) return '<td class="' + (c.cls || '') + (nums.indexOf(j) >= 0 ? ' n' : '') + '">' + esc(c.v) + '</td>';
            return '<td' + cls + '>' + esc(c == null ? '' : c) + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table>');
      }
      if (s.html) h.push(s.html);
    });
    if (o.veredicto) h.push('<div class="ver ' + (o.veredicto.tipo || '') + '">' + esc(o.veredicto.txt) + '</div>');
    if (o.notas && o.notas.length) h.push('<h2>Observaciones</h2><ul>' + o.notas.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>');
    if (o.firmas) {
      var f = o.firmas === true ? ['Elaboró', 'Revisó / Aprobó'] : o.firmas;
      h.push('<table class="firmas" style="margin-top:16px"><tr>' + f.map(function (x) { return '<td>__________________________<br>' + esc(x) + '<br>Nombre, matrícula y firma</td>'; }).join('') + '</tr></table>');
    }
    h.push('<div class="pie"><img src="' + LOGO_PIO + '" alt="Pioneer\'s"><span>' + PIE + ' · ' + esc(C.app || '') + (C.ver ? ' v' + esc(C.ver) : '') +
      '. Resultado de apoyo técnico generado por software: debe ser verificado por un profesional competente' + (C.norma ? ' frente a ' + esc(C.norma) + ' vigente' : '') + '.</span></div>');
    var r = d.getElementById('ek-reporte');
    if (!r) { r = d.createElement('div'); r.id = 'ek-reporte'; d.body.appendChild(r); }
    r.innerHTML = h.join('');
    d.documentElement.classList.add('ek-informe');
    var t0 = d.title;
    if (o.archivo) d.title = o.archivo;
    function fin() { d.documentElement.classList.remove('ek-informe'); d.title = t0; window.removeEventListener('afterprint', fin); }
    window.addEventListener('afterprint', fin);
    setTimeout(function () { window.print(); setTimeout(fin, 500); }, 120);
  };

  /* ---------- marco estándar para PDF de jsPDF ----------
     Reduce el contenido de cada página para dejar espacio a la franja de cabecera (logo Entalpía, título)
     y al pie (texto del Hub, paginación, logo Pioneer's), igual que los informes de Isoflux. */
  EK.marcoPDF = function (doc, o) {
    if (!doc || doc.__ekMarco) return doc;
    doc.__ekMarco = true;
    o = o || {};
    try {
      var n = doc.getNumberOfPages(), k = doc.internal.scaleFactor;
      var tit = o.titulo || C.informe || C.app || 'Informe';
      var sub = 'ENTALPÍA LAB · ' + (C.app || '') + (C.norma ? ' · ' + C.norma : '') + ' · ' + fecha();
      var TOP = 50, BOT = 30; // pt
      for (var i = 1; i <= n; i++) {
        doc.setPage(i);
        var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
        var Wp = W * k, Hp = H * k;
        var s = (Hp - TOP - BOT) / Hp;
        var tx = (Wp - s * Wp) / 2, ty = BOT + ((Hp - TOP - BOT) - s * Hp) / 2;
        var pg = doc.internal.pages[i];
        if (pg && pg.unshift) { pg.unshift('q ' + s.toFixed(5) + ' 0 0 ' + s.toFixed(5) + ' ' + tx.toFixed(3) + ' ' + ty.toFixed(3) + ' cm'); pg.push('Q'); }
        var u = function (pt) { return pt / k; };
        doc.setFillColor(12, 17, 26); doc.rect(0, 0, W, u(TOP - 6), 'F');
        doc.setFillColor(30, 95, 191); doc.rect(0, u(TOP - 6), W, u(1.6), 'F');
        try { doc.addImage(LOGO_ENT, 'JPEG', u(14), u(4), u(40), u(35)); } catch (e) {}
        doc.setFont('helvetica', 'bold'); doc.setTextColor(190, 225, 255); doc.setFontSize(13);
        doc.text(String(tit).slice(0, 90), u(64), u(20));
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(150, 175, 205);
        doc.text(sub.slice(0, 150), u(64), u(33));
        doc.setDrawColor(30, 95, 191); doc.setLineWidth(u(0.8));
        doc.line(u(22), H - u(BOT - 4), W - u(22), H - u(BOT - 4));
        doc.setTextColor(80, 80, 80); doc.setFontSize(7.5);
        doc.text(PIE + ' · ' + (C.app || ''), u(22), H - u(12));
        doc.text('Pág. ' + i + '/' + n, W - u(52), H - u(12), { align: 'right' });
        try { doc.addImage(LOGO_PIO, 'JPEG', W - u(46), H - u(BOT - 6), u(26), u(21)); } catch (e) {}
      }
      doc.setTextColor(0, 0, 0); doc.setDrawColor(0, 0, 0); doc.setFillColor(255, 255, 255);
      doc.setPage(n);
    } catch (e) { if (window.console) console.warn('EK.marcoPDF', e); }
    return doc;
  };
  function enganchaJsPDF() {
    if (C.pdf === false) return true;
    var ns = window.jspdf, Orig = ns && ns.jsPDF;
    if (!Orig || Orig.__ek) return !!(Orig && Orig.__ek);
    function envolver(doc) {
      ['save', 'output'].forEach(function (m) {
        var f = doc[m];
        if (typeof f !== 'function') return;
        doc[m] = function () { EK.marcoPDF(doc); return f.apply(doc, arguments); };
      });
      return doc;
    }
    function J(a, b, c, e) { var doc = new Orig(a, b, c, e); return envolver(doc); }
    J.prototype = Orig.prototype;
    Object.keys(Orig).forEach(function (kk) { try { J[kk] = Orig[kk]; } catch (er) {} });
    J.API = Orig.API; J.version = Orig.version; J.__ek = true; J.__orig = Orig;
    ns.jsPDF = J;
    if (window.jsPDF === Orig) window.jsPDF = J;
    return true;
  }
  EK.enganchaJsPDF = enganchaJsPDF;

  /* ---------- arranque ---------- */
  d.documentElement.classList.add('ek');
  if (C.oscuro) d.documentElement.classList.add('ek-oscuro');
  if (C.alerta !== false) {
    var alertaNativa = window.alert;
    EK.alertaNativa = alertaNativa;
    window.alert = function (m) { if (!d.body) return alertaNativa.call(window, m); EK.alerta(m); };
  }
  if (!enganchaJsPDF()) {
    var tries = 0, iv = setInterval(function () { if (enganchaJsPDF() || ++tries > 40) clearInterval(iv); }, 250);
    window.addEventListener('load', enganchaJsPDF);
  }
  function bordesOscuros() {
    // Tailwind (preflight) pinta todos los bordes "sin color" en gris claro; en el tema oscuro se
    // reemplaza con especificidad cero y al final del documento, para no pisar los bordes de color.
    if (!C.oscuro || d.getElementById('ek-oscuro-base')) return;
    var s = d.createElement('style');
    s.id = 'ek-oscuro-base';
    s.textContent = '@media screen{:where(html.ek-oscuro) *,:where(html.ek-oscuro) ::before,:where(html.ek-oscuro) ::after{border-color:#2a3648}}';
    d.body.appendChild(s);
  }
  if (d.body) montar(); else d.addEventListener('DOMContentLoaded', montar);
  if (d.readyState === 'complete') bordesOscuros(); else window.addEventListener('load', bordesOscuros);
})();

</script>
