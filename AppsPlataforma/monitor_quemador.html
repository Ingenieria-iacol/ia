<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor del quemador</title>
<style>
  :root{
    --bg:#e3e5e1; --panel:#f3f4f1; --ink:#1d2a30; --muted:#66757c; --line:#c4c9c5;
    --steel:#33434b; --steel2:#52646d; --ok:#2f8f5b; --warn:#c7791a; --bad:#b83a2e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px}
  main{width:100%;max-width:1000px;display:grid;gap:16px}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  h1{font-size:1.25rem;margin:0;font-weight:600}
  #estado{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
  #punto{width:10px;height:10px;border-radius:50%;background:var(--muted)}
  .vivo #punto{background:var(--ok)} .viejo #punto{background:var(--warn)} .error #punto{background:var(--bad)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  svg{width:100%;height:auto;display:block}
  #datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .dato small{display:block;color:var(--muted);font-size:.8rem}
  .dato b{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
  .flama{transform-origin:50% 100%;transform-box:fill-box;animation:flick 1.3s ease-in-out infinite alternate}
  .flama.b{animation-duration:.9s;animation-delay:-.4s}
  .flama.c{animation-duration:1.1s;animation-delay:-.7s}
  @keyframes flick{from{transform:scaleY(calc(var(--s) * .93)) scaleX(1)}to{transform:scaleY(calc(var(--s) * 1.05)) scaleX(.97)}}
  @media (prefers-reduced-motion:reduce){.flama{animation:none;transform:scaleY(var(--s))}}
  #config{font-size:.85rem;color:var(--muted)}
  #config label{margin-right:14px}
  #config input{width:70px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:#fff}
</style>
</head>
<body>
<main>
  <header>
    <h1>Monitor del quemador</h1>
    <div id="estado" class="error"><span id="punto"></span><span id="estadoTxt">Conectando…</span></div>
  </header>

  <section class="card">
    <svg viewBox="0 0 800 380" role="img" aria-label="Quemador con temperatura actual">
      <defs>
        <linearGradient id="gTubo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6f828c"/><stop offset=".5" stop-color="#33434b"/><stop offset="1" stop-color="#26323a"/>
        </linearGradient>
        <linearGradient id="gFlama" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" id="fA" stop-color="#2d6fd6"/>
          <stop offset=".35" id="fB" stop-color="#f08a1c"/>
          <stop offset="1" id="fC" stop-color="#ffd25a" stop-opacity=".85"/>
        </linearGradient>
        <radialGradient id="glow"><stop offset="0" id="glowC" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
      </defs>

      <!-- suelo -->
      <rect x="0" y="330" width="800" height="50" fill="#d3d7d3"/>

      <!-- resplandor -->
      <ellipse id="resplandor" cx="400" cy="190" rx="170" ry="150" fill="url(#glow)" opacity="0"/>

      <!-- tubería de gas -->
      <rect x="20" y="268" width="250" height="26" rx="3" fill="url(#gTubo)"/>
      <rect x="64" y="258" width="14" height="46" rx="2" fill="#26323a"/>
      <rect x="150" y="258" width="14" height="46" rx="2" fill="#26323a"/>
      <!-- válvula -->
      <rect x="196" y="262" width="34" height="38" rx="4" fill="#52646d"/>
      <line x1="213" y1="262" x2="213" y2="236" stroke="#26323a" stroke-width="6"/>
      <circle cx="213" cy="232" r="14" fill="none" stroke="#b83a2e" stroke-width="6"/>
      <line x1="199" y1="232" x2="227" y2="232" stroke="#b83a2e" stroke-width="5"/>

      <!-- cuerpo del quemador -->
      <path d="M270 262 H330 L345 300 H455 L470 262 H530 V300 H270 Z" fill="none"/>
      <rect x="270" y="268" width="80" height="26" fill="url(#gTubo)"/>
      <path d="M330 272 H470 L488 316 H312 Z" fill="url(#gTubo)"/>
      <rect x="300" y="316" width="200" height="14" rx="3" fill="#26323a"/>
      <rect x="338" y="330" width="14" height="22" fill="#26323a"/>
      <rect x="448" y="330" width="14" height="22" fill="#26323a"/>
      <!-- cabezal con orificios -->
      <rect x="322" y="258" width="156" height="18" rx="4" fill="#52646d"/>
      <g fill="#1d2a30"><circle cx="345" cy="267" r="3"/><circle cx="375" cy="267" r="3"/><circle cx="405" cy="267" r="3"/><circle cx="435" cy="267" r="3"/><circle cx="460" cy="267" r="3"/></g>

      <!-- flamas -->
      <g id="flamas" style="--s:.2">
        <path class="flama" d="M400 258 C350 220 360 170 400 90 C440 170 450 220 400 258 Z" fill="url(#gFlama)"/>
        <path class="flama b" d="M350 258 C318 232 326 196 350 148 C374 196 382 232 350 258 Z" fill="url(#gFlama)" opacity=".9"/>
        <path class="flama c" d="M452 258 C420 232 428 196 452 148 C476 196 484 232 452 258 Z" fill="url(#gFlama)" opacity=".9"/>
      </g>

      <!-- etiqueta de temperatura -->
      <line x1="560" y1="150" x2="470" y2="215" stroke="#33434b" stroke-width="2" stroke-dasharray="5 4"/>
      <circle cx="470" cy="215" r="5" fill="#33434b"/>
      <rect x="540" y="70" width="230" height="110" rx="10" fill="#fff" stroke="#33434b" stroke-width="2.5"/>
      <text x="655" y="100" text-anchor="middle" font-size="15" fill="#66757c">Temperatura</text>
      <text id="valor" x="655" y="150" text-anchor="middle" font-size="46" font-weight="600" fill="#1d2a30" style="font-variant-numeric:tabular-nums">--,-- °C</text>
      <rect id="franja" x="540" y="164" width="230" height="16" rx="0" fill="#66757c"/>
      <text id="nivel" x="655" y="177" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Sin datos</text>
    </svg>
  </section>

  <section class="card" id="datos">
    <div class="dato"><small>Última lectura</small><b id="ult">—</b></div>
    <div class="dato"><small>Mínima (últimas lecturas)</small><b id="min">—</b></div>
    <div class="dato"><small>Máxima (últimas lecturas)</small><b id="max">—</b></div>
    <div class="dato"><small>Lecturas leídas</small><b id="n">—</b></div>
  </section>

  <section class="card">
    <svg viewBox="0 0 800 160" id="grafica" role="img" aria-label="Historial de temperatura"></svg>
  </section>

  <section class="card" id="config">
    <label>Temperatura media desde <input type="number" id="tMed" value="30"> °C</label>
    <label>Alta desde <input type="number" id="tAlta" value="40"> °C</label>
    <label>Escala máxima de flama <input type="number" id="tMax" value="100"> °C</label>
    <label>Actualizar cada <input type="number" id="seg" value="10"> s</label>
  </section>
</main>

<script>
/* ====== CONFIGURACIÓN ====== */
const SHEET_ID = "1lizcFC5r5BnIm0HR24cU8KMCuMqcK69AUxR2HvWRTa8";
const MAX_PUNTOS = 120;        // cuántas lecturas recientes se grafican
const DATO_VIEJO_SEG = 180;    // si la última lectura es más vieja, se avisa
/* =========================== */

const $ = id => document.getElementById(id);
let temporizador = null;

function parseFecha(v, f){
  if (typeof v === "string" && v.startsWith("Date(")){
    const p = v.slice(5,-1).split(",").map(Number);
    return new Date(p[0],p[1],p[2],p[3]||0,p[4]||0,p[5]||0);
  }
  return f ? new Date(f) : null;
}
const fmt = n => n.toFixed(2).replace(".", ",");

function cargar(){
  const s = document.createElement("script");
  const q = encodeURIComponent("select A,B where B is not null");
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:recibirHoja&tq=${q}&_=${Date.now()}`;
  s.onerror = () => estado("error","No se pudo leer la hoja. Revisa que esté compartida como «cualquier persona con el enlace» y que haya internet.");
  s.onload = () => s.remove();
  document.head.appendChild(s);
}

window.recibirHoja = function(resp){
  if (!resp || resp.status !== "ok"){
    estado("error","Google no devolvió datos. Revisa los permisos de la hoja.");
    return;
  }
  const filas = resp.table.rows
    .map(r => ({ t: parseFecha(r.c[0]?.v, r.c[0]?.f), v: r.c[1]?.v }))
    .filter(r => r.t && typeof r.v === "number");
  if (!filas.length){ estado("error","La hoja no tiene lecturas todavía."); return; }
  pintar(filas.slice(-MAX_PUNTOS), filas.length);
};

function estado(clase, txt){
  $("estado").className = clase;
  $("estadoTxt").textContent = txt;
}

function pintar(datos, total){
  const ult = datos[datos.length-1];
  const edad = (Date.now() - ult.t.getTime())/1000;
  if (edad > DATO_VIEJO_SEG) estado("viejo", "Sin lecturas nuevas hace " + (edad>3600 ? Math.round(edad/3600)+" h" : Math.round(edad/60)+" min"));
  else estado("vivo", "En línea · actualizado " + new Date().toLocaleTimeString("es-CO"));

  const tMed = +$("tMed").value, tAlta = +$("tAlta").value, tMax = +$("tMax").value;
  const T = ult.v;

  $("valor").textContent = fmt(T) + " °C";
  let nivel, color;
  if (T >= tAlta){ nivel="Alta"; color="#b83a2e"; }
  else if (T >= tMed){ nivel="Media"; color="#c7791a"; }
  else { nivel="Normal"; color="#2f8f5b"; }
  $("franja").setAttribute("fill", color);
  $("nivel").textContent = nivel;

  // flama: escala con la temperatura
  const k = Math.max(0.15, Math.min(1, T / tMax));
  $("flamas").style.setProperty("--s", k.toFixed(3));
  $("resplandor").setAttribute("opacity", (0.25 + 0.75*k).toFixed(2));
  // más caliente = más amarillo/blanco en la punta
  $("fC").setAttribute("stop-color", k > .6 ? "#fff3b0" : "#ffd25a");

  const vals = datos.map(d => d.v);
  $("ult").textContent = ult.t.toLocaleString("es-CO",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  $("min").textContent = fmt(Math.min(...vals)) + " °C";
  $("max").textContent = fmt(Math.max(...vals)) + " °C";
  $("n").textContent = total;

  grafica(datos);
}

function grafica(datos){
  const W=800,H=160,pl=46,pr=10,pt=12,pb=24;
  const vs = datos.map(d=>d.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi-lo < 1){ lo -= .5; hi += .5; }
  const x = i => pl + (i/(Math.max(datos.length-1,1)))*(W-pl-pr);
  const y = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  const pts = datos.map((d,i)=>`${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(" ");
  const hora = d => d.t.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
  $("grafica").innerHTML = `
    <line x1="${pl}" y1="${y(lo)}" x2="${W-pr}" y2="${y(lo)}" stroke="#c4c9c5"/>
    <line x1="${pl}" y1="${y(hi)}" x2="${W-pr}" y2="${y(hi)}" stroke="#c4c9c5"/>
    <text x="${pl-6}" y="${y(hi)+4}" text-anchor="end" font-size="11" fill="#66757c">${fmt(hi)}</text>
    <text x="${pl-6}" y="${y(lo)+4}" text-anchor="end" font-size="11" fill="#66757c">${fmt(lo)}</text>
    <polyline points="${pts}" fill="none" stroke="#c7791a" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(datos.length-1)}" cy="${y(datos[datos.length-1].v)}" r="4" fill="#c7791a"/>
    <text x="${pl}" y="${H-6}" font-size="11" fill="#66757c">${hora(datos[0])}</text>
    <text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11" fill="#66757c">${hora(datos[datos.length-1])}</text>`;
}

function programar(){
  clearInterval(temporizador);
  const s = Math.max(5, +$("seg").value || 10);
  temporizador = setInterval(cargar, s*1000);
}
["tMed","tAlta","tMax"].forEach(id => $(id).addEventListener("change", cargar));
$("seg").addEventListener("change", programar);

cargar();
programar();
</script>
</body>
</html>
