<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelador Mueller v2.1 - Ingeniería de Gas</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                mono: ['JetBrains Mono', 'monospace'],
              },
            }
          }
        }
    </script>
    
    <!-- Libraries via CDN -->
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX in browser (Standalone) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Framer Motion (Animation) -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>
    
    <!-- Lucide Icons (React wrapper) -->
    <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>
    
    <!-- PDF & Canvas Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            background-color: #0a0a0c;
            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .print-area {
            background: white !important;
            color: black !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #16161a;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        /* Selection Color */
        ::selection {
            background: rgba(99, 102, 241, 0.3);
            color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- Destructuring Logic for Standalone Browser ---
        const { useState, useEffect, useRef, useMemo, Fragment } = React;
        
        // Robust Framer Motion fallback logic
        const MotionModule = window.Motion || window.framerMotion || {};
        const tags = ['div', 'span', 'section', 'button', 'nav', 'main', 'header', 'footer', 'input', 'label', 'a', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'img'];
        
        // Detect if the module itself is the motion function or if it has a .motion property
        let motionBase = MotionModule.motion || (typeof MotionModule === 'function' ? MotionModule : null);
        
        if (!motionBase) {
            // Fallback object if motion is completely missing
            motionBase = (props) => React.createElement('div', props);
            tags.forEach(tag => {
                motionBase[tag] = (props) => {
                    const { layoutId, initial, animate, exit, transition, ...rest } = props;
                    return React.createElement(tag, rest);
                };
            });
        } else {
            // Ensure all tags exist on the motion object
            tags.forEach(tag => {
                if (!motionBase[tag]) {
                    motionBase[tag] = (props) => React.createElement(tag, props);
                }
            });
        }
        const motion = motionBase;
        const AnimatePresence = MotionModule.AnimatePresence || Fragment;

        // Robust Lucide React icon loading
        const LucideModule = window.lucideReact || window.LucideReact || window.lucide || {};
        const createIconFallback = (name) => (props) => {
            const { size = 24, ...rest } = props;
            return (
                <svg 
                    {...rest} 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round"
                    style={{ opacity: 0.5 }}
                >
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <line x1="3" y1="9" x2="21" y2="9" />
                    <text x="5" y="19" fontSize="6px" fill="currentColor" stroke="none">{name}</text>
                </svg>
            );
        };

        const Plus = LucideModule.Plus || createIconFallback('Plus');
        const Trash2 = LucideModule.Trash2 || createIconFallback('Trash2');
        const FileText = LucideModule.FileText || createIconFallback('FileText');
        const Info = LucideModule.Info || createIconFallback('Info');
        const RefreshCw = LucideModule.RefreshCw || createIconFallback('RefreshCw');
        const Play = LucideModule.Play || createIconFallback('Play');
        const ChevronLeft = LucideModule.ChevronLeft || createIconFallback('ChevronLeft');
        const Eye = LucideModule.Eye || createIconFallback('Eye');
        const EyeOff = LucideModule.EyeOff || createIconFallback('EyeOff');
        const Upload = LucideModule.Upload || createIconFallback('Upload');
        const AlertCircle = LucideModule.AlertCircle || createIconFallback('AlertCircle');
        const Clock = LucideModule.Clock || createIconFallback('Clock');
        const MapPin = LucideModule.MapPin || createIconFallback('MapPin');
        const User = LucideModule.User || createIconFallback('User');
        const Hash = LucideModule.Hash || createIconFallback('Hash');
        const Activity = LucideModule.Activity || createIconFallback('Activity');
        const CheckCircle2 = LucideModule.CheckCircle2 || createIconFallback('CheckCircle2');
        const XCircle = LucideModule.XCircle || createIconFallback('XCircle');
        const FileDown = LucideModule.FileDown || createIconFallback('FileDown');

        // Utility: Concatenate classes safely (Simplified version of clsx/tailwind-merge)
        function cn(...classes) {
            return classes.filter(Boolean).join(' ');
        }

        // --- Constants & Business Logic ---

        const DIAMETER_MAPPING = {
            'Cobre': [6.35, 10, 12, 15, 22, 28, 35, 42, 54, 76.1],
            'PEAD': [10.4, 15.6, 20.8, 26, 32.5, 39, 50, 63, 75, 90, 110, 125, 140, 160, 200, 250],
            'Acero': [8.6, 11.5, 17.5, 23.9, 31.6, 39.1, 50.1, 62.7, 77.9, 90.1, 102.3, 154.1, 205.7, 258.9],
            'Multicapa': [15.8, 20.9, 26.5, 34.3, 47.9, 60.1, 75.3, 100, 125, 150, 200, 250],
            'Otro': [6.35, 10, 15, 20, 25, 30, 40, 50, 75, 100, 150, 200, 250]
        };

        const GAS_PROPERTIES = {
            'GN': { density: 0.6, calorificValue: 10.87 },
            'GLP': { density: 1.52, calorificValue: 25.82 }
        };

        const CITY_ALTITUDES = {
            'Cali': 995, 'Bogota': 2640, 'Medellin': 1495, 'Barranquilla': 18, 'Bucaramanga': 959,
            'Cartagena': 2, 'Pasto': 2536, 'Villavicencio': 467, 'Pereira': 1411, 'Manizales': 2160,
            'Cucuta': 320, 'Popayan': 1760, 'IngresoManual': null
        };

        const MM_TO_INCHES_NOMINAL = {
            6.35: '1/4"', 8.6: '1/4"', 10.4: '3/8"', 11.5: '3/8"', 10: '3/8"', 12: '1/2"', 15: '5/8"',
            15.6: '1/2"', 17.5: '1/2"', 20.8: '3/4"', 22: '3/4"', 23.9: '3/4"', 25: '1"', 26.5: '1"',
            27.2: '1"', 31.6: '1"', 32: '1 1/4"', 32.5: '1 1/4"', 33.7: '1 1/4"', 34.3: '1 1/4"', 35: '1 1/4"',
            38: '1 1/2"', 39.1: '1 1/2"', 42: '1 1/2"', 47.9: '2"', 48.3: '1 1/2"', 50: '2"', 50.1: '2"',
            51: '2"', 54: '2"', 60.1: '2 1/2"', 60.3: '2 1/2"', 62.7: '2 1/2"', 63: '2 1/2"', 75: '3"',
            75.3: '3"', 76: '3"', 76.1: '3"', 77.9: '3"', 90: '3 1/2"', 90.1: '3 1/2"', 100: '4"',
            102.3: '4"', 110: '4"', 114.3: '4 1/2"', 125: '5"', 140: '6"', 150: '6"', 154.1: '6"',
            160: '8"', 200: '8"', 205.7: '8"', 250: '10"', 258.9: '10"', 300: '12"',
        };

        const CONVERSION_FACTORS = { 'mbar': 1.0, 'kPa': 10.0, 'psi': 68.9476, 'kgcm2': 980.665 };
        const MU_CONST_DIMENSIONAL = 2.5 * 10 ** 8;
        const MU_EXP_Q = 1.82;
        const MU_EXP_D = 4.82;
        const MIN_REQUIRED_PRESSURE = 18.0;
        const FIXED_APP_PASSWORD = "1211";

        // --- Main Component ---

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [authError, setAuthError] = useState(false);

            const [activeView, setActiveView] = useState('calculator');
            
            // Project Data
            const [projectName, setProjectName] = useState('');
            const [city, setCity] = useState('');
            const [responsible, setResponsible] = useState('');
            const [projectId, setProjectId] = useState('');
            const [logoURL, setLogoURL] = useState(null);
            const [isometricURL, setIsometricURL] = useState(null);

            // Technical Data
            const [gasType, setGasType] = useState('');
            const [initialPressureValue, setInitialPressureValue] = useState('');
            const [initialPressureUnit, setInitialPressureUnit] = useState('mbar');
            const [maxVelocity, setMaxVelocity] = useState('');
            const [frictionK, setFrictionK] = useState(0.5);
            const [siteAltitude, setSiteAltitude] = useState('');
            const [sitePressure, setSitePressure] = useState('');

            // Tramos and Consumos
            const [segments, setSegments] = useState([]);
            const [consumptions, setConsumptions] = useState([]);
            
            // Results
            const [results, setResults] = useState([]);
            const [isCalculating, setIsCalculating] = useState(false);
            const [calculationMessage, setCalculationMessage] = useState({ text: 'Presione "Calcular" para generar la simulación.', type: 'info' });

            const printRef = useRef(null);

            useEffect(() => {
                setProjectId(`PROY-${new Date().getTime()}`);
            }, []);

            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (password === FIXED_APP_PASSWORD) {
                    setIsAuthenticated(true);
                    setAuthError(false);
                } else {
                    setAuthError(true);
                    setPassword('');
                }
            };

            const updateGasProperties = (type) => {
                setGasType(type);
            };

            const updateCityProperties = (cityName) => {
                setCity(cityName);
                const altitude = CITY_ALTITUDES[cityName];
                if (cityName === 'IngresoManual') {
                    setSiteAltitude('');
                    setSitePressure('');
                } else if (altitude !== undefined && altitude !== null) {
                    setSiteAltitude(altitude);
                    const P0 = 1013.25;
                    const pressureDropFactor = 8.5;
                    const estimated = P0 - (altitude / pressureDropFactor);
                    setSitePressure(Number(Math.max(500, estimated).toFixed(2)));
                }
            };

            const addSegment = () => {
                const newId = `T${segments.length + 1}`;
                setSegments([...segments, { id: newId, length: '', material: 'Cobre', diameter: '', flow: 0 }]);
            };

            const removeSegment = (id) => {
                const updated = segments.filter(s => s.id !== id).map((s, idx) => ({ ...s, id: `T${idx + 1}` }));
                setSegments(updated);
            };

            const updateSegment = (id, field, value) => {
                setSegments(segments.map(s => s.id === id ? { ...s, [field]: value } : s));
            };

            const addConsumption = () => {
                const newId = `C${consumptions.length + 1}`;
                setConsumptions([...consumptions, { id: newId, flow: '', segments: [] }]);
            };

            const removeConsumption = (id) => {
                setConsumptions(consumptions.filter(c => c.id !== id));
            };

            const updateConsumption = (id, field, value) => {
                setConsumptions(consumptions.map(c => c.id === id ? { ...c, [field]: value } : c));
            };

            const calculateFlows = (segs, cons) => {
                const flowMap = {};
                segs.forEach(s => flowMap[s.id] = 0);
                cons.forEach(c => {
                    const flow = Number(c.flow) || 0;
                    c.segments.forEach(segId => {
                        if (flowMap[segId] !== undefined) {
                            flowMap[segId] += flow;
                        }
                    });
                });
                return segs.map(s => ({ ...s, flow: flowMap[s.id] }));
            };

            const performCalculation = () => {
                const updatedSegments = calculateFlows(segments, consumptions);
                setSegments(updatedSegments);

                const initialP_mbar = (Number(initialPressureValue) || 0) * (CONVERSION_FACTORS[initialPressureUnit] || 1);
                const density = gasType ? GAS_PROPERTIES[gasType].density : 0;
                const atmP = Number(sitePressure) || 1013.25;

                if (!gasType || initialP_mbar === 0 || !maxVelocity || updatedSegments.length === 0) {
                    setCalculationMessage({ text: 'Error: Complete los datos técnicos y añada tramos/consumos.', type: 'error' });
                    return;
                }

                setIsCalculating(true);
                let currentP = initialP_mbar;
                const calcResults = [];

                updatedSegments.forEach(seg => {
                    const Q = Number(seg.flow);
                    const L = Number(seg.length);
                    const D = Number(seg.diameter);

                    if (Q <= 0 || !L || !D) {
                        calcResults.push({ id: seg.id, diameter: D, flow: Q, velocity: 0, deltaP: 0, finalP: currentP });
                        return;
                    }

                    const pAbs = currentP + atmP;
                    const deltaP = (frictionK * MU_CONST_DIMENSIONAL * Math.pow(Q, MU_EXP_Q) * L * density) / (Math.pow(D, MU_EXP_D) * pAbs);
                    
                    const d_m = D / 1000;
                    const Q_actual = (Q / 3600) * (1013.25 / pAbs);
                    const velocity = (4 * Q_actual) / (Math.PI * Math.pow(d_m, 2));

                    const finalP = currentP - deltaP;
                    calcResults.push({ id: seg.id, diameter: D, flow: Q, velocity, deltaP, finalP });
                    currentP = finalP;
                });

                setResults(calcResults);
                setCalculationMessage({ text: 'Simulación completada con éxito.', type: 'success' });
                setIsCalculating(false);
            };

            const handleFileUpload = (e, setter) => {
                const file = e.target.files?.[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => setter(event.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const [isPrinting, setIsPrinting] = useState(false);

            const exportPDF = async () => {
                if (!printRef.current) return;
                
                setIsPrinting(true);
                await new Promise(resolve => setTimeout(resolve, 500));
                
                const element = printRef.current;
                
                try {
                    const canvas = await html2canvas(element, {
                        scale: 2,
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff'
                    });
                    
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                    
                    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                    pdf.save(`${projectName || 'Reporte'}_Mueller.pdf`);
                } catch (error) {
                    console.error("PDF Export failed:", error);
                    alert("Error al exportar PDF. Verifique los permisos del navegador.");
                } finally {
                    setIsPrinting(false);
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-[#0a0a0c] selection:bg-indigo-500/30 flex items-center justify-center p-4">
                        <div className="fixed inset-0 overflow-hidden pointer-events-none">
                            <div className="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-500/10 rounded-full blur-[120px]" />
                            <div className="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-blue-500/10 rounded-full blur-[120px]" />
                        </div>

                        <motion.div 
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            className="relative z-10 bg-[#16161a] rounded-3xl shadow-2xl p-8 max-w-sm w-full border border-white/5 ring-1 ring-white/10"
                        >
                            <div className="flex flex-col items-center mb-8">
                                <div className="w-20 h-20 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-xl shadow-indigo-500/20 rotate-3">
                                    <Activity className="w-10 h-10 text-white" />
                                </div>
                                <h1 className="text-3xl font-bold text-white tracking-tight">Acceso Técnico</h1>
                                <p className="text-sm text-zinc-400 text-center mt-3 leading-relaxed">
                                    Ingrese sus credenciales para acceder al panel de modelado de ingeniería.
                                </p>
                            </div>

                            <form onSubmit={handlePasswordSubmit} className="space-y-5">
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-indigo-400 transition-colors">
                                        <Hash className="w-4 h-4" />
                                    </div>
                                    <input
                                        type={showPassword ? "text" : "password"}
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="Contraseña del Sistema"
                                        className={cn(
                                            "w-full pl-11 pr-12 py-4 bg-[#1e1e24] rounded-2xl border transition-all outline-none text-white placeholder:text-zinc-600",
                                            authError 
                                                ? "border-red-500/50 focus:border-red-500 ring-4 ring-red-500/10" 
                                                : "border-white/5 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
                                        )}
                                        autoFocus
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowPassword(!showPassword)}
                                        className="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300 transition-colors"
                                    >
                                        {showPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
                                    </button>
                                </div>
                                
                                {authError && (
                                    <motion.div 
                                        initial={{ opacity: 0, height: 0 }}
                                        animate={{ opacity: 1, height: 'auto' }}
                                        className="flex items-center gap-2 text-red-400 text-xs font-medium"
                                    >
                                        <AlertCircle className="w-3 h-3" />
                                        <span>Contraseña incorrecta. Verifique sus credenciales.</span>
                                    </motion.div>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-4 rounded-2xl hover:from-indigo-500 hover:to-blue-500 transition-all shadow-lg shadow-indigo-600/20 active:scale-[0.98]"
                                >
                                    Autenticar Sistema
                                </button>
                            </form>
                        </motion.div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#0a0a0c] text-zinc-100 pb-20 font-sans selection:bg-indigo-500/30">
                    <div className="fixed inset-0 overflow-hidden pointer-events-none">
                        <div className="absolute top-0 right-0 w-1/2 h-1/2 bg-indigo-500/5 rounded-full blur-[120px]" />
                        <div className="absolute bottom-0 left-0 w-1/2 h-1/2 bg-blue-500/5 rounded-full blur-[120px]" />
                    </div>

                    <header className="sticky top-0 z-40 bg-[#16161a]/80 backdrop-blur-xl border-b border-white/5 px-6 py-4">
                        <div className="max-w-[1440px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 ring-1 ring-white/10">
                                    <Activity className="w-7 h-7" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-white">Modelador Mueller <span className="text-indigo-400 font-mono text-sm ml-2">v2.1</span></h1>
                                    <div className="flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                                        <p className="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">Arquitectura de Redes de Gas</p>
                                    </div>
                                </div>
                            </div>
                            
                            <nav className="flex items-center gap-2 bg-black/20 p-1.5 rounded-2xl border border-white/5">
                                <NavBtn active={activeView === 'calculator'} onClick={() => setActiveView('calculator')} icon={<RefreshCw className="w-4 h-4"/>} label="Simulador"/>
                                <NavBtn active={activeView === 'math'} onClick={() => setActiveView('math')} icon={<FileText className="w-4 h-4"/>} label="Cálculos"/>
                                <NavBtn active={activeView === 'instructions'} onClick={() => setActiveView('instructions')} icon={<Info className="w-4 h-4"/>} label="Guía"/>
                                <NavBtn active={activeView === 'course'} onClick={() => setActiveView('course')} icon={<Play className="w-4 h-4"/>} label="Academia"/>
                            </nav>

                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={exportPDF}
                                    className="px-6 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-xl text-sm font-bold transition-all flex items-center gap-2 border border-white/5 shadow-sm active:scale-95"
                                >
                                    <FileDown className="w-4 h-4 text-rose-500" />
                                    <span>Generar PDF</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-[1440px] mx-auto p-6 lg:p-10 relative z-10">
                        <div ref={printRef} className="space-y-12">
                            
                            <div className="hidden print:block mb-12 border-b border-zinc-200 pb-8">
                                <div className="flex justify-between items-start">
                                    <div className="flex items-center gap-6">
                                        <div className="w-16 h-16 bg-zinc-900 rounded-2xl flex items-center justify-center text-white">
                                            <Activity className="w-10 h-10" />
                                        </div>
                                        <div>
                                            <h1 className="text-4xl font-black text-zinc-900 tracking-tighter uppercase">Memoria Técnica</h1>
                                            <p className="text-zinc-500 font-mono tracking-widest text-xs uppercase mt-1 italic">Ingeniería Avanzada de Fluidos</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        {logoURL && <img src={logoURL} alt="Logo" className="h-16 w-auto mb-4 ml-auto" />}
                                        <div className="space-y-1">
                                            <p className="text-sm font-bold text-zinc-900">{new Date().toLocaleDateString()}</p>
                                            <p className="text-[10px] text-zinc-400 font-mono italic">REF: {projectId}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <AnimatePresence mode="wait">
                                {activeView === 'calculator' && (
                                    <motion.div 
                                        key="calculator"
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        exit={{ opacity: 0, y: -20 }}
                                        className="space-y-10"
                                    >
                                        {/* Section 1: Basic Data */}
                                        <Card title="Datos Maestros del Proyecto" icon={<Clock className="w-5 h-5 text-indigo-400"/>}>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 p-2">
                                                <InputField label="Denominación del Proyecto" value={projectName} onChange={setProjectName} icon={<Activity className="text-indigo-400"/>} isPrinting={isPrinting} />
                                                <div>
                                                    <Label icon={<MapPin className="text-indigo-400"/>}>Ubicación Geográfica</Label>
                                                    {isPrinting ? (
                                                        <div className="px-5 py-3 bg-[#0a0a0c] rounded-2xl font-bold border border-white/5 text-white">{city || '---'}</div>
                                                    ) : (
                                                        <div className="relative group">
                                                            <select 
                                                                value={city} 
                                                                onChange={(e) => updateCityProperties(e.target.value)}
                                                                className="w-full px-5 py-3 rounded-2xl bg-[#1e1e24] border border-white/5 focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/10 appearance-none text-white transition-all hover:bg-[#25252d]"
                                                            >
                                                                <option value="">Seleccione Ubicación</option>
                                                                {Object.keys(CITY_ALTITUDES).sort().map(c => <option key={c} value={c}>{c}</option>)}
                                                            </select>
                                                        </div>
                                                    )}
                                                </div>
                                                <InputField label="Folio Interno (ID)" value={projectId} onChange={setProjectId} icon={<Hash className="text-indigo-400"/>} className="bg-[#1e1e24]/50" readOnly isPrinting={isPrinting} />
                                                <InputField label="Proyectista Responsable" value={responsible} onChange={setResponsible} icon={<User className="text-indigo-400"/>} isPrinting={isPrinting} />
                                                
                                                <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-8">
                                                    <div className="space-y-3">
                                                        <Label icon={<Upload className="text-indigo-400"/>}>Identidad Corporativa (Logo)</Label>
                                                        <div className="flex items-center gap-5">
                                                            {!isPrinting && (
                                                                <label className="flex-1 cursor-pointer group">
                                                                   <div className="flex items-center justify-center gap-3 py-4 bg-[#1e1e24] border-2 border-dashed border-white/5 rounded-2xl group-hover:border-indigo-500/50 group-hover:bg-indigo-500/5 transition-all">
                                                                        <Upload className="w-5 h-5 text-zinc-500 group-hover:text-indigo-400" />
                                                                        <span className="text-sm font-semibold text-zinc-400 group-hover:text-zinc-100">Cargar Imagen</span>
                                                                   </div>
                                                                   <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(e, setLogoURL)} />
                                                                </label>
                                                            )}
                                                            {logoURL && (
                                                                <div className="relative group p-1 bg-white rounded-2xl">
                                                                    <img src={logoURL} className="w-14 h-14 rounded-xl object-contain" />
                                                                    {!isPrinting && (
                                                                        <button onClick={() => setLogoURL(null)} className="absolute -top-3 -right-3 p-1.5 bg-rose-500 text-white rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-all hover:scale-110">
                                                                            <Plus className="w-3 h-3 rotate-45" />
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>

                                                    <div className="space-y-3">
                                                        <Label icon={<Play className="text-indigo-400 rotate-90"/>}>Documentación Isométrica</Label>
                                                        <div className="flex items-center gap-5">
                                                            {!isPrinting && (
                                                                <label className="flex-1 cursor-pointer group">
                                                                   <div className="flex items-center justify-center gap-3 py-4 bg-[#1e1e24] border-2 border-dashed border-white/5 rounded-2xl group-hover:border-indigo-500/50 group-hover:bg-indigo-500/5 transition-all">
                                                                        <Upload className="w-5 h-5 text-zinc-500 group-hover:text-indigo-400" />
                                                                        <span className="text-sm font-semibold text-zinc-400 group-hover:text-zinc-100">Cargar Archivo</span>
                                                                   </div>
                                                                   <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(e, setIsometricURL)} />
                                                                </label>
                                                            )}
                                                            {isometricURL && (
                                                                <div className="relative group p-1 bg-white rounded-2xl">
                                                                    <img src={isometricURL} className="w-14 h-14 rounded-xl object-contain " />
                                                                    {!isPrinting && (
                                                                        <button onClick={() => setIsometricURL(null)} className="absolute -top-3 -right-3 p-1.5 bg-rose-500 text-white rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-all hover:scale-110">
                                                                            <Plus className="w-3 h-3 rotate-45" />
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            {isometricURL && (
                                                <div className="mt-10 pt-10 border-t border-white/5 flex justify-center">
                                                     <div className="relative group max-w-4xl w-full">
                                                         <div className="absolute inset-0 bg-indigo-500/20 blur-[60px] opacity-20 group-hover:opacity-40 transition-opacity" />
                                                         <img src={isometricURL} alt="Esquema Isométrico" className="relative w-full h-auto rounded-3xl shadow-2xl border border-white/10 ring-1 ring-white/20" />
                                                     </div>
                                                </div>
                                            )}
                                        </Card>

                                        {/* Section 2: Technical Info */}
                                        <Card title="Parámetros de Simulación Hidráulica" icon={<Activity className="w-5 h-5 text-indigo-400"/>}>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 p-2">
                                                <div>
                                                    <Label>Matriz Energética (Gas)</Label>
                                                    {isPrinting ? (
                                                        <div className="px-5 py-3 bg-[#0a0a0c] rounded-2xl font-bold border border-white/5 text-white">{gasType || '---'}</div>
                                                    ) : (
                                                        <select 
                                                            value={gasType} 
                                                            onChange={(e) => updateGasProperties(e.target.value)}
                                                            className="w-full px-5 py-3 rounded-2xl bg-[#1e1e24] border border-white/5 focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/10 appearance-none text-white transition-all hover:bg-[#25252d]"
                                                        >
                                                            <option value="">Seleccione Fluido</option>
                                                            <option value="GN">Natural (Metano)</option>
                                                            <option value="GLP">Licuado (Propano/Butano)</option>
                                                        </select>
                                                    )}
                                                </div>

                                                <div className="flex flex-col gap-2">
                                                    <Label>Presión de Suministro</Label>
                                                    {isPrinting ? (
                                                        <div className="px-5 py-3 bg-[#0a0a0c] rounded-2xl font-bold border border-white/5 text-white">{initialPressureValue} {initialPressureUnit}</div>
                                                    ) : (
                                                        <div className="flex">
                                                            <input 
                                                                type="number" 
                                                                value={initialPressureValue} 
                                                                onChange={(e) => setInitialPressureValue(e.target.value === '' ? '' : Number(e.target.value))}
                                                                placeholder="Magnitud"
                                                                className="w-full px-5 py-3 rounded-l-2xl bg-[#1e1e24] border border-white/5 border-r-0 focus:border-indigo-500/50 outline-none text-white transition-all"
                                                            />
                                                            <select 
                                                                value={initialPressureUnit} 
                                                                onChange={(e) => setInitialPressureUnit(e.target.value)}
                                                                className="px-4 py-3 rounded-r-2xl bg-[#282833] border border-white/5 text-xs font-black text-indigo-400 uppercase tracking-wider"
                                                            >
                                                                <option value="mbar">mbar</option>
                                                                <option value="kPa">kPa</option>
                                                                <option value="psi">psi</option>
                                                            </select>
                                                        </div>
                                                    )}
                                                </div>

                                                <InputField label="Vmáx Permisible (m/s)" type="number" value={maxVelocity} onChange={(val) => setMaxVelocity(val === '' ? '' : Number(val))} isPrinting={isPrinting} />
                                                <InputField label="Coef. Rugosidad (K)" type="number" value={frictionK} onChange={(val) => setFrictionK(Number(val))} step={0.01} isPrinting={isPrinting} />

                                                <InputField label="Densidad Crítica" value={gasType ? GAS_PROPERTIES[gasType].density : ''} readOnly className="border-none shadow-none text-indigo-300 font-mono" isPrinting={isPrinting} />
                                                <InputField label="MSNM (Altitud)" value={siteAltitude} onChange={(val) => setSiteAltitude(val === '' ? '' : Number(val))} readOnly={city !== 'IngresoManual'} className={city !== 'IngresoManual' ? 'border-none shadow-none text-indigo-300 font-mono' : ''} isPrinting={isPrinting} />
                                                <InputField label="Patm (P. Atmosférica)" value={sitePressure} onChange={(val) => setSitePressure(val === '' ? '' : Number(val))} isPrinting={isPrinting} />
                                            </div>
                                        </Card>

                                        <Card title="Inventario de Tramos e Segmentos" icon={<Plus className="w-5 h-5 text-indigo-400"/>}>
                                            <div className="overflow-x-auto">
                                                <table className="w-full border-separate border-spacing-y-3">
                                                    <thead>
                                                        <tr className="text-left text-[10px] uppercase tracking-[0.25em] text-zinc-500 font-black">
                                                            <th className="px-6 pb-4">ID</th>
                                                            <th className="px-6 pb-4">L (m)</th>
                                                            <th className="px-6 pb-4">Materialidad</th>
                                                            <th className="px-6 pb-4">Ø Interno (mm)</th>
                                                            <th className="px-6 pb-4 text-indigo-400/70">Caudal Q</th>
                                                            <th className="px-6 pb-4 text-center">Gestión</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="space-y-4">
                                                        {segments.map((seg) => (
                                                            <tr key={seg.id} className="group bg-[#16161a] hover:bg-[#1e1e24] transition-all border border-white/5">
                                                                <td className="px-6 py-4 rounded-l-2xl font-black text-indigo-400 text-lg">{seg.id}</td>
                                                                <td className="px-6 py-4">
                                                                    {isPrinting ? (
                                                                        <span className="font-bold text-white text-lg">{seg.length || '0'}</span>
                                                                    ) : (
                                                                        <input 
                                                                            type="number" 
                                                                            value={seg.length}
                                                                            onChange={(e) => updateSegment(seg.id, 'length', e.target.value === '' ? '' : Number(e.target.value))}
                                                                            placeholder="0.00"
                                                                            className="w-24 bg-transparent border-b-2 border-white/5 focus:border-indigo-500 outline-none px-2 py-1 text-white font-mono text-lg"
                                                                        />
                                                                    )}
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    {isPrinting ? (
                                                                        <span className="text-sm font-semibold text-zinc-300">{seg.material}</span>
                                                                    ) : (
                                                                        <select 
                                                                            value={seg.material}
                                                                            onChange={(e) => updateSegment(seg.id, 'material', e.target.value)}
                                                                            className="bg-zinc-800/50 rounded-xl px-3 py-1.5 text-sm text-zinc-100 outline-none border border-white/5 hover:border-indigo-500/30 transition-all font-medium"
                                                                        >
                                                                            {Object.keys(DIAMETER_MAPPING).map(m => <option key={m} value={m}>{m}</option>)}
                                                                        </select>
                                                                    )}
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    {isPrinting ? (
                                                                        <span className="text-sm font-black text-white">{MM_TO_INCHES_NOMINAL[Number(seg.diameter)] || `${seg.diameter} mm`}</span>
                                                                    ) : (
                                                                        <select 
                                                                            value={seg.diameter}
                                                                            onChange={(e) => updateSegment(seg.id, 'diameter', Number(e.target.value))}
                                                                            className="bg-indigo-500/10 text-indigo-300 rounded-xl px-3 py-1.5 text-sm outline-none border border-indigo-500/20 hover:border-indigo-500/50 transition-all font-bold"
                                                                        >
                                                                            <option value="">- Seleccione -</option>
                                                                            {DIAMETER_MAPPING[seg.material].map(d => (
                                                                                <option key={d} value={d}>{MM_TO_INCHES_NOMINAL[d] || `${d} mm`}</option>
                                                                            ))}
                                                                        </select>
                                                                    )}
                                                                </td>
                                                                <td className="px-6 py-4 font-mono font-bold text-indigo-400">
                                                                    {Number(seg.flow).toFixed(3)}
                                                                </td>
                                                                <td className="px-6 py-4 rounded-r-2xl text-center">
                                                                    {!isPrinting && (
                                                                        <button onClick={() => removeSegment(seg.id)} className="p-3 bg-rose-500/10 text-rose-400 rounded-xl hover:bg-rose-500 hover:text-white transition-all shadow-sm">
                                                                            <Trash2 className="w-4 h-4" />
                                                                        </button>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                                <button onClick={addSegment} className="mt-8 group flex items-center gap-3 text-indigo-400 font-black text-sm uppercase tracking-widest hover:text-indigo-300 transition-all">
                                                    <div className="w-10 h-10 bg-indigo-500/10 rounded-xl flex items-center justify-center border border-indigo-500/20 group-hover:bg-indigo-500 group-hover:text-white transition-all shadow-lg shadow-indigo-500/5">
                                                        <Plus className="w-5 h-5" />
                                                    </div>
                                                    <span>Añadir Nuevo Sección / Tramo</span>
                                                </button>
                                            </div>
                                        </Card>

                                        <Card title="Configuración de Red / Consumos" icon={<Activity className="w-5 h-5 text-indigo-400"/>}>
                                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 p-2">
                                                <div className="space-y-6">
                                                    <p className="text-zinc-500 text-sm italic font-medium leading-relaxed">
                                                        Defina los nodos de consumo (artefactos) y asigne mediante el vinculador los tramos que componen su trayectoria de alimentación.
                                                    </p>
                                                    <div className="space-y-4">
                                                        {consumptions.map((con) => (
                                                            <div key={con.id} className="flex items-start gap-6 p-6 bg-[#16161a] rounded-3xl border border-white/5 group relative overflow-hidden transition-all hover:bg-[#1e1e24] hover:shadow-2xl hover:shadow-indigo-500/5">
                                                                <div className="absolute top-0 right-0 p-1.5 bg-indigo-500/10 text-indigo-400 rounded-bl-xl font-mono text-[10px] font-black uppercase tracking-widest">{con.id}</div>
                                                                
                                                                <div className="flex-1 space-y-5">
                                                                    <div className="flex flex-wrap items-center gap-5">
                                                                        <div className="flex items-center bg-[#0a0a0c] rounded-2xl border border-white/5 px-4 py-2.5 focus-within:ring-2 focus-within:ring-indigo-500/30 transition-all">
                                                                            <input 
                                                                                type="number" 
                                                                                value={con.flow} 
                                                                                onChange={(e) => updateConsumption(con.id, 'flow', e.target.value === '' ? '' : Number(e.target.value))}
                                                                                placeholder="Caudal"
                                                                                className="w-24 text-lg font-black outline-none bg-transparent text-white placeholder:text-zinc-700"
                                                                            />
                                                                            <span className="text-[10px] uppercase text-indigo-400 font-black ml-3 opacity-70">m³/h</span>
                                                                        </div>
                                                                        <div className="flex flex-wrap gap-2">
                                                                            {segments.map(seg => (
                                                                                <button 
                                                                                    key={seg.id}
                                                                                    onClick={() => {
                                                                                        const active = con.segments.includes(seg.id);
                                                                                        updateConsumption(con.id, 'segments', active ? con.segments.filter(id => id !== seg.id) : [...con.segments, seg.id]);
                                                                                    }}
                                                                                    className={cn(
                                                                                        "px-3 py-1.5 rounded-xl text-xs font-black transition-all border",
                                                                                        con.segments.includes(seg.id) 
                                                                                            ? "bg-indigo-600 border-indigo-600 text-white shadow-xl shadow-indigo-600/30" 
                                                                                            : "bg-black/20 border-white/5 text-zinc-500 hover:border-white/20 hover:text-zinc-300"
                                                                                    )}
                                                                                >
                                                                                    {seg.id}
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-3 text-[10px] font-bold uppercase tracking-wider">
                                                                        <span className="text-zinc-600">Ruta de Carga:</span>
                                                                        <div className="flex items-center gap-1.5">
                                                                            {con.segments.length > 0 ? con.segments.map((s, idx) => (
                                                                                <Fragment key={s}>
                                                                                    <span className="text-indigo-400">{s}</span>
                                                                                    {idx < con.segments.length - 1 && <ChevronLeft className="w-2.5 h-2.5 text-zinc-700 -rotate-180" />}
                                                                                </Fragment>
                                                                            )) : <span className="text-rose-500/50 italic">Sin tramos asignados</span>}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                {!isPrinting && (
                                                                    <button onClick={() => removeConsumption(con.id)} className="p-2.5 bg-rose-500/10 text-rose-400 rounded-xl opacity-0 group-hover:opacity-100 transition-all hover:bg-rose-500 hover:text-white">
                                                                        <Plus className="w-4 h-4 rotate-45" />
                                                                    </button>
                                                                )}
                                                            </div>
                                                        ))}
                                                        <button onClick={addConsumption} className="w-full py-6 border-2 border-dashed border-white/10 rounded-3xl text-zinc-500 font-bold flex items-center justify-center gap-3 hover:border-indigo-500/50 hover:text-indigo-400 hover:bg-indigo-500/5 transition-all group">
                                                            <Plus className="w-6 h-6 group-hover:rotate-90 transition-transform" />
                                                            <span className="uppercase tracking-[0.2em] text-sm">Vincular Nodo de Carga</span>
                                                        </button>
                                                    </div>
                                                </div>
                                                
                                                <div className="bg-gradient-to-br from-[#1e1e24] to-[#16161a] rounded-[40px] p-10 flex flex-col justify-between relative overflow-hidden border border-white/5 shadow-2xl">
                                                        <div className="relative z-10">
                                                            <div className="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-white mb-8 shadow-2xl shadow-indigo-500/20">
                                                                <Activity className="w-7 h-7" />
                                                            </div>
                                                            <h3 className="text-3xl font-bold mb-4 text-white tracking-tight">Ejecutar Simulación <br />Hidráulica</h3>
                                                            <p className="text-zinc-400 text-sm leading-relaxed mb-10 max-w-sm">
                                                                El procesador iterativo aplicará el modelo de Mueller dinámico, calculando las pérdidas de presión acumuladas y velocidades puntuales de flujo.
                                                            </p>
                                                            <AnimatePresence>
                                                                {calculationMessage.text && (
                                                                    <motion.div 
                                                                        initial={{ opacity: 0, x: -20 }}
                                                                        animate={{ opacity: 1, x: 0 }}
                                                                        className={cn(
                                                                            "p-5 rounded-3xl mb-10 flex items-start gap-4 border",
                                                                            calculationMessage.type === 'error' ? "bg-red-500/10 text-red-300 border-red-500/20" : 
                                                                            calculationMessage.type === 'success' ? "bg-emerald-500/10 text-emerald-300 border-emerald-500/20" : 
                                                                            "bg-indigo-500/10 text-indigo-300 border-indigo-500/20"
                                                                        )}
                                                                    >
                                                                        <AlertCircle className="w-6 h-6 shrink-0 mt-0.5" />
                                                                        <p className="text-xs font-semibold leading-relaxed tracking-wide">{calculationMessage.text}</p>
                                                                    </motion.div>
                                                                )}
                                                            </AnimatePresence>
                                                        </div>
                                                        <button 
                                                            onClick={performCalculation}
                                                            disabled={isCalculating}
                                                            className="relative z-10 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-5 rounded-[28px] shadow-2xl shadow-indigo-600/30 transition-all active:scale-[0.98] disabled:opacity-50 flex items-center justify-center gap-4 tracking-[0.25em] uppercase text-xs"
                                                        >
                                                            {isCalculating ? <RefreshCw className="w-6 h-6 animate-spin"/> : <Play className="w-6 h-6"/>}
                                                            <span>Lanzar Iteración</span>
                                                        </button>
                                                        
                                                        {/* Background Decoration */}
                                                        <div className="absolute -bottom-20 -right-20 w-80 h-80 bg-indigo-500/10 rounded-full blur-[100px]" />
                                                        <div className="absolute -top-20 -left-20 w-80 h-80 bg-blue-500/10 rounded-full blur-[100px]" />
                                                </div>
                                            </div>
                                        </Card>

                                        {/* Section 5: Results */}
                                        {results.length > 0 && (
                                            <motion.div initial={{ opacity: 0, scale: 0.98 }} animate={{ opacity: 1, scale: 1 }}>
                                                <Card title="Matriz de Resultados e Ingeniería" icon={<CheckCircle2 className="w-5 h-5 text-emerald-400"/>}>
                                                    <div className="overflow-x-auto p-2">
                                                        <table className="w-full border-separate border-spacing-0">
                                                            <thead>
                                                                <tr className="text-left text-[10px] uppercase tracking-[0.25em] text-zinc-500 font-black border-b border-white/5">
                                                                    <th className="px-6 py-5">Tramo</th>
                                                                    <th className="px-6 py-5">Ø (mm)</th>
                                                                    <th className="px-6 py-5">Caudal (m³/h)</th>
                                                                    <th className="px-6 py-5">Vel (m/s)</th>
                                                                    <th className="px-6 py-5">ΔP Puntual</th>
                                                                    <th className="px-6 py-5">P Final</th>
                                                                    <th className="px-6 py-5 text-center">Protocolo</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-white/5">
                                                                {results.map(res => {
                                                                    const vCritical = res.velocity > Number(maxVelocity);
                                                                    const pCritical = res.finalP < MIN_REQUIRED_PRESSURE;
                                                                    return (
                                                                        <tr key={res.id} className="group hover:bg-white/[0.02] transition-colors">
                                                                            <td className="px-6 py-5 font-black text-indigo-400 text-lg uppercase">{res.id}</td>
                                                                            <td className="px-6 py-5 font-mono text-zinc-400 text-sm font-bold">{res.diameter.toFixed(1)}</td>
                                                                            <td className="px-6 py-5 font-mono text-zinc-500 text-sm">{res.flow.toFixed(3)}</td>
                                                                            <td className="px-6 py-5">
                                                                                <div className={cn(
                                                                                    "px-3 py-1 rounded-lg w-fit text-sm font-mono font-black border",
                                                                                    vCritical ? "bg-red-500/10 text-red-400 border-red-500/20" : "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"
                                                                                )}>
                                                                                    {res.velocity.toFixed(2)}
                                                                                </div>
                                                                            </td>
                                                                            <td className="px-6 py-5 font-mono text-red-400 text-sm font-black">-{res.deltaP.toFixed(3)}</td>
                                                                            <td className="px-6 py-5">
                                                                                 <div className={cn(
                                                                                    "text-lg font-mono font-black",
                                                                                    pCritical ? "text-red-500 underline decoration-red-500/50 underline-offset-4" : "text-white"
                                                                                )}>
                                                                                    {res.finalP.toFixed(3)}
                                                                                    <span className="ml-1.5 text-[8px] opacity-40">mbar</span>
                                                                                </div>
                                                                            </td>
                                                                            <td className="px-6 py-5 text-center">
                                                                                {vCritical || pCritical ? (
                                                                                    <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-red-500 text-white text-[10px] font-black uppercase rounded-full shadow-lg shadow-red-500/20 animate-pulse">
                                                                                        <XCircle className="w-3 h-3" />
                                                                                        <span>Revisión Crítica</span>
                                                                                    </div>
                                                                                ) : (
                                                                                    <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-[#1e1e24] border border-white/5 text-emerald-400 text-[10px] font-black uppercase rounded-full group-hover:bg-emerald-500 group-hover:text-white transition-all">
                                                                                        <CheckCircle2 className="w-3 h-3" />
                                                                                        <span>Consistente</span>
                                                                                    </div>
                                                                                )}
                                                                            </td>
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>

                                                    {/* Conclusion */}
                                                    <div className="mt-12 p-10 bg-gradient-to-br from-[#1e1e24] to-[#0a0a0c] rounded-[40px] border border-white/5 shadow-2xl relative overflow-hidden">
                                                        <div className="absolute top-0 right-0 w-40 h-40 bg-indigo-500/5 blur-[60px] rounded-full" />
                                                        <h4 className="text-xl font-bold text-white mb-6 flex items-center gap-3">
                                                            <div className="w-8 h-8 bg-indigo-500/20 rounded-xl flex items-center justify-center text-indigo-400 border border-indigo-400/20">
                                                                <FileText className="w-4 h-4" />
                                                            </div>
                                                            <span>Veredicto de Ingeniería</span>
                                                        </h4>
                                                        <div className="relative z-10 space-y-6">
                                                            <div className="flex items-center gap-4 text-zinc-400">
                                                                 <div className="w-1.5 h-1.5 rounded-full bg-indigo-500 shadow-lg shadow-indigo-500/50" />
                                                                 <p className="text-base leading-relaxed">
                                                                    Evaluación del Proyecto <strong>{projectName || '(Indefinido)'}</strong>: Presión residual mínima de 
                                                                    <span className={cn(
                                                                        "mx-2 px-3 py-1 rounded-xl font-black text-xl border",
                                                                        results[results.length-1].finalP < MIN_REQUIRED_PRESSURE 
                                                                            ? "bg-red-500/10 text-red-400 border-red-500/20" 
                                                                            : "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"
                                                                    )}>
                                                                        {results[results.length-1].finalP.toFixed(2)} <span className="text-xs uppercase tracking-widest opacity-60">mbar</span>
                                                                    </span>.
                                                                 </p>
                                                            </div>
                                                            
                                                            {results.some(r => r.velocity > Number(maxVelocity)) && (
                                                                <div className="flex items-start gap-4 p-5 bg-red-500/10 rounded-2xl border border-red-500/20 animate-in fade-in slide-in-from-top-2">
                                                                    <AlertCircle className="w-6 h-6 text-red-400 shrink-0 mt-0.5" />
                                                                    <div className="space-y-1">
                                                                        <p className="text-red-300 text-sm font-bold">Inconsistencia de Velocidad Detectada</p>
                                                                        <p className="text-red-400/70 text-xs leading-relaxed">Se han registrado flujos laminares superiores al umbral normativo ({maxVelocity} m/s). Es imperativo recalibrar los diámetros en los tramos afectados para mitigar el riesgo de ruido y erosión.</p>
                                                                    </div>
                                                                </div>
                                                            )}

                                                            <div className="pt-6 border-t border-white/5">
                                                                <div className={cn(
                                                                    "inline-flex items-center gap-3 px-8 py-3 rounded-2xl text-xs font-black uppercase tracking-[0.3em] transition-all",
                                                                    results.every(r => r.velocity <= Number(maxVelocity) && r.finalP >= MIN_REQUIRED_PRESSURE) 
                                                                        ? "bg-emerald-500 text-white shadow-xl shadow-emerald-500/20" 
                                                                        : "bg-zinc-800 text-zinc-500 border border-white/5"
                                                                )}>
                                                                    {results.every(r => r.velocity <= Number(maxVelocity) && r.finalP >= MIN_REQUIRED_PRESSURE) 
                                                                        ? <CheckCircle2 className="w-5 h-5 shrink-0" /> 
                                                                        : <XCircle className="w-5 h-5 shrink-0" />}
                                                                    <span>
                                                                        {results.every(r => r.velocity <= Number(maxVelocity) && r.finalP >= MIN_REQUIRED_PRESSURE) 
                                                                            ? "Certificación Exitosa" 
                                                                            : "Ajuste Requerido"}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </Card>
                                            </motion.div>
                                        )}
                                    </motion.div>
                                )}

                                {activeView === 'math' && (
                                    <motion.div 
                                        key="math" 
                                        initial={{ opacity: 0, scale: 0.98 }} 
                                        animate={{ opacity: 1, scale: 1 }} 
                                        className="max-w-4xl mx-auto space-y-8"
                                    >
                                        <div className="text-center mb-12">
                                             <h2 className="text-4xl font-black text-white tracking-tighter uppercase mb-4">Arquitectura Matemática</h2>
                                             <div className="w-24 h-1.5 bg-indigo-600 mx-auto rounded-full" />
                                        </div>

                                        <Card title="Ecuación de Mueller & Pole" icon={<FileText className="w-5 h-5 text-indigo-400"/>}>
