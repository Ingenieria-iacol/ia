                                            <div className="prose prose-invert max-w-none space-y-10 p-2">
                                                <p className="text-zinc-400 text-lg leading-relaxed">
                                                    El motor computacional utiliza el modelo de <strong>Mueller (Pole Parametrizada)</strong>, estándar de oro para el diseño de instalaciones receptoras. Este enfoque garantiza una precisión superior al considerar el rozamiento dinámico y la compresibilidad del fluido.
                                                </p>
                                                
                                                <div className="relative group">
                                                    <div className="absolute inset-0 bg-indigo-500/20 blur-[60px] opacity-20" />
                                                    <div className="relative bg-black/40 backdrop-blur-3xl border border-white/10 p-12 rounded-[40px] font-mono text-2xl lg:text-3xl text-center shadow-2xl">
                                                        <div className="text-indigo-400 mb-6 flex justify-center gap-2">
                                                            <span className="opacity-40">ΔP</span> 
                                                            <span>=</span> 
                                                            <div className="flex flex-col items-center">
                                                                <span className="border-b border-white px-8 pb-3 mb-2">K · C_f · Q^1.82 · L · S</span>
                                                                <span className="px-8 pt-1">D^4.82 · P_abs</span>
                                                            </div>
                                                        </div>
                                                        <div className="text-[10px] uppercase tracking-[0.5em] text-zinc-600 font-black mt-4">Ecuación Fundamental de Caída de Presión</div>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-6">
                                                    <MathItem label="ΔP" desc="Pérdida de presión gravitacional y dinámica (mbar)" />
                                                    <MathItem label="K" desc="Coeficiente de fricción empírico (S/U)" />
                                                    <MathItem label="C_f" desc="Constante dimensional (2.5 × 10⁸)" />
                                                    <MathItem label="Q" desc="Caudal nominal del fluido (m³/h)" />
                                                    <MathItem label="L" desc="Extensión lineal del segmento (m)" />
                                                    <MathItem label="S" desc="Densidad relativa vs Aire estándar" />
                                                    <MathItem label="D" desc="Calibre hidráulico interno (mm)" />
                                                    <MathItem label="P_abs" desc="Presión absoluta operacional (man + atm)" />
                                                </div>
                                            </div>
                                        </Card>
                                    </motion.div>
                                )}

                                {activeView === 'instructions' && (
                                    <motion.div 
                                        key="instructions" 
                                        initial={{ opacity: 0, x: -20 }} 
                                        animate={{ opacity: 1, x: 0 }} 
                                        className="max-w-4xl mx-auto space-y-8 pb-12"
                                    >
                                        <div className="text-center mb-12">
                                             <h2 className="text-4xl font-black text-white tracking-tighter uppercase mb-4">Protocolo de Operación</h2>
                                             <p className="text-zinc-500 tracking-widest text-xs uppercase italic">Directrices de Modelado</p>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                            <InstructionCard 
                                                num="01" 
                                                title="Configuración Inicial" 
                                                desc="Establezca el tipo de gas y la ciudad. La presión atmosférica se recalibra automáticamente según la altitud MSNM para mayor precisión."
                                                icon={<Activity className="w-5 h-5" />}
                                            />
                                            <InstructionCard 
                                                num="02" 
                                                title="Definición de Red" 
                                                desc="Cree los tramos (tuberías) indicando material y longitud. El sistema mapea automáticamente los diámetros internos comerciales."
                                                icon={<Plus className="w-5 h-5" />}
                                            />
                                            <InstructionCard 
                                                num="03" 
                                                title="Mapéo de Consumos" 
                                                desc="Agregue los artefactos y seleccione los tramos que los alimentan. El simulador calculará la suma de caudales simultáneos."
                                                icon={<Activity className="w-5 h-5 rotate-90" />}
                                            />
                                            <InstructionCard 
                                                num="04" 
                                                title="Análisis y PDF" 
                                                desc="Itere el cálculo para verificar velocidades y presiones. Una vez validado, genere la memoria técnica en PDF de alta resolución."
                                                icon={<FileDown className="w-5 h-5" />}
                                            />
                                        </div>
                                    </motion.div>
                                )}

                                {activeView === 'course' && (
                                    <motion.div 
                                        key="course" 
                                        initial={{ opacity: 0, scale: 0.98 }} 
                                        animate={{ opacity: 1, scale: 1 }} 
                                        className="max-w-5xl mx-auto space-y-10"
                                    >
                                        <div className="p-16 bg-gradient-to-br from-indigo-600 to-blue-700 rounded-[60px] text-white flex flex-col items-center text-center relative overflow-hidden shadow-2xl">
                                            <div className="absolute inset-0 bg-opacity-10" />
                                            <div className="relative z-10 max-w-2xl">
                                                <div className="w-20 h-20 bg-white/20 backdrop-blur-xl rounded-3xl flex items-center justify-center mb-10 mx-auto border border-white/30 shadow-2xl">
                                                    <Play className="w-10 h-10 fill-white" />
                                                </div>
                                                <h2 className="text-5xl font-black tracking-tighter uppercase mb-6 leading-tight">Módulo de Especialización Técnica</h2>
                                                <p className="text-xl text-indigo-100 font-medium mb-12 opacity-80 leading-relaxed">
                                                    Acceda a nuestra plataforma educativa para dominar el cálculo avanzado de redes y normatividad vigente.
                                                </p>
                                                <button className="px-10 py-5 bg-white text-indigo-600 font-black text-sm uppercase tracking-[0.3em] rounded-2xl hover:scale-105 transition-all shadow-2xl shadow-black/20">
                                                    Entrar a la Academia
                                                </button>
                                                <div className="mt-16 flex items-center justify-center gap-10 grayscale opacity-40">
                                                    <div className="text-xs font-black uppercase tracking-widest">ASME B31.8</div>
                                                    <div className="text-xs font-black uppercase tracking-widest">NTC 2505</div>
                                                    <div className="text-xs font-black uppercase tracking-widest">BSI ISO</div>
                                                </div>
                                            </div>
                                        </div>
                                    </motion.div>
                                )}
                            </AnimatePresence>
                        </div>
                    </main>

                    <footer className="fixed bottom-0 left-0 right-0 z-40 bg-[#0a0a0c]/60 backdrop-blur-sm px-6 py-4 border-t border-white/5 pointer-events-none">
                        <div className="max-w-[1440px] mx-auto flex justify-between items-center opacity-40">
                            <p className="text-[10px] font-mono tracking-widest uppercase text-white">© 2024 Engine Systems. Mueller Logic v2.0</p>
                            <div className="flex gap-4">
                               <div className="text-[10px] font-mono tracking-widest uppercase text-white">Status: Nominal</div>
                               <div className="w-2 h-2 rounded-full bg-emerald-500 self-center" />
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        // --- Internal Components ---

        function NavBtn({ active, onClick, icon, label }) {
            return (
                <button 
                    onClick={onClick}
                    className={cn(
                        "relative flex items-center gap-3 px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] transition-all overflow-hidden",
                        active 
                            ? "bg-indigo-600 text-white shadow-xl shadow-indigo-600/30 ring-1 ring-indigo-400/50" 
                            : "text-zinc-500 hover:text-zinc-300 hover:bg-white/[0.03]"
                    )}
                >
                    {icon}
                    <span className="hidden lg:inline">{label}</span>
                    {active && <motion.div layoutId="nav-glow" className="absolute inset-0 bg-white/10 blur-xl px-1 py-1" />}
                </button>
            );
        }

        function Card({ title, icon, children }) {
            return (
                <div className="relative group bg-[#0a0a0c]/40 backdrop-blur-3xl rounded-[40px] border border-white/5 p-8 md:p-12 overflow-hidden shadow-2xl transition-all hover:border-white/10">
                    <div className="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/5 to-transparent" />
                    <div className="flex items-center gap-5 mb-12">
                        <div className="w-14 h-14 rounded-2xl bg-[#1e1e24] flex items-center justify-center text-indigo-400 border border-white/5 shadow-2xl">
                            {icon}
                        </div>
                        <h2 className="text-2xl font-black tracking-tighter text-white uppercase">{title}</h2>
                    </div>
                    <div className="relative z-10">
                        {children}
                    </div>
                </div>
            );
        }

        function InputField({ label, icon, value, onChange, type = "text", readOnly = false, className = "", step, isPrinting, placeholder }) {
            return (
                <div className={cn("space-y-4", className)}>
                    <Label icon={icon}>{label}</Label>
                    <div className="relative">
                        {isPrinting ? (
                            <div className="w-full px-6 py-4 rounded-2xl bg-[#0a0a0c] font-black border border-white/5 text-white text-lg">
                                 {value || '---'}
                            </div>
                        ) : (
                            <input 
                                type={type} 
                                value={value} 
                                placeholder={placeholder}
                                onChange={(e) => onChange?.(e.target.value)}
                                readOnly={readOnly}
                                step={step}
                                className={cn(
                                    "w-full px-6 py-4 rounded-2xl bg-[#1e1e24] border border-white/5 outline-none transition-all text-white font-medium placeholder:text-zinc-700",
                                    readOnly ? "opacity-50 cursor-not-allowed bg-[#0a0a0c]" : "focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/10 hover:bg-[#25252d]",
                                    className
                                )}
                            />
                        )}
                    </div>
                </div>
            );
        }

        function Label({ icon, children }) {
            return (
                <label className="flex items-center gap-3 text-[10px] uppercase tracking-[0.25em] font-black text-zinc-500">
                    {icon && <span className="w-4 h-4">{icon}</span>}
                    {children}
                </label>
            );
        }

        function MathItem({ label, desc }) {
            return (
                <div className="flex items-center gap-5 p-5 bg-[#1e1e24] rounded-2xl border border-white/5 group hover:border-indigo-500/30 transition-all">
                    <span className="font-mono font-black text-indigo-400 text-xl w-12 text-center">{label}</span>
                    <span className="text-zinc-400 text-sm font-medium">{desc}</span>
                </div>
            );
        }

        function InstructionCard({ num, title, desc, icon }) {
            return (
                <div className="p-10 bg-[#16161a] rounded-[40px] border border-white/5 space-y-8 group hover:bg-[#1e1e24] transition-all relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-8 text-7xl font-black text-white/5 select-none transition-transform group-hover:scale-110">{num}</div>
                    <div className="w-12 h-12 bg-indigo-500/10 rounded-2xl flex items-center justify-center text-indigo-400 border border-indigo-500/20 shadow-lg shadow-indigo-500/5 transition-transform group-hover:rotate-12">
                        {icon}
                    </div>
                    <div className="space-y-4 relative z-10">
                        <h4 className="text-xl font-black text-white uppercase tracking-tight">{title}</h4>
                        <p className="text-zinc-400 text-sm leading-relaxed font-medium">{desc}</p>
                    </div>
                </div>
            );
        }

        // --- Render ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
