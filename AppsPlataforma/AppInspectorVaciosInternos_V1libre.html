<!-- EK:INICIO estilos -->
<style id="ek-kit-css">
/* ==== ENTALPÍA LAB · Kit estándar de aplicativos (Tecnologías Básicas) ====
   Fuente única: AppsPlataforma/_kit/entalpia-kit.css — se inserta en línea con _kit/aplicar_kit.py.
   Todas las clases llevan prefijo ek- para no chocar con Tailwind ni con el CSS propio de cada app. */
:root{
  --ek-bg:#0a0d12;--ek-pn:#141922;--ek-pn2:#10151d;--ek-tx:#e4eefa;--ek-mu:#8fa3bd;
  --ek-ac:#2f86e8;--ek-ac2:#62b0ff;--ek-bd:#2a3648;--ek-ok:#3fbf7f;--ek-wa:#e8b23a;--ek-er:#ef5b5b;
  --ek-metal:linear-gradient(135deg,#9bd0ff 0%,#2f6fc8 45%,#173a6b 100%);
  --ek-hdr:52px;--ek-ftr:30px;
}
html.ek body{padding-top:var(--ek-hdr)!important;padding-bottom:var(--ek-ftr)!important;box-sizing:border-box}
html.ek.ek-sinpie body{padding-bottom:0!important}
/* Las vistas a pantalla completa descuentan la cabecera y el pie del kit */
html.ek .h-screen{height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important}
html.ek .min-h-screen{min-height:calc(100vh - var(--ek-hdr) - var(--ek-ftr))!important}
html.ek .h-\[100dvh\]{height:calc(100dvh - var(--ek-hdr) - var(--ek-ftr))!important}

/* ---------- cabecera ---------- */
.ek-hdr{position:fixed;top:0;left:0;right:0;height:var(--ek-hdr);z-index:2147483000;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,#121924,#0c1118);border-bottom:1px solid var(--ek-bd);color:var(--ek-tx);
  font:14px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;min-width:0}
.ek-hdr *{box-sizing:border-box}
.ek-hdr .ek-logo{height:38px;width:auto;border-radius:6px;flex:none;display:block}
.ek-hdr .ek-tit{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.ek-hdr .ek-tit b{font-size:16px;letter-spacing:.3px;background:var(--ek-metal);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ek-hdr .ek-tit span{font-size:11.5px;color:var(--ek-mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-hdr .ek-sp{flex:1;min-width:6px}
.ek-hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ek-bd);background:#18202c;color:var(--ek-tx);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;font:13px/1.2 Inter,system-ui,sans-serif;text-decoration:none}
.ek-hbtn:hover{border-color:var(--ek-ac)}
.ek-hbtn.pri{background:var(--ek-ac);border-color:var(--ek-ac);color:#fff}

/* ---------- pie ---------- */
.ek-ftr{position:fixed;left:0;right:0;bottom:0;height:var(--ek-ftr);z-index:2147482999;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-top:1px solid var(--ek-bd);background:#0c1118;color:var(--ek-mu);font:11.5px/1.2 Inter,system-ui,sans-serif;box-sizing:border-box;min-width:0}
.ek-ftr img{height:22px;width:auto;border-radius:4px;flex:none}
.ek-ftr .ek-sp{flex:1}
.ek-ftr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- modales ---------- */
.ek-modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;align-items:center;justify-content:center;z-index:2147483100;padding:12px;
  font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ek-tx)}
.ek-modal.on{display:flex}
.ek-mbox{position:relative;background:var(--ek-pn);border:1px solid var(--ek-bd);border-radius:12px;max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:left}
.ek-mhd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ek-bd);cursor:move;user-select:none;flex:none}
.ek-mhd b{font-size:15px;font-weight:700}.ek-mhd .ek-sp{flex:1}
.ek-mbd{padding:12px 14px;overflow:auto;min-height:0}
.ek-mbd h3{font-size:14px;margin:14px 0 6px;color:var(--ek-ac2);font-weight:700}
.ek-mbd h3:first-child{margin-top:2px}
.ek-mbd p,.ek-mbd li{color:#cfdcec;margin:4px 0}
.ek-mbd ul,.ek-mbd ol{padding-left:22px;margin:4px 0}.ek-mbd ul{list-style:disc}.ek-mbd ol{list-style:decimal}
.ek-mbd code,.ek-mbd .ek-f{font-family:Consolas,"JetBrains Mono",monospace;background:#0d1219;border:1px solid var(--ek-bd);border-radius:5px;padding:1px 5px;font-size:12.5px;color:#cfe6ff}
.ek-mbd .ek-f{display:block;padding:6px 9px;margin:6px 0;white-space:pre-wrap}
.ek-mbd table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.ek-mbd th,.ek-mbd td{border-bottom:1px solid #1d2734;padding:5px 6px;text-align:left}
.ek-mbd th{color:var(--ek-mu);font-weight:600}
.ek-mft{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--ek-bd);flex:none;flex-wrap:wrap}
.ek-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ek-bd);background:#1a2330;color:var(--ek-tx);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font:13px/1.2 Inter,system-ui,sans-serif}
.ek-btn:hover{border-color:var(--ek-ac)}
.ek-btn.pri{background:var(--ek-ac);border-color:var(--ek-ac);color:#fff}
.ek-btn.dan{border-color:#6b2a2a;color:#ffb3b3}
.ek-btn.sm{padding:4px 8px;font-size:12.5px}
.ek-x{border:0;background:none;color:var(--ek-mu);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.ek-x:hover{color:#fff}
.ek-note{font-size:12.5px;border-left:3px solid var(--ek-ac);background:#0f1724;padding:6px 9px;border-radius:0 6px 6px 0;margin:8px 0;color:#c4d4ea}
.ek-note.wa{border-color:var(--ek-wa)}.ek-note.er{border-color:var(--ek-er)}.ek-note.ok{border-color:var(--ek-ok)}
#ek-toast{position:fixed;left:50%;bottom:calc(var(--ek-ftr) + 14px);transform:translateX(-50%);background:#16243a;color:var(--ek-tx);border:1px solid var(--ek-ac);border-radius:8px;padding:8px 12px;z-index:2147483200;display:none;max-width:min(92vw,560px);font:13px/1.4 Inter,system-ui,sans-serif;word-break:break-word;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* bloques que solo existen en impresión */
.ek-print{display:none}
#ek-reporte{display:none}

@media (max-width:720px){
  :root{--ek-hdr:48px;--ek-ftr:26px}
  .ek-hdr .ek-tit span{display:none}
  .ek-hdr .ek-logo{height:32px}
  .ek-hbtn .ek-lbl{display:none}
  .ek-ftr .ek-hide-m{display:none}
}

/* ---------- impresión / PDF del navegador ---------- */
@media print{
  html.ek body{padding:0!important}
  .ek-hdr,.ek-ftr,.ek-modal,#ek-toast{display:none!important}
  .ek-print{display:block!important;visibility:visible!important;color:#111;font:9.5pt/1.35 "Segoe UI",Arial,sans-serif;position:static!important}
  .ek-print *{visibility:visible!important}
  .ek-print-cab{display:flex!important;align-items:center;gap:12px;border-bottom:2px solid #1d4f8f;padding:0 0 6px;margin:0 0 10px;break-inside:avoid}
  .ek-print-cab img{height:44px;width:auto}
  .ek-print-cab h1{font-size:14pt;margin:0;color:#173a6b;font-weight:700}
  .ek-print-cab div div{font-size:9pt;color:#444}
  .ek-print-pie{display:flex!important;align-items:center;gap:8px;margin-top:14px;border-top:1px solid #c8d3e2;padding-top:6px;font-size:8pt;color:#555;break-inside:avoid}
  .ek-print-pie img{height:26px;width:auto}
  .ek-print-pie span{flex:1}
  html.ek .h-screen,html.ek .min-h-screen{height:auto!important;min-height:0!important}
  /* informe estándar EK.informe(): solo se imprime el informe */
  html.ek-informe body>*:not(#ek-reporte){display:none!important}
  html.ek-informe body{background:#fff!important;color:#111!important}
  html.ek-informe #ek-reporte{display:block!important;visibility:visible!important;color:#111;font:9.6pt/1.4 "Segoe UI",Arial,sans-serif}
  html.ek-informe #ek-reporte *{visibility:visible!important}
  #ek-reporte .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1d4f8f;padding-bottom:6px;margin-bottom:8px}
  #ek-reporte .rh img{height:46px;width:auto}
  #ek-reporte h1{font-size:14.5pt;margin:0;color:#173a6b;font-weight:700}
  #ek-reporte ul{list-style:disc;padding-left:18px;margin:4px 0}#ek-reporte ol{list-style:decimal;padding-left:18px}
  #ek-reporte .rh div div{font-size:9pt;color:#444}
  #ek-reporte h2{font-size:11pt;font-weight:700;color:#173a6b;margin:12px 0 4px;border-bottom:1px solid #c8d3e2;padding-bottom:2px;break-after:avoid}
  #ek-reporte table{width:100%;border-collapse:collapse;font-size:8.8pt;margin:2px 0 4px}
  #ek-reporte th,#ek-reporte td{border:1px solid #c8d3e2;padding:3px 5px;text-align:left;background:#fff;color:#111;vertical-align:top}
  #ek-reporte th{background:#eaf1fa!important;font-weight:600}
  #ek-reporte td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #ek-reporte tr{break-inside:avoid}
  #ek-reporte .ok{color:#17663f;font-weight:700}#ek-reporte .no{color:#a3161d;font-weight:700}#ek-reporte .wa{color:#8a5a00;font-weight:700}
  #ek-reporte .ver{border:1.5px solid #1d4f8f;border-radius:6px;padding:7px 10px;margin:10px 0;font-size:10.5pt;break-inside:avoid}
  #ek-reporte .ver.ok{border-color:#17663f;background:#effaf3!important}#ek-reporte .ver.no{border-color:#a3161d;background:#fdf0f0!important}#ek-reporte .ver.wa{border-color:#8a5a00;background:#fdf8ea!important}
  #ek-reporte .txt{margin:4px 0;white-space:pre-wrap}
  #ek-reporte .fm{font-family:Consolas,monospace;font-size:8.6pt;background:#f4f7fb!important;border:1px solid #d5dfec;padding:4px 7px;margin:4px 0;white-space:pre-wrap}
  #ek-reporte .firmas td{height:48px;vertical-align:bottom;text-align:center;font-size:8.6pt;color:#444}
  #ek-reporte .pie{margin-top:14px;border-top:1px solid #c8d3e2;padding-top:6px;font-size:8pt;color:#555;display:flex;align-items:center;gap:8px;break-inside:avoid}
  #ek-reporte .pie img{height:28px;width:auto}
  #ek-reporte img.fig{max-width:100%;max-height:120mm;display:block;margin:6px auto;border:1px solid #c8d3e2}
  html.ek-informe .ek-print{display:none!important}
  @page{margin:12mm 12mm 14mm;@bottom-right{content:"Pág. " counter(page) " / " counter(pages);font:8pt Arial,sans-serif;color:#555}}
}

<body class="bg-slate-50 text-slate-900">

window.EK_CFG={"app": "Evaluador de Vacíos Internos", "sub": "Patios de ventilación y evacuación · NTC 3631 Anexo C", "ver": "2.0", "norma": "NTC 3631 Anexo C", "informe": "Reporte de inspección — vacíos internos NTC 3631 Anexo C", "oscuro": true, "pdf": false, "ayuda": "<h3>¿Para qué sirve?<\/h3>\n<p>Verifica las dimensiones mínimas de vacíos internos (patios de ventilación) usados para ventilación y/o evacuación de productos de combustión, según el Anexo C de la NTC 3631.<\/p>\n<h3>Cómo usarlo<\/h3>\n<ol>\n<li>Diligencie técnico y proyecto.<\/li>\n<li>Ingrese el número de pisos y el tipo de uso del vacío. Para evacuación o uso mixto ingrese el número de artefactos B2 y C (NE); en edificios de 7 o más pisos, también la potencia total y el tipo de entrada de aire en la base.<\/li>\n<li>Ingrese el área y el lado menor medidos.<\/li>\n<li>Marque la inspección visual y pulse <b>Evaluar<\/b>. En el reporte, <b>Imprimir / Guardar PDF<\/b> genera el informe estándar.<\/li>\n<\/ol>\n<h3>Criterios aplicados<\/h3>\n<table><tr><th>Edificio<\/th><th>Uso<\/th><th>Área mínima<\/th><th>Lado menor<\/th><\/tr>\n<tr><td rowspan=\"3\">1 a 6 pisos<\/td><td>Ventilación<\/td><td>2,0 m²<\/td><td>1,0 m<\/td><\/tr>\n<tr><td>Evacuación<\/td><td>máx(0,20 × NE ; 2,5) m²<\/td><td>1,5 m<\/td><\/tr>\n<tr><td>Mixto<\/td><td>máx(0,25 × NE ; 3,0) m²<\/td><td>1,5 m<\/td><\/tr>\n<tr><td rowspan=\"3\">7 o más pisos<\/td><td>Ventilación<\/td><td>3,0 m²<\/td><td>1,0 m<\/td><\/tr>\n<tr><td>Evacuación<\/td><td>máx(0,25 × NE ; 3,5) m²<\/td><td>máx(√(A/1,5) ; 1,5) m<\/td><\/tr>\n<tr><td>Mixto<\/td><td>máx(0,40 × NE ; 4,0) m²<\/td><td>máx(√(A/1,5) ; 2,0) m<\/td><\/tr><\/table>\n<p>Ventilación en la base (7 o más pisos, evacuación o mixto):<\/p>\n<div class=\"ek-f\">Bajo plataforma:      V = 6 cm²/kW × ΣP\nConducto horizontal:  V = 11 cm²/kW × ΣP ; lado mínimo = √(V / 1,5)\nPor primer piso:      V = 22 cm²/kW × ΣP<\/div>\n<div class=\"ek-note\">El número de pisos debe ser 1 o mayor; sin ese dato no se aplica criterio y el vacío no se aprueba.<\/div>\n"};

/* ==== ENTALPÍA LAB · Kit estándar de aplicativos (Tecnologías Básicas) ====

     app     nombre del aplicativo            sub     subtítulo de la cabecera
     ver     versión mostrada en el pie       norma   referencia normativa (texto)
     ayuda   HTML de la guía de uso           raiz    ruta relativa a la raíz del sitio ("../")
     alerta  false para conservar window.alert nativo
     pdf     false para no enmarcar los PDF de jsPDF
     marcoImpresion false si la app ya imprime su propio encabezado
     oscuro  true para aplicar el tema oscuro estándar a apps Tailwind claras

(function () {
  'use strict';
  if (window.EK && window.EK.__v) return;
  var C = window.EK_CFG || {};
  var LOGO_ENT = window.EK_LOGO_ENT, LOGO_PIO = window.EK_LOGO_PIO;
  var PIE = "Hub de Ingeniería Pioneer's · un desarrollo de Industrias I.A. Col";
  var d = document;
  var EK = { __v: '1.0', cfg: C, LOGO_ENT: LOGO_ENT, LOGO_PIO: LOGO_PIO, PIE: PIE };
  window.EK = EK;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fecha() { var f = new Date(); return f.toLocaleDateString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit' }) + ' ' + f.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }); }
  EK.esc = esc; EK.fecha = fecha;

  /* ---------- cabecera y pie ---------- */

  /* ---------- marco estándar para PDF de jsPDF ----------

        doc.text(String(tit).slice(0, 90), u(64), u(20));
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(150, 175, 205);
        doc.text(sub.slice(0, 150), u(64), u(33));
        doc.setDrawColor(30, 95, 191); doc.setLineWidth(u(0.8));
        doc.line(u(22), H - u(BOT - 4), W - u(22), H - u(BOT - 4));
        doc.setTextColor(80, 80, 80); doc.setFontSize(7.5);
        doc.text(PIE + ' · ' + (C.app || ''), u(22), H - u(12));
        doc.text('Pág. ' + i + '/' + n, W - u(52), H - u(12), { align: 'right' });
        try { doc.addImage(LOGO_PIO, 'JPEG', W - u(46), H - u(BOT - 6), u(26), u(21)); } catch (e) {}
      }

      doc.setPage(n);
    } catch (e) { if (window.console) console.warn('EK.marcoPDF', e); }

  };

        );
        const IconPrinter = ({size=24, className=""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        );
        const IconCalculator = ({size=24, className=""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="14"/><line x1="16" y1="18" x2="16" y2="18"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="12" y1="18" x2="12" y2="18"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="8" y1="18" x2="8" y2="18"/></svg>
        );
        const IconBuilding = ({size=24, className=""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="22.01"/><line x1="15" y1="22" x2="15" y2="22.01"/><line x1="9" y1="18" x2="9" y2="18.01"/><line x1="15" y1="18" x2="15" y2="18.01"/><line x1="9" y1="14" x2="9" y2="14.01"/><line x1="15" y1="14" x2="15" y2="14.01"/><line x1="9" y1="10" x2="9" y2="10.01"/><line x1="15" y1="10" x2="15" y2="10.01"/><line x1="9" y1="6" x2="9" y2="6.01"/><line x1="15" y1="6" x2="15" y2="6.01"/></svg>
        );

        // --- APLICACIÓN PRINCIPAL ---

        const EvaluatorApp = () => {
            const [formData, setFormData] = useState({
                technicianName: '',
                projectAddress: '',
                floors: 1,
                usageType: 'ventilation', // ventilation, evacuation, mixed
                measuredArea: 0,
                measuredSide: 0,
                numAppliances: 0, // NE
                totalPower: 0, // Sigma P for 7+ floors
                intakeType: 'platform', // platform, duct, first_floor
                checklist: {
                    roofOpening: false,
                    distanceWindows: false, // A & D
                    distanceDucts: false, // B
                    distanceWalls: false, // C & E
                }
            });

            const [showReport, setShowReport] = useState(false);

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                if (name.startsWith('check_')) {
                    const key = name.split('_')[1];
                    setFormData(prev => ({
                        ...prev,
                        checklist: { ...prev.checklist, [key]: checked }
                    }));
                } else {
                    setFormData(prev => ({
                        ...prev,
                        [name]: type === 'number' ? parseFloat(value) || 0 : value
                    }));
                }
            };

            // --- LÓGICA DE CÁLCULO NTC 3631 ---
            const calculateCompliance = () => {
                let requiredArea = 0;
                let requiredSide = 0;
                let requiredVentBase = 0;
                let requiredVentSide = 0; 
                let rulesApplied = [];

                const { floors, usageType, numAppliances, totalPower, intakeType } = formData;
                const NE = numAppliances;

                // 1. Cálculo de Área y Lado
                // (se usa "< 7" para que valores no enteros como 6,5 no queden sin criterio)
                if (floors >= 1 && floors < 7) {
                    if (usageType === 'ventilation') {
                        requiredArea = 2.0;
                        requiredSide = 1.0;
                        rulesApplied.push("Edificios 1-6 pisos (Ventilación): A ≥ 2m², Lm ≥ 1m");
                    } else if (usageType === 'evacuation') {
                        requiredArea = Math.max(0.20 * NE, 2.5);
                        requiredSide = 1.5;
                        rulesApplied.push("Edificios 1-6 pisos (Evacuación): A = (0.20 × NE) ≥ 2.5m², Lm ≥ 1.5m");
                    } else if (usageType === 'mixed') {
                        requiredArea = Math.max(0.25 * NE, 3.0);
                        requiredSide = 1.5;
                        rulesApplied.push("Edificios 1-6 pisos (Mixto): A = (0.25 × NE) ≥ 3m², Lm ≥ 1.5m");
                    }
                } else if (floors >= 7) {
                    if (usageType === 'ventilation') {
                        requiredArea = 3.0;
                        requiredSide = 1.0;
                        rulesApplied.push("Edificios 7+ pisos (Ventilación): A ≥ 3m², Lm ≥ 1m");
                    } else if (usageType === 'evacuation') {
                        requiredArea = Math.max(0.25 * NE, 3.5);
                        requiredSide = Math.max(Math.sqrt(requiredArea / 1.5), 1.5);
                        rulesApplied.push("Edificios 7+ pisos (Evacuación): A = (0.25 × NE) ≥ 3.5m², Lm = √(A/1.5) ≥ 1.5m");
                    } else if (usageType === 'mixed') {
                        requiredArea = Math.max(0.4 * NE, 4.0);
                        requiredSide = Math.max(Math.sqrt(requiredArea / 1.5), 2.0);
                        rulesApplied.push("Edificios 7+ pisos (Mixto): A = (0.4 × NE) ≥ 4m², Lm = √(A/1.5) ≥ 2m");
                    }

                    // 2. Cálculo Ventilación en Base (7+ pisos)
                    if (usageType !== 'ventilation') {
                        if (intakeType === 'platform') {
                            requiredVentBase = (totalPower * 6);
                            rulesApplied.push("Ventilación Base (Plataforma): V = (ΣP × 6) / 1");
                        } else if (intakeType === 'duct') {
                            requiredVentBase = (totalPower * 11);
                            requiredVentSide = Math.sqrt(requiredVentBase / 1.5);
                            rulesApplied.push("Ventilación Base (Conducto): V = (ΣP × 11) / 1");
                        } else if (intakeType === 'first_floor') {
                            requiredVentBase = (totalPower * 22);
                            rulesApplied.push("Ventilación Base (Primer Piso): V = (ΣP × 22) / 1");
                        }
                    }
                }

                // 3. Evaluación Aprobado/Reprobado
                const areaPass = formData.measuredArea >= requiredArea;
                const sidePass = formData.measuredSide >= requiredSide;
                
                // Checklist (Todos deben ser true)
                const checklistPass = Object.values(formData.checklist).every(val => val === true);
                // Sin número de pisos válido no hay criterio aplicable: no se puede aprobar
                const floorsValid = floors >= 1;
                if (!floorsValid) rulesApplied.push("Número de pisos no válido (debe ser ≥ 1): no se aplica criterio.");
                const overallPass = floorsValid && areaPass && sidePass && checklistPass;

                return {
                    requiredArea,
                    requiredSide,
                    requiredVentBase,
                    requiredVentSide,
                    rulesApplied,
                    areaPass,
                    sidePass,
                    checklistPass,
                    overallPass
                };
            };

            const results = calculateCompliance();

            // Informe estándar ENTALPÍA LAB (Imprimir / Guardar como PDF)
            const printReport = () => {
                if (!window.EK) { window.print(); return; }
                const r = results, f = formData;
                const est = ok => ok ? { v: 'CUMPLE', cls: 'ok' } : { v: 'NO CUMPLE', cls: 'no' };
                const uso = f.usageType === 'ventilation' ? 'Solo ventilación' : f.usageType === 'evacuation' ? 'Solo evacuación' : 'Mixto (ventilación + evacuación)';
                const entrada = f.intakeType === 'platform' ? 'Caso 1: bajo plataforma' : f.intakeType === 'duct' ? 'Caso 2: conducto horizontal' : 'Caso 3: por primer piso';
                EK.informe({
                    titulo: 'Reporte de inspección — vacíos internos NTC 3631 Anexo C',
                    archivo: 'Vacio_interno_NTC3631_AnexoC',
                    datos: [['Técnico evaluador', f.technicianName], ['Dirección / proyecto', f.projectAddress], ['Número de pisos', f.floors], ['Tipo de uso', uso],
                            ['Artefactos B2 y C (NE)', f.usageType !== 'ventilation' ? f.numAppliances : '—'], ['Potencia total (ΣP)', f.usageType !== 'ventilation' && f.floors >= 7 ? f.totalPower + ' kW' : '—']],
                    secciones: [
                        { titulo: '1. Evaluación dimensional', cabeza: ['Parámetro', 'Medido', 'Mínimo requerido', 'Estado'], numeros: [1, 2], filas: [
                            ['Área en planta (A)', f.measuredArea.toFixed(2) + ' m²', r.requiredArea.toFixed(2) + ' m²', est(r.areaPass)],
                            ['Lado menor (Lm)', f.measuredSide.toFixed(2) + ' m', r.requiredSide.toFixed(2) + ' m', est(r.sidePass)]],
                          formula: r.rulesApplied.filter(x => !x.includes('Ventilación Base')).join('\n') },
                        r.requiredVentBase > 0 ? { titulo: '2. Ventilación en base (edificios de 7 o más pisos)', cabeza: ['Concepto', 'Valor'], numeros: [1], filas: [
                            ['Entrada de aire', entrada], ['Área libre requerida (V)', r.requiredVentBase.toFixed(2) + ' cm²']].concat(f.intakeType === 'duct' ? [['Lado mínimo del conducto', r.requiredVentSide.toFixed(2) + ' cm']] : []),
                          formula: r.rulesApplied.find(x => x.includes('Ventilación Base')) } : null,
                        { titulo: '3. Inspección visual', cabeza: ['Condición', 'Estado'], filas: [
                            ['Cubierta superior: deja libre el 25 % del área (mín. 4 m² o 6 m² según uso)', est(f.checklist.roofOpening)],
                            ['Distancia a paredes con ventanas (A, D, G) ≥ 1,0 m (0,40 m con flujos convergentes)', est(f.checklist.distanceWindows)],
                            ['Distancia entre conductos al mismo nivel (B) ≥ 0,30 m', est(f.checklist.distanceDucts)],
                            ['Distancia a muros ciegos (C, E): lateral ≥ 0,30 m, frontal ≥ 1,0 m', est(f.checklist.distanceWalls)]] }
                    ],
                    veredicto: r.overallPass ? { tipo: 'ok', txt: 'APROBADO — el vacío interno cumple las especificaciones mínimas evaluadas del Anexo C de la NTC 3631.' }
                                             : { tipo: 'no', txt: 'NO APROBADO — el vacío interno no cumple uno o más criterios evaluados.' },
                    firmas: ['Técnico responsable', 'Revisó / Aprobó']
                });
            };

            // --- VISTA DE REPORTE ---
            if (showReport) {
                return (
                    <div className="min-h-screen bg-white text-black p-8 max-w-4xl mx-auto print-full-width">
                        <div className="flex justify-between items-center mb-6 no-print">
                            <button onClick={() => setShowReport(false)} className="text-gray-600 hover:text-gray-900 flex items-center gap-2">
                                &larr; Volver a editar
                            </button>
                            <button onClick={printReport} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2 shadow-md">
                                <IconPrinter size={18} /> Imprimir / Guardar PDF
                            </button>
                        </div>

                        <div className="border-b-2 border-gray-800 pb-4 mb-6">
                            <div className="flex justify-between items-end">
                                <div>
                                    <h1 className="text-3xl font-bold uppercase text-gray-800">Reporte de Inspección</h1>
                                    <p className="text-lg text-gray-600">Vacíos Internos para Gas</p>
                                </div>
                                <div className="text-right text-xs text-gray-500">
                                    <p>Conformidad NTC 3631 (Anexo C)</p>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-6 mb-8 text-sm">
                            <div className="bg-gray-50 p-4 rounded border border-gray-100">
                                <p className="mb-1"><span className="font-bold text-gray-700">Técnico Evaluador:</span> {formData.technicianName || 'N/A'}</p>
                                <p className="mb-1"><span className="font-bold text-gray-700">Fecha:</span> {new Date().toLocaleDateString()}</p>
                                <p><span className="font-bold text-gray-700">Dirección:</span> {formData.projectAddress || 'N/A'}</p>
                            </div>
                            <div className="bg-gray-50 p-4 rounded border border-gray-100">
                                <p className="mb-1"><span className="font-bold text-gray-700">Número de Pisos:</span> {formData.floors}</p>
                                <p className="mb-1"><span className="font-bold text-gray-700">Tipo de Uso:</span> {formData.usageType === 'ventilation' ? 'Solo Ventilación' : formData.usageType === 'evacuation' ? 'Solo Evacuación' : 'Mixto (Vent + Evac)'}</p>
                                {(formData.usageType !== 'ventilation') && (
                                    <>
                                    <p className="mb-1"><span className="font-bold text-gray-700">Artefactos (NE):</span> {formData.numAppliances}</p>
                                    <p><span className="font-bold text-gray-700">Potencia Total (ΣP):</span> {formData.totalPower} kW</p>
                                    </>
                                )}
                            </div>
                        </div>

                        {/* RESULTADO FINAL */}
                        <div className={`p-4 border-l-8 mb-8 ${results.overallPass ? 'bg-green-50 border-green-600' : 'bg-red-50 border-red-600'}`}>
                            <h2 className={`text-2xl font-bold ${results.overallPass ? 'text-green-800' : 'text-red-800'}`}>
                                DICTAMEN FINAL: {results.overallPass ? 'APROBADO' : 'NO APROBADO'}
                            </h2>
                            <p className="text-gray-700 mt-1">
                                El vacío interno evaluado <strong>{results.overallPass ? 'CUMPLE' : 'NO CUMPLE'}</strong> con las especificaciones mínimas de la norma técnica.
                            </p>
                        </div>

                        {/* DETALLE DIMENSIONAL */}
                        <div className="mb-8">
                            <h3 className="text-lg font-bold border-b border-gray-300 mb-4 pb-1 text-gray-800">1. Evaluación Dimensional</h3>
                            <table className="w-full text-sm text-left border-collapse">
                                <thead className="bg-gray-100 text-gray-700">
                                    <tr>
                                        <th className="p-2 border border-gray-200">Parámetro</th>
                                        <th className="p-2 border border-gray-200">Valor Medido</th>
                                        <th className="p-2 border border-gray-200">Mínimo Requerido</th>
                                        <th className="p-2 border border-gray-200 text-center">Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="p-2 border border-gray-200">Área en Planta (A)</td>
                                        <td className="p-2 border border-gray-200 font-medium">{formData.measuredArea.toFixed(2)} m²</td>
                                        <td className="p-2 border border-gray-200">{results.requiredArea.toFixed(2)} m²</td>
                                        <td className="p-2 border border-gray-200 text-center">
                                            {results.areaPass ? <span className="text-green-700 font-bold flex justify-center items-center gap-1"><IconCheckCircle size={14}/> OK</span> : <span className="text-red-700 font-bold flex justify-center items-center gap-1"><IconXCircle size={14}/> FALLA</span>}
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="p-2 border border-gray-200">Lado Menor (Lm)</td>
                                        <td className="p-2 border border-gray-200 font-medium">{formData.measuredSide.toFixed(2)} m</td>
                                        <td className="p-2 border border-gray-200">{results.requiredSide.toFixed(2)} m</td>
                                        <td className="p-2 border border-gray-200 text-center">
                                            {results.sidePass ? <span className="text-green-700 font-bold flex justify-center items-center gap-1"><IconCheckCircle size={14}/> OK</span> : <span className="text-red-700 font-bold flex justify-center items-center gap-1"><IconXCircle size={14}/> FALLA</span>}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <p className="text-xs text-gray-500 mt-2 italic">Criterio aplicado: {results.rulesApplied[0]}</p>
                        </div>

                        {/* VENTILACION EN BASE (SOLO SI APLICA) */}
                        {results.requiredVentBase > 0 && (
                            <div className="mb-8">
                                <h3 className="text-lg font-bold border-b border-gray-300 mb-4 pb-1 text-gray-800">2. Ventilación en Base (Edificios 7+ pisos)</h3>
                                <div className="bg-gray-50 p-4 rounded border border-gray-200">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <p className="text-gray-500 text-xs uppercase tracking-wider">Método de Entrada</p>
                                            <p className="font-bold text-gray-800">{
                                                formData.intakeType === 'platform' ? 'Bajo Plataforma' :
                                                formData.intakeType === 'duct' ? 'Conducto Horizontal' : 'Primer Piso'
                                            }</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500 text-xs uppercase tracking-wider">Área Libre Requerida (V)</p>
                                            <p className="font-bold text-gray-800 text-lg">{results.requiredVentBase.toFixed(2)} cm²</p>
                                        </div>
                                    </div>
                                    {formData.intakeType === 'duct' && (
                                        <div className="mt-2 pt-2 border-t border-gray-200">
                                            <p className="text-gray-500 text-xs uppercase tracking-wider">Lado Mínimo Conducto</p>
                                            <p className="font-bold text-gray-800">{results.requiredVentSide.toFixed(2)} cm</p>
                                        </div>
                                    )}
                                </div>
                                <p className="text-xs text-gray-500 mt-2 italic">Fórmula: {results.rulesApplied.find(r => r.includes('Ventilación Base'))}</p>
                            </div>
                        )}

                        {/* CHEQUEO VISUAL */}
                        <div className="mb-8">
                            <h3 className="text-lg font-bold border-b border-gray-300 mb-4 pb-1 text-gray-800">3. Inspección Visual (Distancias y Cubierta)</h3>
                            <ul className="text-sm space-y-3">
                                <li className="flex items-start gap-3">
                                    <div className="mt-0.5">{formData.checklist.roofOpening ? <IconCheckCircle size={18} className="text-green-600"/> : <IconXCircle size={18} className="text-red-600"/>}</div>
                                    <span className={formData.checklist.roofOpening ? "text-gray-700" : "text-red-700 font-medium"}>Cubierta superior (si existe) deja libre 25% del área o cumple mínimo requerido.</span>
                                </li>
                                <li className="flex items-start gap-3">
                                    <div className="mt-0.5">{formData.checklist.distanceWindows ? <IconCheckCircle size={18} className="text-green-600"/> : <IconXCircle size={18} className="text-red-600"/>}</div>
                                    <span className={formData.checklist.distanceWindows ? "text-gray-700" : "text-red-700 font-medium"}>Distancia a ventanas/muros ventilados (A, D, G) ≥ 1.0m (o 0.40m convergentes).</span>
                                </li>
                                <li className="flex items-start gap-3">
                                    <div className="mt-0.5">{formData.checklist.distanceDucts ? <IconCheckCircle size={18} className="text-green-600"/> : <IconXCircle size={18} className="text-red-600"/>}</div>
                                    <span className={formData.checklist.distanceDucts ? "text-gray-700" : "text-red-700 font-medium"}>Distancia entre conductos (B) ≥ 0.30m.</span>
                                </li>
                                <li className="flex items-start gap-3">
                                    <div className="mt-0.5">{formData.checklist.distanceWalls ? <IconCheckCircle size={18} className="text-green-600"/> : <IconXCircle size={18} className="text-red-600"/>}</div>
                                    <span className={formData.checklist.distanceWalls ? "text-gray-700" : "text-red-700 font-medium"}>Distancia a muros ciegos (C, E) ≥ 0.30m (lateral) / Frontal ≥ 1.0m.</span>
                                </li>
                            </ul>
                        </div>

                        <div className="mt-16 pt-6 border-t border-gray-300 flex justify-between text-xs text-gray-500">
                            <p>Generado por App Evaluador NTC 3631</p>
                            <div className="text-center">
                                <p className="mb-8">__________________________________________</p>
                                <p className="font-bold">Firma del Técnico Responsable</p>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- VISTA DE FORMULARIO ---
            return (
                <div className="min-h-screen bg-slate-100 p-4 md:p-8 no-print fade-in">
                    <div className="max-w-3xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden">
                        {/* Header */}
                        <div className="bg-blue-800 p-6 text-white">
                            <div className="flex items-center gap-3">
                                <IconCalculator size={32} />
                                <div>
                                    <h1 className="text-2xl font-bold">Evaluador de Vacíos Internos</h1>
                                    <p className="text-blue-100 text-sm">Cálculo y Reporte según NTC 3631 - Anexo C</p>
                                </div>
                            </div>
                        </div>

                        <div className="p-6 space-y-8">
                        
                            {/* Sección 1: Info General */}
                            <section>
                                <h2 className="text-lg font-semibold text-gray-800 flex items-center gap-2 mb-4 border-b pb-2">
                                    <IconFileText className="text-blue-600" size={20}/> Información del Proyecto
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Nombre del Técnico</label>
                                        <input
                                            type="text"
                                            name="technicianName"
                                            value={formData.technicianName}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none"
                                            placeholder="Ej. Juan Pérez"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Dirección / Proyecto</label>
                                        <input
                                            type="text"
                                            name="projectAddress"
                                            value={formData.projectAddress}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none"
                                            placeholder="Ej. Edificio Los Andes Apto 402"
                                        />
                                    </div>
                                </div>
                            </section>

                            {/* Sección 2: Datos Edificación */}
                            <section className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-sm">
                                <h2 className="text-lg font-semibold text-gray-800 flex items-center gap-2 mb-4">
                                    <IconBuilding className="text-blue-600" size={20}/> Datos de la Edificación
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Número de Pisos</label>
                                        <input
                                            type="number"
                                            name="floors"
                                            min="1"
                                            value={formData.floors}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border border-gray-300 rounded-md outline-none"
                                        />
                                        <p className="text-xs text-gray-500 mt-1">Determina si aplica C.1.1 (1-6 pisos) o C.1.2 (7+ pisos).</p>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Tipo de Uso del Vacío</label>
                                        <select
                                            name="usageType"
                                            value={formData.usageType}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border border-gray-300 rounded-md outline-none bg-white"
                                        >
                                            <option value="ventilation">Solo Ventilación</option>
                                            <option value="evacuation">Solo Evacuación</option>
                                            <option value="mixed">Mixto (Ventilación + Evacuación)</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Inputs Condicionales */}
                                {formData.usageType !== 'ventilation' && (
                                    <div className="mt-4 pt-4 border-t border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-6 fade-in">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Número Total de Artefactos (B2 y C) <span className="text-red-500">*</span>
                                            </label>
                                            <input
                                                type="number"
                                                name="numAppliances"
                                                min="0"
                                                value={formData.numAppliances}
                                                onChange={handleInputChange}
                                                className="w-full p-2 border border-gray-300 rounded-md outline-none"
                                                placeholder="NE"
                                            />
                                        </div>
                                        
                                        {formData.floors >= 7 && (
                                            <>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                                        Potencia Total Instalada (kW) <span className="text-red-500">*</span>
                                                    </label>
                                                    <input
                                                        type="number"
                                                        name="totalPower"
                                                        min="0"
                                                        value={formData.totalPower}
                                                        onChange={handleInputChange}
                                                        className="w-full p-2 border border-gray-300 rounded-md outline-none"
                                                        placeholder="ΣP (Suma potencias)"
                                                    />
                                                </div>
                                                <div className="col-span-1 md:col-span-2">
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Tipo de Entrada de Aire (Base)</label>
                                                    <select
                                                        name="intakeType"
                                                        value={formData.intakeType}
                                                        onChange={handleInputChange}
                                                        className="w-full p-2 border border-gray-300 rounded-md outline-none bg-white"
                                                    >
                                                        <option value="platform">Caso 1: Bajo Plataforma</option>
                                                        <option value="duct">Caso 2: Conducto Horizontal</option>
                                                        <option value="first_floor">Caso 3: Por Primer Piso</option>
                                                    </select>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                )}
                            </section>

                            {/* Sección 3: Mediciones */}
                            <section>
                                <h2 className="text-lg font-semibold text-gray-800 flex items-center gap-2 mb-4 border-b pb-2">
                                    <IconRuler className="text-blue-600" size={20}/> Mediciones en Campo
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-blue-50 p-4 rounded-md border border-blue-200 shadow-sm">
                                        <label className="block text-sm font-bold text-blue-900 mb-1">Área Medida (m²)</label>
                                        <input
                                            type="number"
                                            name="measuredArea"
                                            step="0.01"
                                            value={formData.measuredArea}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border border-blue-300 rounded-md outline-none text-2xl font-mono text-blue-900 text-center bg-white"
                                        />
                                    </div>
                                    <div className="bg-blue-50 p-4 rounded-md border border-blue-200 shadow-sm">
                                        <label className="block text-sm font-bold text-blue-900 mb-1">Lado Menor Medido (m)</label>
                                        <input
                                            type="number"
                                            name="measuredSide"
                                            step="0.01"
                                            value={formData.measuredSide}
                                            onChange={handleInputChange}
                                            className="w-full p-2 border border-blue-300 rounded-md outline-none text-2xl font-mono text-blue-900 text-center bg-white"
                                        />
                                    </div>
                                </div>
                                {/* Feedback en vivo */}
                                <div className="mt-3 text-sm text-gray-500 flex justify-between px-2 font-medium">
                                    <span>Requerido Mín: {results.requiredArea.toFixed(2)} m²</span>
                                    <span>Requerido Mín: {results.requiredSide.toFixed(2)} m</span>
                                </div>
                            </section>

                            {/* Sección 4: Checklist */}
                            <section>
                                <h2 className="text-lg font-semibold text-gray-800 flex items-center gap-2 mb-4 border-b pb-2">
                                    <IconCheckCircle className="text-blue-600" size={20}/> Inspección Visual (Norma)
                                </h2>
                                <div className="space-y-3">
                                    <label className="flex items-start gap-3 p-3 border border-gray-200 rounded-md hover:bg-gray-50 cursor-pointer transition-colors shadow-sm">
                                        <input
                                            type="checkbox"
                                            name="check_roofOpening"
                                            checked={formData.checklist.roofOpening}
                                            onChange={handleInputChange}
                                            className="mt-1 h-5 w-5 text-blue-600 rounded focus:ring-blue-500"
                                        />
                                        <span className="text-sm text-gray-700">
                                            <span className="font-bold block text-gray-900">Cubierta Superior</span>
                                            Si existe techo, deja libre una superficie de comunicación con el exterior del 25% (mín 4m² o 6m² según uso).
                                        </span>
                                    </label>

                                    <label className="flex items-start gap-3 p-3 border border-gray-200 rounded-md hover:bg-gray-50 cursor-pointer transition-colors shadow-sm">
                                        <input
                                            type="checkbox"
                                            name="check_distanceWindows"
                                            checked={formData.checklist.distanceWindows}
                                            onChange={handleInputChange}
                                            className="mt-1 h-5 w-5 text-blue-600 rounded focus:ring-blue-500"
                                        />
                                        <span className="text-sm text-gray-700">
                                            <span className="font-bold block text-gray-900">Distancias a Ventanas (A, D, G)</span>
                                            Conductos a ≥ 1.0m de paredes con ventanas. (Si hay flujos convergentes ≥ 0.40m).
                                        </span>
                                    </label>

                                    <label className="flex items-start gap-3 p-3 border border-gray-200 rounded-md hover:bg-gray-50 cursor-pointer transition-colors shadow-sm">
                                        <input
                                            type="checkbox"
                                            name="check_distanceDucts"
                                            checked={formData.checklist.distanceDucts}
                                            onChange={handleInputChange}
                                            className="mt-1 h-5 w-5 text-blue-600 rounded focus:ring-blue-500"
                                        />
                                        <span className="text-sm text-gray-700">
                                            <span className="font-bold block text-gray-900">Distancia entre Conductos (B)</span>
                                            Separación entre conductos al mismo nivel ≥ 0.30m.
                                        </span>
                                    </label>
                                    
                                    <label className="flex items-start gap-3 p-3 border border-gray-200 rounded-md hover:bg-gray-50 cursor-pointer transition-colors shadow-sm">
                                        <input
                                            type="checkbox"
                                            name="check_distanceWalls"
                                            checked={formData.checklist.distanceWalls}
                                            onChange={handleInputChange}
                                            className="mt-1 h-5 w-5 text-blue-600 rounded focus:ring-blue-500"
                                        />
                                        <span className="text-sm text-gray-700">
                                            <span className="font-bold block text-gray-900">Distancias a Muros Ciegos (C, E)</span>
                                            Lateral ≥ 0.30m. Frontal ≥ 1.0m (o 2m según interpretación de tabla para seguridad).
                                        </span>
                                    </label>
                                </div>
                            </section>

                            {/* Botón de Acción */}
                            <div className="pt-6">
                                <button
                                    onClick={() => setShowReport(true)}
                                    className={`w-full py-4 rounded-lg font-bold text-lg shadow-lg transition-all transform hover:-translate-y-1 active:translate-y-0 ${
                                        results.overallPass 
                                        ? 'bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white shadow-green-200' 
                                        : 'bg-gray-800 hover:bg-gray-900 text-white'
                                    }`}
                                >
                                    {results.overallPass 
                                        ? '✔ Vacío Cumple - Generar Certificado' 
                                        : 'Evaluar y Ver Fallos'}
                                </button>
                                {!results.overallPass && (
                                    <div className="mt-3 p-3 bg-red-50 border border-red-100 rounded text-center text-red-600 text-sm font-medium animate-pulse">
                                        <span className="flex items-center justify-center gap-2">
                                            <IconAlertTriangle size={16} /> Hay criterios que no se cumplen. Revisa los datos.
                                        </span>
                                    </div>
                                )}
                            </div>

                        </div>
                    </div>
                    <div className="text-center text-gray-400 text-xs mt-8">
                        App de Evaluación NTC 3631 • Funciona offline
                    </div>
                </div>
            );
        };

        const IconAlertTriangle = ({size=24, className=""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EvaluatorApp />);
    </script>
</body>
</html>
