<style>
:root{color-scheme:dark;--bg:#070b16;--card:#0d1424;--bd:#1e2a44;--tx:#e2e8f0;--mu:#8b9ab5;--bl:#3b82f6;--cy:#38bdf8;--em:#10b981;--am:#f59e0b;--rd:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}header img{height:42px;border-radius:6px}h1{font-size:17px;margin:0}h1 span{color:var(--cy)}small,.mu{color:var(--mu)}
button,select,input{font:inherit;color:var(--tx);background:#0a1120;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}button{cursor:pointer;background:#111b31}button.on,button.p{border-color:var(--bl);background:var(--bl);font-weight:600}
nav{display:flex;gap:6px;padding:10px 18px;flex-wrap:wrap}main{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:0 18px 28px;max-width:1300px;margin:auto}@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}.card h2{font-size:13px;margin:0 0 8px;color:#9cc2ff}
label{display:block;color:var(--mu);font-size:11px;margin:8px 0 3px}.g2{display:grid;grid-template-columns:1fr 90px;gap:6px}input,select{width:100%}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.rc{background:#0a1120;border:1px solid var(--bd);border-radius:12px;padding:10px;display:grid;grid-template-columns:96px 1fr;gap:10px}
.rc .ph{background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;height:96px}.rc .ph img{max-width:100%;max-height:96px}.ph.no{background:#14203a;color:var(--mu);font-size:11px;text-align:center}
.tag{font-size:10px;padding:1px 6px;border:1px solid var(--bd);border-radius:5px;color:var(--mu);margin-right:3px;white-space:nowrap}.ok{color:#6ee7b7;border-color:#065f46}.wr{color:#fcd34d;border-color:#78350f}.bd{color:#fca5a5;border-color:#7f1d1d}
.bar{height:8px;background:#14203a;border-radius:5px;margin:4px 0;overflow:hidden}.bar i{display:block;height:100%}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}th{color:#9cc2ff;position:sticky;top:0;background:var(--card)}.sc{max-height:560px;overflow:auto}
.tab{display:none}.tab.on{display:block}#cv{height:340px;border-radius:10px;background:radial-gradient(circle at 50% 30%,#12203d,#070b16);cursor:grab;touch-action:none}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kp div{background:#0a1120;border:1px solid var(--bd);border-radius:10px;padding:8px}.kp b{display:block;font-size:19px}
svg text{fill:var(--mu);font-size:10px}.st{border-left:3px solid var(--bl);padding:6px 10px;margin:6px 0;background:#0a1120;border-radius:0 8px 8px 0}
#spl{position:fixed;inset:0;z-index:99999;background:#1a1a1a;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;transition:opacity .7s ease,transform .7s ease}
#spl.out{opacity:0;transform:scale(1.07);pointer-events:none}
#splc{position:absolute;inset:0;width:100%;height:100%}
#spll{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
#spleW{position:relative;width:min(34vmin,300px);-webkit-mask-image:radial-gradient(closest-side,#000 64%,transparent 100%);mask-image:radial-gradient(closest-side,#000 64%,transparent 100%);clip-path:inset(0 0 100% 0)}
#spleW img,#splw img{display:block;width:100%}
#spledge{position:absolute;left:0;right:0;height:8%;top:0;background:linear-gradient(transparent,rgba(255,255,255,.85),transparent);mix-blend-mode:screen;opacity:0}
#splw{width:min(60vmin,540px);margin-top:-5vmin;-webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);clip-path:inset(0 100% 0 0);filter:blur(8px)}
#splk{margin-top:-1.2vmin;text-align:center;opacity:0;letter-spacing:.42em;font-size:max(10px,1.5vmin);color:#9aa;text-transform:uppercase}
#splk b{display:block;margin-top:1vmin;letter-spacing:.3em;font-size:max(12px,2vmin);background:linear-gradient(90deg,#38bdf8,#3b82f6,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent}
#splt{position:absolute;left:3vmin;bottom:5vmin;font:max(10px,1.45vmin)/1.7 Consolas,'Courier New',monospace;color:#7fe0ff;white-space:pre;text-shadow:0 0 6px rgba(80,200,255,.5)}
#splb{position:absolute;left:3vmin;right:3vmin;bottom:3vmin;height:2px;background:rgba(255,255,255,.08)}
#splb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#3b82f6,#ffb020);box-shadow:0 0 10px #3b82f6}
#spls{position:absolute;right:3vmin;top:3vmin;background:rgba(255,255,255,.07);color:#cde;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:12px}
#splh{position:absolute;left:0;right:0;bottom:12vmin;text-align:center;color:#ffd24a;font-size:14px;opacity:0;transition:opacity .4s}
#splo{position:absolute;right:3vmin;bottom:5vmin;color:#778;font-size:11px;cursor:pointer;user-select:none}

#splf{position:absolute;left:0;right:0;bottom:7.5vmin;display:flex;gap:9px;align-items:center;justify-content:center;opacity:0;color:#8a96a6;font-size:max(10px,1.4vmin);letter-spacing:.06em}#splf img{height:max(20px,3.4vmin);border-radius:5px}

function capAt(r,pe){const a=r.pe[0],b=r.pe[1];if(!r.cm||!r.cn||a==b||r.cm==r.cn)return r.cn||r.cm;return r.cm+(r.cn-r.cm)*cl((pe-a)/(b-a),0,1)}
function eva(r,Pin,Pt,Q,tol){if(Pin<r.pe[0]*.97||Pin>r.pe[1]*1.03)return null;let Po,er=0;if(r.adj&&Pt>=r.ps[0]&&Pt<=r.ps[1])Po=Pt;else{Po=r.ps[0];er=Math.abs(Po-Pt)/Pt;if(er>tol)return null}const cap=capAt(r,Pin),u=Q/cap;if(!cap||u>1)return null;return{r,Po,cap,u,er,sc:100-Math.abs(u-.6)*60-er*100+(r.adj?0:4)}}

  const wr=ease((t-2900)/800);wm.style.clipPath=`inset(0 ${(1-wr)*100}% 0 0)`;wm.style.filter=`blur(${(1-wr)*8}px)`;tag.style.opacity=ease((t-3500)/600);ft.style.opacity=ease((t-3900)/600);

 (function loop(now){if(done)return;const dt=Math.min(80,now-last);last=now;
