<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasSim Pro - Engineering Suite v7</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; }
        canvas { display: block; }
        
        .panel {
            position: absolute; background: rgba(15, 15, 20, 0.98);
            padding: 15px; border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid #00d2ff22;
            backdrop-filter: blur(15px); user-select: none; z-index: 10;
        }
        #ui-panel { top: 10px; left: 10px; width: 260px; }
        #props-panel { top: 10px; right: 10px; width: 260px; display: none; }
        #restore-ui { position: absolute; bottom: 20px; left: 20px; background: #00d2ff; color: #000; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; z-index: 100; }

        h3 { margin: 0 0 10px 0; font-size: 11px; color: #00d2ff; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        button { width: 100%; padding: 8px; margin: 3px 0; background: #2a2a30; color: #eee; border: 1px solid #444; cursor: pointer; transition: 0.3s; border-radius: 6px; font-size: 12px; }
        button:hover { background: #3a3a45; border-color: #00d2ff; }
        button.active { background: #00d2ff; color: #000; font-weight: bold; }
        button.save { background: #1b5e20; border: none; color: white; font-weight: bold; }
        
        label { font-size: 10px; color: #888; display: block; margin-top: 8px; text-transform: uppercase; font-weight: bold; }
        select, input { width: 100%; background: #15151a; color: #fff; border: 1px solid #333; padding: 6px; margin-top: 4px; border-radius: 4px; box-sizing: border-box; font-size: 13px; }

        .label-node { pointer-events: none; text-align: center; font-family: monospace; transition: opacity 0.3s; }
        .label-tag { color: #00d2ff; background: rgba(0,0,0,0.9); padding: 2px 6px; border: 1px solid #00d2ff66; border-radius: 4px; display: block; font-size: 12px; }
        .label-len { color: #f1c40f; font-weight: bold; display: block; margin-top: 2px; font-size: 11px; }

        .hidden { display: none !important; }
        .instr { font-size: 10px; color: #555; margin-top: 10px; line-height: 1.4; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <button id="restore-ui" onclick="toggleUI(true)">👁 MOSTRAR INTERFAZ</button>

    <div id="ui-panel" class="panel">
        <h3>Proyecto / CAD</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
            <button class="save" onclick="exportJSON()">💾 Guardar</button>
            <button class="save" onclick="document.getElementById('importFile').click()">📂 Abrir</button>
        </div>
        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
        <button onclick="exportPDF()">📄 Exportar PDF</button>
        <button onclick="undo()">↩ Deshacer</button>

        <h3>Insertar</h3>
        <button onclick="addElement('pipe')">➕ Tubería de Gas</button>
        <button id="btn-insert-valve" onclick="modeInsertValve()">📍 Insertar en Tubo</button>
        <button onclick="addElement('valve')">⧓ Válvula Libre</button>
        
        <h3>Visibilidad Global</h3>
        <label><input type="checkbox" checked onchange="toggleGrid(this.checked)"> Ver Rejilla</label>
        <label><input type="checkbox" id="global-labels-toggle" checked onchange="toggleAllLabels(this.checked)"> Ver Todas las Etiquetas</label>
        
        <button onclick="toggleUI(false)" style="margin-top:10px; opacity:0.6;">Ocultar Todo (H)</button>
        <div class="instr">
            <b>Suprimir:</b> Eliminar seleccionados<br>
            <b>Shift + Click:</b> Selección múltiple<br>
            <b>Esc:</b> Cancelar inserción
        </div>
    </div>

    <div id="props-panel" class="panel">
        <h3>Propiedades (<span id="select-count">0</span>)</h3>
        
        <div style="background: rgba(0,210,255,0.1); padding: 10px; border-radius: 5px; margin-bottom: 10px;">
            <label style="color:#00d2ff; cursor:pointer;">
                <input type="checkbox" id="prop-show-label" onchange="updateProperties()"> ETIQUETA INDIVIDUAL
            </label>
        </div>

        <div id="valve-state-box" style="display:none; background: rgba(241, 196, 15, 0.1); padding: 10px; border-radius: 5px; margin-bottom: 10px;">
            <label style="color:#f1c40f; cursor:pointer;">
                <input type="checkbox" id="prop-valve-open" onchange="updateProperties()"> VÁLVULA ABIERTA
            </label>
        </div>
        
        <label>TAG / ID:</label>
        <input type="text" id="prop-id" oninput="updateProperties()">
        
        <label id="label-len-prop">Longitud (m):</label>
        <input type="number" id="prop-len" step="0.1" oninput="updateProperties()">
        
        <label>Diámetro (pulg):</label>
        <select id="prop-diam" onchange="updateProperties()">
            <option value="0.2">1/2"</option>
            <option value="0.35">3/4"</option>
            <option value="0.5">1"</option>
            <option value="0.8">2"</option>
        </select>
        
        <label>Rotar 90°:</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px;">
            <button onclick="rotateSelected('x')">X</button>
            <button onclick="rotateSelected('y')">Y</button>
            <button onclick="rotateSelected('z')">Z</button>
        </div>
        
        <button style="background:#a00; border:none; margin-top:15px; font-weight:bold;" onclick="deleteSelected()">ELIMINAR (Supr)</button>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DragControls } from 'three/addons/controls/DragControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        let scene, camera, renderer, labelRenderer, controls, dragControls, grid;
        let elements = [];
        let selectedObjects = [];
        let fittings = [];
        let history = [];
        let isInsertingValve = false;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            const aspect = window.innerWidth / window.innerHeight;
            const d = 15;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(25, 25, 25);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            document.body.appendChild(labelRenderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 30, 20);
            scene.add(light);

            grid = new THREE.GridHelper(60, 60, 0x222222, 0x111111);
            scene.add(grid);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
            controls.enableDamping = true;

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);

            loadFromCache();
            animate();
        }

        // --- MODELADO DE VÁLVULA UNIFICADA ---
        function createGasValve(diam, isOpen = true) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x95a5a6 });
            const handleMat = new THREE.MeshPhongMaterial({ color: 0xf1c40f });

            // Cuerpo
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(diam * 1.6, 16, 16), bodyMat);
            const coneGeo = new THREE.ConeGeometry(diam * 1.5, 0.8, 16);
            const c1 = new THREE.Mesh(coneGeo, bodyMat);
            const c2 = new THREE.Mesh(coneGeo, bodyMat);
            c1.position.y = 0.4;
            c2.position.y = -0.4;
            c2.rotation.x = Math.PI;

            // Maneral
            const handleGroup = new THREE.Group();
            handleGroup.name = "HANDLE_GEOM";
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(diam*0.4, diam*0.4, 0.5), bodyMat);
            stem.rotation.z = Math.PI/2;
            stem.position.set(diam*1.2, 0, 0);
            const lever = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.3), handleMat);
            lever.position.set(diam*1.5, 0.6, 0);
            handleGroup.add(stem, lever);
            handleGroup.rotation.y = isOpen ? 0 : Math.PI / 2;

            group.add(c1, c2, sphere, handleGroup);
            
            // Importante: Marcar hijos como no seleccionables individualmente por DragControls
            group.traverse(child => { child.userData.isValvePart = true; });
            
            return group;
        }

        function syncLabel(obj) {
            let labelObj = obj.getObjectByName("UID_LABEL");
            if (!labelObj) {
                const div = document.createElement('div');
                div.className = 'label-node';
                div.innerHTML = `<span class="label-tag"></span><span class="label-len"></span>`;
                labelObj = new CSS2DObject(div);
                labelObj.name = "UID_LABEL";
                obj.add(labelObj);
            }
            labelObj.element.querySelector('.label-tag').textContent = obj.userData.id;
            labelObj.element.querySelector('.label-len').textContent = (obj.userData.type === 'pipe' ? obj.userData.length + "m" : "");
            labelObj.position.set(0, (obj.userData.length || 1) / 2 + 0.6, 0);
            
            const globalShow = document.getElementById('global-labels-toggle').checked;
            labelObj.visible = obj.userData.showLabel && globalShow;
            labelObj.element.style.opacity = (obj.userData.showLabel && globalShow) ? "1" : "0";
        }

        window.toggleAllLabels = function(show) {
            elements.forEach(el => syncLabel(el));
        }

        window.addElement = function(type) {
            const data = {
                type: type,
                id: (type === 'pipe' ? 'TUB-' : 'VAL-') + Math.floor(Math.random()*999),
                diameter: 0.35,
                length: type === 'pipe' ? 4 : 1,
                showLabel: true,
                isOpen: true
            };
            createObject(data, new THREE.Vector3(0,2,0), new THREE.Euler());
            saveState();
        }

        function createObject(data, pos, rot) {
            let mesh;
            if (data.type === 'pipe') {
                const geo = new THREE.CylinderGeometry(data.diameter, data.diameter, data.length, 32);
                mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: 0x7f8c8d }));
            } else {
                mesh = createGasValve(data.diameter, data.isOpen);
            }
            mesh.userData = data;
            mesh.position.copy(pos);
            mesh.rotation.copy(rot);
            scene.add(mesh);
            elements.push(mesh);
            syncLabel(mesh);
            refreshDragControls();
            processJunctions();
            return mesh;
        }

        function onKeyDown(e) {
            if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
            if (e.key.toLowerCase() === 'h') toggleUI();
            if (e.key === 'Escape') cancelInsertion();
        }

        function onPointerDown(e) {
            if (e.button !== 0) return;
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            if (isInsertingValve) {
                const intersects = raycaster.intersectObjects(elements.filter(el => el.userData.type === 'pipe'));
                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    const pipe = intersect.object;
                    const data = {
                        type: 'valve', id: 'VAL-' + Math.floor(Math.random()*999),
                        diameter: pipe.userData.diameter, length: 1, showLabel: true, isOpen: true
                    };
                    createObject(data, intersect.point, pipe.rotation.clone());
                    saveState();
                    cancelInsertion();
                }
                return;
            }

            const intersects = raycaster.intersectObjects(elements, true);
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                // Si golpeamos parte de una válvula, subimos al grupo raíz
                while(obj.parent && obj.parent.type !== 'Scene') obj = obj.parent;
                e.shiftKey ? toggleSelection(obj) : selectSingle(obj);
            } else if (!e.shiftKey) clearSelection();
        }

        window.modeInsertValve = function() {
            isInsertingValve = true;
            document.getElementById('btn-insert-valve').classList.add('active');
            renderer.domElement.style.cursor = 'crosshair';
        }

        function cancelInsertion() {
            isInsertingValve = false;
            document.getElementById('btn-insert-valve').classList.remove('active');
            renderer.domElement.style.cursor = 'default';
        }

        window.updateProperties = function() {
            const newId = document.getElementById('prop-id').value;
            const newLen = parseFloat(document.getElementById('prop-len').value) || 0.1;
            const newDiam = parseFloat(document.getElementById('prop-diam').value);
            const showL = document.getElementById('prop-show-label').checked;
            const isOpen = document.getElementById('prop-valve-open').checked;

            selectedObjects.forEach(obj => {
                obj.userData.id = newId;
                obj.userData.length = newLen;
                obj.userData.diameter = newDiam;
                obj.userData.showLabel = showL;
                obj.userData.isOpen = isOpen;

                if (obj.userData.type === 'pipe') {
                    obj.geometry.dispose();
                    obj.geometry = new THREE.CylinderGeometry(newDiam, newDiam, newLen, 32);
                } else {
                    const handle = obj.getObjectByName("HANDLE_GEOM");
                    if (handle) handle.rotation.y = isOpen ? 0 : Math.PI / 2;
                }
                syncLabel(obj);
            });
            processJunctions();
            saveState();
        }

        function updateUI() {
            const panel = document.getElementById('props-panel');
            if (selectedObjects.length === 0) { panel.style.display = 'none'; return; }
            panel.style.display = 'block';
            document.getElementById('select-count').innerText = selectedObjects.length;
            
            const obj = selectedObjects[0];
            document.getElementById('prop-id').value = obj.userData.id;
            document.getElementById('prop-len').value = obj.userData.length;
            document.getElementById('prop-diam').value = obj.userData.diameter;
            document.getElementById('prop-show-label').checked = obj.userData.showLabel;

            const isPipe = obj.userData.type === 'pipe';
            document.getElementById('prop-len').style.display = isPipe ? 'block' : 'none';
            document.getElementById('label-len-prop').style.display = isPipe ? 'block' : 'none';

            const valveBox = document.getElementById('valve-state-box');
            if (obj.userData.type === 'valve') {
                valveBox.style.display = 'block';
                document.getElementById('prop-valve-open').checked = obj.userData.isOpen;
            } else {
                valveBox.style.display = 'none';
            }
        }

        function refreshDragControls() {
            if (dragControls) dragControls.dispose();
            // Pasamos solo los objetos raíz (pipes y groups de válvulas)
            dragControls = new DragControls(elements, camera, renderer.domElement);
            
            dragControls.addEventListener('dragstart', (e) => {
                controls.enabled = false;
                if (!selectedObjects.includes(e.object)) selectSingle(e.object);
                e.object.userData.oldPos = e.object.position.clone();
            });
            dragControls.addEventListener('drag', (e) => {
                const offset = e.object.position.clone().sub(e.object.userData.oldPos);
                selectedObjects.forEach(obj => { if (obj !== e.object) obj.position.add(offset); });
                e.object.userData.oldPos.copy(e.object.position);
                processJunctions();
            });
            dragControls.addEventListener('dragend', () => { controls.enabled = true; saveState(); });
        }

        function selectSingle(obj) { clearSelection(); addToSelection(obj); }
        function addToSelection(obj) {
            if (!selectedObjects.includes(obj)) {
                selectedObjects.push(obj);
                obj.traverse(c => { if(c.isMesh) {
                    c.userData.oldEmissive = c.material.emissive.getHex();
                    c.material.emissive.setHex(0x333333); 
                }});
            }
            updateUI();
        }
        function clearSelection() {
            selectedObjects.forEach(obj => obj.traverse(c => { if(c.isMesh) c.material.emissive.setHex(c.userData.oldEmissive || 0); }));
            selectedObjects = [];
            updateUI();
        }
        function toggleSelection(obj) { selectedObjects.includes(obj) ? removeFromSelection(obj) : addToSelection(obj); }
        function removeFromSelection(obj) {
            selectedObjects = selectedObjects.filter(o => o !== obj);
            obj.traverse(c => { if(c.isMesh) c.material.emissive.setHex(0); });
            updateUI();
        }

        window.deleteSelected = function() {
            if (selectedObjects.length === 0) return;
            selectedObjects.forEach(obj => {
                scene.remove(obj);
                // Si tiene etiqueta CSS2D, el CSS2DRenderer la manejará si el objeto es removido del grafo
                elements = elements.filter(el => el !== obj);
            });
            clearSelection();
            processJunctions();
            saveState();
        }

        function processJunctions() {
            fittings.forEach(f => scene.remove(f));
            fittings = [];
            const points = [];
            elements.forEach(el => {
                el.updateMatrixWorld();
                const h = el.userData.length / 2;
                const v1 = new THREE.Vector3(0, h, 0).applyMatrix4(el.matrixWorld);
                const v2 = new THREE.Vector3(0, -h, 0).applyMatrix4(el.matrixWorld);
                points.push({ pos: v1, el: el }, { pos: v2, el: el });
            });
            const clusters = [];
            points.forEach(pt => {
                let found = clusters.find(c => c.pos.distanceTo(pt.pos) < 0.8);
                if (found) {
                    found.els.push(pt.el);
                    pt.el.position.add(new THREE.Vector3().subVectors(found.pos, pt.pos));
                } else clusters.push({ pos: pt.pos.clone(), els: [pt.el] });
            });
            clusters.forEach(c => {
                if (c.els.length > 1) {
                    const diam = c.els[0].userData.diameter;
                    const fit = new THREE.Mesh(new THREE.SphereGeometry(diam * 1.1, 12, 12),
                        new THREE.MeshPhongMaterial({ color: c.els.length > 2 ? 0x00d2ff : 0x7f8c8d }));
                    fit.position.copy(c.pos);
                    scene.add(fit);
                    fittings.push(fit);
                }
            });
        }

        window.rotateSelected = function(axis) {
            const a = Math.PI/2;
            selectedObjects.forEach(obj => { obj.rotation[axis] += a; });
            processJunctions(); saveState();
        }

        window.exportJSON = function() {
            const data = elements.map(el => ({
                type: el.userData.type, id: el.userData.id, pos: el.position,
                rot: { x: el.rotation.x, y: el.rotation.y, z: el.rotation.z },
                diameter: el.userData.diameter, length: el.userData.length, showLabel: el.userData.showLabel, isOpen: el.userData.isOpen
            }));
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `GasSim_Export.json`;
            link.click();
        }

        window.importJSON = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = JSON.parse(e.target.result);
                elements.forEach(el => scene.remove(el));
                elements = [];
                data.forEach(d => createObject(d, d.pos, new THREE.Euler(d.rot.x, d.rot.y, d.rot.z)));
                saveState();
            };
            reader.readAsText(file);
        }

        function saveState() {
            const data = elements.map(el => ({
                type: el.userData.type, id: el.userData.id, pos: el.position,
                rot: { x: el.rotation.x, y: el.rotation.y, z: el.rotation.z },
                diameter: el.userData.diameter, length: el.userData.length, showLabel: el.userData.showLabel, isOpen: el.userData.isOpen
            }));
            localStorage.setItem('gassim_v7_cache', JSON.stringify(data));
            history.push(JSON.stringify(data));
            if (history.length > 20) history.shift();
        }

        function loadFromCache() {
            const cache = localStorage.getItem('gassim_v7_cache');
            if (cache) {
                const data = JSON.parse(cache);
                data.forEach(d => createObject(d, d.pos, new THREE.Euler(d.rot.x, d.rot.y, d.rot.z)));
            }
        }

        window.undo = function() {
            if (history.length < 2) return;
            history.pop();
            const prev = JSON.parse(history[history.length - 1]);
            elements.forEach(el => scene.remove(el));
            elements = [];
            prev.forEach(d => createObject(d, d.pos, new THREE.Euler(d.rot.x, d.rot.y, d.rot.z)));
        }

        window.exportPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4');
            renderer.render(scene, camera);
            doc.setFillColor(15, 15, 20); doc.rect(0, 0, 297, 210, 'F');
            doc.addImage(renderer.domElement.toDataURL('image/png'), 'PNG', 10, 10, 277, 150);
            doc.setTextColor(0, 210, 255); doc.text("PLANO GAS-SIM PRO v7", 15, 175);
            doc.save('Plano_GasSim.pdf');
        }

        window.toggleUI = (show) => {
            const isShowing = show !== undefined ? show : document.getElementById('ui-panel').classList.contains('hidden');
            document.getElementById('ui-panel').classList.toggle('hidden', !isShowing);
            if (selectedObjects.length > 0) document.getElementById('props-panel').classList.toggle('hidden', !isShowing);
            document.getElementById('restore-ui').style.display = isShowing ? 'none' : 'block';
        }
        window.toggleGrid = (v) => grid.visible = v;

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 15;
            camera.left = -d * aspect; camera.right = d * aspect; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
    </script>
</body>
</html>
