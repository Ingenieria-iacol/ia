<script>
/* =====================================================================
   GasLP_Liquido · HERRAMIENTAS: tiempos, margen de error y factor de seguridad,
   librería de ecuaciones, auditor y alerta de contraflujo.
   Todas se abren en ventanas flotantes (FW) y leen el estado por GLPX.
   ===================================================================== */
(()=>{
const X=window.GLPX,$=id=>document.getElementById(id),{TYPES,BAR,PSI,G}=GLP,E=X.E,nf=X.nf;
const closeMenus=()=>document.querySelectorAll('details.mn[open]').forEach(d=>d.open=false);
const tg=n=>n.tag||n.id,isV=n=>(TYPES[n.type]||{}).ves,isC=n=>(TYPES[n.type]||{}).con;
const goBtn=(id,txt)=>`<button data-go="${E(id)}" title="Ir al elemento en el dibujo">${E(txt)} ➜</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('.fw [data-go]');if(b)X.select(b.dataset.go);});
const tbl=(hd,rows)=>`<div class="tw"><table>${hd?`<tr>${hd.map(h=>`<th${/^[#\d]|\(/.test(h)&&0?' class="n"':''}>${h}</th>`).join('')}</tr>`:''}${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ---------- simulación de respaldo: se calcula una vez por modelo cuando una herramienta la necesita ---------- */
let SIMK='';
function ensureSim(){const M=X.M,R=X.R;if(!R||!R.conv)return null;if(X.SIM&&!X.SIM.err)return X.SIM;
 if(!M.nodes.some(n=>isV(n)&&GLP.vgeo(n)))return null;
 try{const s=GLP.simulate(M,R,X.SIMOPT);if(s.err)return null;X.SIM=s;return s;}catch(e){console.error(e);return null;}}

/* =====================================================================
   COMPORTAMIENTO EN EL TIEMPO
   ===================================================================== */
function tiempos(){const M=X.M,R=X.R;if(!R||!R.conv)return null;const S=ensureSim(),rho=R.pr.rho,kT=GLP.FS(M,'t'),out={S,kT,tk:[],pu:[],co:[],hitos:[]};
 const dem=M.nodes.reduce((a,n)=>a+(isC(n)?(+n.q||0)*GLP.FS(M,'q'):0),0);out.dem=dem;
 if(S){const n=S.t.length,te=S.t[n-1];out.te=te;out.stop=S.stop;
  S.ves.forEach(v=>{const nd=X.node(v.id),g=GLP.vgeo(nd),f0=v.f[0],f1=v.f[n-1],lleno=f1>=(+nd.fmax||85)-.3&&f1>f0,vacio=f1<=(+nd.fmin||0)+.3&&f1<f0;
   /* instante en que cruza cada hito de llenado */
   const cruza=p=>{for(let i=1;i<n;i++){if((v.f[i-1]-p)*(v.f[i]-p)<=0&&v.f[i]!=v.f[i-1])return S.t[i-1]+(p-v.f[i-1])/(v.f[i]-v.f[i-1])*(S.t[i]-S.t[i-1]);}return null;};
   out.tk.push({id:v.id,tag:v.tag,cap:g.V,f0,f1,kg:v.kg,q0:v.kgh[0],q1:v.kgh[Math.max(n-2,0)],P0:v.P[0],P1:v.P[n-1],Pmax:Math.max(...v.P),T0:v.T[0],T1:v.T[n-1],niv0:v.niv[0],niv1:v.niv[n-1],
    estado:lleno?'lleno':vacio?'mínimo':f1>f0+.05?'llenando':f1<f0-.05?'vaciando':'sin cambio',tFin:lleno||vacio?te:null,h25:cruza(25),h50:cruza(50),h75:cruza(75),hmax:f1>f0?cruza(+nd.fmax||85):null,
    tEst:Math.abs(v.kgh[0])>1e-6?(v.kgh[0]>0?((+nd.fmax||85)-f0):(f0-(+nd.fmin||0)))/100*g.V*rho/(Math.abs(v.kgh[0])/3600):null});});
  S.pumps.forEach(p=>{const nd=X.node(p.id);let en=0,vol=0,kmin=0,dtm=0;for(let i=0;i<n-1;i++){const dt=S.t[i+1]-S.t[i],r=S.R[i].pumps.find(q=>q.id==p.id);if(r){en+=r.Pe*dt;vol+=r.Q*dt;if(r.m>1e-7)dtm+=dt;}if(p.npsh[i]<p.npsh[kmin])kmin=i;}
   const ok=p.Q.filter(Number.isFinite);out.pu.push({id:p.id,tag:p.tag,Q0:p.Q[0],Q1:p.Q[n-1],Qmin:Math.min(...ok),Qmax:Math.max(...ok),dP0:p.dP[0],dP1:p.dP[n-1],dPmax:Math.max(...p.dP),npsh0:p.npsh[0],npshMin:p.npsh[kmin],tNpsh:S.t[kmin],
    need:GLP.npshNeed(M,nd.npshr),kWh:en/3.6e6,vol,marcha:dtm,dT:S.R[0].pumps.find(q=>q.id==p.id)?S.R[0].pumps.find(q=>q.id==p.id).dT:0});});
  M.nodes.filter(isC).forEach(c=>{const P=S.R.map(r=>r.nodes.get(c.id)).filter(Boolean);if(!P.length)return;let k=0;P.forEach((x,i)=>{if(x.P<P[k].P)k=i;});
   out.co.push({id:c.id,tag:tg(c),tipo:TYPES[c.type].n,q:(+c.q||0)*GLP.FS(M,'q'),P0:P[0].P,P1:P[P.length-1].P,Pmin:P[k].P,tPmin:S.t[k],mMin:Math.min(...P.map(x=>x.marg)),T0:P[0].T,T1:P[P.length-1].T});});
  /* tabla de tiempo: unas 9 filas repartidas */
  const m=Math.min(9,n);for(let j=0;j<m;j++){const i=Math.round(j*(n-1)/Math.max(m-1,1));out.hitos.push({t:S.t[i],f:S.ves.map(v=>v.f[i]),P:S.ves.map(v=>v.P[i]),Q:S.pumps.map(p=>p.Q[i]),dP:S.pumps.map(p=>p.dP[i]),np:S.pumps.map(p=>p.npsh[i])});}
 }else{R.pumps.forEach(p=>out.pu.push({id:p.id,tag:p.tag,Q0:p.Q*60000,Q1:p.Q*60000,Qmin:p.Q*60000,Qmax:p.Q*60000,dP0:p.dP/BAR,dP1:p.dP/BAR,dPmax:p.dP/BAR,npsh0:p.NPSHa,npshMin:p.NPSHa,tNpsh:0,need:GLP.npshNeed(M,p.npshr),kWh:null,kW:p.Pe/1000,dT:p.dT,fijo:1}));
  M.nodes.filter(isC).forEach(c=>{const x=R.nodes.get(c.id);if(x)out.co.push({id:c.id,tag:tg(c),tipo:TYPES[c.type].n,q:(+c.q||0)*GLP.FS(M,'q'),P0:x.P,P1:x.P,Pmin:x.P,tPmin:0,mMin:x.marg,T0:x.T,T1:x.T,fijo:1});});}
 /* autonomía: contenido útil de los tanques que alimentan los consumos, dividido por la demanda */
 if(dem>0){let util=0,sin=false;M.nodes.filter(isV).forEach(n=>{const r=R.nodes.get(n.id);if(!r||!(r.sale>1e-7))return;const g=GLP.vgeo(n);if(!g){sin=true;return;}util+=Math.max((+n.fill||0)-(+n.fmin||0),0)/100*g.V*rho;});
  out.aut=sin||!util?null:util/(dem/3600);out.util=util;}
 return out;}
function tiemposHTML(){const M=X.M,R=X.R,D=tiempos();if(!D)return'<p class="hint">La red no tiene solución todavía: corrige primero las verificaciones.</p>';const S=D.S,k=D.kT,kx=k>1?` <span class="pill sim">× ${nf(k,2)} FS</span>`:'',tf=t=>t==null?'—':X.tfmt(t*k);
 let h=`<p class="hint" style="margin:0 0 10px">${S?`Resultado de simular el proceso completo con el modelo actual: <b style="color:var(--tx)">${X.tfmt(D.te)}</b> ${D.stop?'· Fin: '+E(D.stop):'(tiempo máximo de la simulación).'}`:'Ningún tanque tiene capacidad definida: los tanques se tratan como depósitos de nivel constante y nada cambia con el tiempo. Escribe la «Capacidad» de los tanques para ver su evolución.'}${k>1?` Los tiempos se muestran multiplicados por el factor de seguridad ${nf(k,2)}.`:''}</p>`;
 if(D.tk.length)h+=`<h3>Tanques</h3>`+tbl(['Tanque','Llenado','Cantidad','25 %','50 %','75 %','Llenado máx.','Presión','Temperatura','Al caudal inicial'],D.tk.map(t=>[goBtn(t.id,t.tag),`${nf(t.f0,0)} % → ${nf(t.f1,0)} %<br><small>${t.estado}</small>`,(t.kg>=0?'+':'−')+X.fV(Math.abs(t.kg)/R.pr.rho)+'<br><small>'+nf(Math.abs(t.kg),0)+' kg</small>',tf(t.h25),tf(t.h50),tf(t.h75),t.hmax!=null?'<b>'+tf(t.hmax)+'</b>':'no llega',`${X.fPg(t.P0*BAR)} → ${X.fPg(t.P1*BAR)}`,`${nf(X.cT(t.T0),1)} → ${X.fT(t.T1)}`,t.tEst!=null?tf(t.tEst):'—']))+`<p class="hint">Las columnas 25 %, 50 %, 75 % y «Llenado máx.» son el instante en que el tanque cruza ese nivel. «Al caudal inicial» es la estimación simple sin considerar que el caudal cambia.</p>`;

function margen(){const M=X.M,R=X.R;if(!R||!R.conv)return[];const pr=R.pr,rows=[],pm=(v,p,f,d)=>`${f(v)} <small>(${f(v*(1-p))} a ${f(v*(1+p))})</small>`;
 const A=(mag,val,pct,src)=>rows.push([mag,val,pct,src]);
 A('Presión de saturación',X.fPa(pr.Pb)+` <small>(${X.fPa(pr.Pb*.995)} a ${X.fPa(pr.Pb*1.005)})</small>`,'± 0,5 %','Ecuación de Wagner y ley de Raoult frente a tablas de referencia; la composición real del GLP puede variar más que eso.');
 A('Densidad del líquido',`${nf(pr.rho,1)} kg/m³ <small>(${nf(pr.rho*.995,1)} a ${nf(pr.rho*1.005,1)})</small>`,'± 0,5 %','Ecuación de Rackett. Afecta por igual a la conversión kg ↔ galones.');
 A('Viscosidad',`${nf(pr.mu*1e3,3)} mPa·s`,'± 3 %','Ajuste de Andrade. Influye poco: en régimen turbulento la fricción casi no depende de ella.');
 const big=[...R.pipes.values()].filter(x=>Math.abs(x.m)>1e-7).sort((a,b)=>b.dPf-a.dPf)[0];
 if(big){A('Pérdida por fricción (tramo mayor)',pm(big.dPf,.10,v=>X.fdP(v,3)),'± 10 %','Factor de Colebrook (± 5 %) y rugosidad real del tubo, que cambia con el uso.');
  A('Pérdida en accesorios (tramo mayor)',pm(big.dPm,.25,v=>X.fdP(v,3)),'± 25 %','Coeficientes K de tablas; los marcados «típico» pueden diferir más del equipo real.');
  A('Velocidad en tubería',pm(big.v,.05,v=>X.fVl(v)),'± 5 %','Sigue al caudal y al diámetro interior real (tolerancia de fabricación).');}
 R.pumps.forEach(p=>{if(!(p.m>1e-7))return;const nd=X.node(p.id);A(`${p.tag}: caudal`,pm(p.m,nd.modo=='curva'?.07:.05,v=>X.fQ(v,X.qv())),nd.modo=='curva'?'± 7 %':'± 5 %','Curva de bomba aproximada por dos puntos y pérdidas de la red.');
  A(`${p.tag}: diferencial`,pm(p.dP,.05,v=>X.fdP(v)),'± 5 %','Curva de bomba y pérdidas de la descarga.');
  const hs=[...R.pipes].filter(([id])=>R.T.suc.get(p.id)&&R.T.suc.get(p.id).has(id)).reduce((a,[,x])=>a+(x.dPf+x.dPm),0)/(pr.rho*G),e=.15*hs+.03;
  A(`${p.tag}: NPSH disponible`,`${X.fL(p.NPSHa)} <small>(${X.fL(p.NPSHa-e)} a ${X.fL(p.NPSHa+e)})</small>`,'± '+X.fL(e),'Pérdidas de succión (± 15 %) y nivel real de líquido en el tanque. Es la magnitud más sensible: usa el nivel mínimo.');});
 const S=X.SIM&&!X.SIM.err?X.SIM:null;if(S){const te=S.t[S.t.length-1];A('Tiempo de llenado o vaciado',`${X.tfmt(te)} <small>(${X.tfmt(te*.9)} a ${X.tfmt(te*1.1)})</small>`,'± 10 %','Caudal de bomba, densidad y geometría del tanque (cilindro sin casquetes: hasta 3 % en volumen).');
  if(X.M.nodes.some(n=>isV(n)&&n.vap=='sin'))A('Presión final del receptor sin retorno de vapor','depende de la hipótesis','no acotado','Fracción de vapor que condensa: es un supuesto. Calibrarlo con un llenado real.');}
 if(R.surge){A('Golpe de ariete',pm(R.surge.dP,.12,v=>X.fdP(v,1)),'± 12 %','Velocidad del sonido en el líquido estimada (± 8 %) y tiempo real de cierre.');A('Líquido atrapado',X.fPT(R.term.dPdT),'± 15 %','Compresibilidad del líquido estimada a partir de la velocidad del sonido.');}
 A('Temperatura de tanques en la simulación','—','± 1 °C','Tanque bien mezclado a una sola temperatura; coeficiente U con el ambiente dado por el usuario.');
 return rows;}

function ecuHTML(q){const c=ctxEcu(),f=(q||'').toLowerCase();if(!c.R)return'<p class="hint">La red no tiene solución todavía.</p>';let n=0;
 const h=LIB.map(([g,L])=>{const it=L.filter(e=>!f||(e.n+e.ap+e.f+e.ref).toLowerCase().includes(f));if(!it.length)return'';
  return`<h3>${g}</h3>`+it.map(e=>{n++;let val='';try{val=e.c?e.c(c):'';}catch(x){val='';}
   return`<div class="ecu"><div class="en"><b>${e.n}</b><span>${e.ap}</span></div><div class="ef">${e.f}</div>${e.v?`<div class="ev">${e.v}</div>`:''}${val?`<div class="ec"><span>Con los valores del modelo</span>${val}</div>`:''}<div class="er">Referencia: ${e.ref}</div></div>`;}).join('');}).join('');
 return`<p class="hint" style="margin:0 0 8px">Todas las ecuaciones que usa el módulo, con los valores del modelo sustituidos. Las de tubería, bomba y tanque usan el elemento seleccionado en el dibujo${c.p?` (ahora: tubería ${E(c.p)}${c.pu?', bomba '+E(c.pu.tag):''}${c.tk?', tanque '+E(tg(c.tk)):''})`:''}; si no hay selección, el tramo de mayor velocidad.</p>`+(h||'<p class="hint">Sin coincidencias.</p>');}

const RES={ok:['Cumple','ok'],bad:['No cumple','bad'],ver:['Verificar','warn'],na:['No aplica','']};
function aislables(){/* tramos que pueden quedar llenos de líquido entre válvulas de cierre */
 const M=X.M,cl=new Set(M.nodes.filter(n=>(TYPES[n.type]||{}).cierra).map(n=>n.id)),par=new Map(),find=i=>{while(par.get(i)!=i)i=par.get(i);return i;};
 const P=M.pipes.filter(p=>p.srv!='vap');P.forEach(p=>{par.set(p.id,p.id);});
 M.nodes.forEach(n=>{if(cl.has(n.id)||isV(n))return;const ps=P.filter(p=>p.a==n.id||p.b==n.id);for(let i=1;i<ps.length;i++)par.set(find(ps[i].id),find(ps[0].id));});
 const g=new Map();P.forEach(p=>{const k=find(p.id);if(!g.has(k))g.set(k,[]);g.get(k).push(p);});
 return[...g.values()].filter(ps=>{const nodes=new Set(ps.flatMap(p=>[p.a,p.b]));return![...nodes].some(id=>isV(X.node(id)))&&[...nodes].filter(id=>cl.has(id)).length>=2;}).map(ps=>ps.map(p=>p.id));}
function requisitos(){const M=X.M,R=X.R,c=M.crit,Q=[],bombas=M.nodes.filter(n=>n.type=='bomba'),ves=M.nodes.filter(isV),con=M.nodes.filter(isC),pipes=R&&R.conv?[...R.pipes]:[];
 const add=(g,ref,id,txt,ev)=>Q.push(Object.assign({g,ref,id,txt},ev));
 const vec=id=>M.pipes.filter(p=>p.srv!='vap'&&(p.a==id||p.b==id)).map(p=>X.node(p.a==id?p.b:p.a)).filter(Boolean);
 /* A · presiones y materiales */
 const G1='A · Presión de diseño y materiales',R1='NFPA 58 (tubería, accesorios y válvulas) · ASME B31.3';
 if(R){add(G1,R1,'A1','La tubería y los accesorios para líquido se diseñan para 250 psig como mínimo, y para 350 psig aguas abajo de una bomba.',(()=>{const min=(bombas.length?350:250)*PSI;return R.Pdis>=min-1?{r:'ok',ev:`Presión de diseño ${X.fPg(R.Pdis,1)} (mínimo ${X.fPg(min,1)}).`}:{r:'bad',ev:`Presión de diseño ${X.fPg(R.Pdis,1)}, menor que ${X.fPg(min,1)}.`,fx:'Sube la «Presión de diseño» en Proyecto ▸ Tubería y diseño mecánico, o déjala en automática.'};})());
  add(G1,R1,'A2','La presión máxima de operación (saturación a temperatura máxima más el diferencial máximo de la bomba) no supera la presión de diseño.',R.PopMax<=R.Pdis?{r:'ok',ev:`${X.fPg(R.PopMax,1)} frente a ${X.fPg(R.Pdis,1)}.`}:{r:'bad',ev:`${X.fPg(R.PopMax,1)} supera ${X.fPg(R.Pdis,1)}.`,fx:'Limita el diferencial de la bomba y el ajuste del by-pass, o sube la presión de diseño.'});
  if(R.mat.acero)add(G1,'ASME B31.3','A3','El espesor útil de la tubería (descontando tolerancia de fabricación, rosca y corrosión) es mayor que el requerido por presión.',(()=>{const b=R.mech.filter(q=>!q.ok);return!R.mech.length?{r:'na',ev:'Sin tuberías calculadas.'}:b.length?{r:'bad',ev:'No cumplen: '+b.map(q=>`Ø ${q.dn}"`).join(', ')+'.',fx:'Usa cédula 80 o unión soldada.'}:{r:'ok',ev:R.mech.map(q=>`Ø ${q.dn}": útil ${X.fS(q.td)} ≥ ${X.fS(q.tr)}`).join(' · ')};})());
  add(G1,R1,'A4','La tubería de acero con uniones roscadas para líquido es cédula 80; la cédula 40 se reserva para unión soldada.',!R.mat.acero?{r:'ver',ev:'Material: '+E(R.mat.n)+'. Confirma que la norma lo admite para líquido y su presión nominal.'}:M.mec.junta=='rosc'&&M.mec.mat=='a40'?{r:'bad',ev:'Unión roscada con cédula 40.',fx:'Cambia a cédula 80 o a unión soldada.'}:{r:'ok',ev:`${E(R.mat.n)} · unión ${M.mec.junta=='rosc'?'roscada':'soldada'}.`});}
 /* B · alivio hidrostático */
 const G2='B · Alivio hidrostático',R2='NFPA 58 (instalación de tubería de líquido)',ais=aislables();
 add(G2,R2,'B1','Cada tramo de tubería que pueda quedar lleno de líquido y aislado entre dos válvulas de cierre tiene una válvula de alivio hidrostático.',ais.length?{r:'ver',ev:`El dibujo tiene ${ais.length} tramo(s) aislable(s): ${ais.map(a=>a.join('+')).join(' · ')}. El módulo no dibuja alivios: confirma que cada uno tenga el suyo.`,refs:ais.map(a=>a[0]),fx:'Instala un alivio hidrostático en cada tramo listado.'}:{r:'na',ev:'No hay tramos que queden encerrados entre dos válvulas de cierre.'});
 add(G2,R2,'B2','El ajuste del alivio hidrostático está entre 400 y 500 psig (27,6 a 34,5 bar) para tubería de 350 psig.',(()=>{const p=+M.mec.Pali*BAR;return p>=399*PSI&&p<=501*PSI?{r:'ok',ev:`Ajuste ${X.fPg(p,1)}.`}:{r:'ver',ev:`Ajuste ${X.fPg(p,1)}, fuera del rango habitual.`,fx:'Usa un ajuste entre 400 y 500 psig salvo que el sistema esté diseñado para más presión.'};})());
 if(R&&R.term)add(G2,'Cálculo del módulo','B3','El calentamiento que lleva el líquido atrapado hasta el alivio es pequeño: el alivio es indispensable, no opcional.',{r:'ok',ev:`${X.fPT(R.term.dPdT)}; bastan ${X.fDT(R.term.dTali)}.`});
 /* C · bombas */

  add(G3,'Hydraulic Institute · fabricante','C1·'+nm,`${nm}: el NPSH disponible supera al requerido por la bomba más el margen de diseño.`,!p?{r:'ver',ev:'La bomba no está calculada (detenida o mal conectada).',refs:[b.id]}:!(+b.npshr>0)?{r:'ver',ev:'Falta el NPSH requerido del fabricante.',refs:[b.id],fx:'Escribe el NPSH requerido de la curva de la bomba.'}:p.NPSHa>=GLP.npshNeed(M,b.npshr)-1e-9?{r:'ok',ev:`${X.fL(p.NPSHa)} ≥ ${X.fL(GLP.npshNeed(M,b.npshr))}.`}:{r:'bad',ev:`${X.fL(p.NPSHa)} frente a ${X.fL(GLP.npshNeed(M,b.npshr))} requeridos.`,refs:[b.id],fx:'Baja la bomba o sube el tanque, acorta y agranda la succión, o usa una bomba de menor NPSH requerido.'});
  add(G3,R3,'C2·'+nm,`${nm}: tiene válvula de by-pass que devuelve el exceso al tanque de succión.`,M.nodes.some(n=>n.type=='bypass')?{r:'ok',ev:'Hay válvula de by-pass en la red: '+M.nodes.filter(n=>n.type=='bypass').map(tg).join(', ')+'.'}:{r:'bad',ev:'No hay válvula de by-pass.',refs:[b.id],fx:'Agrega una «Válvula de by-pass» entre la descarga y el tanque.'});
  const enSuc=t=>suc&&M.nodes.some(n=>n.type==t&&M.pipes.some(q=>suc.has(q.id)&&(q.a==n.id||q.b==n.id)));
  add(G3,R3,'C3·'+nm,`${nm}: tiene filtro en la succión.`,enSuc('filtro')?{r:'ok',ev:'Filtro en la línea de succión.'}:{r:'bad',ev:'No hay filtro entre el tanque y la bomba.',refs:[b.id],fx:'Coloca un «Filtro en Y» en la succión.'});
  add(G3,R3,'C4·'+nm,`${nm}: tiene válvula de retención en la descarga.`,M.nodes.some(n=>n.type=='reten'&&dsc&&M.pipes.some(q=>dsc.has(q.id)&&(q.a==n.id||q.b==n.id)))?{r:'ok',ev:'Retención en la descarga.'}:{r:'ver',ev:'No se encontró retención aguas abajo de la bomba.',refs:[b.id],fx:'Coloca una «Válvula de retención» a la salida de la bomba.'});
  if(p)add(G3,'Fabricante','C5·'+nm,`${nm}: trabaja dentro de su curva (con diferencial positivo y sin quedarse sin contrapresión).`,p.m<1e-7?{r:'bad',ev:'No entrega caudal.',refs:[b.id]}:p.dP<=0?{r:'bad',ev:'Fuera de curva.',refs:[b.id]}:b.modo=='curva'&&p.dP<.1*(+b.dP0||0)*BAR?{r:'ver',ev:`Entrega ${X.fQ(p.m,X.qv())} con solo ${X.fdP(p.dP)}.`,refs:[b.id],fx:'Confirma el caudal máximo con el fabricante.'}:{r:'ok',ev:`${X.fQ(p.m,X.qv())} a ${X.fdP(p.dP)}.`});});
 /* D · tuberías */
 const G4='D · Tuberías',R4='API RP 14E (velocidades) · criterios de diseño del proyecto';
 if(pipes.length){const hi=pipes.filter(([,x])=>x.v>(x.zona=='D'?+c.vD:+c.vS)+1e-9);

  const fr=pipes.filter(([,x])=>x.zona=='D'&&x.grad>c.grad*BAR+1e-6);add(G4,'Criterio de diseño','D2',`La fricción en descarga no supera ${X.fG(c.grad*BAR)}.`,fr.length?{r:'ver',ev:fr.map(([id,x])=>`${id} (${X.fG(x.grad)})`).join(', '),refs:fr.map(([id])=>id),fx:'Aumenta el diámetro de esos tramos.'}:{r:'ok',ev:'Todos los tramos de descarga cumplen.'});
  if(R.surge)add(G4,'Joukowsky','D3','La sobrepresión por cierre de válvulas, sumada a la de operación, no supera la presión de diseño.',R.surge.Pmax<=R.Pdis?{r:'ok',ev:`Pico ${X.fPg(R.surge.Pmax,1)} con cierre en ${R.surge.tc} s.`}:{r:R.surge.Pmax<=R.Pdis*1.33?'ver':'bad',ev:`Pico ${X.fPg(R.surge.Pmax,1)} frente a ${X.fPg(R.Pdis,1)}.`,fx:'Aumenta el tiempo de cierre o reduce la velocidad.'});}
 /* E · tanques */

 ves.forEach(t=>{const nm=tg(t),g=GLP.vgeo(t),vc=vec(t.id);

  add(G5,R5,'E2·'+nm,`${nm}: cada conexión de líquido tiene válvula de cierre junto al tanque.`,!vc.length?{r:'na',ev:'Sin conexiones.'}:vc.every(n=>(TYPES[n.type]||{}).cierra||n.type=='exceso')?{r:'ok',ev:'Primera pieza de cada conexión: '+vc.map(tg).join(', ')+'.'}:{r:'ver',ev:'Hay conexiones cuyo primer elemento no es una válvula de cierre.',refs:[t.id],fx:'Coloca una válvula de bola o una ESV junto a la boquilla.'});

 if(R)add(G5,'Operación','E4','No hay contraflujo entre tanques: ninguno entrega líquido a otro sin pasar por una bomba.',R.contra?{r:'bad',ev:`${R.contra.src.map(x=>x.tag).join(', ')} → ${R.contra.dst.map(x=>x.tag).join(', ')}.`,refs:R.contra.src.map(x=>x.id),fx:'Instala una válvula de retención en la entrada de cada tanque o cierra las válvulas de los tanques que no participan.'}:{r:'ok',ev:'Sin flujo de igualación entre tanques.'});

 con.forEach(k=>{const x=R&&R.nodes.get(k.id),nm=tg(k);if(!x)return;add(G6,'Criterio de diseño','F2·'+nm,`${nm}: recibe el producto en fase líquida, con presión por encima de la de burbuja.`,x.marg>=-1?{r:'ok',ev:`Margen ${X.fdP(x.marg)} · llega con ${X.fPa(x.P)}.`}:{r:'bad',ev:`Queda ${X.fdP(-x.marg,3)} por debajo de la presión de burbuja.`,refs:[k.id],fx:'Reduce pérdidas, evita subidas o presuriza con bomba.'});

 /* H · vaporizadores */
 const G8='H · Vaporizadores',R8='NFPA 58 (vaporizadores) · datos del fabricante',vz=M.nodes.filter(n=>n.type=='vaporizador');
 if(R)vz.forEach(n=>{const e=GLP.vapEval(M,R,n),nm=tg(n),vn=e.cat?`${e.nu>1?e.nu+' × ':''}${e.cat.marca} ${e.cat.modelo}`:'';

  if(e.cap)add(G8,'Criterio de diseño','H2·'+nm,`${nm}: la capacidad instalada cubre la demanda máxima${n.res&&e.nu>1?', aun con una unidad fuera de servicio':''}.`,e.q>e.capTot*1.0005?{r:'bad',ev:`${nf(e.q,0)} kg/h de demanda frente a ${nf(e.capTot,0)} kg/h.`,refs:[n.id],fx:'Elige un modelo mayor o agrega unidades en paralelo.'}:e.capRes!=null&&e.q>e.capRes*1.0005?{r:'ver',ev:`Con ${e.nu-1} unidad(es) quedan ${nf(e.capRes,0)} kg/h.`,refs:[n.id],fx:'Agrega una unidad o elige un modelo mayor.'}:{r:e.uso>.9?'ver':'ok',ev:`Uso ${nf(e.uso*100,0)} %.${e.uso>.9?' Menos de 10 % de holgura.':''}`,refs:[n.id]});
  add(G8,'Dato del fabricante','H3·'+nm,`${nm}: recibe líquido con la presión mínima de entrada que exige el fabricante.`,e.PminEff==null?{r:'ver',ev:`Llega con ${X.fPg(e.Pin)}; falta la presión mínima del fabricante.`,refs:[n.id],fx:'Escríbela en el catálogo o en «Presión mínima» del equipo.'}:e.Pin>=e.PminEff*BAR-1?{r:'ok',ev:`${X.fPg(e.Pin)} ≥ ${X.fPg(e.PminEff*BAR)}.`}:{r:'bad',ev:`${X.fPg(e.Pin)} frente a ${X.fPg(e.PminEff*BAR)}.`,refs:[n.id],fx:'Aumenta el diferencial de la bomba o reduce las pérdidas de la línea.'});
  add(G8,R8,'H4·'+nm,`${nm}: tiene protección contra arrastre de líquido, válvula de alivio y válvula de cierre en la entrada.`,{r:'ver',ev:'El dibujo no lo puede comprobar: confírmalo con la hoja de datos del equipo.',refs:[n.id]});
  if(e.gas)add(G8,R8,'H5·'+nm,`${nm}: al tener quemador, cumple las distancias mínimas a tanques, válvulas de alivio y puntos de trasiego.`,{r:'ver',ev:'Vaporizador con llama. Las distancias las fija la norma según el tipo y la capacidad.',refs:[n.id]});});
 /* G · calidad de los datos */
 const G7='G · Calidad de los datos',tip=M.nodes.filter(n=>{const t=TYPES[n.type]||{};return t.pas&&t.k!=null&&t.k>0&&(n.K===''||n.K==null);});
 add(G7,'Buenas prácticas','G1','Los coeficientes de pérdida de válvulas y filtros provienen del fabricante.',tip.length?{r:'ver',ev:tip.length+' equipo(s) usan valor típico: '+tip.map(tg).join(', ')+'.',refs:tip.map(n=>n.id),fx:'Escribe el K (o el equivalente al Cv) del fabricante.'}:{r:'ok',ev:'Sin coeficientes típicos.'});

 const na=new Set((M.aud&&M.aud.na)||[]);Q.forEach(q=>{if(na.has(q.id)){q.r0=q.r;q.r='na';q.man=1;}});return Q;}

 return`<p class="hint" style="margin:0 0 8px">Cada requisito se evalúa con el modelo actual. «Verificar» son puntos que el dibujo no permite comprobar por sí solo. Desmarca la casilla de un requisito para reportarlo como «No aplica». Las referencias indican la norma de origen; confirma el numeral y el texto en la edición vigente.</p>`+
 (gs.map(g=>`<div class="audg"><h3>${g}</h3>${L.filter(q=>q.g==g).map(q=>`<div class="dr ${RES[q.r][1]||'info'}" style="grid-template-columns:26px minmax(0,1.2fr) minmax(0,1fr)"><input type="checkbox" data-na="${E(q.id)}"${q.man?'':' checked'} title="Aplica a este proyecto" aria-label="Aplica">
   <div><span class="pill ${RES[q.r][1]}">${RES[q.r][0]}</span> <small style="color:var(--mu)">${E(q.ref)}</small><div style="margin-top:4px;color:var(--tx)">${q.txt}</div></div>
   <div><div class="dq">${q.ev||''}</div>${(q.refs||[]).slice(0,6).map(id=>goBtn(id,X.node(id)?tg(X.node(id)):id)).join(' ')}${q.fx?`<div class="df" style="margin-top:6px"><span>Corrección sugerida</span>${q.fx}</div>`:''}</div></div>`).join('')}</div>`).join('')||'<p class="hint">Ningún requisito coincide con el filtro.</p>');}

let CSIG='';
function contraHTML(k){const pres=x=>`${X.fPa(x.P)} en la boquilla · superficie del líquido a ${X.fL(x.sup)}${x.T!=null?' · '+X.fT(x.T):''}`,a=k.src[0],b=k.dst[0],porP=Math.abs(a.Pgas-b.Pgas)>2000,porN=Math.abs(a.sup-b.sup)>.02;
 return`<div class="ck warn" style="border:none;padding:0 0 8px"><i>!</i><b>${k.src.map(x=>E(x.tag)).join(', ')} ${k.src.length>1?'están entregando':'está entregando'} líquido a ${k.dst.map(x=>E(x.tag)).join(', ')} sin pasar por una bomba</b>
  <p>Los tanques están comunicados por la tubería y, como no tienen la misma presión, el líquido pasa del que tiene más al que tiene menos hasta igualarse. ${k.bomba?'La bomba sí está trabajando, pero parte del caudal se desvía hacia este intercambio.':'No hay ninguna bomba moviendo este caudal.'}</p></div>
 <h3>Qué está pasando</h3>${tbl(['','Tanque','Estado','Caudal'],[...k.src.map(x=>['Entrega',goBtn(x.id,x.tag),pres(x),X.fQ(x.m)+'<br><small>'+X.fQ(x.m,X.q2())+'</small>']),...k.dst.map(x=>['Recibe',goBtn(x.id,x.tag),pres(x),X.fQ(x.m)+'<br><small>'+X.fQ(x.m,X.q2())+'</small>'])])}
 <p><b>Causa.</b> ${porP?`La presión de la fase vapor es distinta (${X.fPa(a.Pgas)} frente a ${X.fPa(b.Pgas)}): los tanques están a distinta temperatura o uno se está comprimiendo al llenarse. `:''}${porN?`El nivel de líquido es distinto (superficie a ${X.fL(a.sup)} frente a ${X.fL(b.sup)}): cada metro de diferencia empuja con unos ${X.fdP(X.R.pr.rho*G,3)}. `:''}${!porP&&!porN?'La diferencia de presión entre boquillas es pequeña pero suficiente para mover líquido por una tubería de baja resistencia. ':''}</p>
 <h3>Cómo corregirlo</h3>
 <div class="df" style="margin-bottom:6px"><span>Corrección principal</span><b>Instala una válvula de retención (antirretorno) en la entrada de cada tanque</b>, orientada hacia el tanque. Así el líquido puede entrar desde el colector pero no devolverse hacia otros tanques. En el módulo: abre «Válvulas y equipos», elige «Válvula de retención» y haz clic sobre la tubería de entrada de cada tanque; se orienta sola.</div>
 <div class="df" style="margin-bottom:6px;background:#ffffff08;border-color:var(--bd);color:var(--tx)"><span style="color:var(--hd)">Alternativas</span><ul style="margin:2px 0 0;padding-left:18px"><li><b>Cierra las válvulas</b> de los tanques que no participan en la operación (llena un tanque a la vez).</li><li>Si el contraflujo aparece al <b>parar la bomba</b>, falta la retención en su descarga.</li><li>Une las fases de vapor con una <b>línea de igualación</b>: iguala las presiones y solo queda la diferencia de nivel.</li><li>Usa <b>colectores separados</b> para llenado y para extracción.</li></ul></div>
 <p class="hint">Si los tanques forman una batería que debe trabajar comunicada y a nivel común, este intercambio es el comportamiento esperado y puedes ignorar la alerta.</p>`;}
function revisarContra(k,vivo){const sig=k?k.src.map(x=>x.id).join()+'>'+k.dst.map(x=>x.id).join():'';if(sig==CSIG)return;CSIG=sig;if(!k){return;}
 FW.make('wcontra',{t:'⚠ Alerta: contraflujo entre tanques',s:'',w:720,h:560,tb:'<span style="flex:1"></span><button id="ctx" class="pri">Entendido</button>'});FW.title('wcontra','⚠ Alerta: contraflujo entre tanques',vivo?'durante la simulación':'en el estado actual del modelo');

<script>

.vzc button{padding:2px 7px;font-size:11.5px}`;document.head.appendChild(css);

   Hoja de ruta paso a paso para diseñar una red de GLP en fase líquida:

/* ---------- pasos ---------- */
const kgL=(kg,rho)=>kg/rho*1000/60;/* kg/h → L/min */
const PASOS=[
{id:'p0',t:'Lo que cambia al pasar de vapor a líquido',
 lead:'Lectura previa. Tu experiencia en redes de gas sirve casi toda, pero seis ideas cambian de signo cuando el GLP va líquido. Los números son los de tu proyecto.',
 body:c=>{const pr=c.R&&c.R.pr,T=[0,20,45],row=k=>[GLP.COMP[k].n,...T.map(t=>X.fPg(GLP.pvap(k,t+273.15)-(c.R?c.R.patm:101325))+' · '+nf(GLP.rhoL(k,t+273.15),0)+' kg/m³')];
  return`<h3>1. La presión la fija la temperatura, no un regulador</h3><p>En el tanque conviven líquido y vapor: la presión es la de saturación a la temperatura del líquido. No se ajusta; se calcula. Si el día enfría, la presión de toda la red baja.</p>
  ${tabla(['Producto',...T.map(t=>'A '+X.fT(t,0))],[row('C3'),row('nC4'),row('iC4')])}${pr?`<p>Tu mezcla a ${X.fT(+c.M.fl.Tl,0)}: <b>${X.fPg(pr.Pb-c.R.patm)}</b> y ${nf(pr.rho,0)} kg/m³.</p>`:''}
  <h3>2. El líquido sale del tanque «al borde de hervir»</h3><p>Es líquido saturado: no tiene reserva de presión. Cualquier caída de presión (fricción, una subida, una válvula estrangulada) o cualquier calentamiento convierte parte del líquido en vapor dentro de la tubería. En una red de vapor, perder presión es perder capacidad; aquí es <b>cavitar la bomba, falsear el medidor y dejar sin alimentación al equipo</b>. Por eso el criterio central del diseño es el <b>margen sobre la presión de burbuja</b> en cada punto.</p>
  <h3>3. La bomba reemplaza al regulador</h3><p>En vapor se parte de una presión alta y se regula hacia abajo. En líquido se parte de la saturación y se <b>añade</b> presión con una bomba. Aguas abajo de la bomba el líquido queda subenfriado (con margen); aguas arriba no. Toda la succión se diseña alrededor del <b>NPSH</b>${pr?`: con líquido saturado, el NPSH disponible es solo la altura de líquido sobre la bomba menos las pérdidas de la succión. En tu mezcla, perder 0,10 bar en la succión equivale a perder <b>${nf(1e4/(pr.rho*G),1)} m</b> de altura`:''}.</p>
  <h3>4. Es unas 250 veces más denso</h3><p>Un litro de líquido da del orden de 250 a 270 litros de vapor. Los caudales en volumen son pequeños, los diámetros también, y las velocidades de diseño son bajas: alrededor de 1 m/s en succión y hasta unos 2 a 3 m/s en descarga. Una fuga de líquido libera esa misma proporción de gas y enfría con fuerza al evaporarse.</p>
  <h3>5. Se dilata mucho y no se deja comprimir</h3><p>${pr?`Tu mezcla se dilata <b>${nf(pr.beta*100,2)} % por cada °C</b>. `:''}Dos consecuencias que no existen en vapor: los tanques nunca se llenan del todo (llenado máximo de norma), y un tramo de tubería lleno de líquido y cerrado por ambos extremos sube de presión${c.R&&c.R.term?` unos <b>${X.fPT(c.R.term.dPdT)}</b>`:' varios bar por cada °C'} al calentarse. De ahí la <b>válvula de alivio hidrostático</b> obligatoria en cada tramo aislable.</p>
  <h3>6. Cerrar rápido golpea</h3><p>Al ser casi incompresible, detener el líquido de golpe produce <b>golpe de ariete</b>${c.R&&c.R.surge?`: en tu red, ${X.fdP(c.R.surge.dJ,1)} con cierre instantáneo`:''}. Importa en válvulas de cierre de emergencia, solenoides y paro de bomba.</p>`;}},

function tabla(hd,rows){return`<div class="tw"><table><tr>${hd.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;}

 return{M,R,rq:(pre,tag)=>Q.filter(q=>{const a=q.id.split('·');return(pre.length==1?a[0][0]==pre:a[0]==pre)&&(!tag||a[1]==tag);}).map(q=>({t:q.txt,s:q.r,d:q.ev,fx:q.fx,go:q.refs&&q.refs[0]}))};}
function evalua(){const c=ctx(),done=(X.M.tutor&&X.M.tutor.ok)||{};return PASOS.map(p=>{let au=[];try{au=p.auto?p.auto(c):[];}catch(e){console.error(e);}const mn=(p.man||[]).map(m=>({id:m[0],t:m[1],ok:!!done[m[0]]}));
  const bad=au.filter(a=>a.s=='bad').length,ver=au.filter(a=>a.s=='ver').length,pm=mn.filter(m=>!m.ok).length,tot=au.filter(a=>a.s!='na').length+mn.length,ok=au.filter(a=>a.s=='ok').length+mn.length-pm;
  return{p,au,mn,bad,ver,pm,tot,ok,s:!p.auto&&!p.man?'inf':bad?'bad':ver||pm?'ver':'ok',c};});}
const IC={ok:'✔',bad:'✖',ver:'!',na:'–'};let CUR=null;
function accion(a){return a.go?`<button data-go="${E(a.go)}">Ir a ${E(X.node(a.go)?tg(X.node(a.go)):a.go)} ➜</button>`:a.tab?`<button data-ttab="${a.tab[0]}|${E(a.tab[1])}">Abrir ${E(a.tab[1])} ➜</button>`:a.tool?`<button data-ttool="${a.tool}">Abrir ➜</button>`:'';}

 if(p.info)b+=`<h3>Información mínima requerida</h3>`+tabla(['Dato','Qué es y por qué importa','De dónde sale'],p.info.map(r=>[`<b>${r[0]}</b>`,r[1],r[2]]));

 return`<div class="tut"><nav class="tutn" aria-label="Pasos"><div class="tutbar"><i style="width:${pct}%"></i></div>${nav}</nav><div class="tutc">${b}</div></div>`;}

 D.P(`Después siguen ${ev.length} pasos en orden de ejecución:`,{after:3});ev.forEach((e,i)=>D.P(E(e.p.t),{bullet:(i+1)+'.',indent:22,bw:18,after:2}));
