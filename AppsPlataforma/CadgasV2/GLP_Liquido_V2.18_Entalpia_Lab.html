<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLP líquido · Isoflux</title>
<style>
:root{/* Tema ENTALPÍA (azul metalizado, a juego con Isoflux y los informes PDF); el wordmark conserva el degradado cálido del logo */
 --bg:#0a0d12;--pn:#141922;--pn2:#11161f;--tx:#e4eefa;--mu:#90a3bd;--ac:#2f86e8;--bd:#2a3648;color-scheme:dark;

 --ok:#57d28a;--warn:#ffd37a;--bad:#ff7d8a;--info:#5aa6ff;--sP:#4ad0ff;--sR:#c48cff;--sV:#9a90ad;--sel:#8fe0ff;--grid:#27456e30;--hd:#bee1ff;--hov:#4f9bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:7px;padding:4px 7px}
button{cursor:pointer;font-weight:600}button:hover{border-color:var(--hov)}
button.on,button.pri{background:var(--btn);border-color:#5aa6ff;color:#fff}
button:disabled{opacity:.4;cursor:default}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #4f9bff;outline-offset:1px}
#tb{background:linear-gradient(180deg,#141c2b,#0b0812);border-bottom:2px solid #2f86e870;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:none}
.brand{display:flex;align-items:center;gap:8px;margin-right:8px}.brand img{height:38px;width:38px;border-radius:9px;border:1px solid #223148;box-shadow:0 0 14px #2f86e840}.brand div{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:16px;letter-spacing:.16em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:10px;color:var(--mu);letter-spacing:.08em}
#tb label{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:4px}
#tb input[type=number]{width:62px}
.sep{width:1px;align-self:stretch;background:var(--bd);margin:0 2px}.sp{margin-left:auto}
#lk{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}#lk.on{border-color:#2e9e4f;color:#9be7b0}
details.mn{position:relative}details.mn summary{list-style:none;cursor:pointer;border:1px solid var(--bd);border-radius:7px;padding:4px 9px;background:var(--pn);font-weight:600}
details.mn summary::-webkit-details-marker{display:none}
details.mn>div{position:absolute;right:0;top:calc(100% + 4px);z-index:40;background:#141922f7;border:1px solid var(--bd);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:190px;box-shadow:0 6px 18px #0009}
details.mn>div button{text-align:left}
#wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px}body.noside #wrap{grid-template-columns:minmax(0,1fr)}body.noside #side{display:none}
/* paleta del diseñador: franja superior, como en ISOFLUX */
#pal{flex:none;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#0e1420,#11161f);padding:5px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px}
#pal>b{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:600;margin-right:4px}
#pal h3{margin:6px 0 2px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#90a3bd;font-weight:600}
#pal button{text-align:left;font-weight:500;font-size:12px;display:flex;align-items:center;gap:5px;padding:2px 8px 2px 4px;white-space:nowrap;flex:none}
#pal svg{flex:none}#pal details.acc{border:1px solid var(--bd);border-radius:9px;background:var(--pn);display:flex;flex-wrap:wrap;align-items:center;min-width:0}#pal details.acc[open]{border-color:#2f86e888}#pal details.acc>summary{padding:6px 10px;font-size:10.5px;flex-wrap:nowrap;white-space:nowrap}#pal .accb{padding:3px 6px 3px 0;display:flex;flex-wrap:wrap;gap:4px}
#cvw{position:relative;min-width:0;min-height:0;background:radial-gradient(110% 75% at 50% 0%,#141c2b 0%,#11161f 45%,#0a0d12 100%)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none}
#cv.t-pipe,#cv.t-eq{cursor:crosshair}#cv.t-orb{cursor:grab}#modes{display:inline-flex;gap:4px}#cv.pan{cursor:grabbing}
#hint{position:absolute;left:10px;bottom:8px;right:10px;pointer-events:none;font-size:11.5px;color:var(--mu);display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
#hint span{background:#0a0d12cc;border-radius:6px;padding:2px 6px}
#dic{position:absolute;right:10px;top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--bd);white-space:nowrap;background:#0a0d12cc}.pill.sim{border-color:#4f9bff;color:#8fe0ff}
.pill.ok{border-color:#2e9e4f;color:#9be7b0}.pill.warn{border-color:#a8842f;color:var(--warn)}.pill.bad{border-color:#b3463d;color:var(--bad)}
#zoom{position:absolute;left:10px;top:8px;display:flex;flex-direction:column;gap:4px}#zoom button{width:30px;padding:3px 0}
#side{border-left:1px solid var(--bd);background:var(--pn2);display:flex;flex-direction:column;min-height:0;min-width:0}
#bside2{position:absolute;right:0;top:44px;z-index:4;border-radius:8px 0 0 8px;border-right:none;padding:10px 5px;display:none;writing-mode:vertical-rl;font-size:11px;letter-spacing:.06em;background:var(--btn);color:#fff;border-color:#5aa6ff}body.noside #bside2{display:block}
#tabs #bhide{flex:none;padding:4px 8px;border-radius:7px}
#tabs{display:flex;gap:4px;padding:8px 8px 0;flex:none}#tabs button{flex:1;border-radius:7px 7px 0 0;border-bottom:none;padding:4px 2px;font-size:12px}
.lop{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px}.lop:last-child{border-bottom:none}.lop span{font-variant-numeric:tabular-nums;text-align:right}.lop input[type=range]{grid-column:1/3;width:100%;padding:0;border:none;background:none;accent-color:#2f86e8}.lop button{min-width:84px}
.gf{pointer-events:none}.gf.on{animation:gf linear infinite}@keyframes gf{to{transform:translateX(20px)}}
@media(prefers-reduced-motion:reduce){.gf.on{animation:none}}
.chart{display:block;width:100%;height:auto;margin:2px 0 10px}.chart text{font:10px system-ui,Segoe UI,Arial,sans-serif;fill:var(--mu)}
#bsim0{white-space:nowrap;flex:none}#sld{width:100%;accent-color:#2f86e8;padding:0;border:none;background:none}
#sb{flex:1;overflow:auto;padding:10px;border-top:1px solid var(--bd)}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card>h2,.card>.h2x{margin:0 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hd)}
.card.hasacc{padding:0}details.acc>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:9px 12px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hd);font-weight:700;border-radius:10px}
details.acc>summary::-webkit-details-marker{display:none}details.acc>summary::before{content:'▸';color:var(--ac);font-size:12px;width:10px}details.acc[open]>summary::before{content:'▾'}
details.acc>summary:hover{background:#ffffff0a}details.acc>summary span{margin-right:auto}
details.acc>summary i{font-style:normal;font-weight:500;font-size:10px;letter-spacing:.02em;text-transform:none;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:0 7px;white-space:nowrap}
.accb{padding:0 12px 11px}.accd{font-size:11.5px;color:var(--mu);margin:0 0 9px;padding:6px 9px;border-left:2px solid var(--ac);background:#ffffff08;border-radius:0 6px 6px 0;text-transform:none;letter-spacing:0}
.accd ul{margin:4px 0 0;padding-left:16px}.accd li{margin:2px 0}.accd b{color:var(--tx);font-weight:600}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}.fg.g3{grid-template-columns:1fr 1fr 1fr}
.fg label{display:block;font-size:11px;color:var(--mu);min-width:0}.fg label.w2{grid-column:1/-1}
.fg input:not([type=checkbox]),.fg select{width:100%;margin-top:2px}
.fg label.chk{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:12px}
.hint{font-size:11px;color:var(--mu);margin:6px 0 0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:12px}
.kv span{color:var(--mu)}.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ck{display:grid;grid-template-columns:20px minmax(0,1fr);gap:1px 6px;padding:6px 4px;border-bottom:1px solid var(--bd);border-radius:6px}
.ck[data-ref]{cursor:pointer}.ck[data-ref]:hover{background:#1b2740}
.ck:last-child{border-bottom:none}.ck i{font-style:normal;font-weight:700}
.ck.ok i{color:var(--ok)}.ck.warn i{color:var(--warn)}.ck.bad i{color:var(--bad)}.ck.info i{color:var(--info)}
.ck b{font-weight:600}.ck p{margin:0;grid-column:2;color:var(--mu);font-size:11.5px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:11.5px}
th{text-align:left;font-weight:600;color:var(--mu);font-size:10.5px;white-space:nowrap}
td,th{padding:3px 5px;border-bottom:1px solid var(--bd)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr[data-ref]{cursor:pointer}tr[data-ref]:hover td{background:#1b2740}
details.fd summary{cursor:pointer;font-weight:600;color:var(--hd)}
details.fd p{color:#cdd9ea;font-size:12px}details.fd code{background:var(--pn2);border:1px solid var(--bd);border-radius:5px;padding:0 4px;font-size:11.5px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#141922f5;border:1px solid #2f86e8;border-radius:10px;padding:8px 14px;z-index:60;display:none;max-width:92vw;box-shadow:0 4px 18px #0007}
#cv text{font:11px system-ui,Segoe UI,Arial,sans-serif;fill:var(--mu);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
#cv text.tg{fill:var(--tx);font-weight:600}
#bver{font-size:11px;padding:2px 8px;border-radius:99px;color:var(--hd)}
#dhelp header b{margin-right:8px;color:var(--hd);letter-spacing:.06em}
#hbody{padding:0}
#hbody details.hsec{border:1px solid var(--bd);border-radius:10px;background:var(--pn);margin-bottom:8px}#hbody details.hsec>summary{text-transform:none;letter-spacing:.01em;font-size:13.5px}
.man{font-size:13px;line-height:1.55;color:#d7e3f2}.man p{margin:0 0 8px;max-width:78ch}.man ul,.man ol{margin:0 0 8px;padding-left:20px}.man li{margin:3px 0}.man b{color:var(--tx)}
.man table{font-size:12.5px;margin:4px 0 10px}.man td,.man th{border:1px solid var(--bd);vertical-align:top;padding:5px 7px}.man th{font-size:11.5px;color:var(--hd)}
.man code{background:var(--pn2);border:1px solid var(--bd);border-radius:5px;padding:0 4px;font-size:12px}
.glo{border:1px solid var(--bd);border-radius:10px;background:var(--pn);padding:8px 12px;margin-bottom:7px}.glo b{color:var(--hd)}.glo p{margin:3px 0 0;font-size:12.5px;color:#d7e3f2}.glo p b{color:var(--tx)}
.ver{border:1px solid var(--bd);border-radius:10px;background:var(--pn);padding:9px 12px;margin-bottom:8px}.ver h3{margin:0 0 4px;font-size:13.5px}.ver h3 span{color:var(--ac);margin-right:4px}.ver h3 small{float:right;font-weight:400;color:var(--mu)}.ver ul{margin:0;padding-left:18px;font-size:12.5px;color:#d7e3f2}.ver li{margin:2px 0}
#dgb{padding:0}.dsum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#dgb h3{margin:14px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}#dgb h3 small{font-weight:400;color:var(--mu);margin-left:4px}
#dgb h3.bad{color:var(--bad)}#dgb h3.warn{color:var(--warn)}#dgb h3.info{color:var(--info)}
.ecu{border:1px solid var(--bd);border-left:3px solid var(--ac,#4f9bff);border-radius:8px;padding:8px 10px;margin:0 0 8px;font-size:12.5px}
.ecu .en{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ecu .en span{font-size:10.5px;color:var(--mu);text-align:right}
.ecu .ef{font-family:Cambria,'Times New Roman',serif;font-size:15px;padding:6px 8px;margin:6px 0;background:#ffffff0a;border-radius:6px;overflow-x:auto}
.ecu .ev,.ecu .er{font-size:11px;color:var(--mu)}.ecu .ec{margin:6px 0;padding:5px 8px;border-radius:6px;background:#57d28a12;border:1px solid #2e9e4f55;font-size:12px}
.ecu .ec span{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ok);font-weight:700}
.audg h3{margin:12px 0 6px}.audg .dr{margin-bottom:6px}
.dr{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--bd);border-left:3px solid var(--bd);border-radius:8px;background:var(--pn);margin-bottom:6px;font-size:12.5px}
.dr.bad{border-left-color:var(--bad)}.dr.warn{border-left-color:var(--warn)}.dr.info{border-left-color:var(--info)}
.dp button{width:100%;text-align:left;font-size:12px;white-space:normal}.dq{color:#d7e3f2}
.df{background:#57d28a12;border:1px solid #2e9e4f66;border-radius:7px;padding:5px 8px;color:#d6f5e2}.df em{display:block;font-style:normal;font-size:11px;margin-top:4px;padding-top:4px;border-top:1px dashed #2e9e4f66}.df em.au{color:var(--ok);font-weight:600}.df em.ma{color:var(--mu)}
.df span{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ok);font-weight:700;margin-bottom:1px}
@media(max-width:700px){.dr{grid-template-columns:minmax(0,1fr)}}
#memo{display:none}
@media(max-width:900px){
 body{overflow:auto;height:auto}#wrap{display:block}
 #pal{padding:6px 16px}#pal>b{display:none}
 #cvw{height:62vh}#side{border-left:none;border-top:1px solid var(--bd)}#sb{overflow:visible;padding:10px 16px}
}
@media print{
 :root{--bg:#fff;--pn:#fff;--pn2:#f3f5f8;--tx:#1a1a1a;--mu:#555;--bd:#c9ced6;--ok:#1b7a3d;--warn:#9a6700;--bad:#b3261e;--info:#1f4e9c;--sP:#0b74b8;--sR:#6a3fc0;--sV:#666;--sel:#1f4e9c;--grid:#e9e2e4;--hd:#1f4e9c;color-scheme:light}

 table.pg{width:100%;border-collapse:collapse}table.pg>thead>tr>td,table.pg>tfoot>tr>td,table.pg>tbody>tr>td{padding:0;border:none}

 .cvd h1{color:#fff;font-size:24pt;margin:0 0 4mm}.cvd h2{color:#bee1ff;font-size:14pt;margin:0 0 4mm;border:none;padding:0}.cvd p{color:#bee1ff;font-size:9.5pt;margin:0}

<script>
/* =====================================================================
   GasLP_Liquido · VENTANAS FLOTANTES (mismo formato que ISOFLUX)
   No bloquean el dibujo: se arrastran desde el encabezado, se redimensionan
   desde la esquina, se minimizan, se amplían y se cierran. Varias a la vez.
   FW.make(id,{t,s,w,h,html}) crea (oculta) · FW.show(id) · FW.hide(id) · FW.body(id)
   Cada ventana imita la interfaz de <dialog> (showModal, close, open) para el código existente.
   ===================================================================== */
window.FW=(()=>{
 const W={};let z=2147482000,n=0;
 const css=document.createElement('style');css.textContent=`
 .fw{position:fixed;z-index:2147482000;display:none;flex-direction:column;background:#0b1222;border:1px solid #2b4a74;border-radius:14px;overflow:hidden;
  box-shadow:0 24px 70px #000a,0 0 0 1px #ffffff0d inset;color:#eaf2ff;min-width:320px;min-height:120px;max-width:100vw;max-height:100vh;font:13px/1.45 system-ui,Segoe UI,Arial,sans-serif}
 .fw.on{display:flex}.fw.max{width:100vw!important;height:100vh!important;left:0!important;top:0!important;border-radius:0}.fw.min{height:auto!important;min-height:0}.fw.min .fw-b,.fw.min .fw-r,.fw.min .fw-tb{display:none}
 .fw-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:move;user-select:none;touch-action:none;background:linear-gradient(100deg,#0c1322,#16284a);border-bottom:1px solid #22406b;flex:none}
 .fw-ti{font:700 13px system-ui;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis}.fw-ti small{font-weight:500;opacity:.6;font-size:11px;overflow:hidden;text-overflow:ellipsis}
 .fw-sp{flex:1}.fw-bar>button{width:30px;height:28px;border:none;border-radius:8px;background:#ffffff14;color:#dbe8ff;font:600 15px system-ui;cursor:pointer;line-height:1;padding:0;flex:none}
 .fw-bar>button:hover{background:#ffffff28}.fw-bar>button.fw-x:hover{background:#c0392b;color:#fff}
 .fw-tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid #1c3558;background:#0d1628;flex:none}.fw-tb:empty{display:none}
 .fw-b{flex:1;overflow:auto;padding:12px 14px;min-height:0}
 .fw-r{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:3;background:linear-gradient(135deg,transparent 46%,#5e82b8 46%,#5e82b8 58%,transparent 58%,transparent 70%,#5e82b8 70%,#5e82b8 82%,transparent 82%)}.fw.max .fw-r{display:none}
 @media print{.fw{display:none!important}}`;
 document.head.appendChild(css);
 function make(id,o){if(W[id])return W[id];o=o||{};const d=document.createElement('div');d.className='fw';d.id=id;
  d.innerHTML=`<div class="fw-bar"><span class="fw-ti"><span class="fw-t"></span><small class="fw-s"></small></span><span class="fw-sp"></span><button class="fw-n" title="Minimizar">—</button><button class="fw-m" title="Ampliar / restaurar">⤢</button><button class="fw-x" title="Cerrar">✕</button></div><div class="fw-tb"></div><div class="fw-b"></div><div class="fw-r" title="Redimensionar"></div>`;
  document.body.appendChild(d);const k=n++,vw=innerWidth,vh=innerHeight,w=Math.min(o.w||760,vw-16),h=Math.min(o.h||560,vh-16);
  Object.assign(d.style,{width:w+'px',height:h+'px',left:Math.max(8,Math.min((vw-w)/2+(k%5)*26-52,vw-w-8))+'px',top:Math.max(8,Math.min((vh-h)/2+(k%5)*22-30,vh-h-8))+'px'});
  d.querySelector('.fw-t').textContent=o.t||'';d.querySelector('.fw-s').textContent=o.s||'';if(o.tb)d.querySelector('.fw-tb').innerHTML=o.tb;if(o.html)d.querySelector('.fw-b').innerHTML=o.html;
  const front=()=>{d.style.zIndex=++z;};d.addEventListener('pointerdown',front,true);
  d.querySelector('.fw-n').onclick=()=>{d.classList.remove('max');d.classList.toggle('min');};
  d.querySelector('.fw-m').onclick=()=>{d.classList.remove('min');d.classList.toggle('max');};
  d.querySelector('.fw-x').onclick=()=>hide(id);
  const drag=(el,fn)=>{let s=null;el.addEventListener('pointerdown',e=>{if(e.target.closest('button')||d.classList.contains('max'))return;const r=d.getBoundingClientRect();s={x:e.clientX,y:e.clientY,l:r.left,t:r.top,w:r.width,h:r.height};try{el.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
   el.addEventListener('pointermove',e=>{if(s)fn(s,e.clientX-s.x,e.clientY-s.y);});const end=()=>{s=null;};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);};
  drag(d.querySelector('.fw-bar'),(s,dx,dy)=>{d.style.left=Math.max(120-s.w,Math.min(innerWidth-120,s.l+dx))+'px';d.style.top=Math.max(0,Math.min(innerHeight-36,s.t+dy))+'px';});
  drag(d.querySelector('.fw-r'),(s,dx,dy)=>{d.style.width=Math.max(320,s.w+dx)+'px';d.style.height=Math.max(120,s.h+dy)+'px';});
  /* interfaz tipo <dialog> */
  d.showModal=d.show=()=>show(id);d.close=()=>hide(id);Object.defineProperty(d,'open',{get:()=>d.classList.contains('on')});
  d._onhide=o.onhide;W[id]=d;return d;}
 function show(id){const d=W[id];if(!d)return;d.classList.add('on');d.classList.remove('min');d.style.zIndex=++z;return d;}
 function hide(id){const d=W[id];if(!d)return;d.classList.remove('on');if(d._onhide)d._onhide();}
 const body=id=>W[id]&&W[id].querySelector('.fw-b'),tb=id=>W[id]&&W[id].querySelector('.fw-tb');
 const title=(id,t,s)=>{const d=W[id];if(!d)return;d.querySelector('.fw-t').textContent=t;if(s!=null)d.querySelector('.fw-s').textContent=s;};
 return{make,show,hide,body,tb,title,isOpen:id=>!!(W[id]&&W[id].open)};
})();
/* ventanas que usa el código existente: conservan sus identificadores internos */
FW.make('dhelp',{t:'❔ Ayuda',s:'GLP líquido · manual, glosario y versiones',w:880,h:680,tb:`<button data-ht="man">Manual de uso</button><button data-ht="demo">Modelos de ejemplo</button><button data-ht="glo">Glosario</button><button data-ht="ver">Registro de versiones</button><span style="flex:1"></span><button id="hdown" class="pri" title="Descarga el manual completo como archivo HTML">⬇ Descargar manual</button><button id="hprint" title="Imprime el manual o guárdalo como PDF">🖨 Imprimir</button>`,html:'<div id="hbody"></div>'});
FW.make('ddiag',{t:'📋 Diagnóstico',s:'incumplimientos, datos faltantes y corrección sugerida',w:980,h:620,tb:`<span id="dgsum" style="display:flex;gap:6px;flex-wrap:wrap"></span><span style="flex:1"></span><button id="dgap" class="pri">⚙ Aplicar correcciones</button><button id="dgx">Entendido</button>`,html:'<div id="dgb"></div>'});

</script>
<script>
/* =====================================================================
   GasLP_Liquido · PROPIEDADES Y CATÁLOGOS (sin DOM)
   Unidades internas SI: Pa abs, K, kg, m, s. Las conversiones se hacen
   solo en la entrada/salida.
   ===================================================================== */
const GLP=(()=>{
const R=8.314462,G=9.80665,BAR=1e5,PSI=6894.757;

/* ---------- Componentes puros ----------
   W   : coeficientes de Wagner para presión de vapor (Reid-Prausnitz-Poling)
         ln(Pv/Pc) = (a·τ + b·τ^1.5 + c·τ^3 + d·τ^6)/Tr ,  τ = 1 − Tr
   Zra : parámetro de Rackett (Spencer-Danner) ajustado a la densidad NIST a 15 °C
   mu  : Andrade  ln μ[mPa·s] = A + B/T   (ajuste a líquido saturado NIST 0…40 °C)
   cp  : cp líquido [kJ/kg·K] = a + b·t(°C)
   hb,Tb: calor latente en el punto de ebullición normal (Watson, n = 0,38)
   c   : velocidad del sonido en líquido saturado [m/s] = a + b·t(°C)  (estimación ±8 %)
   pci : poder calorífico inferior [MJ/kg];  Gg: densidad relativa del gas (aire = 1) */
const COMP={

 nC4:{n:'n-Butano', M:58.122,Tc:425.125,Pc:37.96, W:[-6.88709,1.15157,-1.99873,-3.13003],Zra:.27312,mu:[-4.4013,762.6],cp:[2.31,.0050],Tb:272.66,hb:385.7,c:[1045,-5.4],pci:45.75,Gg:2.0665},
 iC4:{n:'Isobutano',M:58.122,Tc:407.81, Pc:36.29, W:[-6.95579,1.50090,-2.52717,-1.49776],Zra:.27459,mu:[-4.9997,921.9],cp:[2.29,.0056],Tb:261.40,hb:366.4,c:[960,-5.5], pci:45.61,Gg:2.068}};

 cuL:{n:'Cobre rígido tipo L (ASTM B88)',eps:.0015,E:117e9,alpha:1.7e-5,sizes:CUN.map((d,i)=>mk(CUOD[i],CUL[i],d))}};

const ACC={

 c90:{n:'Codo 90° estándar (roscado)',ft:30},
 c90l:{n:'Codo 90° radio largo (soldable r/d 1,5)',ft:14},
 c45:{n:'Codo 45°',ft:16},

 vc:{n:'Válvula de compuerta',ft:8},
 vg:{n:'Válvula de globo',ft:340},
 chk:{n:'Válvula de retención de columpio',ft:100},

 esv:{n:'Válvula de cierre de emergencia (ESV)',k:2,est:1},

/* ---------- Factor de fricción ---------- */
function fric(Re,er){
 if(!(Re>0))return 0;const lam=64/Re;if(Re<2300)return lam;

})();

<script>

function topo(M){

  if(ps.length!=2){if(ps.length)W.push({s:'bad',ref:n.id,t:`${n.tag||n.id}: ${t.n.toLowerCase()} mal conectada`,d:'Un equipo en línea necesita exactamente dos tuberías (entrada y salida). Con otra cantidad se trata como una simple unión.'});return;}

 const ft=new Map(P.map(p=>[p.id,0])),codo=M.mec.junta=='sold'?14:30;
 M.nodes.forEach(n=>{if((TYPES[n.type]||{}).lin&&split.has(n.id)||(TYPES[n.type]||{}).ves)return;const ps=adj.get(n.id)||[];if(ps.length<2)return;

 const walk=(starts,stopLin)=>{const seen=new Set(),pipes=new Set(),q=[...starts];
  while(q.length){const s=q.shift();if(seen.has(s))continue;seen.add(s);const base=s.replace('#o','');

/* ---------- solución hidráulica con los diámetros dados (dn: Map id → DN) ---------- */

/* ---------- sentido de flujo de los equipos direccionales según la física ----------

      dentro de su curva y, si ambos lo hacen (trasiego entre dos tanques), el de mayor NPSH disponible (la bomba está junto a su fuente);
    · retención y exceso de flujo: se alinean con el caudal que mueven bombas y consumos (con los tanques en equilibrio entre sí);
    · by-pass: de la presión mayor a la menor.

 const Tamb=M.fl.Tamb===''||M.fl.Tamb==null?+M.fl.Tl:+M.fl.Tamb,U=Math.max(+M.fl.U||0,0);
 S.st.forEach((s,id)=>{const x=r.nodes.get(id);if(!x)return;const cap=s.g.V*rho,m=Math.max(s.f*cap,1e-6),min=x.entra||0,q=-x.sale,dm=q*dt;
  if(s.n.modo!='fix'){let T=s.T;
   if(min>0&&x.Tin!=null)T=(m*T+min*dt*x.Tin)/(m+min*dt);/* mezcla con lo que entra */
   const A=Math.PI*s.g.D*s.g.L+Math.PI*s.g.D*s.g.D/2;T+=U*A*(Tamb-T)*dt/(m*cp);/* ganancia o pérdida con el ambiente */
   const Pg=x.Pgas,Z=Math.max(1-.02*Pg/BAR,.6),rv=Pg*R0.fr.M/1000/(Z*GLP.R*(T+273.15)),dV=-dm/rho;/* cambio del espacio de vapor */
   if(dV>0)T-=rv*dV*hfg/(m*cp);/* se vacía: hierve líquido para llenar el espacio (autorrefrigeración) */
   else if(s.n.vap=='sin')T+=Math.min(Math.max((+s.n.cond||0)/100,0),1)*rv*(-dV)*hfg/(m*cp);/* se llena sin retorno: el vapor que condensa cede calor */

  if(q>0&&s.f>=fx-1e-6&&!s.al.max){s.al.max=1;ev('warn',id,`${tag(s.n)} alcanzó su llenado máximo (${+s.n.fmax||85} %).`);}
  if(q<0&&s.f<=fn+1e-6&&!s.al.min){s.al.min=1;ev('warn',id,`${tag(s.n)} llegó a su nivel mínimo (${+s.n.fmin||0} %).`);}
  if(s.f>=.995&&!s.al.full){s.al.full=1;S.stop=`${tag(s.n)} quedó lleno de líquido (sin espacio de vapor): condición peligrosa.`;ev('bad',id,S.stop);}
  if(s.f<=.005&&q<0&&!s.al.empty){s.al.empty=1;S.stop=`${tag(s.n)} se quedó sin líquido.`;ev('bad',id,S.stop);}

 [...S.trap.keys()].forEach(k=>{if(!keys.has(k)){const tr=S.trap.get(k);S.trap.delete(k);ev('info',tr.ids[0],`Tramo ${tr.ids.join(', ')}: vuelve a comunicarse con la red.`);}});

/* simulación «hasta el final»: repite pasos hasta que un recipiente se llena, otro se agota o el flujo se detiene */
function simulate(M,R0,opt){
 opt=opt||{};const tmax=(+opt.tmax||12)*3600;
 if(!R0.conv)return{err:'La red no tiene solución en el estado inicial: corrige primero las verificaciones.'};
 const S=simInit(M,R0);if(!S.st.size)return{err:'Ningún recipiente conectado tiene capacidad definida. Selecciona un tanque y escribe su «Capacidad».'};
 for(let k=0;k<900&&!S.stop;k++){
  const {r,dt}=simStep(S,Math.min(900,Math.max(tmax-S.t,.02)),true);if(S.stop)break;
  let any=false;S.st.forEach((s,id)=>{const x=r.nodes.get(id);if(x&&Math.abs(x.sale)>1e-7)any=true;});
  if(!any){S.stop='El flujo se detuvo: las presiones quedaron equilibradas o la bomba ya no entrega.';break;}
  S.st.forEach(s=>{if(S.stop)return;if(s.al.max)S.stop=`${s.n.tag||s.n.id} alcanzó su llenado máximo (${+s.n.fmax||85} %).`;else if(s.al.min)S.stop=`${s.n.tag||s.n.id} llegó a su nivel mínimo (${+s.n.fmin||0} %).`;});
  if(!S.stop&&S.t>=tmax-1e-6)S.stop=`Se alcanzó el tiempo máximo de simulación (${+opt.tmax||12} h).`;}
 if(!S.stop)S.stop='Se alcanzó el número máximo de pasos.';
 /* estado final */
 const o=S.out,r=solve(M,R0.dn,R0.T,simOv(S));if(r.conv){o.t.push(S.t);o.R.push(r);o.ves.forEach(v=>{const s=S.st.get(v.id),x=r.nodes.get(v.id);v.f.push(s.f*100);v.P.push((x.Pgas-S.patm)/BAR);v.T.push(s.T);v.niv.push(vlevel(s.n,s.f));v.kgh.push(-x.sale*3600);});
  o.pumps.forEach(p=>{const x=r.pumps.find(q=>q.id==p.id);p.Q.push(x?x.Q*60000:0);p.dP.push(x?x.dP/BAR:0);p.npsh.push(x?x.NPSHa:NaN);});}
 o.ves.forEach(v=>{const s=S.st.get(v.id);v.kg=(v.f[v.f.length-1]-v.f[0])/100*s.g.V*o.rho;v.cap=s.g.V;});
 o.npshMin=Math.min(...o.pumps.flatMap(p=>p.npsh.filter(Number.isFinite)),Infinity);o.stop=S.stop;o.ev=S.ev;
 M.nodes.forEach(n=>{delete n._al;delete n._efc;});return o;
}

<script>
/* =====================================================================
   GasLP_Liquido · SÓLIDOS 3D
   Los equipos se construyen con primitivas tridimensionales (cilindro,
   cápsula, esfera, caja, disco) en coordenadas locales y se proyectan con
   la misma matriz de la vista (órbita yaw/pit, como ISOFLUX), de modo que

const GLP3D=(()=>{
const f1=v=>(+v).toFixed(1),cl=(v,a,b)=>Math.min(b,Math.max(a,v));

/* matriz de pantalla y dirección hacia el observador para un yaw/pit */
function view(yaw,pit){const c=Math.cos(yaw),q=Math.sin(yaw),sp=Math.sin(pit),cp=Math.cos(pit);return{m:[c,q*sp,0,-cp,-q,c*sp],v:[q*cp,sp,c*cp]};}

   let s=el(far,sh(col,-.3));
   if(L>.6){const q=(t0,t1,c,op)=>`<polygon points="${[[Pa,t0],[Pb,t0],[Pb,t1],[Pa,t1]].map(([P,t])=>f1(P[0]+nx*r*t)+','+f1(P[1]+ny*r*t)).join(' ')}" fill="${c}"${op?` opacity="${op}"`:''}/>`;
    s+=q(-1,1,col)+q(-1,-.55,sh(col,-.42))+q(-.55,-.15,sh(col,-.18))+q(.25,.7,sh(col,.38))+q(.7,1,sh(col,-.12));

   s+=el(near,o.cap||sh(col,.12));it.push({d:dp(mul(add(a,b),.5))+(o.z||0),s});},
  /* cápsula (cilindro con cabezas semiesféricas): tanque */

function chart(title,unit,series,t){const W=330,H=132,ml=38,mr=46,mt=20,mb=20,pw=W-ml-mr,ph=H-mt-mb,tm=t[t.length-1]||1,hrs=tm>7200,ts=hrs?3600:60;

 const X=x=>ml+x/tm*pw,Y=v=>mt+(hi-v)/(hi-lo)*ph,dec=hi-lo<3?2:hi-lo<30?1:0;let g=`<text x="${ml}" y="11" style="fill:var(--tx);font-weight:600">${title} <tspan style="font-weight:400;fill:var(--mu)">(${unit})</tspan></text>`;
 [0,.5,1].forEach(k=>{const v=lo+(hi-lo)*k;g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)" stroke-width="1"/><text x="${ml-5}" y="${Y(v)+3}" text-anchor="end">${nf(v,dec)}</text>`;});
 [0,.5,1].forEach(k=>g+=`<text x="${X(tm*k)}" y="${H-5}" text-anchor="${k==0?'start':k==1?'end':'middle'}">${nf(tm*k/ts,hrs?1:0)}${k==1?(hrs?' h':' min'):''}</text>`);

  let y=Y(s.v[s.v.length-1])+3;while(ys.some(q=>Math.abs(q-y)<10))y+=10;ys.push(y);g+=`<text x="${ml+pw+4}" y="${y}" style="fill:${PAL[i%5]}">${E(s.n)}</text>`;});

const FUND=`<p><b>Propiedades.</b> Presión de vapor por Wagner y de burbuja por Raoult; densidad por Rackett; viscosidad por Andrade. Contraste con tablas NIST entre −40 y 50 °C: presión y densidad ±0,5 %, viscosidad ±3 %. La velocidad del sonido es una estimación (±8 %) y solo interviene en ariete y alivio hidrostático.</p>
<p><b>Red.</b> Flujo incompresible. Cada tubería cumple <code>P<sub>a</sub> − P<sub>b</sub> = ρ·g·Δz + (f·L/D + ΣK)·ρv²/2</code> con <code>f</code> de Colebrook-White; cada nodo conserva la masa. El sistema completo (caudales y presiones) se resuelve por Newton, así que admite lazos, varias fuentes, bombas con curva <code>ΔP = ΔP₀ − c·Q²</code> y by-pass que abren al superar su diferencial de ajuste.</p>
<p><b>Accesorios.</b> Codos y tees se deducen del dibujo con el método de Crane (codo 90° 30·f<sub>T</sub> roscado o 14·f<sub>T</sub> soldable; tee 20·f<sub>T</sub> de paso y 60·f<sub>T</sub> por el ramal); entrada y salida de recipientes con K = 0,5 y 1,0. Los K de filtro, exceso de flujo y ESV son típicos: reemplázalos por el dato del fabricante.</p>
<p><b>Fase líquida.</b> El líquido sale saturado de su recipiente: su presión de burbuja es la del recipiente de origen y se propaga con el flujo (ponderada por caudal donde se mezclan corrientes). <code>NPSH<sub>d</sub> = (P<sub>succión</sub> − P<sub>burbuja</sub>)/(ρ·g) + v²/(2g)</code>.</p>
<p><b>Dimensionamiento.</b> Las tuberías en «Automático» toman el menor diámetro comercial que cumple la velocidad de su zona (y la fricción en descarga); la succión se agranda hasta cumplir el NPSH o hasta que agrandar deje de ayudar.</p>
<p><b>Simulación.</b> Cuasi-estacionaria: en cada paso se resuelve la red con el estado de los recipientes y se integra la masa (paso ≤ 1 % de la capacidad). La temperatura del líquido recibido se mezcla en masa. Sin retorno de vapor, la presión del receptor es <code>P<sub>sat</sub>(T) + (1 − η)·[P₀·(V<sub>v0</sub>/V<sub>v</sub>)<sup>1,13</sup> − P₀]</code>, donde η es la fracción de vapor que condensa (hipótesis a calibrar).</p>
<p><b>Alcance.</b> Las líneas de vapor solo se dibujan. No se modelan transitorios rápidos (arranques, ondas). No reemplaza la curva real del fabricante, el análisis de flexibilidad ni la verificación contra la edición vigente de NFPA 58 / NTC 3853.</p>`;
window.GLP_FUND=FUND;

 {v:'2.18',f:'2026-11-11',t:'Indicador de conectividad, bases de tanques y modelos de ejemplo',c:['Nueva verificación «Conectividad de la red»: si un tanque, bomba, válvula u otro equipo quedó dibujado sin ninguna tubería tocándolo, aparece en rojo (o la unión suelta, en amarillo) con el nombre del elemento; si todo está bien unido, lo confirma en verde.','Corrección: la base de los tanques horizontales y verticales ahora baja hasta el nivel real del piso en vez de quedar pegada al casco; los tanques elevados ya no se ven flotando.','«❔ Ayuda ▸ Modelos de ejemplo»: además de los dos ejemplos existentes, se agregan «Descargue de carrotanque a tanque fijo» (trasiego cisterna → tanque), «Transporte de caudal por tubería» (solo transporte, presión fija en ambos extremos) y «Suministro a usuario final» (dos consumos con su propia presión mínima). Cada uno se carga con un clic.']},
 {v:'2.17',f:'2026-11-11',t:'Dibujo como ISOFLUX: vista giratoria, trazado por modos y equipos en 3D',c:['La vista gira: arrastra con el botón derecho o usa «◍ Orbitar». Botones «ISO» (vista isométrica), «PL» (planta), «⟳» (rotación automática) y «⤢» (encuadrar).','Misma proyección de ISOFLUX (órbita por azimut y elevación); la vista elegida se recuerda.','Trazado igual que en ISOFLUX: clic en el punto inicial, «⬆ Subir», «➡ Nivel» o «⬇ Bajar» (o las flechas) y clic para fijar cada tramo; imán con aro verde sobre puntos existentes; número + Enter para la longitud exacta; clic derecho sin arrastrar o Esc termina.','Los equipos ya no son símbolos planos: tanques, bombas, válvulas, filtros, medidores, vaporizadores y consumos son sólidos 3D que se orientan con su tubería y giran con la vista.','Las tuberías se dibujan como tubos con volumen, con grosor según su diámetro, y todo se pinta por profundidad.','Todo el dibujo está a la misma escala real: tanques según su diámetro y longitud, tuberías según su diámetro y equipos con su tamaño aproximado; al acercar o alejar todo crece o se reduce junto. Solo hay un tamaño mínimo para que los equipos pequeños no desaparezcan al alejar.','Los tanques muestran el nivel de líquido dentro del cuerpo; las válvulas de bola cerradas giran su palanca y la ponen en rojo.','Mover la vista: arrastrar el fondo, botón central o Mayús + arrastrar.'],},
 {v:'2.16',f:'2026-11-11',t:'Vaporizadores: catálogo editable y verificación en el diseño',c:['Herramientas ▸ «🔥 Vaporizadores»: ventana con el estado de cada vaporizador del dibujo, el catálogo y una guía de tipos y selección.','Catálogo con 27 modelos base (eléctricos secos, fuego directo y baño de agua) con capacidad en kg/h y gal/h; se pueden agregar, editar, duplicar, eliminar, filtrar, exportar a CSV y restaurar.','Cada vaporizador del dibujo recibe un modelo de catálogo, unidades en paralelo y reserva N+1 opcional.','El cálculo comprueba capacidad frente a la demanda, presión mínima de entrada, presión máxima admisible y potencia térmica; e informa calor requerido, vapor producido y consumo propio.','Botón «Sugerido» que propone el menor modelo que cubre la demanda con 10 % de holgura.','Diagnóstico, Auditor (grupo H), Tutor de diseño (nuevo paso «Vaporizadores») e informe PDF incluyen los vaporizadores.','Corrección: las confirmaciones del tutor y los «No aplica» del auditor ahora se conservan al recargar y al deshacer.']},
 {v:'2.15',f:'2026-11-11',t:'Tutor de diseño',c:['Botón «🎓 Tutor de diseño»: hoja de ruta de 13 pasos para diseñar una red de GLP en fase líquida, desde las bases de diseño hasta los entregables.','Lectura previa «de vapor a líquido» con los números de tu proyecto.','Cada paso indica la información mínima, de dónde sale, dónde se ingresa, el criterio de aceptación, los errores frecuentes y la evidencia para auditoría.','Cada paso se evalúa contra el modelo actual y lleva al elemento o a la herramienta donde se corrige.','Confirmaciones del ingeniero que se guardan con el modelo.','El PDF consolidado incluye la sección «Hoja de ruta de diseño» con el avance y las confirmaciones.','«⬇ Guía en PDF» dentro del tutor descarga la hoja de ruta completa en formato ENTALPÍA, con portada, índice y el estado de tu modelo.']},
 {v:'2.14',f:'2026-11-11',t:'Herramientas hermanas de ISOFLUX: ventanas flotantes, auditor, ecuaciones, tiempo, factor de seguridad y PDF consolidado',c:['Ventanas flotantes con el mismo formato de ISOFLUX: se arrastran, se redimensionan, se minimizan y se maximizan sin tapar el dibujo.','Menú «Herramientas»: Diagnóstico, Auditor, Librería de ecuaciones, Comportamiento en el tiempo, Margen de error y factor de seguridad, y Glosario.','Auditor: requisitos agrupados por tema con resultado (Cumple, No cumple, Verificar, No aplica), evidencia, corrección sugerida, filtros y búsqueda.','Librería de ecuaciones con los valores del modelo sustituidos para el elemento seleccionado.','Comportamiento en el tiempo: cuánto tarda cada tanque en llegar al 25, 50, 75 % y al llenado máximo; caudal, diferencial, NPSH y energía de cada bomba; consumo acumulado y autonomía de vaporizadores y consumos.','Factor de seguridad ingenieril (1,5 por defecto) aplicable a caudal de consumos, NPSH requerido, golpe de ariete, espesor de pared y tiempos; y tabla de margen de error de cada resultado.','Alerta emergente de contraflujo entre tanques, con la causa y la corrección (válvulas de retención, cierre de válvulas, igualación de vapor).','Los tanques muestran su nivel de llenado en el dibujo y cambia durante la simulación.','Glosario de términos (NPSH, cavitación, burbuja, by-pass y otros).','Informe ▸ «Descargar PDF consolidado»: un solo archivo .pdf en formato ENTALPÍA con portada, índice con número de página, marcadores y toda la información del proyecto.']},
 {v:'2.13',f:'2026-11-10',t:'Simulación en vivo con operación de válvulas y bombas, y termodinámica de tanques',c:['Botón «▶ Simulación» que enciende y apaga la simulación en vivo, incluidas las guías de flujo.','Las guías se mueven a la velocidad calculada de cada tramo, a la escala del dibujo.','Durante la simulación se abren y cierran válvulas, se regula su apertura, se arrancan y paran bombas y hay paro de emergencia; la red responde al instante.','Cada cierre calcula su golpe de ariete; el líquido atrapado entre dos cierres se calienta y sube de presión hasta el alivio hidrostático.','Balance de energía de los tanques: mezcla, calor de bomba, autorrefrigeración al vaciar, condensación al llenar y calor del ambiente.','Válvula de exceso de flujo con caudal de cierre, bomba fuera de servicio, apertura parcial de válvulas y ajuste de alivio de tanques.','Corrección: la red ya se resuelve con todas las válvulas cerradas y las bombas detenidas.']},
 {v:'2.12',f:'2026-11-10',t:'Sentidos de flujo según la física y guías de flujo como ISOFLUX',c:['Bombas, retenciones, exceso de flujo y by-pass se orientan solos según el caudal y las presiones del cálculo, sin importar el orden en que se dibujó la tubería.','Cada equipo direccional tiene «Sentido de flujo»: Automático (según la física) o Manual.','Tablas y fichas muestran «De → a», desnivel y presiones en el sentido real del flujo.','Guías de flujo rojas repetidas junto a cada tubería, como en ISOFLUX; con «Flujo» avanzan con el caudal. Símbolo elegible: chevron, triángulo, flecha o punto.']},
 {v:'2.11',f:'2026-11-10',t:'Botón «Aplicar correcciones»',c:['El diagnóstico marca con ⚙ los puntos que el módulo puede corregir solo y con ✋ los que requieren tu decisión.','«Aplicar correcciones» ejecuta las marcadas con ⚙, recalcula, repite la simulación y muestra qué cambió.','Corrige: diámetros fijos insuficientes, succión para NPSH, sentido de bombas y retenciones, cédula de la tubería, tiempo de cierre y tiempo máximo de simulación.','Todo queda en el historial: se deshace con Ctrl+Z.']},
 {v:'2.10',f:'2026-11-10',t:'Paleta del diseñador en franja superior y panel ocultable',c:['La paleta de equipos pasa a una franja superior, como en ISOFLUX: el dibujo gana todo el ancho izquierdo.','El panel derecho se puede ocultar y mostrar (botón «▤ Panel», tecla P o la pestaña del borde); se recuerda la preferencia.']},
 {v:'2.9',f:'2026-11-10',t:'Memoria de cálculo en formato Entalpía',c:['Portada oscura con el logo, título, proyecto, número de documento y fecha, como los informes de ISOFLUX.','Encabezado con logo y pie con numeración en todas las páginas.','Tablas con encabezado azul, tarjetas de resumen ejecutivo y plano isométrico en fondo oscuro.','Nuevos datos de proyecto: descripción, código, revisión, ubicación, elaboró, profesión y matrícula.','La tabla de verificaciones incluye la corrección sugerida.']},
 {v:'2.8',f:'2026-11-10',t:'Diagnóstico emergente al simular',c:['Al pulsar «Simular» se abre una ventana con los incumplimientos, la información faltante y las observaciones.','Cada punto trae al frente su corrección sugerida y un botón para ir al elemento en el dibujo.','Revisa también lo que ocurre durante el proceso: NPSH mínimo, velocidades, presión máxima y llenado incompleto.','Botón «Ver diagnóstico» para abrirlo en cualquier momento.']},

 {v:'2.6',f:'2026-11-10',t:'Caudal en kg y en galones, presión y capacidad de cada tubería',c:['Las etiquetas del dibujo muestran diámetro, caudal en masa y en galones, velocidad y presión de inicio → fin.','Cada tubería informa su capacidad a la velocidad máxima de su zona y el porcentaje de uso.','La tabla de tuberías incluye caudal y capacidad en ambas unidades.','Las etiquetas que se montarían una sobre otra se omiten del dibujo.']},

 {v:'1.0',f:'2026-11-10',t:'Calculadora de una línea de líquido',c:['Primera versión: dimensionamiento de una línea en serie con perfil de presión, NPSH, ariete y alivio hidrostático.']}];

const MAN=[
{t:'1. Qué es este módulo',b:`<p>GasLP_Liquido es un modelador de redes de <b>GLP en fase líquida</b>. Se dibuja la red en isométrico (tanques, bombas, válvulas, tuberías, consumos) y el módulo calcula caudales, velocidades y presiones en cada punto, elige diámetros, verifica que el líquido no se vaporice y simula el llenado de tanques en el tiempo.</p>
<p>Es un archivo independiente: funciona solo o abierto desde ISOFLUX. Trabaja siempre en régimen permanente; la simulación de llenado encadena muchos estados permanentes.</p>`},
{t:'2. La pantalla',b:`<ul><li><b>Barra superior</b>: herramientas de dibujo (Seleccionar, Tubería), paso y nivel de trabajo, deshacer, etiquetas, flujo animado, unidades, memoria, archivo y ayuda.</li>
<li><b>Paleta del diseñador (franja superior)</b>: equipos agrupados en Recipientes, Impulsión y retorno, Consumos, y Válvulas y equipos. Al abrir un grupo, sus equipos aparecen en la misma franja.</li>
<li><b>Lienzo (centro)</b>: dibujo isométrico. Ejes X y Z en el piso; el eje vertical es la elevación.</li>
<li><b>Panel (derecha)</b>, ocultable con «▤ Panel» o la tecla P, con cuatro pestañas: <b>Elemento</b> (datos de lo seleccionado), <b>Proyecto</b> (fluido, criterios, material), <b>Resultados</b> (dictamen, alturas, verificaciones, tablas) y <b>Simulación</b>.</li></ul>
<p>Todos los grupos son acordeones: inician cerrados y solo uno queda abierto por zona. Cada grupo indica a qué componentes aplica.</p>`},
{t:'3. Cómo dibujar una red',b:`<p>El dibujo funciona igual que en ISOFLUX.</p><ol><li>En la paleta del diseñador abre «Recipientes», elige <b>Tanque</b> y haz clic en el plano.</li>
<li>Elige <b>╱ Tubería</b> y haz clic en el punto inicial (un equipo, un punto de una tubería o el plano).</li>
<li>Elige el modo: <b>⬆ Subir</b>, <b>➡ Nivel</b> o <b>⬇ Bajar</b> (o las flechas del teclado). En «Nivel» el tramo sigue el eje X o Z más cercano al cursor; en «Subir» y «Bajar» va en vertical.</li>
<li>Mueve el cursor y haz clic para fijar cada tramo; la longitud se redondea al «Paso». Para una longitud exacta escribe el número y pulsa Enter.</li>
<li>Los puntos existentes se <b>imantan</b>: al pasar sobre ellos aparece un aro verde y el clic conecta ahí.</li>
<li><b>Clic derecho sin arrastrar</b>, doble clic o Esc terminan el trazo.</li>
<li>Coloca <b>bombas, válvulas y filtros</b> haciendo clic sobre una tubería: la parten en ese punto y se orientan con ella.</li>
<li>Termina cada ramal en un <b>vaporizador</b> o <b>consumo</b> y dibuja los <b>retornos</b> al tanque (cambia el «Servicio» de la tubería).</li></ol>
<p><b>Vista.</b> Arrastra con el <b>botón derecho</b> para girar, o usa <b>◍ Orbitar</b>. <b>ISO</b> vuelve a la vista isométrica, <b>PL</b> muestra la planta, <b>⟳</b> gira sola y <b>⤢</b> encuadra. Arrastrar el fondo (o botón central, o Mayús) mueve la vista; la rueda acerca y aleja.</p>
<p><b>Equipos en 3D.</b> Todos los equipos son sólidos que giran con la vista y se orientan según su tubería. El tanque muestra su nivel de líquido; una válvula de bola cerrada gira la palanca y la muestra en rojo. Codos y tees se deducen de la geometría.</p>`},
{t:'4. Componentes',b:`<table><tr><th>Componente</th><th>Qué hace</th><th>Datos principales</th></tr>
<tr><td>Tanque de almacenamiento</td><td>Fuente o receptor de líquido. Su presión es la de saturación a su temperatura.</td><td>Elevación de la boquilla, temperatura, capacidad, diámetro, llenado inicial, máximo y mínimo, conexión, fase vapor.</td></tr>
<tr><td>Tanque de condensados</td><td>Recipiente a su propia presión; normalmente una bomba lo devuelve al tanque principal.</td><td>Igual que el tanque; suele usar presión fija.</td></tr>
<tr><td>Bomba</td><td>Eleva la presión. Con «curva» el caudal resulta del equilibrio con la red.</td><td>Diferencial a caudal cero, caudal y diferencial nominales, NPSH requerido, eficiencia, sentido.</td></tr>
<tr><td>Válvula de by-pass</td><td>Abre cuando el diferencial supera su ajuste y devuelve el exceso al tanque.</td><td>Ajuste diferencial, sentido.</td></tr>
<tr><td>Vaporizador / Consumo</td><td>Punto de entrega con caudal fijo.</td><td>Consumo, presión mínima (opcional).</td></tr>
<tr><td>Válvulas de bola, globo, ESV</td><td>Pérdida de carga; pueden cerrarse para aislar un tramo.</td><td>Coeficiente K (vacío = típico), cerrada.</td></tr>
<tr><td>Retención, exceso de flujo</td><td>Pérdida de carga con sentido; la retención bloquea el flujo inverso.</td><td>K, sentido.</td></tr>
<tr><td>Filtro en Y, medidor</td><td>Pérdida de carga; el medidor admite una caída fija.</td><td>K o ΔP fijo.</td></tr></table>
<p>Un equipo en línea (bomba, by-pass, válvula, filtro) necesita <b>exactamente dos tuberías</b>.</p><p><b>Sentido de flujo.</b> No depende del orden en que dibujes. En «Automático (según la física)» el módulo orienta cada bomba hacia donde entrega caudal dentro de su curva (y, si puede hacerlo en ambos sentidos, hacia donde tiene mayor NPSH, es decir, con la succión del lado de su fuente); alinea retenciones y válvulas de exceso de flujo con el caudal, y el by-pass de la presión mayor a la menor. «Invertir» lo deja en «Manual» con el sentido contrario.</p>`},
{t:'5. Tuberías: diámetro, capacidad y uso',b:`<ul><li><b>Diámetro</b>: «Automático» toma el menor diámetro comercial que cumple la velocidad de su zona (y la fricción en descarga). También se puede fijar (aparece con 📌).</li>
<li><b>Servicio</b>: Líquido, Retorno de líquido (se calcula igual, otro color) o Vapor (solo se dibuja).</li>
<li><b>K adicional</b>: accesorios no dibujados. <b>Longitud real</b>: reemplaza la del dibujo.</li>
<li><b>Codos y tees</b> se deducen del dibujo; entrada y salida de tanques también.</li></ul>
<p><b>Capacidad</b> es el caudal que admite el diámetro a la velocidad máxima de su zona, y <b>Uso</b> el porcentaje que representa el caudal actual. Se muestran en kg/h y en galones. La capacidad no incluye el límite de fricción ni el NPSH, que pueden restringir antes.</p>
<p><b>Zonas</b>: «Succión / lado saturado» es todo lo que no está aguas abajo de una bomba; «Descarga» es lo presurizado por una bomba, incluidos los retornos.</p>`},
{t:'6. Alturas y desnivel',b:`<p>La altura de cada punto es su <b>Elevación</b>, medida desde un mismo nivel 0. Se ingresa en tres lugares:</p>
<ul><li>Pestaña <b>Resultados → Alturas del sistema · salida → llegada</b>: elevación de cada tanque, bomba y consumo, con el desnivel entre fuente y destino.</li>
<li>Al seleccionar una <b>tubería → Alturas del tramo</b>: elevación de inicio y de fin.</li>
<li>Al seleccionar un <b>equipo</b>: campo Elevación (en un tanque, «Elev. boquilla»).</li></ul>
<p><b>Por qué importa.</b> Cada metro que el líquido sube cuesta unos 0,05 bar (10 m ≈ 0,5 bar). En la <b>succión es crítico</b>: el líquido sale del tanque saturado, sin reserva de presión, y lo único que protege a la bomba de la cavitación es la altura del líquido sobre ella menos las pérdidas. Por eso la bomba va debajo del tanque y cerca de él. Sin bomba, una línea que sube hace que el líquido empiece a vaporizarse.</p>`},
{t:'7. Pestaña Proyecto',b:`<table><tr><th>Grupo</th><th>Aplica a</th><th>Qué define</th></tr>
<tr><td>Proyecto</td><td>Memoria</td><td>Identificación; no interviene en el cálculo.</td></tr>
<tr><td>Fluido</td><td>Toda la red</td><td>Mezcla (propano, n-butano, isobutano), temperatura del líquido y máxima, altitud. De aquí salen la presión de los tanques, la densidad y la viscosidad.</td></tr>
<tr><td>Criterios de diseño</td><td>Tuberías, bombas, consumos</td><td>Velocidad máxima en succión y descarga, fricción máxima, margen de NPSH, margen sobre burbuja, diámetro mínimo.</td></tr>
<tr><td>Tubería y diseño mecánico</td><td>Tuberías, válvulas</td><td>Material y cédula, unión, fabricación, corrosión, presión de diseño, ajuste del alivio, tiempo de cierre.</td></tr></table>
<p>Valores por defecto: 0,9 m/s en succión y 2,7 m/s en descarga; presión de diseño automática de 250 psig sin bomba y 350 psig con bomba.</p>`},
{t:'8. Resultados y verificaciones',b:`<ul><li><b>Dictamen</b>: Cumple, Con observaciones o No cumple.</li>
<li><b>Velocidad</b>: cada tubería frente al límite de su zona.</li>
<li><b>NPSH disponible</b>: debe superar el NPSH requerido de la bomba más el margen.</li>
<li><b>Fase líquida</b>: en cada consumo, presión frente a presión de burbuja. Si queda por debajo, el líquido se vaporiza (flash).</li>
<li><b>By-pass</b>: abierto o cerrado, y cuánto recircula.</li>
<li><b>Balance de tanques</b>: cuánto entrega o recibe cada uno y el tiempo estimado de llenado al caudal actual.</li>
<li><b>Presión de diseño y espesor</b> (ASME B31.3), <b>golpe de ariete</b> y <b>alivio hidrostático</b>.</li></ul>
<p>Un clic en una verificación o en una fila de tabla selecciona el elemento. Los equipos con incumplimiento se resaltan en rojo en el dibujo.</p>`},
{t:'9. Etiquetas del dibujo',b:`<p>Cada tubería con flujo muestra dos líneas: <b>diámetro · caudal en masa · caudal en galones</b> y <b>velocidad · presión de inicio → fin</b>. Los tanques y consumos muestran presión, porcentaje de llenado y elevación. Con la simulación encendida, las <b>guías de flujo</b> (símbolos rojos repetidos junto a cada tubería, como en ISOFLUX) indican el sentido físico del caudal.</p>
<p>«Etiquetas» las oculta o muestra. Las guías de flujo solo aparecen con la simulación en vivo encendida y avanzan a la velocidad calculada de cada tramo; «Guía» cambia el símbolo. Si dos etiquetas se montarían, una se omite: el dato sigue en la ficha del tramo y en la tabla.</p>`},
{t:'10. Simulación de llenado',b:`<ol><li>Selecciona cada tanque y escribe su <b>Capacidad</b>, diámetro, llenado inicial, llenado máximo y nivel mínimo.</li>
<li>En el tanque que se llena, elige la <b>fase vapor</b>: con retorno de vapor (igualación) o sin retorno.</li>
<li>En la pestaña <b>Simulación</b> pulsa «⏩ Hasta el final» para calcular todo el proceso de una vez, o «▶ Iniciar simulación en vivo» para verlo correr y operar los equipos.</li></ol>
<p>En cada instante se resuelve la red con el nivel, la temperatura y la presión que tienen los tanques en ese momento; se acumula la masa trasegada y se repite hasta que un tanque se llena, otro se agota o el flujo se detiene.</p>
<p>Al terminar se abre el <b>Diagnóstico</b>: lista los incumplimientos, la información faltante y las observaciones, cada uno con su <b>corrección sugerida</b> y un botón para ir al elemento. Incluye lo que ocurre durante el proceso (NPSH mínimo, velocidades, presión máxima, llenado incompleto). «Ver diagnóstico» lo abre de nuevo.</p>
<p><b>Aplicar correcciones</b> ejecuta las que el módulo puede hacer por sí mismo (marcadas con ⚙): pasar a «Automático» o agrandar diámetros fijos insuficientes, liberar la succión para cumplir el NPSH, invertir bombas o retenciones montadas al revés, cambiar a cédula 80, aumentar el tiempo de cierre y ampliar el tiempo máximo de simulación. Luego recalcula y muestra lo que cambió; se deshace con Ctrl+Z. Las marcadas con ✋ necesitan un dato de fabricante o un cambio en el dibujo y no se tocan.</p>
<p>Entrega duración, cantidad trasegada, caudal medio, NPSH mínimo y gráficas de llenado, nivel, presión, caudal y diferencial de bomba. El control deslizante recorre el proceso y el dibujo muestra ese instante.</p>
<p><b>Capacidad útil</b> de un tanque = (llenado máximo − mínimo) × capacidad × densidad. Para dimensionar almacenamiento: capacidad = consumo diario × días de autonomía ÷ (densidad × fracción útil).</p>`},
{t:'10 bis. Simulación en vivo y operación de equipos',b:`<p><b>▶ Simulación</b> (barra superior) enciende y apaga la simulación en vivo. Al encenderla el tiempo corre al <b>Ritmo</b> elegido (×1 a ×600), aparecen las <b>guías de flujo</b> y el panel muestra reloj, operación, tanques, bombas, eventos y curvas. Al apagarla, la red vuelve al estado de diseño que tenía.</p>
<p><b>Guías de flujo.</b> Se mueven a la velocidad calculada de cada tramo a la escala del dibujo (píxeles por segundo = velocidad en m/s × píxeles por metro), sin importar el ritmo del reloj. Un tramo sin caudal no muestra guías.</p>
<p><b>Operar.</b> Clic sobre una válvula de bola, de globo o ESV la cierra o abre; clic sobre una bomba la para o la arranca. En el panel hay además un control de <b>apertura</b> para regular y el botón <b>Paro de emergencia</b> (cierra las ESV y detiene las bombas).</p>
<p><b>Qué calcula en cada instante.</b></p><ul>
<li><b>Red</b>: caudales y presiones con el estado real de válvulas y bombas; el by-pass abre o cierra solo; la retención impide el retroceso.</li>
<li><b>Golpe de ariete</b> de cada cierre o paro: Joukowsky <code>ρ·a·Δv</code>, reducido si el cierre es más lento que <code>2L/a</code>; avisa si el pico supera la presión de diseño.</li>
<li><b>Líquido atrapado</b> entre dos cierres: se calienta hacia la temperatura máxima con constante <code>τ = ρ·c<sub>p</sub>·D/(4·U)</code> y su presión sube <code>dP/dT = (β − 3α)/(κ<sub>T</sub> + D/(E·t))</code> hasta abrir el alivio hidrostático.</li>
<li><b>Tanques</b>: masa y energía. La temperatura cambia por la mezcla con lo que entra, el calor de bomba <code>ΔT = ΔP/(ρ·η·c<sub>p</sub>)</code>, la autorrefrigeración al vaciar (hierve líquido para llenar el espacio de vapor), la condensación al llenar sin retorno de vapor y el intercambio con el ambiente <code>U·A·(T<sub>amb</sub> − T)</code>. La presión sigue a la de saturación.</li>
<li><b>Válvula de exceso de flujo</b>: cierra de golpe si el caudal supera su caudal de cierre; se rearma con un clic.</li>
<li><b>Alarmas</b>: cavitación, bomba sin caudal, llenado máximo, nivel mínimo, tanque lleno de líquido, alivio de tanque.</li></ul>
<p><b>Límites.</b> Es cuasi-estacionaria: cada instante es un equilibrio; no resuelve la onda de presión en el tiempo (el ariete se estima con la fórmula, no se propaga). La apertura parcial supone Cv proporcional a la apertura. Una bomba detenida no deja pasar caudal. La densidad se mantiene a la temperatura del líquido de Proyecto.</p>`},
{t:'11. Unidades',b:`<p>Menú <b>Unidades</b>: volumen (m³, L, gal), caudal (kg/h, lb/h, L/min, gal/min, gal/h, m³/h), presión (bar, psi, kPa), cantidad (kg, lb, gal, L), longitud y altura (m, ft), temperatura (°C, °F), velocidad (m/s, ft/s) y potencia (kW, hp). Hay tres combinaciones rápidas: SI, Galones e Inglés completo.</p>
<p>Las unidades son solo de presentación: el modelo y los archivos se guardan en SI. Los galones son US (3,785 L) y dependen de la densidad de la mezcla a la temperatura del líquido. Un consumo escrito en unidades de volumen se guarda como masa con la densidad del momento.</p>`},
{t:'12. Archivo, memoria y enlace con ISOFLUX',b:`<ul><li><b>Archivo</b>: exportar e importar la red en JSON, cargar ejemplos, red nueva.</li>
<li><b>Memoria</b>: informe en formato Entalpía (portada con logo, datos del proyecto, contenido, plano isométrico, memoria de cálculo, simulación y verificaciones con corrección sugerida). Se imprime o se guarda como PDF desde el diálogo del navegador; usa tamaño A4.</li>
<li>El trabajo se guarda solo en el navegador de este equipo; para llevarlo a otro, exporta el JSON.</li>
<li><b>Enviar a ISOFLUX</b>: entrega el resumen y el modelo al modelador principal. El puente definitivo del lado de ISOFLUX está pendiente.</li></ul>`},
{t:'13. Lo que debes saber antes de confiar en los números',b:`<ul>
<li><b>Cuasi-estacionario.</b> Cada instante es un equilibrio hidráulico; no propaga ondas de presión ni arranques en el tiempo. El golpe de ariete se estima con Joukowsky.</li><li><b>Termodinámica de tanques</b>: líquido bien mezclado a una sola temperatura y vapor en equilibrio con él; el coeficiente U con el ambiente es un dato tuyo (5–10 W/m²·K para acero al aire).</li>
<li><b>Líneas de vapor</b>: solo se dibujan; no entran al cálculo.</li>
<li><b>Curva de bomba</b>: parábola por dos puntos. Ajusta los puntos a la curva del fabricante cerca de la operación; a baja contrapresión puede sobrestimar el caudal.</li>
<li><b>Contrapresión sin retorno de vapor</b>: depende de «Vapor que condensa», 95 % por defecto. Es una hipótesis: calíbrala con un llenado real.</li>
<li><b>Llenado máximo de 85 %</b>: valor habitual por defecto. Confirma el límite con la tabla de la norma según densidad, temperatura y tamaño del tanque.</li>
<li><b>Coeficientes «típico»</b> de filtro, exceso de flujo, ESV y similares: reemplázalos por el dato del fabricante.</li>
<li><b>Geometría del tanque</b>: cilindro recto, sin casquetes.</li>
<li><b>Mezcla de corrientes</b>: la presión de burbuja se pondera por caudal donde se juntan líquidos de recipientes distintos.</li>
<li><b>Velocidad del sonido</b>: estimación (±8 %); solo afecta ariete y alivio hidrostático.</li>
<li><b>Propiedades</b>: presión de vapor y densidad dentro de ±0,5 % y viscosidad ±3 % frente a valores de referencia NIST, entre −40 y 50 °C.</li>
<li><b>Norma</b>: los criterios siguen la práctica de NFPA 58 / NTC 3853 y API RP 14E. Verifica contra la edición vigente; el módulo no reemplaza esa revisión ni el análisis de flexibilidad.</li></ul>`},
{t:'14. Fundamento de cálculo',b:'%FUND%'},
{t:'16. Herramientas: ventanas flotantes',b:`<p>El menú <b>Herramientas</b> abre ventanas flotantes iguales a las de ISOFLUX: se arrastran por la barra, se redimensionan por la esquina, «—» las minimiza, «⤢» las maximiza y «✕» las cierra. Se actualizan solas cuando cambia el modelo.</p>
<ul><li><b>Diagnóstico</b>: incumplimientos, datos faltantes y observaciones, cada uno con su corrección; «Aplicar correcciones» ejecuta las automáticas.</li>
<li><b>Auditor</b>: lista de requisitos agrupados por tema (presión y materiales, alivio hidrostático, bombas, tuberías, tanques, trasiego, calidad de datos). Cada uno muestra resultado, evidencia y corrección. «Verificar» son puntos que el dibujo no puede comprobar solo. Desmarca la casilla para declararlo «No aplica». Las referencias a normas indican el origen del criterio: confirma numeral y texto en la edición vigente.</li>
<li><b>Librería de ecuaciones</b>: todas las ecuaciones del módulo con variables, referencia y los valores del modelo sustituidos. Usa el elemento seleccionado; si no hay, el tramo de mayor velocidad.</li>
<li><b>Comportamiento en el tiempo</b>: ver sección 17.</li>
<li><b>Margen de error y factor de seguridad</b>: ver sección 18.</li>
<li><b>Glosario</b>: significado de cada término técnico.</li></ul>`},
{t:'17. El tiempo como factor de diseño',b:`<p>Cuando los tanques tienen capacidad, el módulo simula el proceso completo y reporta:</p>
<ul><li><b>Tanques</b>: instante en que cruzan el 25, 50 y 75 % y el llenado máximo, cantidad transferida, presión y temperatura inicial y final, y la estimación simple «al caudal inicial» para comparar.</li>
<li><b>Bombas</b>: caudal y diferencial al inicio y al final (al llenarse el receptor la bomba entrega menos), NPSH mínimo y cuándo ocurre, tiempo en marcha, volumen bombeado, energía y calentamiento del líquido.</li>
<li><b>Vaporizadores y consumos</b>: consumo en 1, 8 y 24 horas, presión de llegada mínima, margen sobre burbuja y <b>autonomía</b> (cuánto dura el producto útil de los tanques que los alimentan).</li>
<li><b>Tabla de tiempo</b> y gráficas de llenado, presión, temperatura, caudal y NPSH.</li></ul>
<p>El diagnóstico incluye un resumen de tiempos y el PDF consolidado trae la sección completa.</p>`},
{t:'18. Margen de error y factor de seguridad',b:`<p><b>Margen de error</b>: tabla con la banda en la que puede estar el valor real de cada resultado y de dónde proviene el error. Son estimaciones de ingeniería, no un análisis estadístico. El NPSH disponible es la magnitud más sensible.</p>
<p><b>Factor de seguridad</b>: actívalo y elige el factor (1,5 por defecto). Se aplica solo en los conceptos marcados: caudal de consumos, NPSH requerido, sobrepresión de golpe de ariete, espesor de pared requerido, y tiempos y autonomía. Queda indicado en verificaciones, diagnóstico e informe.</p>`},
{t:'19. Contraflujo entre tanques',b:`<p>Si un tanque entrega líquido a otro sin pasar por una bomba, aparece una alerta que explica cuáles tanques, con qué presión y nivel, y por qué. Ocurre cuando tanques comunicados tienen distinta presión de vapor (distinta temperatura) o distinto nivel.</p>
<p>La corrección habitual es una <b>válvula de retención en la entrada de cada tanque</b>; también cerrar las válvulas de los tanques que no participan, o unir las fases de vapor. Si es una batería que debe trabajar a nivel común, es el comportamiento esperado.</p>`},
{t:'20. Informe PDF consolidado',b:`<p><b>Informe ▸ Descargar PDF consolidado</b> genera un archivo .pdf en formato ENTALPÍA con portada, índice con número de página (con enlaces) y marcadores. Contiene: datos del proyecto, plano isométrico encuadrado automáticamente, parámetros, resultados hidráulicos, comportamiento en el tiempo, eventos de la simulación, verificaciones con correcciones, auditoría, margen de error y factor de seguridad, diseño mecánico, ecuaciones con valores, glosario y alcance.</p>
<p>«Imprimir memoria» sigue disponible para la memoria corta por el diálogo de impresión.</p>`},
{t:'21. Tutor de diseño',b:`<p>El botón <b>🎓 Tutor de diseño</b> abre una hoja de ruta de 13 pasos: bases de diseño, producto y temperaturas, demanda, almacenamiento, trazado, vaporizadores, almacenamiento, bomba y succión, tuberías, válvulas y protección, diseño mecánico, escenarios en el tiempo, verificación y entregables. Empieza con una lectura sobre lo que cambia al pasar de gas en fase vapor a líquido.</p>
<p>Cada paso muestra la información mínima requerida y su fuente, dónde se ingresa, el criterio de aceptación, los errores frecuentes y la evidencia que queda para auditoría. «Estado en tu modelo» evalúa el paso con los datos actuales; «Confirmaciones del ingeniero» son los puntos que el dibujo no puede comprobar y que marcas tú. El avance y las confirmaciones salen en el PDF consolidado.</p>`},
{t:'22. Vaporizadores',b:`<p>El vaporizador se dibuja como punto final de una línea de líquido (paleta ▸ Consumos ▸ Vaporizador). Su «Consumo» es el gas que debe entregar a la red de vapor en la hora de máxima demanda.</p>
<p><b>Herramientas ▸ Vaporizadores</b> abre una ventana con tres pestañas:</p>
<ul><li><b>En el diseño</b>: cada vaporizador con su modelo, unidades, demanda, capacidad instalada, uso, presión de llegada frente a la mínima, margen sobre burbuja, calor requerido, vapor producido y consumo propio. Desde ahí se cambia el modelo, las unidades y la reserva N+1; «Sugerido» propone el menor modelo que cubre la demanda con 10 % de holgura.</li>
<li><b>Catálogo</b>: tabla de modelos con capacidad (kg/h y gal/h), potencia útil, presiones, pérdida, temperatura de salida y conexiones. «＋ Agregar», ✎ editar, ⧉ duplicar y 🗑 eliminar (no deja eliminar un modelo en uso). Se exporta a CSV y «Restaurar base» recupera los modelos originales conservando los tuyos. El catálogo viaja con el modelo y queda como biblioteca del navegador.</li>
<li><b>Tipos y selección</b>: cuándo conviene cada tipo y qué necesita todo vaporizador.</li></ul>
<p>El catálogo base trae capacidades de catálogos de distribuidor para propano; potencia, presiones y temperatura están en blanco hasta que escribas el dato del fabricante. Lo que está en blanco no se comprueba.</p>
<p>El cálculo verifica: capacidad ≥ demanda (con factor de seguridad si está activo), reserva N+1, presión de llegada ≥ mínima, presión máxima de operación ≤ admisible, y potencia térmica si el catálogo la indica. Con más de 30 % de butanos avisa que la capacidad de catálogo es para propano.</p>`},
{t:'23. Atajos de teclado',b:`<table><tr><th>Tecla</th><th>Acción</th></tr><tr><td>T</td><td>Herramienta Tubería</td></tr><tr><td>Esc</td><td>Terminar el trazo / volver a Seleccionar</td></tr><tr><td>Números + Enter</td><td>Longitud exacta del tramo que se traza</td></tr><tr><td>Supr</td><td>Eliminar la selección</td></tr><tr><td>Ctrl+Z / Ctrl+Y</td><td>Deshacer / rehacer</td></tr><tr><td>↑ / ↓ / ← →</td><td>Con Tubería: modo Subir / Bajar / Nivel</td></tr><tr><td>Botón derecho + arrastrar</td><td>Girar la vista</td></tr><tr><td>Clic derecho</td><td>Terminar el trazo</td></tr><tr><td>Mayús o botón central + arrastrar</td><td>Mover la vista</td></tr><tr><td>F</td><td>Ajustar el dibujo a la ventana</td></tr><tr><td>P</td><td>Mostrar u ocultar el panel derecho</td></tr><tr><td>Rueda del ratón</td><td>Acercar o alejar</td></tr></table>`}];
/* glosario: término → explicación en lenguaje llano */
window.GLP_GLO=[
['NPSH','Sigla en inglés de «cabeza neta positiva de succión». Es cuánta presión, medida en metros de columna de líquido, tiene el líquido a la entrada de la bomba <b>por encima de la presión a la que empieza a hervir</b>. Si es poca, el líquido hierve dentro de la bomba (cavitación) y esta deja de bombear y se daña.'],
['NPSH disponible (NPSHd)','El NPSH que realmente ofrece tu instalación en la succión de la bomba. En GLP el líquido sale del tanque ya a punto de hervir, así que el NPSH disponible es prácticamente la <b>altura del líquido del tanque sobre la bomba, menos las pérdidas de la tubería de succión</b>. Lo calcula el módulo.'],
['NPSH requerido (NPSHr)','El NPSH mínimo que la bomba necesita para no cavitar. Es un <b>dato del fabricante</b> (sale de la curva de la bomba). Debe cumplirse: NPSH disponible ≥ NPSH requerido + margen.'],
['Cavitación','Formación y colapso de burbujas de vapor dentro de la bomba cuando la presión en su entrada cae por debajo de la de ebullición del líquido. Produce ruido, vibración, pérdida de caudal y desgaste.'],
['Presión de saturación (de vapor)','Presión a la que el líquido y su vapor están en equilibrio a una temperatura dada. Es la presión que marca un tanque de GLP: depende solo de la mezcla y de la temperatura, no de qué tan lleno esté.'],
['Presión de burbuja','Para una mezcla, la presión por debajo de la cual aparece la primera burbuja de vapor. Si la presión en un punto de la tubería baja de este valor, el líquido empieza a vaporizarse.'],
['Líquido saturado','Líquido que está justo en su punto de ebullición: cualquier caída de presión o calentamiento lo hace hervir. Así sale el GLP del tanque.'],
['Margen sobre burbuja','Diferencia entre la presión real en un punto y la presión de burbuja. Positivo = sigue líquido; negativo = se está vaporizando.'],
['Vaporización en línea (flash)','Parte del líquido se convierte en vapor dentro de la tubería porque la presión cayó por debajo de la de burbuja. Reduce la capacidad de la línea y afecta medidores y bombas.'],
['Diferencial de bomba','Aumento de presión que da la bomba: presión de descarga menos presión de succión.'],
['Curva de bomba','Relación entre el caudal que entrega una bomba y el diferencial que produce: a más contrapresión, menos caudal. El punto de operación es donde la curva de la bomba se cruza con la resistencia de la red.'],
['Válvula de by-pass (diferencial)','Válvula que se abre cuando el diferencial de la bomba supera un ajuste y devuelve el exceso de caudal al tanque. Protege la bomba cuando la descarga se cierra.'],
['Válvula de retención (antirretorno, check)','Deja pasar el líquido en un solo sentido. Evita que el líquido se devuelva cuando la bomba para o cuando un tanque tiene más presión que otro.'],
['Contraflujo','Flujo en sentido contrario al previsto. Entre tanques comunicados ocurre solo: el que tiene más presión o más nivel empuja líquido hacia los demás hasta igualarse.'],
['Válvula de exceso de flujo','Válvula que se cierra sola si el caudal supera un valor (por ejemplo, al romperse una manguera). Se rearma cuando las presiones se igualan.'],
['ESV (válvula de cierre de emergencia)','Válvula de cierre rápido, manual, remoto o térmico, para aislar una línea de trasiego en una emergencia.'],
['Golpe de ariete','Sobrepresión brusca que aparece al detener de golpe un líquido en movimiento (cierre rápido de válvula o paro de bomba). Se calcula con la fórmula de Joukowsky.'],
['Celeridad','Velocidad a la que viaja la onda de presión del golpe de ariete por la tubería; depende del líquido y de la rigidez del tubo.'],
['Alivio hidrostático','Válvula pequeña de alivio que protege un tramo de tubería que puede quedar lleno de líquido entre dos válvulas cerradas. Sin ella, unos pocos grados de calentamiento suben la presión decenas de bar.'],
['Líquido atrapado','Líquido encerrado entre dos cierres. Al calentarse quiere dilatarse y, como no puede, la presión sube muy rápido.'],
['Retorno de vapor (igualación)','Tubería que une la fase vapor del tanque que se llena con la del tanque que se vacía. Mantiene las presiones iguales y hace el trasiego más rápido y con menos esfuerzo de bomba.'],
['Autorrefrigeración','Enfriamiento del líquido de un tanque que se vacía: parte del líquido hierve para llenar el espacio que queda y toma el calor del propio líquido.'],
['Capacidad de agua','Volumen geométrico total del tanque, es decir, el agua que cabría si se llenara por completo. Es como se rotulan los tanques de GLP.'],
['Llenado máximo','Porcentaje del volumen del tanque que puede ocuparse con líquido; el resto debe quedar para vapor y para la dilatación. Habitualmente 80–85 %.'],
['Cabeza (altura de columna)','Presión expresada como altura de líquido: 1 m de GLP equivale a unos 0,05 bar.'],
['Desnivel','Diferencia de elevación entre dos puntos. Subir consume presión; bajar la aporta.'],
['Presión manométrica y absoluta','Manométrica (bar man, psig) es la que lee un manómetro: por encima de la atmosférica. Absoluta = manométrica + atmosférica. Las propiedades del gas se calculan con la absoluta.'],
['Cédula (schedule)','Serie de espesor de pared de un tubo de acero. Cédula 80 es más gruesa que cédula 40 para el mismo diámetro.'],
['Diámetro nominal','Nombre comercial del tubo en pulgadas (por ejemplo 2"). No es el diámetro interior real, que depende de la cédula.'],
['Coeficiente K','Número que mide cuánta presión pierde el líquido al pasar por un accesorio o una válvula: pérdida = K × (energía de velocidad).'],
['Cv','Coeficiente de caudal de una válvula que da el fabricante: caudal de agua en gal/min que pasa con 1 psi de caída. A mayor Cv, menos pérdida.'],
['Número de Reynolds','Indica si el flujo es ordenado (laminar) o turbulento. En tuberías de GLP casi siempre es turbulento.'],
['Factor de fricción','Coeficiente que relaciona la pérdida de presión por rozamiento con la velocidad, el diámetro y la longitud. Se obtiene con la ecuación de Colebrook-White.'],
['Rugosidad','Aspereza interior del tubo; a más rugosidad, más pérdida por fricción.'],
['Cuasi-estacionario','Forma de simular en el tiempo: cada instante se calcula como un equilibrio y luego se avanza un paso. No reproduce las ondas de presión.'],
['Factor de seguridad','Número mayor que 1 por el que se multiplica una exigencia para cubrir incertidumbres. Aquí, 1,5 por defecto.'],
['Margen de error','Banda dentro de la cual puede estar el valor real respecto al calculado, por la precisión de las fórmulas y de los datos.'],
['Vaporizador','Equipo que convierte el GLP líquido en vapor aportando calor (resistencias eléctricas, baño de agua caliente o llama). Se usa cuando la vaporización natural del tanque no alcanza para la demanda.'],
['Vaporización natural','Vapor que produce un tanque por sí solo tomando calor del ambiente a través de su pared mojada. Depende del tamaño del tanque, su nivel y la temperatura; cuando no alcanza, se necesita un vaporizador.'],
['Arrastre de líquido','Paso de líquido sin vaporizar a la salida del vaporizador, por sobrecarga o falta de calor. Los equipos traen una protección que cierra la entrada.'],
['Reserva N+1','Criterio de instalar una unidad más de las necesarias, para atender la demanda con una fuera de servicio.'],
['GLP','Gas licuado del petróleo: mezcla de propano y butanos que se almacena líquida a presión y temperatura ambiente.'],
['PCI','Poder calorífico inferior: energía útil que entrega el combustible al quemarse.']];
const gloHTML=q=>{const f=(q||'').toLowerCase();const L=GLP_GLO.filter(x=>!f||(x[0]+' '+x[1]).toLowerCase().includes(f));return L.length?L.map(x=>`<div class="glo"><b>${x[0]}</b><p>${x[1]}</p></div>`).join(''):'<p class="hint">Sin coincidencias.</p>';};

 DEMOS.map(x=>`<div class="ver" style="display:flex;align-items:center;gap:10px;justify-content:space-between"><div><h3 style="margin:0"><span>›</span> ${x.n}</h3><p style="margin:4px 0 0;color:var(--mut,#8892a6)">${x.d}</p></div><button data-demo="${x.k}" class="pri" style="flex:none">Cargar</button></div>`).join('');
