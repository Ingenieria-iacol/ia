    <script>
        tailwind.config = {
            darkMode: 'class',

    <style>
        :root {
            --ti-950: #070a10; --ti-900: #0c1119; --ti-850: #101722; --ti-800: #151e2b;
            --eng-line: #243245; --eng-line-soft: #1a2535;
            --steel-200: #d3e0ef; --steel-300: #a9bdd3; --steel-400: #7f9bbb; --steel-500: #4f78a8; --steel-600: #34598a; --steel-700: #243f66;
        }
        body {
            background-color: var(--ti-950);
            color: #e5e5e5;
            font-family: 'Bahnschrift', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image:
                linear-gradient(rgba(127,155,187,.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(127,155,187,.06) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .panel {
            background: linear-gradient(180deg, rgba(21,30,43,.94) 0%, rgba(12,17,25,.94) 100%);
            border: 1px solid var(--eng-line);
            box-shadow: 0 16px 36px rgba(0,0,0,.4), inset 0 0 0 1px rgba(169,189,211,.04);
        }
        .metal-edge { height: 2px; background: linear-gradient(90deg, transparent, var(--steel-500) 20%, var(--steel-200) 50%, var(--steel-500) 80%, transparent); }
        .metal-text { background: linear-gradient(180deg, #ffffff 0%, var(--steel-200) 55%, var(--steel-400) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .metal-fill {
            background: linear-gradient(180deg, #a9c8ec 0%, #5d8cc4 46%, #2f5686 54%, #4476ad 100%);
            border: 1px solid #a9c8ec; color: #06101e; font-weight: 800;
            text-shadow: 0 1px 0 rgba(255,255,255,.35);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.25), 0 6px 18px rgba(47,86,134,.35);
        }
        .metal-fill:hover { filter: brightness(1.08); }
        .key {
            background: linear-gradient(180deg, #1c2738, #121a27);
            border: 1px solid var(--eng-line);
            color: var(--steel-200);
            transition: border-color .15s ease, background .15s ease, transform .1s ease;
        }
        .key:hover { border-color: var(--steel-400); background: linear-gradient(180deg, #243349, #162133); }
        .key:active { transform: scale(.95); }
        .key-fn { color: var(--steel-300); background: linear-gradient(180deg, #172233, #0f1623); }
        .key-op { color: #ffd88a; }
        .tile { background: linear-gradient(180deg, #2c4a74 0%, #172a46 100%); border: 1px solid var(--steel-600); color: var(--steel-200); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); transition: background .2s ease, color .2s ease; }
        .app-card { background: linear-gradient(180deg, var(--ti-800), var(--ti-900)); border: 1px solid var(--eng-line); transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
        .app-card:hover { transform: translateY(-3px); border-color: var(--steel-500); box-shadow: 0 18px 36px rgba(0,0,0,.5); }
        .app-card:hover .tile { background: linear-gradient(180deg, #a9c8ec 0%, #4476ad 100%); color: #06101e; border-color: #a9c8ec; }
        .field { background: #0c1119; border: 1px solid var(--eng-line); color: #e5e5e5; }
        .field:focus { outline: none; border-color: var(--steel-400); box-shadow: 0 0 0 1px var(--steel-400); }
        .eng-focus:focus-visible { outline: 2px solid var(--steel-300); outline-offset: 2px; }
        .readout { font-variant-numeric: tabular-nums; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--ti-950); }
        ::-webkit-scrollbar-thumb { background: #2a3a52; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--steel-500); }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #5fcf9b; }
        @media (prefers-reduced-motion: reduce) {
            .app-card, .key { transition: none; }
            .app-card:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- ALMACENAMIENTO (tolerante a navegadores que lo bloquean) ---
        const store = {
            get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
        };

        // --- ICONOS SVG (sin librerías externas) ---
        const Svg = ({ size = 20, children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{children}</svg>
        );
        const IconScan = ({ size }) => <Svg size={size}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></Svg>;
        const IconVideo = ({ size }) => <Svg size={size}><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10.5 5.5-3.5v10L16 13.5"/></Svg>;
        const IconSpeaker = ({ size }) => <Svg size={size}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></Svg>;
        const IconInvoice = ({ size }) => <Svg size={size}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></Svg>;
        const IconChat = ({ size }) => <Svg size={size}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></Svg>;
        const IconClipboard = ({ size }) => <Svg size={size}><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><polyline points="9 14 11 16 15 12"/></Svg>;
        const IconExternal = ({ size }) => <Svg size={size}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></Svg>;
        const IconClock = ({ size }) => <Svg size={size}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Svg>;
        const IconCalc = ({ size }) => <Svg size={size}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="12" y1="10" x2="12.01" y2="10"/><line x1="16" y1="10" x2="16.01" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></Svg>;
        const IconGraph = ({ size }) => <Svg size={size}><path d="M3 3v18h18"/><path d="M7 15c2-8 4-8 6-2s4 4 6-5"/></Svg>;
        const IconNote = ({ size }) => <Svg size={size}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></Svg>;
        const IconCheck = ({ size = 16 }) => <Svg size={size}><polyline points="20 6 9 17 4 12"/></Svg>;
        const IconTrash = ({ size = 16 }) => <Svg size={size}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Svg>;
        const IconPlus = ({ size = 18 }) => <Svg size={size}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
        const IconSound = ({ size = 18, off }) => <Svg size={size}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>{off ? <><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></> : <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>}</Svg>;

        // --- SONIDOS ---
        let soundOn = store.get('ENTALPIA_sound', '1') !== '0';
        const playSound = (type) => {
            if (!soundOn) return;
            const sounds = {
                click: "https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3",
                success: "https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3", 
                delete: "https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3"
            };
            const audio = new Audio(sounds[type]);
            audio.volume = 0.3;
            audio.play().catch(e => console.log("Audio play prevented")); 
        };

        // <<PARSER
        // --- MOTOR DE EXPRESIONES MATEMÁTICAS (sin eval) ---
        const FN_NAMES = new Set(['asin', 'acos', 'atan', 'sqrt', 'sin', 'cos', 'tan', 'abs', 'exp', 'ln', 'log']);
        const NAMES = ['asin', 'acos', 'atan', 'sqrt', 'sin', 'cos', 'tan', 'abs', 'exp', 'ln', 'log', 'pi', 'ans', 'x', 'e'];

        function tokenize(src) {
            const s = src.replace(/\s+/g, '').replace(/,/g, '.');
            const out = [];
            let i = 0;
            while (i < s.length) {
                const c = s[i];
                if (/[0-9.]/.test(c)) {
                    let j = i, dot = false;
                    while (j < s.length && /[0-9.]/.test(s[j])) {
                        if (s[j] === '.') { if (dot) throw new Error('Número no válido'); dot = true; }
                        j++;
                    }
                    const txt = s.slice(i, j);
                    if (txt === '.') throw new Error('Número no válido');
                    out.push({ t: 'num', v: parseFloat(txt) });
                    i = j; continue;
                }
                if ('+-*/^()'.includes(c)) { out.push({ t: 'op', v: c }); i++; continue; }
                if (c === '×') { out.push({ t: 'op', v: '*' }); i++; continue; }
                if (c === '÷') { out.push({ t: 'op', v: '/' }); i++; continue; }
                if (c === '−') { out.push({ t: 'op', v: '-' }); i++; continue; }
                if (c === 'π') { out.push({ t: 'sym', v: 'pi' }); i++; continue; }
                if (c === '√') { out.push({ t: 'fn', v: 'sqrt' }); i++; continue; }
                if (/[a-zA-Z]/.test(c)) {
                    const rest = s.slice(i).toLowerCase();
                    const name = NAMES.find(n => rest.startsWith(n));
                    if (!name) throw new Error('Símbolo no reconocido');
                    out.push(FN_NAMES.has(name) ? { t: 'fn', v: name } : { t: 'sym', v: name });
                    i += name.length; continue;
                }
                throw new Error('Símbolo no reconocido: ' + c);
            }
            return out;
        }

        function parse(tokens) {
            let p = 0;
            const peek = () => tokens[p];
            const next = () => tokens[p++];
            const isOp = (t, v) => t && t.t === 'op' && t.v === v;
            const startsFactor = (t) => t && (t.t === 'num' || t.t === 'fn' || t.t === 'sym' || isOp(t, '('));

            function expr() {
                let n = term();
                while (isOp(peek(), '+') || isOp(peek(), '-')) {
                    const op = next().v;
                    n = { k: 'bin', op, a: n, b: term() };
                }
                return n;
            }
            function term() {
                let n = unary();
                for (;;) {
                    const t = peek();
                    if (isOp(t, '*') || isOp(t, '/')) { next(); n = { k: 'bin', op: t.v, a: n, b: unary() }; }
                    else if (startsFactor(t)) { n = { k: 'bin', op: '*', a: n, b: power() }; } // multiplicación implícita: 2x, 3(x+1)
                    else break;
                }
                return n;
            }
            function unary() {
                const t = peek();
                if (isOp(t, '-') || isOp(t, '+')) { next(); const a = unary(); return t.v === '-' ? { k: 'neg', a } : a; }
                return power();
            }
            function power() {
                const b = atom();
                if (isOp(peek(), '^')) { next(); return { k: 'bin', op: '^', a: b, b: unary() }; }
                return b;
            }
            function atom() {
                const t = next();
                if (!t) throw new Error('Expresión incompleta');
                if (t.t === 'num') return { k: 'num', v: t.v };
                if (t.t === 'sym') return { k: 'sym', v: t.v };
                if (t.t === 'fn') {
                    if (isOp(peek(), '(')) {
                        next();
                        const a = expr();
                        if (peek()) { if (!isOp(next(), ')')) throw new Error('Falta cerrar el paréntesis'); }
                        return { k: 'fn', f: t.v, a };
                    }
                    return { k: 'fn', f: t.v, a: power() };
                }
                if (isOp(t, '(')) {
                    const a = expr();
                    if (peek()) { if (!isOp(next(), ')')) throw new Error('Falta cerrar el paréntesis'); }
                    return a;
                }
                throw new Error('Expresión no válida');
            }

            if (!tokens.length) throw new Error('Expresión vacía');
            const ast = expr();
            if (p < tokens.length) throw new Error('Expresión no válida');
            return ast;
        }

        function evalAst(n, env) {
            switch (n.k) {
                case 'num': return n.v;
                case 'sym':
                    if (n.v === 'pi') return Math.PI;
                    if (n.v === 'e') return Math.E;
                    if (n.v === 'ans') return env.ans || 0;
                    if (n.v === 'x') { if (env.x === undefined) throw new Error('La variable x no está definida aquí'); return env.x; }
                    throw new Error('Símbolo no reconocido');
                case 'neg': return -evalAst(n.a, env);
                case 'bin': {
                    const a = evalAst(n.a, env), b = evalAst(n.b, env);
                    switch (n.op) {
                        case '+': return a + b;
                        case '-': return a - b;
                        case '*': return a * b;
                        case '/': return a / b;
                        case '^': return Math.pow(a, b);
                    }
                    throw new Error('Operador no válido');
                }
                case 'fn': {
                    const v = evalAst(n.a, env);
                    const toRad = (z) => env.deg ? z * Math.PI / 180 : z;
                    const fromRad = (z) => env.deg ? z * 180 / Math.PI : z;
                    switch (n.f) {
                        case 'sin': return Math.sin(toRad(v));
                        case 'cos': return Math.cos(toRad(v));
                        case 'tan': return Math.tan(toRad(v));
                        case 'asin': return fromRad(Math.asin(v));
                        case 'acos': return fromRad(Math.acos(v));
                        case 'atan': return fromRad(Math.atan(v));
                        case 'ln': return Math.log(v);
                        case 'log': return Math.log10(v);
                        case 'sqrt': return Math.sqrt(v);
                        case 'abs': return Math.abs(v);
                        case 'exp': return Math.exp(v);
                    }
                    throw new Error('Función no válida');
                }
            }
            throw new Error('Expresión no válida');
        }

        function formatNum(v) {
            if (!isFinite(v)) return 'Indefinido';
            if (Math.abs(v) < 1e-12) return '0';
            return String(parseFloat(v.toPrecision(12))).replace('.', ',');
        }
        // PARSER>>

        function calcEval(src, deg, ans) {
            const v = evalAst(parse(tokenize(src)), { deg, ans });
            if (typeof v !== 'number' || Number.isNaN(v)) throw new Error('Operación no válida');
            return v;
        }

        // --- COMPONENTES ---

        const Card = ({ children, className = "" }) => (
            <div className={`panel relative rounded-xl overflow-hidden p-6 ${className}`}>
                <div className="metal-edge absolute top-0 left-0 right-0 opacity-70"></div>
                {children}
            </div>
        );

        const WidgetTitle = ({ icon, children, hint }) => (
            <div className="flex items-center justify-between gap-3 mb-4">
                <div className="flex items-center gap-2 text-steel-300">
                    <span className="text-steel-400">{icon}</span>
                    <h3 className="font-bold text-white">{children}</h3>
                </div>
                {hint && <span className="text-xs text-steel-400">{hint}</span>}
            </div>
        );

        // 1. CALCULADORA CIENTÍFICA
        const CalculatorWidget = () => {
            const [expr, setExpr] = useState("");
            const [deg, setDeg] = useState(true);
            const [ans, setAns] = useState(0);

            const preview = useMemo(() => {
                if (!expr.trim()) return { text: "0", error: false };
                try { return { text: formatNum(calcEval(expr, deg, ans)), error: false }; }
                catch (e) { return { text: e.message, error: true }; }
            }, [expr, deg, ans]);

            const press = (val) => {
                playSound('click');
                if (val === 'C') return setExpr("");
                if (val === '⌫') return setExpr(expr.replace(/(asin\(|acos\(|atan\(|sqrt\(|sin\(|cos\(|tan\(|log\(|ln\(|√\(|Ans|.)$/u, ''));
                if (val === 'MODE') return setDeg(!deg);
                if (val === '=') {
                    if (!expr.trim()) return;
                    try {
                        const v = calcEval(expr, deg, ans);
                        if (!isFinite(v)) return;
                        setAns(v);
                        setExpr(formatNum(v));
                    } catch (e) { /* el mensaje ya se muestra en la vista previa */ }
                    return;
                }
                const map = { 'x²': '^2', 'Ans': 'ans' };
                setExpr(expr + (map[val] || val));
            };

            const rows = [
                ['sin(', 'cos(', 'tan(', 'MODE'],
                ['ln(', 'log(', '√(', '^'],
                ['(', ')', 'π', '⌫'],
                ['7', '8', '9', '÷'],
                ['4', '5', '6', '×'],
                ['1', '2', '3', '−'],
                ['0', '.', 'Ans', '+'],
                ['C', 'x²', 'e', '=']
            ];
            const kind = (b) => b === '=' ? 'metal-fill' : ['sin(', 'cos(', 'tan(', 'ln(', 'log(', '√(', '^', '(', ')', 'π', 'x²', 'e', 'Ans', 'MODE'].includes(b) ? 'key key-fn' : ['÷', '×', '−', '+'].includes(b) ? 'key key-op' : 'key';

            return (
                <Card className="lg:col-span-1">
                    <WidgetTitle icon={<IconCalc />} hint="Calculadora científica">Calculadora</WidgetTitle>
                    <label htmlFor="calcInput" className="sr-only">Expresión</label>
                    <input
                        id="calcInput"
                        value={expr}
                        onChange={(e) => setExpr(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') press('='); }}
                        placeholder="Escribe o usa las teclas"
                        autoComplete="off" spellCheck="false"
                        className="field readout w-full rounded-lg px-3 py-2 text-right text-xl font-mono"
                    />
                    <div className={`readout text-right text-sm mt-2 mb-3 h-5 truncate ${preview.error ? 'text-ember' : 'text-steel-300'}`} aria-live="polite">
                        {expr.trim() ? (preview.error ? preview.text : '= ' + preview.text) : ''}
                    </div>
                    <div className="grid grid-cols-4 gap-2">
                        {rows.flat().map((btn) => (
                            <button key={btn} onClick={() => press(btn)}
                                aria-label={btn === 'MODE' ? (deg ? 'Modo grados activo; cambiar a radianes' : 'Modo radianes activo; cambiar a grados') : btn === '⌫' ? 'Borrar' : btn}
                                className={`${kind(btn)} eng-focus h-10 rounded-lg text-sm font-semibold`}>
                                {btn === 'MODE' ? (deg ? 'DEG' : 'RAD') : btn}
                            </button>
                        ))}
                    </div>
                </Card>
            );
        };

        // 2. GRAFICADORA
        const compileFn = (src) => {
            if (!src.trim()) return null;
            try {
                const ast = parse(tokenize(src));
                evalAst(ast, { x: 0, deg: false, ans: 0 }); // valida variables y símbolos
                return { fn: (x) => { try { return evalAst(ast, { x, deg: false, ans: 0 }); } catch (e) { return NaN; } } };
            } catch (e) {
                return { error: e.message };
            }
        };
        const niceStep = (range) => {
            const raw = range / 8;
            const p = Math.pow(10, Math.floor(Math.log10(raw)));
            const m = raw / p;
            return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
        };
        const tidy = (v) => String(parseFloat(v.toPrecision(6)));

        const GraphWidget = () => {
            const canvasRef = useRef(null);
            const [fx, setFx] = useState('sin(x)');
            const [gx, setGx] = useState('x^2/10');
            const [xmin, setXmin] = useState('-10');
            const [xmax, setXmax] = useState('10');
            const [hover, setHover] = useState(null);
            const [tick, setTick] = useState(0);

            const compiled = useMemo(() => ({ f: compileFn(fx), g: compileFn(gx) }), [fx, gx]);
            const range = useMemo(() => {
                const a = parseFloat(xmin.replace(',', '.')), b = parseFloat(xmax.replace(',', '.'));
                return (isFinite(a) && isFinite(b) && a < b) ? [a, b] : null;
            }, [xmin, xmax]);

            const yr = useMemo(() => {
                if (!range) return [-1, 1];
                const vals = [];
                [compiled.f, compiled.g].forEach(c => {
                    if (c && c.fn) for (let i = 0; i <= 400; i++) {
                        const y = c.fn(range[0] + (range[1] - range[0]) * i / 400);
                        if (isFinite(y) && Math.abs(y) < 1e9) vals.push(y);
                    }
                });
                if (!vals.length) return [-1, 1];
                vals.sort((a, b) => a - b);
                const lo = vals[Math.floor(vals.length * 0.02)], hi = vals[Math.ceil(vals.length * 0.98) - 1];
                if (hi - lo < 1e-9) return [lo - 1, hi + 1];
                const pad = (hi - lo) * 0.15;
                return [lo - pad, hi + pad];
            }, [compiled, range]);

            useEffect(() => {
                const onResize = () => setTick(t => t + 1);
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                const w = rect.width, h = rect.height;
                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                const ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = '#0c1119';
                ctx.fillRect(0, 0, w, h);
                if (!range) return;

                const [a, b] = range, [y0, y1] = yr;
                const X = (x) => (x - a) / (b - a) * w;
                const Y = (y) => h - (y - y0) / (y1 - y0) * h;

                ctx.font = '11px Segoe UI, sans-serif';
                const sx = niceStep(b - a), sy = niceStep(y1 - y0);
                ctx.lineWidth = 1;
                for (let x = Math.ceil(a / sx) * sx; x <= b; x += sx) {
                    ctx.strokeStyle = '#1a2535'; ctx.beginPath(); ctx.moveTo(X(x), 0); ctx.lineTo(X(x), h); ctx.stroke();
                }
                for (let y = Math.ceil(y0 / sy) * sy; y <= y1; y += sy) {
                    ctx.strokeStyle = '#1a2535'; ctx.beginPath(); ctx.moveTo(0, Y(y)); ctx.lineTo(w, Y(y)); ctx.stroke();
                }
                // Ejes
                const axisX = (y0 <= 0 && y1 >= 0) ? Y(0) : (y0 > 0 ? h - 1 : 1);
                const axisY = (a <= 0 && b >= 0) ? X(0) : (a > 0 ? 1 : w - 1);
                ctx.strokeStyle = '#4f78a8'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(0, axisX); ctx.lineTo(w, axisX); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(axisY, 0); ctx.lineTo(axisY, h); ctx.stroke();
                // Etiquetas
                ctx.fillStyle = '#7f9bbb';
                for (let x = Math.ceil(a / sx) * sx; x <= b; x += sx) {
                    if (Math.abs(x) < sx / 100) continue;
                    ctx.textAlign = 'center';
                    ctx.fillText(tidy(x), X(x), Math.min(h - 4, Math.max(12, axisX + 14)));
                }
                for (let y = Math.ceil(y0 / sy) * sy; y <= y1; y += sy) {
                    if (Math.abs(y) < sy / 100) continue;
                    ctx.textAlign = 'left';
                    ctx.fillText(tidy(y), Math.min(w - 36, Math.max(4, axisY + 5)), Y(y) - 3);
                }

                // Curvas
                ctx.save();
                ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                const plot = (c, color) => {
                    if (!c || !c.fn) return;
                    ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.beginPath();
                    let pen = false, prev = null;
                    const N = Math.max(300, Math.floor(w));
                    for (let i = 0; i <= N; i++) {
                        const x = a + (b - a) * i / N, y = c.fn(x);
                        if (!isFinite(y)) { pen = false; prev = null; continue; }
                        const px = X(x), py = Y(y);
                        if (!pen || (prev !== null && Math.abs(py - prev) > h)) { ctx.moveTo(px, py); pen = true; } else { ctx.lineTo(px, py); }
                        prev = py;
                    }
                    ctx.stroke();
                };
                plot(compiled.f, '#a9c8ec');
                plot(compiled.g, '#ffb020');
                ctx.restore();

                // Cursor
                if (hover) {
                    ctx.strokeStyle = 'rgba(211,224,239,.35)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(X(hover.x), 0); ctx.lineTo(X(hover.x), h); ctx.stroke(); ctx.setLineDash([]);
                    [[hover.f, '#a9c8ec'], [hover.g, '#ffb020']].forEach(([v, col]) => {
                        if (v !== null && isFinite(v) && Y(v) >= 0 && Y(v) <= h) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X(hover.x), Y(v), 4.5, 0, Math.PI * 2); ctx.fill(); }
                    });
                }
            }, [compiled, range, yr, tick, hover]);

            const onMove = (e) => {
                if (!range) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = range[0] + ((e.clientX - rect.left) / rect.width) * (range[1] - range[0]);
                setHover({
                    x,
                    f: compiled.f && compiled.f.fn ? compiled.f.fn(x) : null,
                    g: compiled.g && compiled.g.fn ? compiled.g.fn(x) : null
                });
            };

            const zoom = (factor) => {
                if (!range) return;
                const c = (range[0] + range[1]) / 2, half = (range[1] - range[0]) / 2 * factor;
                setXmin(tidy(c - half)); setXmax(tidy(c + half));
            };

            const errMsg = (c) => c && c.error ? c.error : null;
            const readout = (v) => (v === null || v === undefined) ? '—' : formatNum(v);

            return (
                <Card className="lg:col-span-2">
                    <WidgetTitle icon={<IconGraph />} hint="Graficadora de funciones">Graficadora</WidgetTitle>
                    <div className="grid sm:grid-cols-2 gap-3 mb-3">
                        <div>
                            <label htmlFor="fx" className="flex items-center gap-2 text-xs text-steel-300 mb-1"><span className="w-3 h-1 rounded bg-[#a9c8ec]"></span>f(x) =</label>
                            <input id="fx" value={fx} onChange={(e) => setFx(e.target.value)} spellCheck="false" autoComplete="off" className="field w-full rounded-lg px-3 py-2 font-mono text-sm" placeholder="sin(x)" />
                            {errMsg(compiled.f) && <p className="text-xs text-ember mt-1">{errMsg(compiled.f)}</p>}
                        </div>
                        <div>
                            <label htmlFor="gx" className="flex items-center gap-2 text-xs text-steel-300 mb-1"><span className="w-3 h-1 rounded bg-[#ffb020]"></span>g(x) =</label>
                            <input id="gx" value={gx} onChange={(e) => setGx(e.target.value)} spellCheck="false" autoComplete="off" className="field w-full rounded-lg px-3 py-2 font-mono text-sm" placeholder="x^2/10" />
                            {errMsg(compiled.g) && <p className="text-xs text-ember mt-1">{errMsg(compiled.g)}</p>}
                        </div>
                    </div>
                    <div className="flex flex-wrap items-end gap-3 mb-3">
                        <div>
                            <label htmlFor="xmin" className="block text-xs text-steel-300 mb-1">x mínimo</label>
                            <input id="xmin" value={xmin} onChange={(e) => setXmin(e.target.value)} className="field w-24 rounded-lg px-3 py-1.5 font-mono text-sm" />
                        </div>
                        <div>
                            <label htmlFor="xmax" className="block text-xs text-steel-300 mb-1">x máximo</label>
                            <input id="xmax" value={xmax} onChange={(e) => setXmax(e.target.value)} className="field w-24 rounded-lg px-3 py-1.5 font-mono text-sm" />
                        </div>
                        <div className="flex gap-2 ml-auto">
                            <button onClick={() => zoom(0.7)} aria-label="Acercar" className="key eng-focus w-10 h-9 rounded-lg font-bold">+</button>
                            <button onClick={() => zoom(1 / 0.7)} aria-label="Alejar" className="key eng-focus w-10 h-9 rounded-lg font-bold">−</button>
                            <button onClick={() => { setXmin('-10'); setXmax('10'); }} className="key eng-focus px-3 h-9 rounded-lg text-sm">Restablecer</button>
                        </div>
                    </div>
                    {!range && <p className="text-xs text-ember mb-2">El valor mínimo de x debe ser menor que el máximo.</p>}
                    <canvas ref={canvasRef} onMouseMove={onMove} onMouseLeave={() => setHover(null)}
                        className="w-full rounded-lg border border-[#243245] cursor-crosshair" style={{ height: '320px', display: 'block' }}
                        role="img" aria-label="Gráfica de las funciones ingresadas"></canvas>
                    <div className="readout flex flex-wrap gap-x-6 gap-y-1 text-sm text-steel-300 mt-3 min-h-[1.5rem]">
                        {hover ? (<>
                            <span>x = <span className="text-white">{formatNum(hover.x)}</span></span>
                            <span className="text-[#a9c8ec]">f(x) = <span className="text-white">{readout(hover.f)}</span></span>
                            <span className="text-[#ffb020]">g(x) = <span className="text-white">{readout(hover.g)}</span></span>
                        </>) : <span className="text-steel-400">Pasa el cursor sobre la gráfica para leer valores. Acepta sin, cos, tan, ln, log, √, abs, exp, π y e; los ángulos van en radianes.</span>}
                    </div>
                </Card>
            );
        };

        // 3. BLOC DE NOTAS
        const NotesWidget = () => {
            const [note, setNote] = useState(() => store.get('ENTALPIA_note', ""));
            const handleChange = (e) => {
                setNote(e.target.value);
                store.set('ENTALPIA_note', e.target.value);
            };
            return (
                <Card className="flex flex-col h-full">
                    <WidgetTitle icon={<IconNote />} hint="Se guarda en este navegador">Notas rápidas</WidgetTitle>
                    <label htmlFor="noteArea" className="sr-only">Notas rápidas</label>
                    <textarea
                        id="noteArea"
                        className="field w-full flex-1 min-h-[180px] p-3 rounded-lg resize-none text-gray-200"
                        placeholder="Escribe recordatorios aquí..."
                        value={note}
                        onChange={handleChange}
                    />
                </Card>
            );
        };

        // 4. LISTA DE TAREAS (TODO)
        const TodoWidget = () => {
            const [tasks, setTasks] = useState(() => {
                try {
                    const saved = store.get('ENTALPIA_todos', null);
                    return saved ? JSON.parse(saved) : [{ id: 1, text: "Revisar certificaciones", completed: false }];
                } catch (e) { return [{ id: 1, text: "Revisar certificaciones", completed: false }]; }
            });
            const [input, setInput] = useState("");

            useEffect(() => { store.set('ENTALPIA_todos', JSON.stringify(tasks)); }, [tasks]);

            const addTask = () => {
                if (!input.trim()) return;
                playSound('click');
                setTasks([...tasks, { id: Date.now(), text: input, completed: false }]);
                setInput("");
            };
            const toggleTask = (id) => {
                setTasks(tasks.map(t => {
                    if (t.id === id) {
                        !t.completed ? playSound('success') : playSound('click');
                        return { ...t, completed: !t.completed };
                    }
                    return t;
                }));
            };
            const deleteTask = (id) => {
                playSound('delete');
                setTasks(tasks.filter(t => t.id !== id));
            };
            const pending = tasks.filter(t => !t.completed).length;

            return (
                <Card className="h-full flex flex-col">
                    <WidgetTitle icon={<IconCheck size={20} />} hint={`${pending} ${pending === 1 ? 'pendiente' : 'pendientes'}`}>Tareas pendientes</WidgetTitle>
                    <div className="flex gap-2 mb-4">
                        <label htmlFor="taskInput" className="sr-only">Nueva tarea</label>
                        <input
                            id="taskInput" type="text" value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && addTask()}
                            placeholder="Nueva tarea..."
                            className="field flex-1 rounded-lg px-3 py-2 text-sm"
                        />
                        <button onClick={addTask} aria-label="Agregar tarea" className="metal-fill eng-focus p-2 rounded-lg">
                            <IconPlus />
                        </button>
                    </div>
                    <div className="flex-1 overflow-y-auto space-y-1 max-h-[220px] pr-1">
                        {tasks.length === 0 && <p className="text-sm text-steel-400">No hay tareas. Escribe la primera arriba.</p>}
                        {tasks.map((task) => (
                            <div key={task.id} className="group flex items-center justify-between p-2 rounded-lg hover:bg-white/5 transition-colors border border-transparent hover:border-[#243245]">
                                <div className="flex items-center gap-3 overflow-hidden">
                                    <button onClick={() => toggleTask(task.id)} aria-label={task.completed ? 'Marcar como pendiente' : 'Marcar como hecha'} className={`eng-focus flex-shrink-0 w-5 h-5 rounded border flex items-center justify-center transition-all ${task.completed ? 'bg-steel-500 border-steel-300 text-white' : 'border-gray-500 hover:border-steel-300'}`}>
                                        {task.completed && <IconCheck />}
                                    </button>
                                    <span className={`text-sm truncate transition-all ${task.completed ? 'text-gray-500 line-through' : 'text-gray-200'}`}>
                                        {task.text}
                                    </span>
                                </div>
                                <button onClick={() => deleteTask(task.id)} aria-label="Eliminar tarea" className="eng-focus text-gray-500 hover:text-ember opacity-0 group-hover:opacity-100 focus:opacity-100 transition-all">
                                    <IconTrash />
                                </button>
                            </div>
                        ))}
                    </div>
                </Card>
            );
        };

        // --- RELOJ (compacto, en el encabezado) ---
        const ClockChip = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            return (
                <div className="flex items-center gap-3 text-steel-300">
                    <IconClock size={20} />
                    <div className="leading-tight">
                        <div className="readout text-lg font-bold text-white">{time.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}</div>
                        <div className="text-xs text-steel-400">{time.toLocaleDateString('es-ES', { weekday: 'long', month: 'long', day: 'numeric' })}</div>
                    </div>
                </div>

                { name: "Texto a voz", desc: "Convierte texto escrito en audio.", icon: <IconSpeaker size={22} />, url: "../extensiones/aap_texto_a_voz.html" },

                                <div className="hidden md:flex items-center gap-2 text-xs">

                                    <span className="px-3 py-1.5 rounded-full border border-[#243245] bg-ti800 text-steel-300 flex items-center gap-2"><span className="live-dot"></span>Activo</span>

                                    <IconSound off={!sound} />
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 md:px-6 py-10 space-y-14">
                        {/* Aplicaciones */}
                        <section aria-labelledby="h-apps">
                            <h2 id="h-apps" className="text-2xl md:text-3xl font-bold text-white">Aplicaciones</h2>
                            <p className="text-steel-400 mt-1 max-w-[60ch]">Se abren en una pestaña nueva para que sigas trabajando aquí.</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">
                                {shortcuts.map((link) => (
                                    <a key={link.name} href={link.url} target="_blank" rel="noopener noreferrer" className="app-card eng-focus group flex items-start gap-4 p-5 rounded-xl">
                                        <div className="tile w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0">{link.icon}</div>
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-center justify-between gap-2">
                                                <h3 className="font-bold text-white">{link.name}</h3>
                                                <span className="text-steel-400 group-hover:text-white transition-colors"><IconExternal size={16} /></span>
                                            </div>
                                            <p className="text-sm text-steel-300 mt-1 leading-relaxed">{link.desc}</p>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        </section>

                        {/* Herramientas */}
                        <section aria-labelledby="h-tools">
                            <h2 id="h-tools" className="text-2xl md:text-3xl font-bold text-white">Herramientas</h2>
                            <p className="text-steel-400 mt-1 max-w-[60ch]">Funcionan directamente en esta página, sin instalar nada.</p>
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
                                <CalculatorWidget />
                                <GraphWidget />
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                                <NotesWidget />
                                <TodoWidget />
                            </div>
                        </section>
                    </main>
                    
                    <footer className="max-w-6xl mx-auto px-4 md:px-6 pb-10 text-center text-gray-600 text-xs border-t border-[#1a2535] pt-6">
                        <p>Desarrollado para Industrias IA Col. - 2026</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
