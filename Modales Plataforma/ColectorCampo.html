<script>
/* Isoflux V21 · Colector de campo. Funciona sin señal (todo queda guardado en el celular). Exporta el formato
   «isoflux-campo» (JSON), Excel con las mismas hojas de la plantilla y KML; con el enlace de campo del proyecto
   (?campo=…) publica el levantamiento en la bitácora del proyecto del SGC. */
(function(){
const API='https://script.google.com/macros/s/AKfycbzPsHZ7TjSHExWu3dEboPC1_WXl5KMfisX3DKo4SOtQM2PYa66HF7ba0Ary8eET5N08/exec';
const QS=new URLSearchParams(location.search),TOKEN=QS.get('campo')||'',$=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const fx=(v,d=1)=>isFinite(v)&&v!==''&&v!=null?(+v).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const toast=m=>{const t=$('to');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200);};
const RED={'Residencial':'🏠','Comercial':'🏪','Industrial':'🏭','Anillo de distribución':'⭕'};
const FLU={GN:'Gas natural',GLP:'GLP',O2:'Oxígeno',Aire:'Aire comprimido',N2:'Nitrógeno'};
const PT0=[['Acometida / fuente de suministro','A','🚩'],['Acometida a usuario','U','🏠'],['Tanque / almacenamiento','TK','🛢️'],['Estación de regulación (ERM / ERP)','ERM','🏭'],['Regulador','R','🎛️'],['Medidor / centro de medición','M','🧮'],
 ['Válvula de seccionamiento','VS','⛔'],['Válvula','V','🔧'],['Derivación / te','T','⊥'],['Cambio de dirección','C','↪️'],['Vértice de trazado','P','•'],['Elevador / transición','EL','↕️'],['Punto de consumo / equipo','E','🔥'],
 ['Punto de prueba / toma de presión','PP','⏲️'],['Final de red / tapón','F','⏹️'],['Cruce con otra red','X','✖️'],['Hito / referencia (no es tubería)','H','📌']];
/* tipos de punto agregados por el personal (compartidos en el SGC; el administrador elimina repetidos) */
let PT=PT0.slice(),EXT=[],ALIAS={};
const nrm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const EMOJIS=['📍','🔧','⛔','🧯','📡','🔌','🚰','🧰','📦','🪧','🕳️','🏗️','⚙️','🔥','💨','🫁','🧪','🛢️','🚧','🌳','🏠','🏭','🔩','⚡'];
function emojiDe(n){const t=nrm(n);const M=[[/valvul|llave|registro/,'🔧'],[/sensor|sonda|transmis|medic/,'📡'],[/caja|camara|pozo|registro/,'🕳️'],[/poste|aviso|senal|placa|marca/,'🪧'],[/extint|incend/,'🧯'],[/electr|tablero|cable/,'⚡'],[/agua|hidra/,'🚰'],[/oxigen|medicinal|toma/,'🫁'],[/aire|compres|venteo|alivio/,'💨'],[/quemador|horno|estufa|calent|caldera/,'🔥'],[/tanque|cilindro|deposito/,'🛢️'],[/filtro|trampa/,'🧪'],[/soporte|anclaje|abrazadera/,'🔩'],[/arbol|zona verde/,'🌳'],[/obra|excav|zanja/,'🚧']];for(const[r,e]of M)if(r.test(t))return e;return '📍';}
function pref(n){const base=new Set(PT0.map(x=>x[1]));let p=nrm(n).split(' ').filter(w=>w.length>2||/^\d/.test(w)).map(w=>w[0].toUpperCase()).join('').slice(0,3)||'O';if(base.has(p))p+='O';return p;}
function refrescaPT(){const ex=(SEND&&SEND.ptExtra&&SEND.ptExtra.tipos)||[];ALIAS=(SEND&&SEND.ptExtra&&SEND.ptExtra.alias)||{};const loc=(D&&D.ptLocal)||[];const vistos=new Set(PT0.map(x=>nrm(x[0])));EXT=[];
 ex.concat(loc).forEach(x=>{const k=nrm(x.nombre);if(!k||vistos.has(k)||ALIAS[x.nombre])return;vistos.add(k);EXT.push([x.nombre,pref(x.nombre),x.emoji||emojiDe(x.nombre),1]);});
 PT=PT0.concat(EXT);if(D&&D.puntos)D.puntos.forEach(p=>{if(ALIAS[p.tipo])p.tipo=ALIAS[p.tipo];});}
async function nuevoTipo(nombre,emoji){nombre=String(nombre||'').trim().replace(/\s+/g,' ').slice(0,60);if(nombre.length<3)throw Error('Escribe un nombre de al menos 3 letras.');const k=nrm(nombre);
 const ya=PT.find(x=>nrm(x[0])===k);if(ya)return ya[0];
 let r=null;if(!OFF&&navigator.onLine){try{r=await api({paso:'tipoPunto',nombre,emoji});}catch(e){}}
 const t=r&&r.tipo?r.tipo:{nombre,emoji:emoji||emojiDe(nombre),pendiente:1};if(r&&r.tipos&&SEND)SEND.ptExtra=r.tipos;
 if(!r){D.ptLocal=(D.ptLocal||[]).filter(x=>nrm(x.nombre)!==k).concat([t]);}
 refrescaPT();guardar();return t.nombre;}
async function subirTiposPendientes(){const L=(D&&D.ptLocal)||[];if(!L.length||OFF||!navigator.onLine)return;const quedan=[];for(const t of L){try{const r=await api({paso:'tipoPunto',nombre:t.nombre,emoji:t.emoji});if(r&&r.tipos&&SEND)SEND.ptExtra=r.tipos;if(r&&r.tipo&&r.tipo.nombre!==t.nombre)D.puntos.forEach(p=>{if(p.tipo===t.nombre)p.tipo=r.tipo.nombre;});}catch(e){quedan.push(t);}}D.ptLocal=quedan;refrescaPT();}
const DIA=['1/4"','3/8"','1/2"','3/4"','1"','1 1/4"','1 1/2"','2"','2 1/2"','3"','4"','6"','8"','20 mm','25 mm','32 mm','40 mm','63 mm','90 mm','110 mm','160 mm'];
const MAT=['Acero galvanizado','Acero al carbón','Acero inoxidable','PE-AL-PE','Polietileno (PE 100)','Cobre rígido','Cobre flexible','CSST'];
const INST=['Enterrada','Bajo vía vehicular (enterrada)','Aérea / a la vista','Por fachada','Embebida en muro o piso','Encamisada / ducto'];
const SUP=['Andén','Zona verde','Vía','Concreto','Asfalto','Tierra','Muro','Piso interior','Cubierta'];
const DIRS=['NO','N','NE','Sube','','O','','E','Baja','','SO','S','SE','',''];
const SERV=['Acueducto','Alcantarillado','Energía baja tensión','Energía media tensión','Telecomunicaciones','Gas existente','Alumbrado público','Otra'];
const DOCS=[['CO-FO-03','Declaración de implementación del SIG','📣 Se informa'],['Ley 1581','Autorización de tratamiento de datos personales','✍️ Firma (abajo)'],['CO-FO-02','Revisión de requisitos del servicio','📝 Diligencia y firma'],
 ['DI-FO-01','Planificación y datos de entrada del diseño','✍️ Valida los datos del levantamiento'],['CN-PL-01','Plan de calidad, SST y ambiente del proyecto','📣 Se informa',['Comercial','Industrial','Anillo de distribución']],['GI-MZ-04','Matriz de peligros del proyecto (GTC 45)','📣 Se informa',['Comercial','Industrial','Anillo de distribución']],
 ['GI-FO-24','Permiso de excavación (si hay tramos enterrados)','📣 Se informa y coordina'],['GI-FO-20','Permiso de trabajo en alturas (2 m o más)','📣 Se informa'],['GI-FO-22','Permiso de trabajo en caliente','📣 Se informa'],['GI-FO-21','Ingreso a espacios confinados (si aplica)','📣 Se informa'],
 ['DI-FO-05','Control de cambios del diseño','✍️ Aprueba cambios'],['CN-FO-04','Acta de prueba de hermeticidad','✍️ Firma como testigo'],['GI-FO-23','Registro de purga y puesta en servicio','✍️ Firma del usuario'],['DI-FO-04','Validación del diseño','✍️ Recibe a satisfacción']];
/* ---------- almacenamiento (IndexedDB, sin señal) ---------- */
const DB=new Promise(r=>{try{const q=indexedDB.open('isoflux_colector',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);}catch(e){r(null);}});
const kvGet=async k=>{const d=await DB;if(!d)return null;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});};
const kvSet=async(k,v)=>{const d=await DB;if(!d)return;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r();});};
const nuevo=()=>({formato:'isoflux-campo',version:1,creado:new Date().toISOString(),proyecto:{tipoRed:QS.get('red')&&RED[QS.get('red')]?QS.get('red'):'Residencial',fluido:'GN',sistema:'Geográficas WGS84 / MAGNA-SIRGAS (lat, lon)',psumU:'mbar',fecha:new Date().toISOString().slice(0,10),equipoGps:'Celular (colector Isoflux)',nombre:QS.get('proyecto')||''},puntos:[],tramos:[],equipos:[],cruces:[],fotos:[],sgc:[],firmas:[],consent:false});
let D=null,ST='pr',SEND=null,OFF=false;const KEY='cur:'+TOKEN;
/* datos registrados en el SGC por el administrador o el creador del proyecto: llegan bloqueados */
const redDe=t=>/industr/i.test(t||'')?'Industrial':/comerc/i.test(t||'')?'Comercial':/anillo|extern|distribu|red pe|polietil/i.test(t||'')?'Anillo de distribución':/residen|vivien|domicil/i.test(t||'')?'Residencial':'';
let LOCK={};function bloquear(){LOCK={};if(!SEND||!SEND.proyecto)return;const P=SEND.proyecto,pr=D.proyecto;const set=(k,v)=>{if(v!=null&&String(v).trim()!==''){pr[k]=String(v);LOCK[k]=1;}};
 set('nombre',P.titulo);set('cliente',P.cliente);set('direccion',P.ubicacion);set('codigo',P.id);const r=redDe(P.tipo);if(r)set('tipoRed',r);}
const guardar=()=>{D.mod=new Date().toISOString();kvSet(KEY,D);const h=$('hsv')||$('hst');if(h)h.textContent='💾 guardado '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});};

function pad(cv,img){const k=devicePixelRatio||1;cv.width=cv.clientWidth*k;cv.height=cv.clientHeight*k;const c=cv.getContext('2d');c.lineWidth=2.2*k;c.lineCap='round';c.strokeStyle='#0f1f33';let dr=false,n=0;const o={touched:false};
 if(img){const im=new Image();im.onload=()=>c.drawImage(im,0,0,cv.width,cv.height);im.src=img;n=1;}
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*k,(e.clientY-r.top)*k];};
 cv.onpointerdown=e=>{dr=true;o.touched=true;const p=pt(e);c.beginPath();c.moveTo(p[0],p[1]);cv.setPointerCapture(e.pointerId);};cv.onpointermove=e=>{if(!dr)return;const p=pt(e);c.lineTo(p[0],p[1]);c.stroke();n++;};cv.onpointerup=()=>dr=false;
 o.clear=()=>{c.clearRect(0,0,cv.width,cv.height);n=0;o.touched=true;};o.empty=()=>n<3;o.data=()=>{const t=document.createElement('canvas');t.width=480;t.height=Math.round(480*cv.height/cv.width);const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,t.height);x.drawImage(cv,0,0,t.width,t.height);return t.toDataURL('image/png');};return o;}

function json(conFotos){const o=JSON.parse(JSON.stringify(D));o.fotos=[];o.puntos.forEach(p=>{(p.fotos||[]).forEach(f=>o.fotos.push({archivo:f.archivo,ref:p.id,desc:p.desc||'',fecha:f.fecha,data:conFotos?f.data:undefined}));p.foto=(p.fotos||[]).map(f=>f.archivo).join(', ');delete p.fotos;});o.exportado=new Date().toISOString();o.colector='Isoflux V21';return JSON.stringify(o);}

async function excel(){if(!window.XLSX){toast('Cargando el generador de Excel…');await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>ko();document.head.appendChild(s);}).catch(()=>{});}
 if(!window.XLSX){alert('Sin conexión no se puede generar el Excel: descarga el archivo .json (Isoflux lo lee igual).');return;}
 const o=JSON.parse(json(false)),pr=o.proyecto,wb=XLSX.utils.book_new(),A=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n);
 const KP=[['Nombre del proyecto','nombre'],['Código / consecutivo','codigo'],['Tipo de red','tipoRed'],['Fluido','fluido'],['Servicio solicitado','servicio'],['Contratante / cliente','cliente'],['NIT / CC','nit'],['Contacto','contacto'],['Teléfono','telefono'],['Correo','correo'],['Dirección','direccion'],['Municipio','municipio'],['Departamento','departamento'],['Distribuidor','distribuidor'],['Presión de suministro','psum'],['Unidad de presión','psumU'],['Altitud del sitio (msnm)','altitud'],['Temperatura ambiente (°C)','tamb'],['N.º de unidades / usuarios','unidades'],['N.º de pisos','pisos'],['Crecimiento previsto (%)','crec'],['Sistema de coordenadas','sistema'],['Equipo GPS / GNSS','equipoGps'],['Levantado por','levanto'],['Cargo / matrícula','cargo'],['Fecha del levantamiento','fecha'],['Observaciones','obs']];
 A('Proyecto',[['Dato','Valor'],...KP.map(([l,k])=>[l,pr[k]==null?'':pr[k]])]);
 const HP=['ID','Tipo de punto','Ramal','Viene de (ID)','Latitud','Longitud','Cota terreno (msnm)','Precisión (m)','Distancia (m)','Dirección','Nivel (m)','Ø tramo que llega','Material','Instalación','Profundidad (m)','Superficie / acabado','Long. medida (m)','Equipo / descripción','Foto(s)','Referencia (ID)','Este (m)','Norte (m)','Nombre del tag','Estado (Nueva / Existente)','Observaciones','Unido por tubería (Sí / No)','Registrado por','Fecha de registro'],HK=['id','tipo','ramal','viene','lat','lon','cota','prec','dist','dir','nivel','dia','mat','inst','prof','sup','lmed','desc','foto','ref','este','norte','tag','estado','obs','unionTx','autor','creado'];
 A('Puntos',[HP,...o.puntos.map(p=>HK.map(k=>k=='unionTx'?(p.union===0?'No':p.union===1?'Sí':''):p[k]==null?'':p[k]))]);A('Tramos',[['ID tramo','Desde','Hasta','Ø','Material','Instalación','Profundidad (m)','Superficie / acabado','Long. medida (m)','Presión','Estado','Observaciones'],...o.tramos.map(t=>[t.id,t.desde,t.hasta,t.dia,t.mat,t.inst,t.prof,t.sup,t.lmed,t.press,t.estado,t.obs])]);
 A('Equipos',[['Punto (ID)','Equipo / artefacto','Cantidad','Potencia (kW)','Caudal (L/min)','Hora inicio','Hora fin','Factor de uso','Tipo (A/B/C)','Recinto','Volumen recinto (m3)','Ventilación','Potencia (BTU/h)','Presión requerida','Observaciones'],...o.equipos.map(e=>[e.punto,e.nombre,e.cant,e.kw,e.qlm,e.h0,e.h1,e.fc,e.cls,e.recinto,e.vol,e.vent,e.btu,e.pmin,e.obs])]);
 A('Cruces',[['Referencia (punto o tramo)','Red / servicio','Relación (Cruce / Paralelo)','Distancia horizontal (m)','Distancia vertical (m)','Profundidad de la otra red (m)','Operador','Observaciones'],...o.cruces.map(c=>[c.ref,c.serv,c.rel,c.dh,c.dv,c.prof,c.op,c.obs])]);
 A('Fotos',[['Archivo','Punto / tramo','Descripción','Fecha'],...o.fotos.map(f=>[f.archivo,f.ref,f.desc,f.fecha])]);A('SGC contratante',[['Código','Documento','Qué hace el contratante','Momento','Cumplido (Sí / No)','Nombre','Fecha'],...o.sgc.map(s=>[s.codigo,s.titulo,s.rol,'',s.ok,s.nombre,s.fecha])]);
 A('Firmas',[['Rol','Nombre','Documento','Cargo / empresa','Fecha','Firma','Autoriza tratamiento de datos (Sí / No)'],...o.firmas.map(f=>[f.rol,f.nombre,f.doc,'',f.fecha,f.firma?'Firmado en el colector':'',f.autoriza])]);
 XLSX.writeFile(wb,nombre('xlsx'));}

async function publicar(auto){const m=$('pubm')||{set textContent(x){},set innerHTML(x){}},b=$('bpub')||{},v=validar();if(v.e.length){alert('Corrige primero: '+v.e.join(' '));return;}if(!D.consent){alert('El contratante debe autorizar el tratamiento de datos (pestaña SGC) antes de publicar.');return;}
 if(!navigator.onLine||OFF){D.pubPend=new Date().toISOString();guardar();if(!auto)alert('Sin señal: el levantamiento queda guardado en el celular y EN COLA. Se publicará solo en cuanto haya conexión (abre el colector cuando tengas señal).');m.innerHTML='<span class="wa">⏳ En cola: se publicará solo al volver la señal.</span>';return;}b.disabled=true;
 try{const g=D.puntos.find(p=>p.lat),fotos=D.puntos.flatMap(p=>(p.fotos||[]).map(f=>({n:f.archivo||p.id+'.jpg',d:f.data})));
  m.textContent='Creando el registro…';const pr=D.proyecto;
  const r=await api({paso:'entrada',tipo:'Levantamiento georreferenciado',autor:pr.levanto||'Personal de campo',texto:`📍 Levantamiento georreferenciado · red ${pr.tipoRed} · ${FLU[pr.fluido]||pr.fluido}\n${D.puntos.length} puntos, ${D.equipos.length} equipos, ${D.cruces.length} cruces, ${fotos.length} fotos.\nContratante: ${pr.cliente||'—'}${D.consent?' (autorizó tratamiento de datos)':''}.\nAbrir en Isoflux: Control ▸ Proyecto ▸ 📍 Campo ▸ Importar ▸ Traer de la bitácora.`,gps:g?`${(+g.lat).toFixed(6)}, ${(+g.lon).toFixed(6)} (±${fx(g.prec,0)} m)`:'',conArchivos:true});
  const b64=s=>btoa(unescape(encodeURIComponent(s)));m.textContent='Subiendo el levantamiento…';await api({paso:'archivo',entradaId:r.id,b64:b64(json(false)),mime:'application/json',nombre:nombre('json')});
  for(let i=0;i<fotos.length;i++){m.textContent=`Subiendo foto ${i+1} de ${fotos.length}…`;await api({paso:'archivo',entradaId:r.id,b64:fotos[i].d.split(',')[1],mime:'image/jpeg',nombre:fotos[i].n});}
  D.publicado=new Date().toISOString();delete D.pubPend;[...D.puntos,...D.equipos,...D.cruces].forEach(x=>{if(!x.pub)x.pub=D.publicado;});guardar();m.innerHTML='<span class="okc">✓ Publicado en la bitácora del proyecto. El diseñador lo trae desde Isoflux.</span>';}
 catch(e){m.innerHTML='<span class="er">'+E(e.message)+'</span>';}b.disabled=false;}

(async()=>{if(!TOKEN){puerta('Este colector solo funciona con un <b>enlace de campo vigente</b> del proyecto.');return;}
 const SK='ses:'+TOKEN;let cache=await kvGet(SK);
 try{if(!navigator.onLine)throw Object.assign(Error('offline'),{red:1});SEND=await api({});await kvSet(SK,{SEND,t:Date.now()});}
 catch(e){const vivo=cache&&cache.SEND&&new Date(cache.SEND.expira)>new Date();if((e.red||e instanceof TypeError)&&vivo){SEND=cache.SEND;OFF=true;}else{if(cache)await kvSet(SK,null);puerta(E(e.message==='offline'?'Sin conexión y sin una sesión vigente guardada en este celular. Ábrelo con señal la primera vez.':e.message));return;}}

 addEventListener('online',()=>{OFF=false;cabecera();subirTiposPendientes().then(()=>{guardar();cola();});});cola();if(D.mod&&!OFF)toast('Levantamiento recuperado de este celular.');})();
