<style>
:root{--bg:#f3f6fa;--cd:#fff;--tx:#0f1f33;--mu:#5b6b7f;--b:#1d5fd8;--bd:#d5dde8;--ok:#13824f;--wa:#a35b00;--er:#c62828;--hd:#0d2848}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:10px 14px calc(10px) 14px;display:flex;align-items:center;gap:10px}

nav button{border:0;background:none;padding:7px 2px 8px;font:inherit;font-size:10.5px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px}nav button i{font-style:normal;font-size:19px}nav button.on{color:var(--b);font-weight:700}

canvas.map{width:100%;height:260px;border:1px solid var(--bd);border-radius:10px;background:#0b1a2b;display:block}
canvas.sig{width:100%;height:150px;border:1px dashed #9aa9bb;border-radius:10px;background:#fff;touch-action:none;display:block}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.ph .x{position:relative}.ph .x b{position:absolute;top:-6px;right:-6px;background:var(--er);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.doc{border-bottom:1px solid var(--bd);padding:8px 0}.doc:last-child{border:0}.doc .c{font-family:ui-monospace,monospace;font-size:12px;color:var(--b)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0f1f33;color:#fff;padding:10px 14px;border-radius:10px;font-size:13.5px;z-index:9;max-width:92vw;display:none}
.ov{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:8;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}

.sh .hd{display:flex;align-items:center;gap:8px;position:sticky;top:-12px;background:var(--bg);padding:6px 0;z-index:2}.sh .hd b{flex:1;font-size:16px}
.priv{background:#fff8e6;border:1px solid #f0d58c;border-radius:10px;padding:10px;font-size:12.5px}.priv label{color:var(--tx);display:flex;gap:8px;align-items:flex-start;margin:0}.priv input{width:auto;margin-top:3px}
.ck{display:flex;gap:8px;align-items:flex-start}.ck input{width:auto;margin-top:3px}
</style>

<body>
<header><div style="font-size:24px">📍</div><div><b>ISOFLUX · COLECTOR DE CAMPO</b><small id="hsub">Levantamiento georreferenciado</small></div><span class="sp"></span><span id="hst" class="mu" style="color:#bcd3f5;font-size:11.5px"></span></header>
<main id="m"></main>
<nav id="nv"><button data-s="pr"><i>🏗️</i>Proyecto</button><button data-s="pu"><i>📍</i>Puntos</button><button data-s="eq"><i>🔥</i>Equipos</button><button data-s="cr"><i>↔️</i>Cruces</button><button data-s="sg"><i>✍️</i>SGC</button><button data-s="en"><i>📤</i>Enviar</button></nav>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div class="toast" id="to"></div>
<script>
/* Isoflux V21 · Colector de campo. Funciona sin señal (todo queda guardado en el celular). Exporta el formato
   «isoflux-campo» (JSON), Excel con las mismas hojas de la plantilla y KML; con el enlace de campo del proyecto
   (?campo=…) publica el levantamiento en la bitácora del proyecto del SGC. */
(function(){
const API='https://script.google.com/macros/s/AKfycbzPsHZ7TjSHExWu3dEboPC1_WXl5KMfisX3DKo4SOtQM2PYa66HF7ba0Ary8eET5N08/exec';
const QS=new URLSearchParams(location.search),TOKEN=QS.get('campo')||'',$=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const fx=(v,d=1)=>isFinite(v)&&v!==''&&v!=null?(+v).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const toast=m=>{const t=$('to');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200);};
const RED={'Residencial':'🏠','Comercial':'🏪','Industrial':'🏭','Anillo de distribución':'⭕'};
const FLU={GN:'Gas natural',GLP:'GLP',O2:'Oxígeno',Aire:'Aire comprimido',N2:'Nitrógeno'};
const PT=[['Acometida / fuente de suministro','A','🚩'],['Acometida a usuario','U','🏠'],['Tanque / almacenamiento','TK','🛢️'],['Estación de regulación (ERM / ERP)','ERM','🏭'],['Regulador','R','🎛️'],['Medidor / centro de medición','M','🧮'],
 ['Válvula de seccionamiento','VS','⛔'],['Válvula','V','🔧'],['Derivación / te','T','⊥'],['Cambio de dirección','C','↪️'],['Vértice de trazado','P','•'],['Elevador / transición','EL','↕️'],['Punto de consumo / equipo','E','🔥'],
 ['Punto de prueba / toma de presión','PP','⏲️'],['Final de red / tapón','F','⏹️'],['Cruce con otra red','X','✖️'],['Hito / referencia (no es tubería)','H','📌']];
const DIA=['1/4"','3/8"','1/2"','3/4"','1"','1 1/4"','1 1/2"','2"','2 1/2"','3"','4"','6"','8"','20 mm','25 mm','32 mm','40 mm','63 mm','90 mm','110 mm','160 mm'];
const MAT=['Acero galvanizado','Acero al carbón','Acero inoxidable','PE-AL-PE','Polietileno (PE 100)','Cobre rígido','Cobre flexible','CSST'];
const INST=['Enterrada','Bajo vía vehicular (enterrada)','Aérea / a la vista','Por fachada','Embebida en muro o piso','Encamisada / ducto'];
const SUP=['Andén','Zona verde','Vía','Concreto','Asfalto','Tierra','Muro','Piso interior','Cubierta'];
const DIRS=['NO','N','NE','Sube','','O','','E','Baja','','SO','S','SE','',''];
const SERV=['Acueducto','Alcantarillado','Energía baja tensión','Energía media tensión','Telecomunicaciones','Gas existente','Alumbrado público','Otra'];
const DOCS=[['CO-FO-03','Declaración de implementación del SIG','📣 Se informa'],['Ley 1581','Autorización de tratamiento de datos personales','✍️ Firma (abajo)'],['CO-FO-02','Revisión de requisitos del servicio','📝 Diligencia y firma'],
 ['DI-FO-01','Planificación y datos de entrada del diseño','✍️ Valida los datos del levantamiento'],['CN-PL-01','Plan de calidad, SST y ambiente del proyecto','📣 Se informa',['Comercial','Industrial','Anillo de distribución']],['GI-MZ-04','Matriz de peligros del proyecto (GTC 45)','📣 Se informa',['Comercial','Industrial','Anillo de distribución']],
 ['GI-FO-24','Permiso de excavación (si hay tramos enterrados)','📣 Se informa y coordina'],['GI-FO-20','Permiso de trabajo en alturas (2 m o más)','📣 Se informa'],['GI-FO-22','Permiso de trabajo en caliente','📣 Se informa'],['GI-FO-21','Ingreso a espacios confinados (si aplica)','📣 Se informa'],
 ['DI-FO-05','Control de cambios del diseño','✍️ Aprueba cambios'],['CN-FO-04','Acta de prueba de hermeticidad','✍️ Firma como testigo'],['GI-FO-23','Registro de purga y puesta en servicio','✍️ Firma del usuario'],['DI-FO-04','Validación del diseño','✍️ Recibe a satisfacción']];
/* ---------- almacenamiento (IndexedDB, sin señal) ---------- */
const DB=new Promise(r=>{try{const q=indexedDB.open('isoflux_colector',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);}catch(e){r(null);}});
const kvGet=async k=>{const d=await DB;if(!d)return null;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});};
const kvSet=async(k,v)=>{const d=await DB;if(!d)return;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r();});};
const nuevo=()=>({formato:'isoflux-campo',version:1,creado:new Date().toISOString(),proyecto:{tipoRed:QS.get('red')&&RED[QS.get('red')]?QS.get('red'):'Residencial',fluido:'GN',sistema:'Geográficas WGS84 / MAGNA-SIRGAS (lat, lon)',psumU:'mbar',fecha:new Date().toISOString().slice(0,10),equipoGps:'Celular (colector Isoflux)',nombre:QS.get('proyecto')||''},puntos:[],tramos:[],equipos:[],cruces:[],fotos:[],sgc:[],firmas:[],consent:false});
let D=null,ST='pr',SEND=null;
const guardar=()=>{D.mod=new Date().toISOString();kvSet('cur',D);$('hst').textContent='💾 guardado '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});};
/* ---------- geodesia (para el mapa) ---------- */
const GA=6378137,GF=1/298.257223563,GE2=GF*(2-GF),RAD=Math.PI/180;
const ecef=(la,lo,h)=>{const a=la*RAD,b=lo*RAD,s=Math.sin(a),N=GA/Math.sqrt(1-GE2*s*s);return[(N+h)*Math.cos(a)*Math.cos(b),(N+h)*Math.cos(a)*Math.sin(b),(N*(1-GE2)+h)*s];};
const enu=(o,la,lo)=>{const p=ecef(la,lo,0),q=ecef(o.lat,o.lon,0),d=[p[0]-q[0],p[1]-q[1],p[2]-q[2]],a=o.lat*RAD,b=o.lon*RAD;return[-Math.sin(b)*d[0]+Math.cos(b)*d[1],-Math.sin(a)*Math.cos(b)*d[0]-Math.sin(a)*Math.sin(b)*d[1]+Math.cos(a)*d[2]];};
const AZ={N:0,NE:45,E:90,SE:135,S:180,SO:225,O:270,NO:315};
function posiciones(){const P={},by={};D.puntos.forEach(p=>by[p.id]=p);const g=D.puntos.find(p=>isFinite(+p.lat)&&p.lat!==''&&p.lat!=null);const o=g?{lat:+g.lat,lon:+g.lon}:null;
 D.puntos.forEach(p=>{if(o&&p.lat!==''&&p.lat!=null&&isFinite(+p.lat)){const q=enu(o,+p.lat,+p.lon);P[p.id]=q;}});if(!o&&D.puntos.length)P[D.puntos[0].id]=[0,0];
 for(let k=0;k<D.puntos.length+2;k++)D.puntos.forEach(p=>{if(P[p.id])return;const r=p.ref||p.viene;if(r&&P[r]&&isFinite(+p.dist)&&p.dir){const q=P[r];if(p.dir=='Sube'||p.dir=='Baja')P[p.id]=[q[0],q[1]];else{const a=(AZ[p.dir]!=null?AZ[p.dir]:+p.dir)*RAD;if(isFinite(a))P[p.id]=[q[0]+p.dist*Math.sin(a),q[1]+p.dist*Math.cos(a)];}}});return P;}
function mapa(cv){const c=cv.getContext('2d'),k=devicePixelRatio||1,W=cv.width=cv.clientWidth*k,H=cv.height=cv.clientHeight*k;c.fillStyle='#0b1a2b';c.fillRect(0,0,W,H);const P=posiciones(),ids=Object.keys(P);
 if(!ids.length){c.fillStyle='#8fa3b8';c.font=`${13*k}px sans-serif`;c.fillText('Aún no hay puntos ubicados',14*k,26*k);return;}
 const xs=ids.map(i=>P[i][0]),ys=ids.map(i=>P[i][1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),m=26*k,s=Math.min((W-2*m)/Math.max(x1-x0,1),(H-2*m)/Math.max(y1-y0,1)),T=i=>[m+(P[i][0]-x0)*s,H-m-(P[i][1]-y0)*s];
 c.strokeStyle='#4fa3ff';c.lineWidth=2.5*k;let last={};D.puntos.forEach(p=>{const r=String(p.ramal||'');const a=p.viene||last[r];if(a&&P[a]&&P[p.id]&&!/Hito/.test(p.tipo)){const A=T(a),B=T(p.id);c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);c.stroke();}if(!/Hito/.test(p.tipo))last[r]=p.id;});
 D.tramos.forEach(t=>{if(P[t.desde]&&P[t.hasta]){const A=T(t.desde),B=T(t.hasta);c.setLineDash([6*k,4*k]);c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);c.stroke();c.setLineDash([]);}});
 c.font=`${11*k}px sans-serif`;D.puntos.forEach(p=>{if(!P[p.id])return;const q=T(p.id);c.fillStyle=/Acometida \/ fuente/.test(p.tipo)?'#ff5252':/Hito/.test(p.tipo)?'#fff':'#ffd54f';c.beginPath();c.arc(q[0],q[1],4.5*k,0,7);c.fill();c.fillStyle='#dceaff';c.fillText(p.id,q[0]+6*k,q[1]-6*k);});
 c.fillStyle='#dceaff';c.fillText('N ↑',W-34*k,18*k);const L0=[1,2,5,10,20,50,100,200,500].find(v=>v*s>50*k)||500;c.strokeStyle='#dceaff';c.lineWidth=1.5*k;c.beginPath();c.moveTo(10*k,H-10*k);c.lineTo(10*k+L0*s,H-10*k);c.stroke();c.fillText(L0+' m',10*k,H-16*k);}
/* ---------- utilidades de formulario ---------- */
const sel=(id,ops,v,ph)=>`<select id="${id}">${ph!=null?`<option value="">${E(ph)}</option>`:''}${ops.map(o=>{const[val,txt]=Array.isArray(o)?o:[o,o];return`<option value="${E(val)}"${String(v)==String(val)?' selected':''}>${E(txt)}</option>`;}).join('')}</select>`;
const inp=(id,v,t,ph,ex)=>`<input id="${id}" value="${E(v==null?'':v)}" ${t?`type="${t}"`:''} ${t=='number'?'inputmode="decimal" step="any"':''} placeholder="${E(ph||'')}" ${ex||''}>`;
const val=id=>{const e=$(id);return e?e.value.trim():'';};
const nid=t=>{const pre=(PT.find(p=>p[0]==t)||PT[10])[1];let i=1;while(D.puntos.some(p=>p.id==pre+i))i++;return pre+i;};
const ico=t=>(PT.find(p=>p[0]==t)||['','','•'])[2];
/* ---------- pantallas ---------- */
function pinta(){document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.s==ST));const m=$('m'),pr=D.proyecto;$('hsub').textContent=(pr.nombre||'Levantamiento georreferenciado')+' · '+(RED[pr.tipoRed]||'')+' '+pr.tipoRed;
 if(ST=='pr'){m.innerHTML=`<div class="cd"><h2>🏗️ Proyecto y contratante</h2>
  <label>Tipo de red</label><div class="seg" id="sred">${Object.keys(RED).map(r=>`<button data-r="${E(r)}" class="${pr.tipoRed==r?'on':''}">${RED[r]} ${E(r.replace(' de distribución',''))}</button>`).join('')}</div>
  <label>Nombre del proyecto</label>${inp('p_nombre',pr.nombre)}<div class="g2"><div><label>Código</label>${inp('p_codigo',pr.codigo)}</div><div><label>Fluido</label>${sel('p_fluido',Object.keys(FLU).map(k=>[k,FLU[k]]),pr.fluido)}</div></div>
  <label>Servicio solicitado</label>${sel('p_servicio',['Diseño','Diseño y construcción','Construcción','Mantenimiento','Reparación','Interventoría'],pr.servicio,'—')}
  <label>Contratante / cliente</label>${inp('p_cliente',pr.cliente)}<div class="g2"><div><label>NIT / CC</label>${inp('p_nit',pr.nit)}</div><div><label>Contacto</label>${inp('p_contacto',pr.contacto)}</div><div><label>Teléfono</label>${inp('p_telefono',pr.telefono,'tel')}</div><div><label>Correo</label>${inp('p_correo',pr.correo,'email')}</div></div>
  <label>Dirección</label>${inp('p_direccion',pr.direccion)}<div class="g2"><div><label>Municipio</label>${inp('p_municipio',pr.municipio)}</div><div><label>Departamento</label>${inp('p_departamento',pr.departamento)}</div></div>
  <div class="g2"><div><label>Distribuidor</label>${inp('p_distribuidor',pr.distribuidor,'','Empresa de gas')}</div><div><label>Presión de suministro</label><div class="row" style="flex-wrap:nowrap">${inp('p_psum',pr.psum,'number')}${sel('p_psumU',['mbar','psi','bar','kPa'],pr.psumU)}</div></div>
  <div><label>Altitud (msnm)</label>${inp('p_altitud',pr.altitud,'number')}</div><div><label>Temperatura (°C)</label>${inp('p_tamb',pr.tamb,'number')}</div><div><label>N.º unidades / usuarios</label>${inp('p_unidades',pr.unidades,'number')}</div><div><label>N.º de pisos</label>${inp('p_pisos',pr.pisos,'number')}</div>
  <div><label>Crecimiento previsto (%)</label>${inp('p_crec',pr.crec==null?20:pr.crec,'number')}</div><div><label>Fecha</label>${inp('p_fecha',pr.fecha,'date')}</div></div>
  <label>Sistema de coordenadas</label>${sel('p_sistema',['Geográficas WGS84 / MAGNA-SIRGAS (lat, lon)','Origen Nacional CTM12 (EPSG:9377)','UTM 18N (WGS84)','UTM 17N (WGS84)','UTM 19N (WGS84)','Plano local (m) sin georreferencia'],pr.sistema)}
  <div class="g2"><div><label>Levantado por</label>${inp('p_levanto',pr.levanto,'','Nombre completo')}</div><div><label>Cargo / matrícula</label>${inp('p_cargo',pr.cargo)}</div></div><label>Equipo GPS / GNSS</label>${inp('p_equipoGps',pr.equipoGps)}
  <label>Observaciones</label><textarea id="p_obs">${E(pr.obs||'')}</textarea></div>
  ${SEND?`<div class="cd mu">🔗 Enlace de campo del proyecto <b>${E(SEND.proyecto.titulo)}</b> · vence ${E(String(SEND.expira).slice(0,10))}. Al terminar, publica el levantamiento en la bitácora desde «Enviar».</div>`:''}
  <div class="cd"><div class="row"><button class="btn" id="bnu">🗑️ Nuevo levantamiento</button><label class="btn" style="margin:0">📂 Abrir archivo .json<input type="file" id="fop" accept=".json" hidden></label></div><p class="mu">Todo se guarda en este celular a medida que escribes, aunque no haya señal.</p></div>`;
  m.querySelectorAll('[id^=p_]').forEach(e=>e.oninput=e.onchange=()=>{pr[e.id.slice(2)]=e.value;guardar();});

function pad(cv,img){const k=devicePixelRatio||1;cv.width=cv.clientWidth*k;cv.height=cv.clientHeight*k;const c=cv.getContext('2d');c.lineWidth=2.2*k;c.lineCap='round';c.strokeStyle='#0f1f33';let dr=false,n=0;const o={touched:false};
 if(img){const im=new Image();im.onload=()=>c.drawImage(im,0,0,cv.width,cv.height);im.src=img;n=1;}
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*k,(e.clientY-r.top)*k];};
 cv.onpointerdown=e=>{dr=true;o.touched=true;const p=pt(e);c.beginPath();c.moveTo(p[0],p[1]);cv.setPointerCapture(e.pointerId);};cv.onpointermove=e=>{if(!dr)return;const p=pt(e);c.lineTo(p[0],p[1]);c.stroke();n++;};cv.onpointerup=()=>dr=false;
 o.clear=()=>{c.clearRect(0,0,cv.width,cv.height);n=0;o.touched=true;};o.empty=()=>n<3;o.data=()=>{const t=document.createElement('canvas');t.width=480;t.height=Math.round(480*cv.height/cv.width);const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,t.height);x.drawImage(cv,0,0,t.width,t.height);return t.toDataURL('image/png');};return o;}

 if(!window.XLSX){alert('Sin conexión no se puede generar el Excel: descarga el archivo .json (Isoflux lo lee igual).');return;}
 const o=JSON.parse(json(false)),pr=o.proyecto,wb=XLSX.utils.book_new(),A=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n);
 const KP=[['Nombre del proyecto','nombre'],['Código / consecutivo','codigo'],['Tipo de red','tipoRed'],['Fluido','fluido'],['Servicio solicitado','servicio'],['Contratante / cliente','cliente'],['NIT / CC','nit'],['Contacto','contacto'],['Teléfono','telefono'],['Correo','correo'],['Dirección','direccion'],['Municipio','municipio'],['Departamento','departamento'],['Distribuidor','distribuidor'],['Presión de suministro','psum'],['Unidad de presión','psumU'],['Altitud del sitio (msnm)','altitud'],['Temperatura ambiente (°C)','tamb'],['N.º de unidades / usuarios','unidades'],['N.º de pisos','pisos'],['Crecimiento previsto (%)','crec'],['Sistema de coordenadas','sistema'],['Equipo GPS / GNSS','equipoGps'],['Levantado por','levanto'],['Cargo / matrícula','cargo'],['Fecha del levantamiento','fecha'],['Observaciones','obs']];
 A('Proyecto',[['Dato','Valor'],...KP.map(([l,k])=>[l,pr[k]==null?'':pr[k]])]);
 const HP=['ID','Tipo de punto','Ramal','Viene de (ID)','Latitud','Longitud','Cota terreno (msnm)','Precisión (m)','Distancia (m)','Dirección','Nivel (m)','Ø tramo que llega','Material','Instalación','Profundidad (m)','Superficie / acabado','Long. medida (m)','Equipo / descripción','Foto(s)','Referencia (ID)','Este (m)','Norte (m)','Etiqueta / tag','Estado (Nueva / Existente)','Observaciones'],HK=['id','tipo','ramal','viene','lat','lon','cota','prec','dist','dir','nivel','dia','mat','inst','prof','sup','lmed','desc','foto','ref','este','norte','tag','estado','obs'];
 A('Puntos',[HP,...o.puntos.map(p=>HK.map(k=>p[k]==null?'':p[k]))]);A('Tramos',[['ID tramo','Desde','Hasta','Ø','Material','Instalación','Profundidad (m)','Superficie / acabado','Long. medida (m)','Presión','Estado','Observaciones'],...o.tramos.map(t=>[t.id,t.desde,t.hasta,t.dia,t.mat,t.inst,t.prof,t.sup,t.lmed,t.press,t.estado,t.obs])]);
 A('Equipos',[['Punto (ID)','Equipo / artefacto','Cantidad','Potencia (kW)','Caudal (L/min)','Hora inicio','Hora fin','Factor de uso','Tipo (A/B/C)','Recinto','Volumen recinto (m3)','Ventilación','Potencia (BTU/h)','Presión requerida','Observaciones'],...o.equipos.map(e=>[e.punto,e.nombre,e.cant,e.kw,e.qlm,e.h0,e.h1,e.fc,e.cls,e.recinto,e.vol,e.vent,e.btu,e.pmin,e.obs])]);
 A('Cruces',[['Referencia (punto o tramo)','Red / servicio','Relación (Cruce / Paralelo)','Distancia horizontal (m)','Distancia vertical (m)','Profundidad de la otra red (m)','Operador','Observaciones'],...o.cruces.map(c=>[c.ref,c.serv,c.rel,c.dh,c.dv,c.prof,c.op,c.obs])]);
 A('Fotos',[['Archivo','Punto / tramo','Descripción','Fecha'],...o.fotos.map(f=>[f.archivo,f.ref,f.desc,f.fecha])]);A('SGC contratante',[['Código','Documento','Qué hace el contratante','Momento','Cumplido (Sí / No)','Nombre','Fecha'],...o.sgc.map(s=>[s.codigo,s.titulo,s.rol,'',s.ok,s.nombre,s.fecha])]);
 A('Firmas',[['Rol','Nombre','Documento','Cargo / empresa','Fecha','Firma','Autoriza tratamiento de datos (Sí / No)'],...o.firmas.map(f=>[f.rol,f.nombre,f.doc,'',f.fecha,f.firma?'Firmado en el colector':'',f.autoriza])]);
 XLSX.writeFile(wb,nombre('xlsx'));}
