<!--
  =====================================================================
   VR ENTALPIA · Mundo Virtual (WebXR)
   Catálogo inmersivo 3D compatible con Meta Quest (2 / 3 / 3S / Pro)
  ---------------------------------------------------------------------
   · En el navegador de Meta Quest: botón "Entrar en VR".
   · En PC / móvil: vista 3D navegable (arrastrar para mirar, clic para abrir).
   · Requiere HTTPS (GitHub Pages ya lo cumple).

   CÓMO AGREGAR PROYECTOS  →  edita el arreglo `database` (más abajo).
   Cada item admite:
     title, subtitle, icon (emoji), img (miniatura opcional)
     tipo: "video"     → pantalla gigante en el laboratorio   (url = .mp4)
           "video360"  → esfera inmersiva equirectangular     (url = .mp4)
                         estereo: "sbs" (lado a lado) | "tb" (arriba/abajo) | omitir = mono
           "modelo"    → modelo 3D en pedestal, se agarra y gira
                         modelo: "erm" (gemelo digital incluido) | glb: "ruta/archivo.glb"
     descripcion: texto para el panel de información (modelos)
   Los videos e imágenes de otros dominios deben permitir CORS; lo más
   seguro es alojarlos en este mismo repositorio / dominio.
  =====================================================================
-->
<style>

<script>
/* Vigilante de arranque: si algo falla o tarda, se informa y se ofrece reintentar (nunca carga infinita). */
window.__vrBoot = { ok: false, failed: false };
function vrFail(msg, keep){
  var b = window.__vrBoot; if (b.failed && !keep) return; b.failed = true;
  var l = document.getElementById('loading'); if (!l) return;
  l.classList.remove('hide'); l.classList.add('err');
  l.querySelector('.spinner').style.display = 'none';
  document.getElementById('load-msg').innerHTML = msg;
  document.getElementById('load-retry').hidden = false;
}
/* oculta la portada de carga respetando un tiempo mínimo para que no parpadee */
function vrHideLoading(){
  var wait = Math.max(0, 1200 - performance.now());
  setTimeout(function (){ var l = document.getElementById('loading'); if (l && !window.__vrBoot.failed) l.classList.add('hide'); }, wait);
}
function vrBusy(msg){
  var l = document.getElementById('loading'); if (!l) return;
  l.classList.remove('hide', 'err'); l.querySelector('.spinner').style.display = '';
  document.getElementById('load-msg').textContent = msg; document.getElementById('load-retry').hidden = true;
}
addEventListener('error', function (e){ var isScript = e.target && e.target.tagName === 'SCRIPT'; if (!(e instanceof ErrorEvent) && !isScript) return; if (!window.__vrBoot.ok) vrFail('No se pudo iniciar el Mundo Virtual.<br><small style="opacity:.7">' + String(e.message || 'Error al cargar los componentes 3D').replace(/</g, '&lt;') + '</small>'); }, true);
addEventListener('unhandledrejection', function (e){ if (!window.__vrBoot.ok) vrFail('No se pudo iniciar el Mundo Virtual.<br><small style="opacity:.7">' + String(e.reason && e.reason.message || e.reason || '').replace(/</g, '&lt;') + '</small>'); });
/* solo cuenta el tiempo con la pestaña visible (en segundo plano el navegador pausa la animación) */
(function (){ var t = 0; var iv = setInterval(function (){
  if (window.__vrBoot.ok || window.__vrBoot.failed){ clearInterval(iv); return; }
  if (document.visibilityState === 'visible' && (t += 1) >= 20){ clearInterval(iv); vrFail('La carga está tardando más de lo normal. Revisa tu conexión y vuelve a intentarlo.'); }
}, 1000); })();
</script>

import * as THREE from 'three';

const DEMO_VIDEO = 'https://threejs.org/examples/textures/sintel.mp4';

const $ = s => document.querySelector(s);
let toastTimer;

/* =====================================================================
   3. ESCENA BÁSICA
   ===================================================================== */
/* Equipos con poca memoria (p. ej. gráficos integrados y 4 GB de RAM): modo liviano */
const IS_HEADSET = /OculusBrowser|Quest|Pico|Wolvic/i.test(navigator.userAgent);   // en las gafas se mantiene la calidad
const LOW_MEM = !IS_HEADSET && (navigator.deviceMemory || 8) <= 4;
async function createRenderer(){
  const tries = [
    { antialias: !LOW_MEM, powerPreference: 'high-performance' },
    { antialias: false, powerPreference: 'default' },
    { antialias: false, powerPreference: 'low-power', depth: true, stencil: false }
  ];
  let last;
  for (let i = 0; i < tries.length; i++){
    try { return new THREE.WebGLRenderer(tries[i]); }
    catch (e){ last = e; console.warn('WebGL intento', i + 1, 'falló:', e.message); await new Promise(r => setTimeout(r, 700)); }
  }
  throw last;
}
let renderer;
try {
  renderer = await createRenderer();
} catch (e){
  vrFail('Tu navegador bloqueó los gráficos 3D (WebGL) para este sitio.<br><small style="opacity:.75;line-height:1.6">Suele pasar tras varias caídas gráficas seguidas. Para desbloquearlo: <b>cierra por completo el navegador y ábrelo de nuevo</b>.<br>Si persiste: cierra otras pestañas con 3D o video, y en la configuración del navegador activa «Usar aceleración por hardware».</small>');
  throw e;
}
renderer.setPixelRatio(LOW_MEM ? 1 : Math.min(devicePixelRatio, 1.5));
window.__vr = { renderer, lowMem: LOW_MEM };
/* Si la tarjeta gráfica pierde el contexto, se intenta recuperar; si no vuelve, se recarga sola una vez. */

   4. AYUDANTES DE TEXTURAS (canvas → panel 3D)
   ===================================================================== */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(ctx, text, x, y, maxW, lh){
  const words = String(text).split(/\s+/); let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ ctx.fillText(line, x, y); line = w; y += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
  return y + lh;
}
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function texFrom(canvas, mip = false){
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  // los paneles se ven casi a su tamaño real: sin mipmaps ahorran ~25 % de memoria gráfica
  t.generateMipmaps = mip; t.minFilter = mip ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
  t.anisotropy = mip ? (LOW_MEM ? 2 : 4) : 1;
  return t;
}
/* Panel con contenido dibujado; devuelve mesh con userData.redraw(fn) */
function panel(wm, hm, draw, ppm = 420){
  const c = makeCanvas(Math.round(wm * ppm), Math.round(hm * ppm));
  const ctx = c.getContext('2d');
  draw(ctx, c.width, c.height);
  const tex = texFrom(c);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wm, hm),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.02 }));
  mesh.userData.redraw = fn => { ctx.clearRect(0, 0, c.width, c.height); fn(ctx, c.width, c.height); tex.needsUpdate = true; };
  return mesh;
}
function glassBg(ctx, W, H, r = 36, alpha = 0.78){
  roundRect(ctx, 3, 3, W - 6, H - 6, r);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(22,24,32,${alpha})`); g.addColorStop(1, `rgba(8,9,13,${alpha})`);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.stroke();
}

const interactables = [];
function registerUI(mesh, ui){ mesh.userData.ui = Object.assign({ count: 0, on: false }, ui); interactables.push(mesh); return mesh; }
function setHover(obj, on){
  const ui = obj.userData.ui; if (!ui) return;
  ui.count = Math.max(0, ui.count + (on ? 1 : -1));
  const now = ui.count > 0;
  if (now !== ui.on){ ui.on = now; ui.onHover && ui.onHover(now); }
}
function visibleDeep(o){ while (o){ if (!o.visible) return false; o = o.parent; } return true; }

function makeButton(text, { w = 0.32, h = 0.1, primary = false } = {}, onSelect){
  const ppm = 600;
  const c = makeCanvas(Math.round(w * ppm), Math.round(h * ppm)), ctx = c.getContext('2d');
  const tex = texFrom(c);
  let label = text, hover = false;
  const draw = () => {
    const W = c.width, H = c.height; ctx.clearRect(0, 0, W, H);
    roundRect(ctx, 4, 4, W - 8, H - 8, (H - 8) / 2);
    ctx.fillStyle = primary ? (hover ? '#ff2a35' : ACCENT) : (hover ? 'rgba(255,255,255,.30)' : 'rgba(30,32,40,.88)');
    ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = hover ? '#ffffff' : 'rgba(255,255,255,.28)'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let fs = H * 0.42; ctx.font = `700 ${fs}px ${FONT}`;
    while (ctx.measureText(label).width > W * 0.86 && fs > 10){ fs -= 2; ctx.font = `700 ${fs}px ${FONT}`; }
    ctx.fillText(label, W / 2, H / 2 + 2);
    tex.needsUpdate = true;
  };
  draw();
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.02 }));
  registerUI(mesh, {
    onSelect,
    onHover(on){ hover = on; draw(); mesh.scale.setScalar(on ? 1.07 : 1); }
  });
  mesh.userData.setText = t => { label = t; draw(); }; mesh.userData.label = () => label;
  return mesh;
}

function glowTexture(color){

  roundRect(ctx, 40, 40, 560, 340, 30); ctx.lineWidth = 8; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  ctx.shadowBlur = 0; ctx.stroke();
  return texFrom(c);
}
const glowCache = {};

function makeCard(item, cat, row){
  const g = new THREE.Group();

    new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.02 }));
  const gt = glowCache[cat.color] || (glowCache[cat.color] = glowTexture(cat.color));

function layoutRows(dt){
  const k = 1 - Math.pow(0.0001, dt);
  for (const row of rows){
    row.offset += (row.target - row.offset) * k;
    const n = row.cards.length, span = (n - 1) * STEP;
    let firstA = Infinity;
    row.cards.forEach((card, i) => {
      const ud = card.userData;
      ud.hoverT += ((ud.hovered ? 1 : 0) - ud.hoverT) * Math.min(1, dt * 12);
      const a = i * STEP - span / 2 + row.offset;
      const over = Math.abs(a) - HALF_VIS;
      const alpha = THREE.MathUtils.clamp(1 - over / (STEP * 0.6), 0, 1);
      card.visible = alpha > 0.02;
      if (!card.visible) return;
      if (alpha > 0.5) firstA = Math.min(firstA, a);
      const r = R - ud.hoverT * 0.12;
      const y = row.y + ud.hoverT * 0.015;
      card.position.set(Math.sin(a) * r, y, -Math.cos(a) * r);
      card.lookAt(0, y, 0);
      card.scale.setScalar(1 + ud.hoverT * 0.08);
      ud.face.material.opacity = alpha;
      ud.glow.material.opacity = ud.hoverT * alpha;
    });
    if (firstA === Infinity) firstA = -HALF_VIS;
    const la = firstA - (CW / 2) / R + 0.75 / R;
    const ly = row.y + CH / 2 + 0.065;
    row.label.position.set(Math.sin(la) * R, ly, -Math.cos(la) * R);
    row.label.lookAt(0, ly, 0);
  }
}

function setStereo(layout){
  const apply = (mesh, eye) => {
    const uv = mesh.geometry.attributes.uv.array;
    for (let i = 0; i < uv.length; i += 2){
      let u = baseUV[i], v = baseUV[i + 1];
      if (layout === 'sbs'){ u = u * 0.5 + (eye === 'R' ? 0.5 : 0); }
      else if (layout === 'tb'){ v = v * 0.5 + (eye === 'L' ? 0.5 : 0); }
      uv[i] = u; uv[i + 1] = v;
    }
    mesh.geometry.attributes.uv.needsUpdate = true;
  };
  const stereo = layout === 'sbs' || layout === 'tb';
  sphMono.visible = !stereo; sphL.visible = sphR.visible = stereo;
  if (stereo){ apply(sphL, 'L'); apply(sphR, 'R'); }
}

/* Gemelo digital: Estación de Regulación y Medición (ERM) — procedimental */
function buildERM(){
  const g = new THREE.Group();
  const M = (color, m = 0.5, r = 0.4, extra = {}) => new THREE.MeshStandardMaterial({ color, metalness: m, roughness: r, ...extra });
  const yellow = M(0xf2c200, 0.25, 0.45), steel = M(0xa4adb7, 0.85, 0.28), red = M(0xd62828, 0.2, 0.5),
        dark = M(0x2a2e36, 0.6, 0.5), blue = M(0x1f5fbf, 0.35, 0.4), white = M(0xf2f2f2, 0, 0.6), black = M(0x111111, 0.2, 0.6);
  const PY = 0.2, PR = 0.022;
  const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); g.add(m); return m; };
  const pipe = (x1, x2, y = PY, mat = yellow) => add(new THREE.CylinderGeometry(PR, PR, x2 - x1, 24), mat, (x1 + x2) / 2, y, 0, 0, 0, Math.PI / 2);
  const flange = (x, y = PY) => add(new THREE.CylinderGeometry(PR * 2, PR * 2, 0.012, 24), steel, x, y, 0, 0, 0, Math.PI / 2);
  const valve = (x) => {
    add(new THREE.SphereGeometry(0.038, 24, 16), steel, x, PY, 0);
    add(new THREE.CylinderGeometry(0.006, 0.006, 0.05, 12), steel, x, PY + 0.055, 0);
    add(new THREE.BoxGeometry(0.13, 0.012, 0.022), red, x + 0.05, PY + 0.08, 0);
    flange(x - 0.042); flange(x + 0.042);
  };
  const gauge = (x) => {
    add(new THREE.CylinderGeometry(0.005, 0.005, 0.07, 10), steel, x, PY + 0.055, 0);
    add(new THREE.CylinderGeometry(0.034, 0.034, 0.018, 32), steel, x, PY + 0.11, 0, Math.PI / 2);
    add(new THREE.CircleGeometry(0.029, 32), white, x, PY + 0.11, 0.0095);
    add(new THREE.BoxGeometry(0.003, 0.024, 0.002), red, x + 0.006, PY + 0.115, 0.011, 0, 0, -0.6);
  };
  // skid y soportes
  add(new THREE.BoxGeometry(1.08, 0.035, 0.34), dark, 0, 0.018, 0);
  [-0.42, -0.2, 0.04, 0.42].forEach(x => add(new THREE.BoxGeometry(0.03, PY - 0.04, 0.03), dark, x, (PY - 0.04) / 2 + 0.035, 0));
  // tramos
  pipe(-0.54, -0.37); valve(-0.33); pipe(-0.29, -0.25);
  add(new THREE.CylinderGeometry(0.05, 0.05, 0.2, 32), blue, -0.2, PY + 0.01, 0);           // filtro
  add(new THREE.CylinderGeometry(0.055, 0.055, 0.02, 32), steel, -0.2, PY + 0.12, 0);
  add(new THREE.CylinderGeometry(0.012, 0.012, 0.04, 12), steel, -0.2, PY - 0.11, 0);
  pipe(-0.15, -0.06); gauge(-0.1);
  add(new THREE.SphereGeometry(0.055, 32, 20), steel, 0, PY, 0);                             // regulador
  add(new THREE.CylinderGeometry(0.075, 0.075, 0.05, 40), blue, 0, PY + 0.085, 0);
  add(new THREE.SphereGeometry(0.075, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2), blue, 0, PY + 0.11, 0);
  add(new THREE.CylinderGeometry(0.008, 0.008, 0.3, 12), yellow, 0.05, PY + 0.3, 0);          // venteo
  add(new THREE.TorusGeometry(0.03, 0.008, 10, 24, Math.PI), yellow, 0.08, PY + 0.45, 0);
  add(new THREE.CylinderGeometry(0.008, 0.008, 0.04, 12), yellow, 0.11, PY + 0.43, 0);
  pipe(0.055, 0.17); gauge(0.12);
  add(new THREE.BoxGeometry(0.15, 0.17, 0.13), M(0x6d7680, 0.6, 0.35), 0.24, PY + 0.03, 0);  // medidor
  add(new THREE.PlaneGeometry(0.09, 0.04), new THREE.MeshBasicMaterial({ color: 0x0e2a14 }), 0.24, PY + 0.06, 0.066);
  add(new THREE.PlaneGeometry(0.07, 0.018), new THREE.MeshBasicMaterial({ color: 0x39ff6a }), 0.24, PY + 0.06, 0.0665);
  add(new THREE.BoxGeometry(0.04, 0.03, 0.02), black, 0.24, PY - 0.03, 0.07);
  pipe(0.315, 0.37); valve(0.41); pipe(0.45, 0.55);
  flange(-0.54); flange(0.55);

  const labels = [
    ['Entrada · alta presión', -0.5, 0.33], ['Válvula de corte', -0.33, 0.4], ['Filtro', -0.2, 0.42],
    ['Manómetro P1', -0.1, 0.52], ['Regulador', 0.0, 0.62], ['Venteo', 0.12, 0.78],
    ['Medidor', 0.24, 0.48], ['Válvula de salida', 0.41, 0.4], ['Salida · media presión', 0.5, 0.33]
  ].map(([t, x, y], i) => { const l = label3D(t); l.position.set(x, y + (i % 2) * 0.06, 0.05); g.add(l); return l; });
  g.position.y = -0.2;
  const wrap = new THREE.Group(); wrap.add(g);
  return { root: wrap, labels };
}

function fitObject(obj, size = 0.8){
  const box = new THREE.Box3().setFromObject(obj), s = new THREE.Vector3(), c = new THREE.Vector3();
  box.getSize(s); box.getCenter(c);
  const k = size / Math.max(s.x, s.y, s.z, 1e-6);
  const wrap = new THREE.Group(); obj.position.sub(c); wrap.add(obj); wrap.scale.setScalar(k);
  return wrap;
}
const gltfLoader = new GLTFLoader();
function loadModel(item){
  return new Promise((res, rej) => {
    if (item.modelo === 'erm') return res(buildERM());
    if (!item.glb) return rej(new Error('Sin modelo'));
    gltfLoader.load(item.glb, gl => res({ root: fitObject(gl.scene), labels: [] }), undefined, rej);
  });
}
function resetModel(){ if (!modelRoot) return; modelHolder.attach(modelRoot); modelRoot.position.set(0, 0, 0); modelRoot.quaternion.identity(); modelRoot.scale.setScalar(1); autoRot = true; }

/* --- Abrir / cerrar --- */
function headPose(){
  camera.getWorldPosition(tmpV);
  camera.getWorldDirection(tmpV2); tmpV2.y = 0;
  if (tmpV2.lengthSq() < 1e-4) tmpV2.set(0, 0, -1);
  tmpV2.normalize();
  return { pos: tmpV.clone(), dir: tmpV2.clone(), yaw: Math.atan2(-tmpV2.x, -tmpV2.z) };
}
function recenter(group, dist){
  const h = headPose();
  group.position.set(h.pos.x + h.dir.x * dist, 0, h.pos.z + h.dir.z * dist);
  group.rotation.set(0, h.yaw, 0);
  group.userData.intro = 0;
}

      wrapText(ctx, item.descripcion || '', m, y + H * 0.03, W - 2 * m, H * 0.058);
    });
    if (modelRoot){ modelHolder.remove(modelRoot); modelRoot = null; }

const raycaster = new THREE.Raycaster();
const pointers = [];
function makePointer(){ const p = { hovered: null, hit: null }; pointers.push(p); return p; }
function clearPointer(p){ if (p.hovered){ setHover(p.hovered, false); p.hovered = null; } p.hit = null; }
function clearAllHovers(){ pointers.forEach(clearPointer); }
function castPointer(p, origin, dir, haptic){
  raycaster.set(origin, dir); raycaster.far = 40;
  const targets = interactables.filter(o => visibleDeep(o));
  const hits = raycaster.intersectObjects(targets, false);
  const hit = hits[0] || null;
  const obj = hit ? hit.object : null;
  if (obj !== p.hovered){
    if (p.hovered) setHover(p.hovered, false);
    if (obj){ setHover(obj, true); haptic && haptic(); }
    p.hovered = obj;
  }
  p.hit = hit;

const ORB = { on: false, T: new THREE.Vector3(), d: 5, anim: null, ptrs: new Map(), pinch: null, lastTap: 0, hud: false, hudOn: innerWidth >= innerHeight, hint0: null };

const ORB_MAX = 6000;

}
function orbitFrame(anim){

  const c = b.getCenter(new THREE.Vector3()), r = Math.max(b.getSize(new THREE.Vector3()).length() / 2, 0.05);
  const d = THREE.MathUtils.clamp(r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05, ORB_MIN(), ORB_MAX);

function orbitGo(T, d, y, p, anim){
  if (anim){ ORB.anim = { t: 0, T0: ORB.T.clone(), d0: ORB.d, y0: yaw, p0: pitch, T1: T.clone(), d1: d, y1: y ?? yaw, p1: p ?? pitch }; return; }

}
function orbitApply(){

  rig.position.copy(ORB.T).addScaledVector(_of, -ORB.d); rig.position.y -= EYE;
  rig.updateMatrixWorld(true);

  const n = THREE.MathUtils.clamp(ORB.d * 0.003, 0.000003, 0.05), f = THREE.MathUtils.clamp(ORB.d * 20000, 4, 30000);

function orbitUpdate(dt){

    if (a.t >= 1) ORB.anim = null;

  const f = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  const s = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  const v = (keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0);
  const zi = (keys.has('Equal') || keys.has('NumpadAdd') ? 1 : 0) - (keys.has('Minus') || keys.has('NumpadSubtract') ? 1 : 0);
  if (f || s || v || zi){

    const sp = Math.max(ORB.d, 0.3) * 0.9 * dt * (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 4 : 1);

    const [a, b] = [...ORB.ptrs.values()];

function updateInfo(){

  Object.assign(brState, { items, page: 0, back }); brPage(0);
}
function brPage(d){
  const n = Math.max(1, Math.ceil(brState.items.length / brItems.length));
  brState.page = THREE.MathUtils.clamp(brState.page + d, 0, n - 1);
  brItems.forEach((b, i) => {
    const it = brState.items[brState.page * brItems.length + i];
    b.visible = !!it; if (!it) return;
    b.userData.setText(it.label); b.userData.ui.onSelect = it.onSelect;
  });
  brPrev.visible = brState.page > 0; brNext.visible = brState.page < n - 1; brBack.visible = !!brState.back;
}
async function openBrowser3D(){

const btnVR = $('#btn-vr');
let needRecenter = false;
async function setupXR(){
  if (!('xr' in navigator)){
    status(window.isSecureContext ? 'Este navegador no soporta WebXR. Abre la página en el navegador de Meta Quest para la experiencia inmersiva.' : 'WebXR requiere HTTPS.');
    return;
  }
  let ok = false;
  try { ok = await navigator.xr.isSessionSupported('immersive-vr'); } catch (_){}
  if (!ok){ status('Visor VR no detectado: estás en vista 3D. Abre esta página en el navegador de Meta Quest y pulsa "Entrar en VR".'); return; }
  btnVR.disabled = false;
  btnVR.addEventListener('click', async () => {
    const cur = renderer.xr.getSession();
    if (cur){ cur.end(); return; }
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
      await renderer.xr.setSession(s);

}

/* =====================================================================
   10b. VISOR CELULAR (VR Box / Cardboard): pantalla dividida con corrección de lente,
        giroscopio del teléfono, selección con la mirada y control Bluetooth opcional.
        Replica las funciones de Meta Quest sin controles: mirar = apuntar,
        sostener la mirada = gatillo, mirar al piso = caminar, mirar a los pies = menú.
   ===================================================================== */
const CB_KEY = 'vr_visor_celular';
const CB = {
  on: false, have: false, q: new THREE.Quaternion(), qs: new THREE.Quaternion(), yaw0: new THREE.Quaternion(), oriT: 0,
  dwell: 0, dwellObj: null, cool: 0, tp: null, tpT: 0, feetOn: false, gp: {}, rt: null, cfg: null
};
CB.cfg = Object.assign({ ipd: 63, lente: 'suave', fov: 92, dwell: 1.3, calidad: 0.85 }, lsGet(CB_KEY, {}) || {});
const gaze = makePointer();
const LENTES = { no: [0, 0], suave: [0.22, 0.12], media: [0.34, 0.2], fuerte: [0.46, 0.28] };   // k1, k2 (barril)

/* --- giroscopio → cuaternión de la cabeza (método DeviceOrientation estándar) --- */
const _zee = new THREE.Vector3(0, 0, 1), _eul = new THREE.Euler(), _q0 = new THREE.Quaternion(), _q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);

function onOri(e){
  if (e.alpha == null && e.beta == null) return;
  const D = THREE.MathUtils.degToRad;
  _eul.set(D(e.beta || 0), D(e.alpha || 0), -D(e.gamma || 0), 'YXZ');
  CB.q.setFromEuler(_eul).multiply(_q1).multiply(_q0.setFromAxisAngle(_zee, -D(angPantalla())));
  if (!CB.have){ CB.have = true; CB.qs.copy(CB.q); }
  CB.oriT = performance.now();
}
function cbRecentrar(){
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(CB.have ? CB.q : new THREE.Quaternion());
  CB.yaw0.setFromAxisAngle(Y_AXIS, -Math.atan2(-f.x, -f.z));
}

/* --- cámaras de cada ojo y malla de corrección de lente --- */
const camL = new THREE.PerspectiveCamera(90, 1, 0.03, 2500), camR = new THREE.PerspectiveCamera(90, 1, 0.03, 2500);
camL.layers.enable(1); camR.layers.enable(2);                        // video 360 estéreo: cada ojo su esfera
const cbScene = new THREE.Scene(), cbOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
const cbEyes = [0, 1].map(() => { const m = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ vertexColors: true })); m.frustumCulled = false; cbScene.add(m); return m; });
function cbMalla(){
  const W = innerWidth, H = innerHeight, mm = 0.1587;                 // 1 px CSS ≈ 0,159 mm en teléfonos
  const ipdPx = CB.cfg.ipd / mm, [k1, k2] = LENTES[CB.cfg.lente] || LENTES.suave, R0 = H / 2, aspect = (W / 2) / H;
  const N = 36;
  cbEyes.forEach((mesh, eye) => {
    const pos = [], uv = [], col = [], idx = [];
    const x0 = eye * W / 2, lcx = W / 2 + (eye ? 1 : -1) * Math.min(ipdPx / 2, W / 2 - 4), lcy = H / 2;
    const norm = 1 + k1 + k2;
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++){
      const sx = x0 + i / N * W / 2, sy = j / N * H;
      const rx = (sx - lcx) / R0, ry = (sy - lcy) / R0, r2 = rx * rx + ry * ry, f = (1 + k1 * r2 + k2 * r2 * r2) / norm;
      const u = 0.5 + rx * f / (2 * aspect), v = 0.5 - ry * f / 2;
      pos.push(sx / W * 2 - 1, 1 - sy / H * 2, 0); uv.push(u, v);
      const out = Math.max(0, Math.max(-u, u - 1, -v, v - 1)) * 40, k = THREE.MathUtils.clamp(1 - out, 0, 1);   // fuera de la imagen → negro
      col.push(k, k, k);
    }
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++){ const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(idx);
    mesh.geometry.dispose(); mesh.geometry = g;
  });

  const pr = Math.min(devicePixelRatio, 2) * CB.cfg.calidad, w = Math.min(1600, Math.round(W / 2 * pr)), h = Math.min(1800, Math.round(H * pr));
  if (!CB.rt || CB.rt[0].width !== w || CB.rt[0].height !== h){
    CB.rt?.forEach(t => t.dispose());
    const half = renderer.capabilities.isWebGL2 && (renderer.extensions.has('EXT_color_buffer_half_float') || renderer.extensions.has('EXT_color_buffer_float'));
    CB.rt = [0, 1].map(() => new THREE.WebGLRenderTarget(w, h, { type: half ? THREE.HalfFloatType : THREE.UnsignedByteType, samples: renderer.capabilities.isWebGL2 && !LOW_MEM ? 4 : 0 }));
  }
  cbEyes.forEach((m, i) => { m.material.map = CB.rt[i].texture; m.material.needsUpdate = true; });
}

/* --- retícula de mirada con anillo de carga --- */
const retGrp = new THREE.Group(); retGrp.visible = false; camera.add(retGrp);
const retDot = new THREE.Mesh(new THREE.RingGeometry(0.004, 0.0075, 28), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true, opacity: 0.95, toneMapped: false }));
const retArc = new THREE.Mesh(new THREE.RingGeometry(0.0095, 0.0135, 40, 1, Math.PI / 2, 0.001), new THREE.MeshBasicMaterial({ color: 0xffaa3c, depthTest: false, transparent: true, toneMapped: false }));
retDot.renderOrder = retArc.renderOrder = 60; retGrp.add(retDot, retArc);
function retArco(p){ retArc.geometry.dispose(); retArc.geometry = new THREE.RingGeometry(0.0095, 0.0135, 40, 1, Math.PI / 2, -Math.max(0.001, p) * Math.PI * 2); }
/* marcador de destino al caminar con la mirada */
const tpMark = new THREE.Group(); tpMark.visible = false; scene.add(tpMark);
const tpRing = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.27, 48), new THREE.MeshBasicMaterial({ color: 0x3d8bff, transparent: true, opacity: 0.9, depthWrite: false, toneMapped: false, side: THREE.DoubleSide }));
const tpFill = new THREE.Mesh(new THREE.CircleGeometry(0.22, 48), new THREE.MeshBasicMaterial({ color: 0xffaa3c, transparent: true, opacity: 0.55, depthWrite: false, toneMapped: false, side: THREE.DoubleSide }));
tpRing.rotation.x = tpFill.rotation.x = -Math.PI / 2; tpMark.add(tpRing, tpFill);

/* --- menú de los pies (equivale a los botones y joysticks de Quest) --- */
const feet = new THREE.Group(); feet.visible = false; rig.add(feet);
const feetBg = panel(1.06, 0.5, (ctx, W, H) => { glassBg(ctx, W, H, 40, 0.86); ctx.fillStyle = '#9fc4e8'; ctx.textAlign = 'center'; ctx.font = `600 ${H * 0.07}px ${FONT}`; ctx.fillText('Mira un botón para activarlo · sube la mirada para cerrar', W / 2, H * 0.93); }, 500);
feetBg.position.z = -0.002; feet.add(feetBg);
const FB = [];
const fb = (t, x, y, fn, w = 0.32) => { const b = makeButton(t, { w, h: 0.095 }, fn); b.position.set(x, y, 0); feet.add(b); FB.push(b); return b; };
const fbPanel = fb('📋 Traer panel', -0.345, 0.17, () => { if (mode === 'plano') placePlanUI(true); else if (mode === '360'){ recenter(sphereUI, 0.9); sphereBar.g.visible = true; } else recenter(menu, 0); });
fb('🎯 Centrar vista', 0, 0.17, () => { cbRecentrar(); if (mode === 'menu') setTimeout(() => recenter(menu, 0), 50); });
fb('⌂ Catálogo', 0.345, 0.17, () => { if (mode !== 'menu') closeViewer(); });
const fbA = fb('⟲ Girar', -0.39, 0.05, () => cbAccion('izq'), 0.24), fbB = fb('⟳ Girar', -0.13, 0.05, () => cbAccion('der'), 0.24);
const fbC = fb('＋ Acercar', 0.13, 0.05, () => cbAccion('mas'), 0.24), fbD = fb('－ Alejar', 0.39, 0.05, () => cbAccion('menos'), 0.24);
fb('✕ Salir del visor', 0, -0.07, () => cbSalir(), 0.5);
function cbAccion(a){
  const real = mode === 'plano' && PLAN && PLAN.mode === 'real', gt = grabTarget();
  if (real){ if (a === 'mas') rig.position.y += 1; else if (a === 'menos') rig.position.y = Math.max(rig.position.y - 1, -50); else snapTurn((a === 'izq' ? 1 : -1) * Math.PI / 4); return; }
  if (gt){ if (a === 'izq' || a === 'der') gt.obj.rotateOnWorldAxis(Y_AXIS, (a === 'izq' ? 1 : -1) * Math.PI / 6); else gt.obj.scale.multiplyScalar(a === 'mas' ? 1.25 : 0.8); autoRot = false; if (PLAN) PLAN.spin = false; return; }
  snapTurn((a === 'izq' ? 1 : -1) * Math.PI / 4);
}
function etiquetasPies(){
  const real = mode === 'plano' && PLAN && PLAN.mode === 'real', gt = grabTarget();
  fbA.userData.setText(gt && !real ? '⟲ Girar' : '⟲ Voltear'); fbB.userData.setText(gt && !real ? '⟳ Girar' : '⟳ Voltear');
  fbC.userData.setText(real ? '⬆ Subir 1 m' : gt ? '＋ Agrandar' : '＋ —'); fbD.userData.setText(real ? '⬇ Bajar 1 m' : gt ? '－ Achicar' : '－ —');
  fbPanel.userData.setText(mode === 'plano' ? '📋 Traer panel' : mode === '360' ? '📋 Controles' : '📋 Catálogo al frente');

/* --- piso para caminar con la mirada (modo 1:1 y alrededor de la maqueta) --- */
const _gr = new THREE.Raycaster(), _go = new THREE.Vector3(), _gd = new THREE.Vector3(), _gq = new THREE.Quaternion();
function pisoMirado(){
  if (mode !== 'plano' && mode !== 'menu') return null;
  if (_gd.y > -0.42) return null;                                   // hay que mirar claramente hacia abajo (≈ 25°)
  const y0 = mode === 'plano' && PLAN && PLAN.mode === 'real' ? rig.position.y : 0;
  const t = (y0 - _go.y) / _gd.y; if (!(t > 1.0 && t < 25)) return null;
  // si la mirada toca la mesa, la maqueta o un tubo/componente antes que el piso, no se camina
  _gr.set(_go, _gd); _gr.far = t; _gr.camera = camera;
  const obst = mode === 'plano' ? (PLAN && PLAN.mode === 'maqueta' ? [planView] : [planContent]) : [];
  if (obst.length && _gr.intersectObjects(obst, true).some(h => h.object.visible && !h.object.isSprite && !h.object.userData.piso && !(h.object.material && (h.object.material.isShadowMaterial || h.object.material.isLineDashedMaterial)))) return null;
  return new THREE.Vector3(_go.x + _gd.x * t, y0, _go.z + _gd.z * t);
}

/* --- actualización por cuadro --- */
function cbUpdate(dt){
  // orientación de la cabeza: giroscopio (o arrastre si el equipo no tiene sensores, para probar en PC)
  const sinSensor = !CB.have || performance.now() - CB.oriT > 1500;
  if (sinSensor) camera.rotation.set(-pitch, -yaw, 0, 'YXZ');
  else { CB.qs.slerp(CB.q, 0.6); camera.quaternion.copy(CB.yaw0).multiply(CB.qs); }
  camera.updateMatrixWorld();
  camera.getWorldPosition(_go); camera.getWorldQuaternion(_gq); _gd.set(0, 0, -1).applyQuaternion(_gq);
  const pitchW = Math.asin(THREE.MathUtils.clamp(_gd.y, -1, 1));

  // menú de los pies
  if (!CB.feetOn && pitchW < -0.95){
    CB.feetOn = true; etiquetasPies();
    let hx = _gd.x, hz = _gd.z; const l = Math.hypot(hx, hz); if (l < 0.05){ const f = new THREE.Vector3(0, 1, 0).applyQuaternion(_gq); hx = -f.x; hz = -f.z; } const l2 = Math.hypot(hx, hz) || 1; hx /= l2; hz /= l2;
    feet.position.copy(rig.worldToLocal(new THREE.Vector3(_go.x + hx * 0.42, _go.y - 0.95, _go.z + hz * 0.42)));
    feet.rotation.set(-1.0, Math.atan2(-hx, -hz) - rig.rotation.y, 0, 'YXZ'); feet.visible = true;
  } else if (CB.feetOn && pitchW > -0.5){ CB.feetOn = false; feet.visible = false; }

  // mirada = puntero
  const hit = castPointer(gaze, _go, _gd);
  if (!hit && mode === 'plano') planHitFor(gaze, { o: _go, d: _gd }); else planHits.delete(gaze);
  const ui = hit && hit.object.userData.ui && hit.object.userData.ui.onSelect ? hit.object : null;
  retGrp.visible = true; const dist = hit ? Math.min(hit.distance, 12) : 3; retGrp.position.set(0, 0, -dist); retGrp.scale.setScalar(dist);
  const now = performance.now() / 1000;                              // tiempo real (no depende de los cuadros por segundo)
  if (ui && now >= CB.cool){
    if (CB.dwellObj !== ui){ CB.dwellObj = ui; CB.dwell = now; }
    const p = (now - CB.dwell) / CB.cfg.dwell; retArco(p);
    if (p >= 1){ select(gaze); CB.cool = now + 0.7; CB.dwellObj = null; retArco(0); }
  } else if (!ui || now < CB.cool){ if (CB.dwellObj){ CB.dwellObj = null; retArco(0); } }

  // caminar con la mirada: sostener la vista sobre el piso → ir allí (sin mareo: salto corto)
  const piso = !ui && !CB.feetOn ? pisoMirado() : null;
  if (piso && (mode === 'plano')){
    if (!CB.tp || CB.tp.distanceTo(piso) > 0.35){ CB.tp = piso; CB.tpT = now; }
    const p = Math.min(1, (now - CB.tpT) / 1.6);
    tpMark.visible = true; tpMark.position.copy(piso).add(tmpV.set(0, 0.01, 0)); tpFill.scale.setScalar(Math.max(0.01, p));
    if (p >= 1){ const d = piso.clone().sub(tmpV.set(_go.x, piso.y, _go.z)); rig.position.add(d); CB.tp = null; tpMark.visible = false; CB.cool = now + 0.4; }
  } else { tpMark.visible = false; CB.tp = null; CB.tpT = 0; }

  // control Bluetooth (si hay): A = seleccionar / caminar ya, B = catálogo, joystick = caminar o girar
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  for (const gp of pads){
    const st = CB.gp[gp.index] || (CB.gp[gp.index] = {});
    const a = !!(gp.buttons[0]?.pressed), b = !!(gp.buttons[1]?.pressed);
    if (a && !st.a){ if (ui) select(gaze); else if (CB.tp){ CB.tpT = -99; } }
    if (b && !st.b && mode !== 'menu') closeViewer();
    st.a = a; st.b = b;
    const x = gp.axes[0] || 0, y = gp.axes[1] || 0;
    if (mode === 'plano' && PLAN && PLAN.mode === 'real'){ if (Math.abs(x) > 0.2 || Math.abs(y) > 0.2) walk(x, -y, dt); }
    else { const gt = grabTarget(); if (gt && Math.abs(x) > 0.2){ gt.obj.rotateOnWorldAxis(Y_AXIS, x * dt * 2); autoRot = false; } if (gt && Math.abs(y) > 0.3) gt.obj.scale.multiplyScalar(1 - y * dt * 0.8); }
  }
}
const _ex = new THREE.Vector3();
function cbRender(){
  const W = innerWidth, H = innerHeight;
  if (!CB.rt) cbMalla();
  camera.updateMatrixWorld(); _ex.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  const sh = renderer.shadowMap.autoUpdate; renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;
  [camL, camR].forEach((c, i) => {
    c.position.setFromMatrixPosition(camera.matrixWorld).addScaledVector(_ex, (i ? 1 : -1) * CB.cfg.ipd / 2000);
    c.quaternion.copy(_gq); c.fov = CB.cfg.fov; c.aspect = (W / 2) / H; c.near = camera.near; c.far = camera.far; c.updateProjectionMatrix(); c.updateMatrixWorld();
    if (CB.cfg.lente === 'no'){
      renderer.setRenderTarget(null); renderer.setScissorTest(true);
      renderer.setViewport(i * W / 2, 0, W / 2, H); renderer.setScissor(i * W / 2, 0, W / 2, H); renderer.render(scene, c);
    } else { renderer.setRenderTarget(CB.rt[i]); renderer.render(scene, c); }
  });
  renderer.shadowMap.autoUpdate = sh;
  if (CB.cfg.lente === 'no'){ renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); return; }
  renderer.setRenderTarget(null); renderer.setViewport(0, 0, W, H); renderer.render(cbScene, cbOrtho);
}

/* --- entrar / salir --- */
const cbOv = document.createElement('div'); cbOv.id = 'cb-ov'; document.body.appendChild(cbOv);
function cbAjustes(){
  const c = CB.cfg;
  cbOv.innerHTML = `<div class="cb-box"><h3>👓 Visor celular (VR Box / Cardboard)</h3>
  <p>Funciona como unas gafas Meta Quest pero con tu teléfono. <b>Para apuntar mira</b>; <b>para hacer clic sostén la mirada</b> sobre el botón hasta que se llene el anillo; <b>para caminar mira un punto del piso</b> hasta que se llene el círculo; <b>mira hacia tus pies</b> para el menú (girar, escalar, traer panel, salir).</p>
  <label>Distancia entre tus ojos / lentes <b id="cb-ipdv">${c.ipd} mm</b><input type="range" id="cb-ipd" min="54" max="74" step="1" value="${c.ipd}"></label>
  <label>Corrección de lente<select id="cb-lente"><option value="no">Sin corrección</option><option value="suave">Suave (VR Box, Cardboard)</option><option value="media">Media</option><option value="fuerte">Fuerte (lentes grandes)</option></select></label>
  <label>Campo de visión <b id="cb-fovv">${c.fov}°</b><input type="range" id="cb-fov" min="70" max="115" step="1" value="${c.fov}"></label>
  <label>Tiempo para seleccionar con la mirada<select id="cb-dw"><option value="0.9">Rápido (0,9 s)</option><option value="1.3">Normal (1,3 s)</option><option value="1.8">Lento (1,8 s)</option></select></label>
  <label>Calidad de imagen<select id="cb-q"><option value="0.65">Ahorro de batería</option><option value="0.85">Equilibrada</option><option value="1">Máxima</option></select></label>
  <p class="cb-n">Gira el teléfono en horizontal, con el borde de carga a la derecha. Si tienes un control Bluetooth, el botón A selecciona, B vuelve al catálogo y el joystick camina.</p>
  <div class="cb-acts"><button class="btn" id="cb-no">Cancelar</button><button class="btn btn-vr" id="cb-go">👓 Entrar al visor</button></div></div>`;
  cbOv.className = 'on';
  $('#cb-lente').value = c.lente; $('#cb-dw').value = String(c.dwell); $('#cb-q').value = String(c.calidad);
  $('#cb-ipd').oninput = e => { $('#cb-ipdv').textContent = e.target.value + ' mm'; };
  $('#cb-fov').oninput = e => { $('#cb-fovv').textContent = e.target.value + '°'; };
  $('#cb-no').onclick = () => { cbOv.className = ''; };
  $('#cb-go').onclick = () => {
    Object.assign(CB.cfg, { ipd: +$('#cb-ipd').value, lente: $('#cb-lente').value, fov: +$('#cb-fov').value, dwell: +$('#cb-dw').value, calidad: +$('#cb-q').value });
    lsSet(CB_KEY, CB.cfg); cbEntrar();
  };
}
let wakeLock = null;
async function cbEntrar(){
  // permisos de sensores (iPhone) y pantalla completa horizontal (Android): deben pedirse en el toque del usuario
  try { if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){ const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') toast('Sin permiso de movimiento: arrastra el dedo para mirar.'); } } catch (_){}
  try { await (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)?.call(document.documentElement, { navigationUI: 'hide' }); } catch (_){}
  try { await screen.orientation?.lock?.('landscape'); } catch (_){}
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_){}
  addEventListener('deviceorientation', onOri, true);
  CB.on = true; CB.rt = null; document.body.classList.add('cb'); cbOv.className = '';
  clearPointer(mouse); hasMouse = false; camera.layers.disable(1);
  setTimeout(() => { cbMalla(); }, 200);
  // cuenta regresiva para poner el teléfono en el visor y centrar la vista
  let n = 4; const tick = () => { if (!CB.on) return; if (--n > 0){ toast3D(`Coloca el teléfono en el visor… ${n}`); setTimeout(tick, 1000); } else { cbRecentrar(); if (mode === 'menu') recenter(menu, 0); else if (mode === 'plano') placePlanUI(true); toast3D('Mira un botón para seleccionarlo · mira a tus pies para el menú'); } };
  tick();
}
function cbSalir(){
  if (!CB.on) return;
  CB.on = false; removeEventListener('deviceorientation', onOri, true); CB.have = false;
  document.body.classList.remove('cb'); retGrp.visible = false; feet.visible = false; CB.feetOn = false; tpMark.visible = false; clearPointer(gaze); planHits.delete(gaze);
  camera.layers.enable(1); camera.quaternion.identity(); yaw = pitch = 0;
  try { wakeLock?.release?.(); } catch (_){} wakeLock = null;
  try { screen.orientation?.unlock?.(); } catch (_){}
  try { if (document.fullscreenElement) document.exitFullscreen?.(); } catch (_){}
  renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.setRenderTarget(null);
  CB.rt?.forEach(t => t.dispose()); CB.rt = null;
}
addEventListener('resize', () => { if (CB.on) setTimeout(cbMalla, 120); });
document.addEventListener('fullscreenchange', () => { if (CB.on && !document.fullscreenElement && /Android/i.test(navigator.userAgent)) toast3D('Pantalla completa desactivada'); });
// tocar la pantalla (si el visor lo permite) también selecciona lo que se mira
cv.addEventListener('pointerup', e => { if (!CB.on) return; e.stopImmediatePropagation(); const tap = !drag || drag.moved < 8; drag = null; cv.classList.remove('dragging'); if (tap && gaze.hit && gaze.hit.object.userData.ui?.onSelect){ select(gaze); CB.cool = performance.now() / 1000 + 0.6; } }, true);
$('#btn-cb').addEventListener('click', () => CB.on ? cbSalir() : cbAjustes());
$('#cb-x').addEventListener('click', () => cbSalir());
window.__vrCB = { CB, entrar: cbEntrar, salir: cbSalir, ajustes: cbAjustes,
  mirar: (y, p) => { yaw = y; pitch = p; },
  rayo: () => { camera.updateMatrixWorld(); const o = camera.getWorldPosition(new THREE.Vector3()), q = camera.getWorldQuaternion(new THREE.Quaternion()), d = new THREE.Vector3(0, 0, -1).applyQuaternion(q); raycaster.set(o, d); raycaster.far = 40; const t = interactables.filter(m => visibleDeep(m)); const h = raycaster.intersectObjects(t, false); return { n: t.length, hits: h.slice(0, 3).map(x => [x.object.userData.label ? x.object.userData.label() : '?', +x.distance.toFixed(2)]), o: o.toArray(), d: d.toArray(), go: _go.toArray(), gd: _gd.toArray() }; },
  estado: () => ({ hit: gaze.hit ? (gaze.hit.object.userData.label ? gaze.hit.object.userData.label() : gaze.hit.object.type) : null, yaw, pitch, cam: camera.getWorldDirection(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)), modo: mode }),
  apuntarA: t => { const o = interactables.find(m => visibleDeep(m) && m.userData.label && m.userData.label().includes(t)); if (!o) return false; camera.updateMatrixWorld(); const c = camera.getWorldPosition(new THREE.Vector3()), p = o.getWorldPosition(new THREE.Vector3()).sub(c).normalize(); const ry = rig.rotation.y; const d = p.clone().applyAxisAngle(Y_AXIS, -ry); yaw = -Math.atan2(-d.x, -d.z); pitch = -Math.asin(d.y); return true; } };

/* =====================================================================
   11. BUCLE DE RENDER
   ===================================================================== */
const btnExit2D = $('#btn-exit');
btnExit2D.addEventListener('click', () => closeViewer());
let lastMode = null;
const groupsIntro = [menu, screenView, modelView, sphereUI, planUI, browser];
let loopErrors = 0;
function loop(){
  try { frame(); }
  catch (e){
    if (loopErrors++ < 3) console.error('Mundo Virtual:', e);
    try { renderer.render(scene, camera); } catch (_){}
  }
  if (!window.__vrBoot.ok){ window.__vrBoot.ok = true; vrHideLoading(); }
}
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt;
  orbitSync();
  if (mode !== lastMode){ lastMode = mode; btnExit2D.hidden = mode === 'menu'; }
  const inXR = renderer.xr.isPresenting;

  if (inXR){
    if (needRecenter){ needRecenter = false; setTimeout(() => recenter(menu, 0), 300); }
    for (const c of controllers){
      const ud = c.userData;
      if (!ud.active){ ud.reticle.visible = false; planHits.delete(c); continue; }
      const r = ctrlRay(c);
      const hit = castPointer(ud.ptr, r.o, r.d, () => pulse(c));
      const mh = hit ? null : (mode === 'plano' ? planHitFor(c, r) : hitModel(r.o, r.d));
      if (hit) planHits.delete(c);
      const h = hit || mh;
      ud.line.scale.z = h ? h.distance : 3;
      ud.line.material.color.set(hit ? 0xffffff : 0xff3b45);
      ud.reticle.visible = !!hit;
      if (hit){ ud.reticle.position.copy(hit.point); ud.reticle.lookAt(r.o); }
    }
    handleSticks(dt);
  } else if (CB.on){
    cbUpdate(dt);
  } else {
    camera.rotation.set(-pitch, -yaw, 0, 'YXZ');
    if (ORB.on) orbitUpdate(dt);
    if (hasMouse && !drag){
      const r = rayFromCamera(); const h = castPointer(mouse, r.o, r.d);
      if (mode === 'plano' && !h) planHitFor(mouse, r); else planHits.delete(mouse);
    } else if (!hasMouse){ clearPointer(mouse); planHits.delete(mouse); }
  }
  planFrame++;
  if (mode === 'plano'){
    desktopWalk(dt); updateInfo();
    if (PLAN && PLAN.spin && PLAN.mode === 'maqueta' && !grabbedBy) planPivot.rotation.y += dt * 0.22;
    seguirLuz();
    if (realGrid.visible){ realGrid.position.x = Math.round(rig.position.x); realGrid.position.z = Math.round(rig.position.z); }
  }

  if (menu.visible) layoutRows(dt);

  // animación de entrada de grupos
  for (const g of groupsIntro){
    if (!g.visible) continue;
    if (g.userData.intro === undefined) g.userData.intro = 1;
    if (g.userData.intro < 1){ g.userData.intro = Math.min(1, g.userData.intro + dt * 3); const s = 0.92 + 0.08 * (1 - Math.pow(1 - g.userData.intro, 3)); g.scale.setScalar(s); }
  }

  // entorno
  if (env.visible){
    env.userData.stars.rotation.y += dt * 0.004;
    env.userData.dust.rotation.y -= dt * 0.02;
    env.userData.ring.material.opacity = 0.55 + 0.3 * Math.sin(elapsed * 2);
  }
  // visores
  if (mode === 'pantalla' || mode === '360') updateBars();
  if (mode === 'modelo'){
    if (modelRoot && autoRot && !grabbedBy) modelRoot.rotation.y += dt * 0.35;
    holo.material.opacity = 0.05 + 0.03 * Math.sin(elapsed * 3);
    if (modelLabels.length && labelsOn){ camera.getWorldPosition(tmpV); modelLabels.forEach(l => l.lookAt(tmpV)); }
  }
  if (CB.on) cbRender(); else renderer.render(scene, camera);
}

recenter(menu, 0);
try { arranquePlanos(); } catch (e){ console.error(e); }
renderer.setAnimationLoop(loop);
</script>
