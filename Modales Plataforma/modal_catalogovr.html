<!--
  =====================================================================
   VR ENTALPIA · Mundo Virtual (WebXR)
   Catálogo inmersivo 3D compatible con Meta Quest (2 / 3 / 3S / Pro)
  ---------------------------------------------------------------------
   · En el navegador de Meta Quest: botón "Entrar en VR".
   · En PC / móvil: vista 3D navegable (arrastrar para mirar, clic para abrir).
   · Requiere HTTPS (GitHub Pages ya lo cumple).

   CÓMO AGREGAR PROYECTOS  →  edita el arreglo `database` (más abajo).
   Cada item admite:
     title, subtitle, icon (emoji), img (miniatura opcional)
     tipo: "video"     → pantalla gigante en el laboratorio   (url = .mp4)
           "video360"  → esfera inmersiva equirectangular     (url = .mp4)
                         estereo: "sbs" (lado a lado) | "tb" (arriba/abajo) | omitir = mono
           "modelo"    → modelo 3D en pedestal, se agarra y gira
                         modelo: "erm" (gemelo digital incluido) | glb: "ruta/archivo.glb"
     descripcion: texto para el panel de información (modelos)
   Los videos e imágenes de otros dominios deben permitir CORS; lo más
   seguro es alojarlos en este mismo repositorio / dominio.
  =====================================================================
-->
<style>
  :root{
    --bg:#05060a; --accent:#e50914; --accent-2:#ff2a35; --text:#fff; --muted:#a7a9b4;
    --glass:rgba(10,11,16,.72); --line:rgba(255,255,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  canvas{display:block;touch-action:none;cursor:grab}

  nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;gap:12px;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,0));}
  .logo{font-size:1.4rem;font-weight:800;color:var(--accent);letter-spacing:2px;text-transform:uppercase;white-space:nowrap;text-decoration:none}
  .logo span{color:#fff;font-weight:300}
  .actions{display:flex;gap:10px;align-items:center}
  .btn{border:1px solid var(--line);background:var(--glass);color:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;
    font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(6px);
    text-decoration:none;transition:background .2s,transform .2s}
  .btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

  #status{position:fixed;top:66px;right:16px;z-index:10;font-size:.75rem;color:var(--muted);background:var(--glass);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:min(360px,calc(100vw - 32px));display:none}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;font-size:.8rem;color:var(--muted);
    background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 16px;text-align:center;
    max-width:calc(100vw - 32px);backdrop-filter:blur(6px)}
  #toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(10px);z-index:11;opacity:0;
    background:rgba(229,9,20,.92);color:#fff;font-weight:600;font-size:.9rem;padding:10px 18px;border-radius:10px;
    transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}

  /* Modal "Mis planos" */
  .pm{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}

  .pm-row:hover,.pm-row:focus-visible{background:#1a1d27;border-color:rgba(229,9,20,.6);outline:none}
  .pm-th{width:64px;height:44px;flex:none;border-radius:6px;background:#1d2130 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:1.3rem}

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   1. DATOS DEL CATÁLOGO
   ===================================================================== */
const DEMO_360 = 'https://threejs.org/examples/textures/MaryOculus.mp4';
const DEMO_VIDEO = 'https://threejs.org/examples/textures/sintel.mp4';

const database = [
  {
    category: "Mis planos", color: "#3d8bff", icon: "📐", dinamica: "planos",
    items: [
      { title: "Abrir plano", subtitle: "Proyectos del SGC · Isoflux", icon: "📂", tipo: "accion" }
    ]
  },
  {
    category: "Demostraciones VR", color: "#e50914", icon: "🥽",
    items: [
      { title: "Recorrido 360°", subtitle: "Video inmersivo estéreo", icon: "🌐", tipo: "video360", estereo: "sbs", url: DEMO_360 },
      { title: "Sala de proyección", subtitle: "Pantalla gigante en el laboratorio", icon: "🎬", tipo: "video", url: DEMO_VIDEO },
      { title: "Gemelo digital ERM", subtitle: "Estación de regulación y medición", icon: "🛠️", tipo: "modelo", modelo: "erm",
        descripcion: "Tren de regulación de gas natural: válvulas de corte, filtro, regulador con venteo, medidor y manómetros de entrada y salida. Agárralo con el grip (o mantén el gatillo) para girarlo y examinarlo." }
    ]
  },
  {
    category: "Salud Ocupacional", color: "#1fae6b", icon: "⛑️",
    items: [
      { title: "N/R", img: "", url: "" },
      { title: "N/R", img: "", url: "" }
    ]
  },
  {
    category: "Metrologia", color: "#2f7bff", icon: "📏",
    items: [
      { title: "N/R", img: "", url: "" },
      { title: "N/R", img: "", url: "" }
    ]
  },
  {
    category: "Inspecciones", color: "#f2a516", icon: "🔍",
    items: [
      { title: "N/R", img: "", url: "" },
      { title: "N/R", img: "", url: "" }
    ]
  }
];
const DEST_CAT = database.find(c => c.category === "Demostraciones VR");
const DESTACADO = DEST_CAT.items[0];

/* =====================================================================
   2. UTILIDADES DOM
   ===================================================================== */
const $ = s => document.querySelector(s);
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  toast3D(msg);
}
function status(msg){ const s = $('#status'); s.textContent = msg; s.style.display = msg ? 'block' : 'none'; }

/* =====================================================================
   3. ESCENA BÁSICA
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.Fog(0x05060a, 9, 30);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 2500);
const EYE = 1.6;
camera.position.set(0, EYE, 0);
camera.layers.enable(1);               // ver esfera "ojo izquierdo" fuera de VR
const rig = new THREE.Group();         // "jugador": se gira con snap-turn
rig.add(camera);
scene.add(rig);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a0a0a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 4, 3);
scene.add(sun);

const FONT = 'system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const ACCENT = '#e50914';
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpM = new THREE.Matrix4(), Y_AXIS = new THREE.Vector3(0, 1, 0);
const clock = new THREE.Clock();
let elapsed = 0;

/* =====================================================================
   4. AYUDANTES DE TEXTURAS (canvas → panel 3D)
   ===================================================================== */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(ctx, text, x, y, maxW, lh){
  const words = String(text).split(/\s+/); let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ ctx.fillText(line, x, y); line = w; y += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
  return y + lh;
}
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function texFrom(canvas){
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; t.generateMipmaps = true;
  return t;
}
/* Panel con contenido dibujado; devuelve mesh con userData.redraw(fn) */
function panel(wm, hm, draw, ppm = 420){
  const c = makeCanvas(Math.round(wm * ppm), Math.round(hm * ppm));
  const ctx = c.getContext('2d');
  draw(ctx, c.width, c.height);
  const tex = texFrom(c);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wm, hm),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.02 }));
  mesh.userData.redraw = fn => { ctx.clearRect(0, 0, c.width, c.height); fn(ctx, c.width, c.height); tex.needsUpdate = true; };
  return mesh;
}
function glassBg(ctx, W, H, r = 36, alpha = 0.78){
  roundRect(ctx, 3, 3, W - 6, H - 6, r);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(22,24,32,${alpha})`); g.addColorStop(1, `rgba(8,9,13,${alpha})`);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.stroke();
}

/* =====================================================================
   5. SISTEMA DE INTERACCIÓN (hover / select para mouse, controles y manos)
   ===================================================================== */
const interactables = [];
function registerUI(mesh, ui){ mesh.userData.ui = Object.assign({ count: 0, on: false }, ui); interactables.push(mesh); return mesh; }
function setHover(obj, on){
  const ui = obj.userData.ui; if (!ui) return;
  ui.count = Math.max(0, ui.count + (on ? 1 : -1));
  const now = ui.count > 0;
  if (now !== ui.on){ ui.on = now; ui.onHover && ui.onHover(now); }
}
function visibleDeep(o){ while (o){ if (!o.visible) return false; o = o.parent; } return true; }

function makeButton(text, { w = 0.32, h = 0.1, primary = false } = {}, onSelect){
  const ppm = 600;
  const c = makeCanvas(Math.round(w * ppm), Math.round(h * ppm)), ctx = c.getContext('2d');
  const tex = texFrom(c);
  let label = text, hover = false;
  const draw = () => {
    const W = c.width, H = c.height; ctx.clearRect(0, 0, W, H);
    roundRect(ctx, 4, 4, W - 8, H - 8, (H - 8) / 2);
    ctx.fillStyle = primary ? (hover ? '#ff2a35' : ACCENT) : (hover ? 'rgba(255,255,255,.30)' : 'rgba(30,32,40,.88)');
    ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = hover ? '#ffffff' : 'rgba(255,255,255,.28)'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let fs = H * 0.42; ctx.font = `700 ${fs}px ${FONT}`;
    while (ctx.measureText(label).width > W * 0.86 && fs > 10){ fs -= 2; ctx.font = `700 ${fs}px ${FONT}`; }
    ctx.fillText(label, W / 2, H / 2 + 2);
    tex.needsUpdate = true;
  };
  draw();
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.02 }));
  registerUI(mesh, {
    onSelect,
    onHover(on){ hover = on; draw(); mesh.scale.setScalar(on ? 1.07 : 1); }
  });
  mesh.userData.setText = t => { label = t; draw(); };
  return mesh;
}

/* =====================================================================
   6. ENTORNO: laboratorio holográfico
   ===================================================================== */
const env = new THREE.Group(); scene.add(env);
{
  const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64),
    new THREE.MeshStandardMaterial({ color: 0x0a0b10, roughness: 0.9, metalness: 0.1 }));
  floor.rotation.x = -Math.PI / 2; env.add(floor); env.userData.floor = floor;

  const grid = new THREE.GridHelper(32, 64, 0x5a0a10, 0x1b1d26);
  grid.material.transparent = true; grid.material.opacity = 0.55; grid.position.y = 0.002; env.add(grid);
  env.userData.grid = grid;

  // anillos de plataforma bajo el usuario
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xe50914, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.66, 64), ringMat);
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.004; env.add(ring);
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(0.9, 0.905, 64),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
  ring2.rotation.x = -Math.PI / 2; ring2.position.y = 0.004; env.add(ring2);
  env.userData.ring = ring;

  // arco holográfico detrás del catálogo
  const arc = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 4.2, 96, 1, true, Math.PI - 1.4, 2.8),
    new THREE.MeshBasicMaterial({ color: 0xe50914, wireframe: true, transparent: true, opacity: 0.05 }));
  arc.position.y = 1.8; env.add(arc); env.userData.arc = arc;

  // estrellas / partículas
  const N = 1400, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    const r = 35 + Math.random() * 45, th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 1.8 - 0.8);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.cos(ph) + 5; pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.7, fog: false }));
  env.add(stars); env.userData.stars = stars;

  // polvo flotante cercano
  const M = 260, dp = new Float32Array(M * 3);
  for (let i = 0; i < M; i++){ dp[i * 3] = (Math.random() - .5) * 12; dp[i * 3 + 1] = Math.random() * 3.5; dp[i * 3 + 2] = (Math.random() - .5) * 12; }
  const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  const dust = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xff4d57, size: 0.018, transparent: true, opacity: 0.6 }));
  env.add(dust); env.userData.dust = dust;
}

/* =====================================================================
   7. MENÚ 3D: encabezado + filas curvas de tarjetas + paneles laterales
   ===================================================================== */
const menu = new THREE.Group(); scene.add(menu);
const R = 3.2;                             // radio del arco de tarjetas
const CW = 0.576, CH = 0.36, GAP = 0.07;   // tamaño tarjeta (m)
const STEP = (CW + GAP) / R;               // ángulo entre tarjetas
const HALF_VIS = 0.78;                     // medio ángulo visible por fila (rad)
const ROW_GAP = 0.58;
const nRows = database.length;
const rowTop = 1.42 + (nRows - 1) * ROW_GAP / 2;
const rows = [];

const isPending = it => !it.url && !it.modelo && !it.glb && !['accion', 'plano', 'plano-local'].includes(it.tipo);
const tipoBadge = it => isPending(it) ? 'PRÓXIMAMENTE' : ({ video: 'VIDEO', video360: '360°', modelo: '3D', accion: 'ABRIR', plano: 'PLANO 3D', 'plano-local': 'PLANO 3D' }[it.tipo] || 'VIDEO');

function drawCard(ctx, W, H, item, cat, img){
  ctx.clearRect(0, 0, W, H);
  ctx.save(); roundRect(ctx, 0, 0, W, H, 26); ctx.clip();
  if (img){
    const s = Math.max(W / img.width, H / img.height), iw = img.width * s, ih = img.height * s;
    ctx.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih);
  } else {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, cat.color); g.addColorStop(0.55, '#1a1b22'); g.addColorStop(1, '#0b0c10');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 32){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 32){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.globalAlpha = isPending(item) ? 0.35 : 0.95;

function glowTexture(color){

}

function makeCard(item, cat, row){

function layoutRows(dt){
  const k = 1 - Math.pow(0.0001, dt);
  for (const row of rows){
    row.offset += (row.target - row.offset) * k;
    const n = row.cards.length, span = (n - 1) * STEP;
    let firstA = Infinity;
    row.cards.forEach((card, i) => {
      const ud = card.userData;
      ud.hoverT += ((ud.hovered ? 1 : 0) - ud.hoverT) * Math.min(1, dt * 12);
      const a = i * STEP - span / 2 + row.offset;
      const over = Math.abs(a) - HALF_VIS;
      const alpha = THREE.MathUtils.clamp(1 - over / (STEP * 0.6), 0, 1);
      card.visible = alpha > 0.02;
      if (!card.visible) return;
      if (alpha > 0.5) firstA = Math.min(firstA, a);
      const r = R - ud.hoverT * 0.12;
      const y = row.y + ud.hoverT * 0.015;
      card.position.set(Math.sin(a) * r, y, -Math.cos(a) * r);
      card.lookAt(0, y, 0);
      card.scale.setScalar(1 + ud.hoverT * 0.08);
      ud.face.material.opacity = alpha;
      ud.glow.material.opacity = ud.hoverT * alpha;
    });
    if (firstA === Infinity) firstA = -HALF_VIS;
    const la = firstA - (CW / 2) / R + 0.75 / R;
    const ly = row.y + CH / 2 + 0.065;
    row.label.position.set(Math.sin(la) * R, ly, -Math.cos(la) * R);
    row.label.lookAt(0, ly, 0);
  }
}

      let u = baseUV[i], v = baseUV[i + 1];

      uv[i] = u; uv[i + 1] = v;

    mesh.geometry.attributes.uv.needsUpdate = true;
  };
  const stereo = layout === 'sbs' || layout === 'tb';
  sphMono.visible = !stereo; sphL.visible = sphR.visible = stereo;
  if (stereo){ apply(sphL, 'L'); apply(sphR, 'R'); }

function buildERM(){

  const M = (color, m = 0.5, r = 0.4, extra = {}) => new THREE.MeshStandardMaterial({ color, metalness: m, roughness: r, ...extra });
  const yellow = M(0xf2c200, 0.25, 0.45), steel = M(0xa4adb7, 0.85, 0.28), red = M(0xd62828, 0.2, 0.5),
        dark = M(0x2a2e36, 0.6, 0.5), blue = M(0x1f5fbf, 0.35, 0.4), white = M(0xf2f2f2, 0, 0.6), black = M(0x111111, 0.2, 0.6);
  const PY = 0.2, PR = 0.022;
  const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); g.add(m); return m; };
  const pipe = (x1, x2, y = PY, mat = yellow) => add(new THREE.CylinderGeometry(PR, PR, x2 - x1, 24), mat, (x1 + x2) / 2, y, 0, 0, 0, Math.PI / 2);
  const flange = (x, y = PY) => add(new THREE.CylinderGeometry(PR * 2, PR * 2, 0.012, 24), steel, x, y, 0, 0, 0, Math.PI / 2);
  const valve = (x) => {
    add(new THREE.SphereGeometry(0.038, 24, 16), steel, x, PY, 0);
    add(new THREE.CylinderGeometry(0.006, 0.006, 0.05, 12), steel, x, PY + 0.055, 0);
    add(new THREE.BoxGeometry(0.13, 0.012, 0.022), red, x + 0.05, PY + 0.08, 0);
    flange(x - 0.042); flange(x + 0.042);
  };
  const gauge = (x) => {
    add(new THREE.CylinderGeometry(0.005, 0.005, 0.07, 10), steel, x, PY + 0.055, 0);
    add(new THREE.CylinderGeometry(0.034, 0.034, 0.018, 32), steel, x, PY + 0.11, 0, Math.PI / 2);
    add(new THREE.CircleGeometry(0.029, 32), white, x, PY + 0.11, 0.0095);
    add(new THREE.BoxGeometry(0.003, 0.024, 0.002), red, x + 0.006, PY + 0.115, 0.011, 0, 0, -0.6);
  };
  // skid y soportes
  add(new THREE.BoxGeometry(1.08, 0.035, 0.34), dark, 0, 0.018, 0);
  [-0.42, -0.2, 0.04, 0.42].forEach(x => add(new THREE.BoxGeometry(0.03, PY - 0.04, 0.03), dark, x, (PY - 0.04) / 2 + 0.035, 0));
  // tramos
  pipe(-0.54, -0.37); valve(-0.33); pipe(-0.29, -0.25);
  add(new THREE.CylinderGeometry(0.05, 0.05, 0.2, 32), blue, -0.2, PY + 0.01, 0);           // filtro
  add(new THREE.CylinderGeometry(0.055, 0.055, 0.02, 32), steel, -0.2, PY + 0.12, 0);
  add(new THREE.CylinderGeometry(0.012, 0.012, 0.04, 12), steel, -0.2, PY - 0.11, 0);
  pipe(-0.15, -0.06); gauge(-0.1);
  add(new THREE.SphereGeometry(0.055, 32, 20), steel, 0, PY, 0);                             // regulador
  add(new THREE.CylinderGeometry(0.075, 0.075, 0.05, 40), blue, 0, PY + 0.085, 0);
  add(new THREE.SphereGeometry(0.075, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2), blue, 0, PY + 0.11, 0);
  add(new THREE.CylinderGeometry(0.008, 0.008, 0.3, 12), yellow, 0.05, PY + 0.3, 0);          // venteo
  add(new THREE.TorusGeometry(0.03, 0.008, 10, 24, Math.PI), yellow, 0.08, PY + 0.45, 0);
  add(new THREE.CylinderGeometry(0.008, 0.008, 0.04, 12), yellow, 0.11, PY + 0.43, 0);
  pipe(0.055, 0.17); gauge(0.12);
  add(new THREE.BoxGeometry(0.15, 0.17, 0.13), M(0x6d7680, 0.6, 0.35), 0.24, PY + 0.03, 0);  // medidor
  add(new THREE.PlaneGeometry(0.09, 0.04), new THREE.MeshBasicMaterial({ color: 0x0e2a14 }), 0.24, PY + 0.06, 0.066);
  add(new THREE.PlaneGeometry(0.07, 0.018), new THREE.MeshBasicMaterial({ color: 0x39ff6a }), 0.24, PY + 0.06, 0.0665);
  add(new THREE.BoxGeometry(0.04, 0.03, 0.02), black, 0.24, PY - 0.03, 0.07);
  pipe(0.315, 0.37); valve(0.41); pipe(0.45, 0.55);
  flange(-0.54); flange(0.55);

  const labels = [
    ['Entrada · alta presión', -0.5, 0.33], ['Válvula de corte', -0.33, 0.4], ['Filtro', -0.2, 0.42],
    ['Manómetro P1', -0.1, 0.52], ['Regulador', 0.0, 0.62], ['Venteo', 0.12, 0.78],
    ['Medidor', 0.24, 0.48], ['Válvula de salida', 0.41, 0.4], ['Salida · media presión', 0.5, 0.33]
  ].map(([t, x, y], i) => { const l = label3D(t); l.position.set(x, y + (i % 2) * 0.06, 0.05); g.add(l); return l; });
  g.position.y = -0.2;
  const wrap = new THREE.Group(); wrap.add(g);
  return { root: wrap, labels };
}

function fitObject(obj, size = 0.8){
  const box = new THREE.Box3().setFromObject(obj), s = new THREE.Vector3(), c = new THREE.Vector3();
  box.getSize(s); box.getCenter(c);
  const k = size / Math.max(s.x, s.y, s.z, 1e-6);
  const wrap = new THREE.Group(); obj.position.sub(c); wrap.add(obj); wrap.scale.setScalar(k);
  return wrap;
}
const gltfLoader = new GLTFLoader();
function loadModel(item){
  return new Promise((res, rej) => {
    if (item.modelo === 'erm') return res(buildERM());
    if (!item.glb) return rej(new Error('Sin modelo'));
    gltfLoader.load(item.glb, gl => res({ root: fitObject(gl.scene), labels: [] }), undefined, rej);
  });
}
function resetModel(){ if (!modelRoot) return; modelHolder.attach(modelRoot); modelRoot.position.set(0, 0, 0); modelRoot.quaternion.identity(); modelRoot.scale.setScalar(1); autoRot = true; }

/* --- Abrir / cerrar --- */
function headPose(){
  camera.getWorldPosition(tmpV);
  camera.getWorldDirection(tmpV2); tmpV2.y = 0;
  if (tmpV2.lengthSq() < 1e-4) tmpV2.set(0, 0, -1);
  tmpV2.normalize();
  return { pos: tmpV.clone(), dir: tmpV2.clone(), yaw: Math.atan2(-tmpV2.x, -tmpV2.z) };
}
function recenter(group, dist){
  const h = headPose();
  group.position.set(h.pos.x + h.dir.x * dist, 0, h.pos.z + h.dir.z * dist);
  group.rotation.set(0, h.yaw, 0);
  group.userData.intro = 0;
}
function showMenu(on){ menu.visible = on; }

    });
    if (modelRoot){ modelHolder.remove(modelRoot); modelRoot = null; }
    try {

  setBarTitle(item.title);

  } else {
    mode = 'pantalla'; recenter(screenView, 3.3); screenView.visible = true;
    env.userData.grid.material.opacity = 0.18;
  }
  video.play().catch(() => toast('Pulsa ▶ para reproducir'));
  syncBars();
}

const raycaster = new THREE.Raycaster();
const pointers = [];
function makePointer(){ const p = { hovered: null, hit: null }; pointers.push(p); return p; }
function clearPointer(p){ if (p.hovered){ setHover(p.hovered, false); p.hovered = null; } p.hit = null; }
function clearAllHovers(){ pointers.forEach(clearPointer); }
function castPointer(p, origin, dir, haptic){
  raycaster.set(origin, dir); raycaster.far = 40;
  const targets = interactables.filter(o => visibleDeep(o));
  const hits = raycaster.intersectObjects(targets, false);
  const hit = hits[0] || null;
  const obj = hit ? hit.object : null;
  if (obj !== p.hovered){
    if (p.hovered) setHover(p.hovered, false);
    if (obj){ setHover(obj, true); haptic && haptic(); }
    p.hovered = obj;
  }
  p.hit = hit;
  return hit;
}
function select(p){ const h = p.hit; if (h && h.object.userData.ui?.onSelect) h.object.userData.ui.onSelect(h); }
function grabTarget(){
  if (mode === 'modelo' && modelRoot) return { obj: modelRoot, home: modelHolder };
  if (mode === 'plano' && PLAN && PLAN.mode === 'maqueta') return { obj: planPivot, home: planView };
  return null;
}
function hitModel(origin, dir){
  const g = grabTarget(); if (!g) return null;
  raycaster.set(origin, dir);
  return raycaster.intersectObject(g.obj, true)[0] || null;
}

/* --- Mouse / táctil --- */
const mouse = makePointer();
const ndc = new THREE.Vector2(); let hasMouse = false;
let yaw = 0, pitch = 0, drag = null;
const cv = renderer.domElement;
function setNDC(e){ ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); hasMouse = true; }
function rayFromCamera(){ raycaster.setFromCamera(ndc, camera); return { o: raycaster.ray.origin.clone(), d: raycaster.ray.direction.clone() }; }
cv.addEventListener('pointerdown', e => {
  if (renderer.xr.isPresenting) return;
  setNDC(e); cv.setPointerCapture(e.pointerId);
  const r = rayFromCamera();
  drag = { x: e.clientX, y: e.clientY, moved: 0, model: !!hitModel(r.o, r.d) };
  if (drag.model) autoRot = false;
  cv.classList.add('dragging');
});
cv.addEventListener('pointermove', e => {
  if (renderer.xr.isPresenting) return;
  setNDC(e);
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
  const gt = drag.model && grabTarget();
  if (gt){
    gt.obj.rotateOnWorldAxis(Y_AXIS, dx * 0.01);
  } else {
    const k = e.pointerType === 'touch' ? 0.006 : 0.004;
    yaw += dx * k; pitch = THREE.MathUtils.clamp(pitch + dy * k, -1.3, 1.3);
  }
});
cv.addEventListener('pointerup', e => {
  if (renderer.xr.isPresenting || !drag) return;
  cv.classList.remove('dragging');
  if (drag.moved < 8){ setNDC(e); const r = rayFromCamera(); castPointer(mouse, r.o, r.d); select(mouse); }
  drag = null;
});
cv.addEventListener('pointerleave', () => { if (!drag){ hasMouse = false; clearPointer(mouse); } });
cv.addEventListener('wheel', e => {
  const row = mouse.hovered?.userData.row;
  if (row && mode === 'menu'){ row.target = THREE.MathUtils.clamp(row.target + e.deltaY * 0.0025, -row.limit, row.limit); e.preventDefault(); }
  else if (grabTarget()){ grabTarget().obj.scale.multiplyScalar(e.deltaY > 0 ? 0.92 : 1.08); e.preventDefault(); }
}, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
  if (e.key === ' ' && (mode === 'pantalla' || mode === '360')){ togglePlay(); e.preventDefault(); }
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
  if (e.key === 'ArrowLeft') yaw += 0.2; if (e.key === 'ArrowRight') yaw -= 0.2;
  keys.add(e.code);
  if (e.code === 'KeyM' && mode === 'plano') placePlanUI(true);
});

/* --- Controles XR + manos --- */
const ctrlFactory = new XRControllerModelFactory();
const handFactory = new XRHandModelFactory();
const controllers = [];
const reticleGeo = new THREE.RingGeometry(0.008, 0.014, 24);
for (let i = 0; i < 2; i++){
  const c = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0xff3b45, transparent: true, opacity: 0.85 }));
  line.scale.z = 3; c.add(line);
  const reticle = new THREE.Mesh(reticleGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
  reticle.renderOrder = 20; reticle.visible = false; scene.add(reticle);
  c.userData = { ptr: makePointer(), line, reticle, src: null, active: false };
  c.addEventListener('connected', e => { c.userData.src = e.data; c.userData.active = true; line.visible = e.data.targetRayMode !== 'gaze'; });
  c.addEventListener('disconnected', () => { c.userData.active = false; c.userData.src = null; clearPointer(c.userData.ptr); reticle.visible = false; });
  c.addEventListener('selectstart', () => { if (tryGrab(c)) c.userData.grabbedWithTrigger = true; });
  c.addEventListener('selectend', () => { if (c.userData.grabbedWithTrigger){ c.userData.grabbedWithTrigger = false; if (grabbedBy === c){ releaseGrab(); return; } } });
  c.addEventListener('select', () => { if (!c.userData.didGrab) select(c.userData.ptr); c.userData.didGrab = false; });
  c.addEventListener('squeezestart', () => tryGrab(c));
  c.addEventListener('squeezeend', () => { if (grabbedBy === c) releaseGrab(); });
  rig.add(c);
  controllers.push(c);

  const grip = renderer.xr.getControllerGrip(i);
  grip.add(ctrlFactory.createControllerModel(grip)); rig.add(grip);
  const hand = renderer.xr.getHand(i);
  hand.add(handFactory.createHandModel(hand, 'mesh')); rig.add(hand);
}
function ctrlRay(c){
  tmpM.identity().extractRotation(c.matrixWorld);
  const o = new THREE.Vector3().setFromMatrixPosition(c.matrixWorld);
  const d = new THREE.Vector3(0, 0, -1).applyMatrix4(tmpM).normalize();
  return { o, d };
}
function pulse(c, s = 0.25, ms = 16){ try { c.userData.src?.gamepad?.hapticActuators?.[0]?.pulse?.(s, ms); } catch (_){} }
function tryGrab(c){
  const r = ctrlRay(c);
  if (!hitModel(r.o, r.d)) return false;
  const g = grabTarget();
  releaseGrab(); grabbedBy = c; grabbed = g; autoRot = false; c.attach(g.obj); c.userData.didGrab = true; pulse(c, 0.5, 40);
  return true;
}
let grabbed = null;
function releaseGrab(){ if (grabbedBy && grabbed){ grabbed.home.attach(grabbed.obj); } grabbedBy = null; grabbed = null; }

let turnLock = false;
function snapTurn(a){
  camera.getWorldPosition(tmpV);
  rig.position.sub(tmpV); rig.position.applyAxisAngle(Y_AXIS, a); rig.position.add(tmpV);
  rig.rotation.y += a;
}
function handleSticks(dt){
  const walking = mode === 'plano' && PLAN && PLAN.mode === 'real';
  for (const c of controllers){
    const src = c.userData.src; const gp = src?.gamepad; if (!gp || gp.axes.length < 4) continue;
    const x = gp.axes[2], y = gp.axes[3];
    // botón A / X: traer el panel del plano al frente
    const bA = !!gp.buttons[4]?.pressed;
    if (bA && !c.userData.bA && mode === 'plano') placePlanUI(true);
    c.userData.bA = bA;
    const gt = grabTarget();
    if (src.handedness === 'right'){
      if (gt && grabbedBy !== c){
        if (Math.abs(x) > 0.15){ gt.obj.rotateOnWorldAxis(Y_AXIS, x * dt * 2.5); autoRot = false; }
        if (Math.abs(y) > 0.3) gt.obj.scale.multiplyScalar(1 - y * dt * 0.8);
      } else {
        if (walking && Math.abs(y) > 0.25) rig.position.y -= y * dt * 3 * walkBoost(gp);
        if (Math.abs(x) > 0.7 && !turnLock){ snapTurn(-Math.sign(x) * Math.PI / 6); turnLock = true; }
        if (Math.abs(x) < 0.3) turnLock = false;
      }
    } else if (walking){
      if (Math.abs(x) > 0.15 || Math.abs(y) > 0.15) walk(x, -y, dt * walkBoost(gp));
    } else if (Math.abs(x) > 0.2 && mode === 'menu'){
      const row = c.userData.ptr.hovered?.userData.row || controllers.map(k => k.userData.ptr.hovered?.userData.row).find(Boolean);
      if (row) row.target = THREE.MathUtils.clamp(row.target + x * dt * 1.6, -row.limit, row.limit);
    }
  }
}

async function api(o){
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ t: SES ? SES.t : null }, o)) });
  const tx = await r.text(); let j;

    throw e;

}
const b64u8 = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function gunz(b){
  if (!window.DecompressionStream) throw new Error('Este navegador no puede abrir planos de la nube. Actualízalo.');

}

const OBRA_COL = { 'Nueva': '#34d17a', 'Existente': '#9aa3ad', 'Reparación': '#f2a516', 'Reparacion': '#f2a516', 'Retiro': '#e5484d', 'Desmonte': '#e5484d' };
const nf = (v, d = 0) => Number(v).toLocaleString('es-CO', { minimumFractionDigits: d, maximumFractionDigits: d });
function diaMM(d){
  if (DM[d]) return DM[d];
  const s = String(d || '').replace(/["”]/g, '').replace('½', ' 1/2').replace('¾', '3/4').replace('¼', '1/4').replace(/\s+/g, ' ').trim();
  if (DM[s]) return DM[s];
  const n = parseFloat(s); return isFinite(n) ? (n > 8 ? n : n * 25.4) : 25.4;
}
const hashCol = (k) => { let h = 0; for (const ch of String(k)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETA[h % PALETA.length]; };

/* --- Preparación: índice, sectores (redes conectadas), cajas --- */
function bboxOf(nodes){
  const b = new THREE.Box3();
  for (const n of nodes) b.expandByPoint(tmpV.set(n.x, n.y, n.z));
  if (b.isEmpty()) b.set(new THREE.Vector3(), new THREE.Vector3(1, 1, 1));
  return b;
}
function preparePlan(d, meta){
  const nodes = (d.nodes || []).filter(n => isFinite(n.x) && isFinite(n.y) && isFinite(n.z));
  const byId = new Map(nodes.map(n => [String(n.id), n]));
  const pipes = (d.pipes || []).filter(p => byId.has(String(p.a)) && byId.has(String(p.b)) && String(p.a) !== String(p.b));
  const adj = new Map(nodes.map(n => [String(n.id), []]));
  for (const p of pipes){
    const A = byId.get(String(p.a)), B = byId.get(String(p.b));
    p._len = Math.hypot(B.x - A.x, B.y - A.y, B.z - A.z);
    adj.get(String(p.a)).push(p); adj.get(String(p.b)).push(p);
  }
  const seen = new Set(), sectors = [];
  for (const n of nodes){
    const id = String(n.id); if (seen.has(id)) continue;
    const s = { nodes: [], pipes: new Set() }; const st = [id]; seen.add(id);
    while (st.length){
      const u = st.pop(); s.nodes.push(byId.get(u));
      for (const p of adj.get(u)){ s.pipes.add(p); const v = String(p.a) === u ? String(p.b) : String(p.a); if (!seen.has(v)){ seen.add(v); st.push(v); } }
    }
    s.pipes = [...s.pipes]; sectors.push(s);
  }
  sectors.sort((a, b) => b.nodes.length - a.nodes.length);
  sectors.forEach((s, i) => {
    s.box = bboxOf(s.nodes); s.len = s.pipes.reduce((t, p) => t + p._len, 0); s.color = PALETA[i % PALETA.length];
    const key = s.nodes.find(n => n.type === 'regulador') || s.nodes.find(n => n.type === 'medidor') || s.nodes.find(n => n.type !== 'te');
    s.name = `Sector ${i + 1}` + (key ? ` · ${TY[key.type] || key.type} ${key.tag || key.id}` : '');
    s.nodes.forEach(n => n._sec = i); s.pipes.forEach(p => p._sec = i);
  });
  const count = {}; nodes.forEach(n => count[n.type] = (count[n.type] || 0) + 1);
  const pj = d.proyecto || {};
  return {
    meta: Object.assign({ nombre: pj.nombre || 'Plano Isoflux', proyecto: pj.cliente || '', codigo: pj.codigo || '' }, meta || {}),
    nodes, pipes, byId, adj, sectors, count,
    box: bboxOf(nodes), len: pipes.reduce((t, p) => t + p._len, 0),
    cur: sectors.length > 1 ? -1 : 0, mode: 'maqueta', color: 'material'
  };
}

const T = (g, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) => { if (rx) g.rotateX(rx); if (ry) g.rotateY(ry); if (rz) g.rotateZ(rz); g.translate(x, y, z); return g; };

let PLAN = null;
const planPickables = [];
const planHits = new Map();
let planFrame = 0;

function disposePlanMeshes(){
  for (const m of [...planContent.children]){ planContent.remove(m); m.material.dispose?.(); m.dispose?.(); }
  planPickables.length = 0;
}
function planSet(){
  if (!PLAN) return { nodes: [], pipes: [], box: new THREE.Box3() };
  if (PLAN.cur < 0) return { nodes: PLAN.nodes, pipes: PLAN.pipes, box: PLAN.box };
  return PLAN.sectors[PLAN.cur];
}
function pipeColor(p){
  switch (PLAN.color){
    case 'obra': return OBRA_COL[p.obra] || hashCol(p.obra || '—');
    case 'diametro': { const k = Object.keys(DM); const i = k.indexOf(String(p.dia)); return PALETA[(i >= 0 ? i : 0) % PALETA.length]; }
    case 'sector': return PLAN.sectors[p._sec]?.color || '#888';
    default: return MC[p.mat] || '#8fd0ff';
  }
}
const _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _m = new THREE.Matrix4(), _c = new THREE.Color();
const _bx = new THREE.Vector3(), _by = new THREE.Vector3(), _bz = new THREE.Vector3(), _bm = new THREE.Matrix4();
function orientQuat(dir, out){
  _by.copy(dir).normalize();
  const up = Math.abs(_by.y) > 0.9 ? tmpV2.set(1, 0, 0) : tmpV2.set(0, 1, 0);
  _bz.copy(up).addScaledVector(_by, -up.dot(_by)).normalize();
  _bx.crossVectors(_by, _bz);
  _bm.makeBasis(_bx, _by, _bz); return out.setFromRotationMatrix(_bm);
}

function buildPlan(){
  disposePlanMeshes();
  const set = planSet(); const nodes = set.nodes, pipes = set.pipes;
  const size = set.box.getSize(new THREE.Vector3()), center = set.box.getCenter(new THREE.Vector3());
  const ext = Math.max(size.x, size.z, size.y, 1);
  const real = PLAN.mode === 'real';
  const minR = real ? 0.025 : ext * 0.0035;
  const U = real ? 0.16 : Math.max(ext * 0.009, minR * 3);
  const rOf = p => Math.max(diaMM(p.dia) / 2000, minR);

  // tuberías
  const pm = new THREE.InstancedMesh(unitCyl, new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.25, roughness: 0.5 }), Math.max(1, pipes.length));
  pm.count = pipes.length; pm.userData.pick = [];
  pipes.forEach((p, i) => {
    const A = PLAN.byId.get(String(p.a)), B = PLAN.byId.get(String(p.b));
    const dir = tmpV.set(B.x - A.x, B.y - A.y, B.z - A.z); const L = dir.length() || 1e-4;
    _q.setFromUnitVectors(Y_AXIS, dir.divideScalar(L));
    _p.set((A.x + B.x) / 2, (A.y + B.y) / 2, (A.z + B.z) / 2);
    const r = rOf(p); _s.set(r, L, r);
    pm.setMatrixAt(i, _m.compose(_p, _q, _s)); pm.setColorAt(i, _c.set(pipeColor(p)));
    pm.userData.pick[i] = { k: 'p', o: p };
  });
  pm.instanceMatrix.needsUpdate = true; if (pm.instanceColor) pm.instanceColor.needsUpdate = true;
  planContent.add(pm); planPickables.push(pm);

  // uniones (esferas en nodos con 2+ tubos) para que la red se vea continua
  const joints = nodes.filter(n => (PLAN.adj.get(String(n.id)) || []).length >= 2);
  const jm = new THREE.InstancedMesh(unitSph, new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.25, roughness: 0.5 }), Math.max(1, joints.length));
  jm.count = joints.length;
  joints.forEach((n, i) => {
    const ps = PLAN.adj.get(String(n.id)); const r = Math.max(...ps.map(rOf)) * 1.12;
    jm.setMatrixAt(i, _m.compose(_p.set(n.x, n.y, n.z), _q.identity(), _s.set(r, r, r))); jm.setColorAt(i, _c.set(pipeColor(ps[0])));
  });
  jm.instanceMatrix.needsUpdate = true; if (jm.instanceColor) jm.instanceColor.needsUpdate = true;
  planContent.add(jm);

  // componentes por tipo
  const groups = {};
  for (const n of nodes){ if (COMP[n.type]) (groups[n.type] = groups[n.type] || []).push(n); }
  for (const t in groups){
    const list = groups[t];
    const mk = (geo, color) => { const m = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color, metalness: 0.45, roughness: 0.4 }), list.length); m.userData.pick = []; return m; };
    const im = mk(compGeo(t), COMP[t].color);
    const handle = t === 'valvula' ? mk(compGeo('_mango'), 0xffffff) : null;
    list.forEach((n, i) => {
      const ps = PLAN.adj.get(String(n.id)) || [];
      let dir;
      if (t === 'tanque') dir = tmpV.set(1, 0, 0);
      else if (ps.length){ const p = ps[0]; const o = PLAN.byId.get(String(p.a)) === n ? PLAN.byId.get(String(p.b)) : PLAN.byId.get(String(p.a)); dir = tmpV.set(o.x - n.x, o.y - n.y, o.z - n.z); if (dir.lengthSq() < 1e-9) dir.set(1, 0, 0); }
      else dir = tmpV.set(1, 0, 0);
      if (t === 'manometro' || t === 'consumo' || t === 'ptopres'){ // verticales: "arriba" del componente = +Y mundo
        if (Math.abs(dir.y) / dir.length() > 0.9) dir.set(1, 0, 0); else dir.y = 0;
      }
      orientQuat(dir, _q);
      const u = Math.max(U, (ps.length ? Math.max(...ps.map(rOf)) : minR) * 2.6);
      _m.compose(_p.set(n.x, n.y, n.z), _q, _s.set(u, u, u));
      im.setMatrixAt(i, _m); im.userData.pick[i] = { k: 'n', o: n };
      if (handle){ handle.setMatrixAt(i, _m); handle.setColorAt(i, _c.set(/cerr/i.test(n.est || '') ? '#e5484d' : '#2fd36b')); handle.userData.pick[i] = { k: 'n', o: n }; }
    });
    im.instanceMatrix.needsUpdate = true; planContent.add(im); planPickables.push(im);
    if (handle){ handle.instanceMatrix.needsUpdate = true; if (handle.instanceColor) handle.instanceColor.needsUpdate = true; planContent.add(handle); planPickables.push(handle); }
  }

  // encuadre
  if (real){
    planPivot.position.set(0, 0, 0); planPivot.quaternion.identity(); planPivot.scale.setScalar(1);
    planScaler.scale.setScalar(1);
    planContent.position.set(-center.x, 0, -center.z);
  } else {
    planPivot.position.set(0, TABLE_H + 0.01, 0); planPivot.quaternion.identity(); planPivot.scale.setScalar(1);
    const k = (TABLE_R * 1.75) / Math.max(size.x, size.z, size.y * 1.4, 1e-3);
    planScaler.scale.setScalar(k);
    planContent.position.set(-center.x, -set.box.min.y, -center.z);
  }
  PLAN.ext = ext; PLAN.center = center;
  drawPlanTitle(); drawLegend();
}

    if (!P.length) brSet('No hay proyectos con planos guardados', [], null);
  } catch (e){
    brSet(e.auth ? 'Sesión vencida: ingresa de nuevo fuera de VR' : 'No se pudo cargar: ' + e.message, [], null);
  }
}

/* --- Entrega desde Isoflux ("🥽 Ver en VR") y enlaces ?plano=ID --- */
function arranquePlanos(){
  refreshPlanRow();
  const h = lsGet('vr_plano_handoff'); lsSet('vr_plano_handoff', null);
  if (h && h.exp > Date.now()){
    if (h.ses && h.ses.t){ SES = h.ses; saveSes(); }
    if (h.plan) openPlan(h.plan, { nombre: h.nombre, proyecto: h.proyecto, version: h.version });
    else if (h.planoId) abrirPlanoNube(h.planoId, { proyecto: h.proyecto });
    return;
  }
  const id = new URLSearchParams(location.search).get('plano');
  if (id) abrirPlanoNube(id, {});
}

/* =====================================================================
   10. SESIÓN WebXR (botón "Entrar en VR")
   ===================================================================== */
const btnVR = $('#btn-vr');
let needRecenter = false;
async function setupXR(){
  if (!('xr' in navigator)){
    status(window.isSecureContext ? 'Este navegador no soporta WebXR. Abre la página en el navegador de Meta Quest para la experiencia inmersiva.' : 'WebXR requiere HTTPS.');
    return;
  }
  let ok = false;
  try { ok = await navigator.xr.isSessionSupported('immersive-vr'); } catch (_){}
  if (!ok){ status('Visor VR no detectado: estás en vista 3D. Abre esta página en el navegador de Meta Quest y pulsa "Entrar en VR".'); return; }
  btnVR.disabled = false;
  btnVR.addEventListener('click', async () => {
    const cur = renderer.xr.getSession();
    if (cur){ cur.end(); return; }
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
      await renderer.xr.setSession(s);
    } catch (e){ toast('No se pudo iniciar la sesión VR'); console.error(e); }
  });
}
renderer.xr.addEventListener('sessionstart', () => {
  btnVR.querySelector('.txt').textContent = 'Salir de VR';
  clearPointer(mouse); hasMouse = false;
  camera.layers.disable(1);             // cada ojo ve su esfera estéreo
  try { renderer.xr.setFoveation(1); } catch (_){}
  const walkingNow = mode === 'plano' && PLAN && PLAN.mode === 'real';
  if (!walkingNow){ rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0); }
  btnExitXR.visible = true; needRecenter = mode === 'menu';
  if (mode === 'plano'){ drawPlanTitle(); setTimeout(() => PLAN.mode === 'real' ? placePlanUI(true) : (placeTable(), placePlanUI(false)), 400); }
});
renderer.xr.addEventListener('sessionend', () => {
  btnVR.querySelector('.txt').textContent = 'Entrar en VR';
  camera.layers.enable(1);
  controllers.forEach(c => { clearPointer(c.userData.ptr); c.userData.reticle.visible = false; });
  releaseGrab();
  camera.position.set(0, EYE, 0); yaw = pitch = 0;
  btnExitXR.visible = false;
  if (mode === 'plano'){ setPlanMode(PLAN.mode); }
  else {
    rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0);
    recenter(menu, 0);
    if (mode !== 'menu') closeViewer();
  }
});
setupXR();

$('#btn-fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)?.call(document.documentElement);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   11. BUCLE DE RENDER
   ===================================================================== */
const groupsIntro = [menu, screenView, modelView, sphereUI, planUI, browser];
function loop(){
  const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt;
  const inXR = renderer.xr.isPresenting;

  if (inXR){
    if (needRecenter){ needRecenter = false; setTimeout(() => recenter(menu, 0), 300); }
    for (const c of controllers){
      const ud = c.userData;
      if (!ud.active){ ud.reticle.visible = false; planHits.delete(c); continue; }
      const r = ctrlRay(c);
      const hit = castPointer(ud.ptr, r.o, r.d, () => pulse(c));
      const mh = hit ? null : (mode === 'plano' ? planHitFor(c, r) : hitModel(r.o, r.d));
      if (hit) planHits.delete(c);
      const h = hit || mh;
      ud.line.scale.z = h ? h.distance : 3;
      ud.line.material.color.set(hit ? 0xffffff : 0xff3b45);
      ud.reticle.visible = !!hit;
      if (hit){ ud.reticle.position.copy(hit.point); ud.reticle.lookAt(r.o); }
    }
    handleSticks(dt);
  } else {
    camera.rotation.set(-pitch, -yaw, 0, 'YXZ');
    if (hasMouse && !drag){
      const r = rayFromCamera(); const h = castPointer(mouse, r.o, r.d);
      if (mode === 'plano' && !h) planHitFor(mouse, r); else planHits.delete(mouse);
    } else if (!hasMouse){ clearPointer(mouse); planHits.delete(mouse); }
  }
  planFrame++;
  if (mode === 'plano'){
    desktopWalk(dt); updateInfo();
    if (realGrid.visible){ realGrid.position.x = Math.round(rig.position.x); realGrid.position.z = Math.round(rig.position.z); }
  }

  if (menu.visible) layoutRows(dt);

  // animación de entrada de grupos
  for (const g of groupsIntro){
    if (!g.visible) continue;
    if (g.userData.intro === undefined) g.userData.intro = 1;
    if (g.userData.intro < 1){ g.userData.intro = Math.min(1, g.userData.intro + dt * 3); const s = 0.92 + 0.08 * (1 - Math.pow(1 - g.userData.intro, 3)); g.scale.setScalar(s); }
  }

  // entorno
  if (env.visible){
    env.userData.stars.rotation.y += dt * 0.004;
    env.userData.dust.rotation.y -= dt * 0.02;
    env.userData.ring.material.opacity = 0.55 + 0.3 * Math.sin(elapsed * 2);
  }
  // visores
  if (mode === 'pantalla' || mode === '360') updateBars();
  if (mode === 'modelo'){
    if (modelRoot && autoRot && !grabbedBy) modelRoot.rotation.y += dt * 0.35;
    holo.material.opacity = 0.05 + 0.03 * Math.sin(elapsed * 3);
    if (modelLabels.length && labelsOn){ camera.getWorldPosition(tmpV); modelLabels.forEach(l => l.lookAt(tmpV)); }
  }
  renderer.render(scene, camera);
}

recenter(menu, 0);
arranquePlanos();
renderer.setAnimationLoop(loop);
requestAnimationFrame(() => $('#loading').classList.add('hide'));
</script>
