<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporativos Entalpia - Pionners</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* --- FONDO MARCA DE AGUA (Actualizado) --- */
        body::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 75%; /* 75% de la pantalla */
            height: 75%;
            background: url('../ImagenesPlataformas/logo_entalpia.png') no-repeat center center;
            background-size: contain; 
            z-index: -2;
            opacity: 0.15; /* Ajuste para que sea tenue */
        }

        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }

        /* --- CABECERA --- */
        .logo {
            position: absolute;
            top: 25px;
            left: 50px;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to bottom, #a1c4fd 0%, #1c5294 50%, #082d55 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 10;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        /* --- CAJA DE LOGIN --- */
        .login-box {
            background-color: rgba(0, 0, 0, 0.5); 
            width: 100%;
            max-width: 450px;
            padding: 60px 68px 40px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            position: relative;
            z-index: 5;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        h1 { font-size: 32px; font-weight: 500; margin-bottom: 28px; }

        .input-wrapper { margin-bottom: 16px; position: relative; }

        .input-field {
            width: 100%;
            background: rgba(51, 51, 51, 0.8);
            border: 0;
            border-radius: 4px;
            color: #fff;
            height: 50px;
            padding: 0 45px 0 20px; /* Espacio para el icono de ojo */
            font-size: 16px;
            outline: none;
        }

        /* Icono ver/ocultar */
        .toggle-view {
            position: absolute;
            right: 15px;
            top: 15px;
            cursor: pointer;
            color: #b3b3b3;
            user-select: none;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            margin-top: 24px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: linear-gradient(180deg, #0071eb 0%, #004182 100%);
            transition: all 0.2s ease;
        }

        .signup-text a { color: #fff; text-decoration: none; font-weight: bold; cursor: pointer; }
        .error-msg { background: #e87c03; padding: 10px; border-radius: 4px; margin-bottom: 16px; display: none; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-animation { animation: shake 0.4s; }
    </style>
</head>
<body>

    <div class="logo">ENTALPHIA v1</div>

    <div class="login-box" id="loginBox">
        <h1>Inicia Sesión</h1>
        
        <div id="errorMsg" class="error-msg">
            <b>Credenciales incorrectas.</b> Intente de nuevo.
        </div>

        <form id="loginForm">
            <div class="input-wrapper">
                <input type="text" id="username" class="input-field" placeholder="Usuario" autocomplete="off" required>
            </div>
            
            <div class="input-wrapper">
                <input type="password" id="password" class="input-field" placeholder="Contraseña" required>
                <span class="toggle-view" onclick="togglePassword()">👁️</span>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="signup-text" style="margin-top: 30px;">
            ¿Nuevo en Entalpia? <a onclick="irARegistro()">Regístrate ahora.</a>
        </div>
    </div>

    <script>
        // CORRECCIÓN: Comilla cerrada en juvamo78 y corrección de llaves
        const accessControl = {
            'comserviciosayg@gmail.com': { pass: '2505', url: 'https://www.appsheet.com/start/da1ab19e-5b1c-456f-adab-d979d9a46a5a'},
            'alexander221977@gmail.com': { pass: '2505', url: 'https://www.appsheet.com/start/80829734-e104-4186-aaac-9ee4dd3c72ec'},
            'juvamo78@gmail.com': { pass: '1511', url: 'https://www.appsheet.com/start/80829734-e104-4186-aaac-9ee4dd3c72ec'},
            'josetangarife14@gmail.com': { pass: '1211', url: 'https://www.appsheet.com/start/80829734-e104-4186-aaac-9ee4dd3c72ec'}
        };

        const form = document.getElementById('loginForm');
        const loginBox = document.getElementById('loginBox');
        const errorMsg = document.getElementById('errorMsg');

        // Función Redirección Acceso
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;

            if (accessControl[user] && accessControl[user].pass === pass) {
                window.location.href = accessControl[user].url;
            } else {
                mostrarError();
            }
        });

        // Función Ver/Ocultar Password
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === "password" ? "text" : "password";
        }

        // Función Registro (Placeholder)
        function irARegistro() {
            alert("Redirigiendo al formulario de registro de Pionners...");
            // window.location.href = "TU_URL_AQUI";
        }

        function mostrarError() {
            errorMsg.style.display = 'block';
            loginBox.classList.remove('shake-animation');
            void loginBox.offsetWidth;
            loginBox.classList.add('shake-animation');
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
