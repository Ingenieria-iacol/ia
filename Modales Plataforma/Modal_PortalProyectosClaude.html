<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Portal de Proyectos · Hub de Ingeniería Pioner's</title>
<style>
:root{--bg:#0a0d14;--bg2:#121826;--card:#161d2e;--tx:#e8eefb;--mu:#8fa0bf;--b:#3d8bff;--b2:#7cc8ff;--ln:#26324d;--ok:#3ddc97;--er:#ff6b7a;--m:linear-gradient(135deg,#0a3a95,#3d8bff 38%,#cfe9ff 52%,#2a6fe0 70%,#0a2c75);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,Helvetica,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(1100px 500px at 75% -10%,#12306b55,transparent),var(--bg)}
button,input,select{font:inherit}
.nav{display:flex;align-items:center;gap:14px;padding:12px 4%;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(#0a0d14f2,#0a0d14aa);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.nav img{height:38px;border-radius:6px}.nav .sp{flex:1}.nav b{background:var(--m);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.btn{border:0;border-radius:6px;padding:9px 18px;color:#fff;background:var(--m);font-weight:700;cursor:pointer;text-shadow:0 1px 2px #0008;box-shadow:inset 0 1px 0 #fff6,0 4px 14px #1d5fd855}
.btn:hover{filter:brightness(1.15)}.ghost{background:#ffffff14;box-shadow:none;border:1px solid var(--ln)}.sm{padding:5px 11px;font-size:13px}.dng{background:#5a1a26}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:60px 4%}
.hero h1{font-size:clamp(28px,4.5vw,50px);line-height:1.1;margin:0 0 12px}.hero h1 span{background:var(--m);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);max-width:520px}.hero img{width:100%;border-radius:14px;border:1px solid var(--ln);box-shadow:0 20px 60px #1d5fd844}
.foot{display:flex;gap:18px;align-items:center;justify-content:center;padding:30px 4%;color:var(--mu);font-size:13px;flex-wrap:wrap;text-align:center}.foot img{height:44px;border-radius:50%}
.wrap{padding:24px 4% 60px}.hello{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.hello h2{margin:0;font-size:clamp(22px,3vw,34px)}.mu{color:var(--mu)}
.row h3{margin:28px 0 10px;font-size:18px}.strip{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x proximity}
.pc{flex:0 0 240px;height:140px;border-radius:8px;background:linear-gradient(160deg,#1b2a4a,#0e1424);border:1px solid var(--ln);padding:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;transition:.2s;position:relative;overflow:hidden}
.pc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--m)}
.pc:hover{transform:scale(1.05);border-color:var(--b);box-shadow:0 10px 30px #1d5fd866}.pc b{font-size:16px}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#3d8bff22;color:var(--b2);align-self:flex-start}
.mod{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;overflow:auto}
.box{width:min(440px,100%);background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:26px;box-shadow:0 30px 80px #000a,0 0 0 1px #3d8bff33}.box.w{width:min(720px,100%)}
.box h3{margin:0 0 4px;font-size:22px}.box img.l{height:54px;display:block;margin:0 auto 12px;border-radius:8px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}input,select{width:100%;background:#0b1120;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:10px}input:focus,select:focus{outline:2px solid var(--b);border-color:transparent}
.err{color:var(--er);font-size:13px;min-height:18px;margin-top:8px}.step{display:flex;gap:6px;margin:6px 0 10px}.step i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.step i.on{background:var(--m)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:600;width:34%}
.sc{overflow-x:auto}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lk{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0}.lk a{color:var(--b2);word-break:break-all}
.note{font-size:12px;color:var(--mu);border:1px dashed var(--ln);border-radius:8px;padding:10px;margin-top:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:30px}.g2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="m"></div>

let db=null,users=[],projs=[],me=null,open2=false,view="p",fails=0,lockUntil=0,idle,ready=false;
const enc=new TextEncoder(),key=e=>e.trim().toLowerCase().replace(/[^a-z0-9]/g,"_");
const H=async(s,p)=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode(s+"|"+p)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const salt=()=>crypto.randomUUID(),uid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const modal=h=>{$("#m").innerHTML=h?`<div class="mod"><div class="box ${h.w?"w":""}">${h.h||h}</div></div>`:""};
const close=()=>modal("");
const mine=()=>me?(me.rol==="admin"?projs:projs.filter(p=>p.owner===me.id)):[];
function lock(){if(me){open2=false;render();ask2()}}
function bump(){clearTimeout(idle);if(me&&open2)idle=setTimeout(lock,300000)}
["click","keydown","touchstart"].forEach(e=>addEventListener(e,bump));
function logos(){return `<img class="l" src="${L.pio}" alt="Pioner's">`}
function render(){const a=$("#app");
if(!ready){a.innerHTML=`<div class="wrap mu">Conectando con el registro…</div>`;return}
if(!db){a.innerHTML=`<div class="wrap"><h2>Registro no disponible</h2><p class="mu">Abre este portal desde claude.ai con tu sesión iniciada para conectar el registro de proyectos.</p></div>`;return}
if(!me||!open2){a.innerHTML=`<div class="nav"><img src="${L.ent}" alt="Entalpía"><b>PORTAL DE PROYECTOS</b><span class="sp"></span><button class="btn" onclick="ask1()">Ingresar</button></div>
<section class="hero"><div><h1>Tus proyectos de ingeniería, <span>en un solo lugar</span></h1><p>Redes de gas y desarrollos tecnológicos del Hub de Ingeniería Pioner's. Accede con tu usuario y valida tu segunda clave para ver únicamente tu información.</p><button class="btn" onclick="ask1()">Ingresar al portal</button></div><img src="${L.pio}" alt="Hub de Ingeniería Pioner's"></section>
<div class="foot"><img src="${L.par}" alt="Parque Tecnológico"><span>Un desarrollo de Industrias I.A. Col · Hub de Ingeniería Pioner's · Parque Tecnológico – Software ENTALPIA LABS</span></div>`;return}
const ps=mine(),g={};ps.forEach(p=>(g[p.tipo||"Proyecto"]??=[]).push(p));
let body="";
if(view==="a"&&me.rol==="admin")body=admin();else body=`<div class="hello"><div><h2>Hola, ${esc(me.nombre)}</h2><span class="mu">${ps.length} proyecto(s) asociados a tu cuenta</span></div>${me.rol==="admin"?`<button class="btn sm" onclick="editP()">+ Nuevo proyecto</button>`:""}</div>`+
(ps.length?Object.keys(g).map(t=>`<div class="row"><h3>${esc(t)}</h3><div class="strip">${g[t].map(p=>`<div class="pc" onclick="det('${p.id}')"><span class="tag">${esc(p.estado||"Activo")}</span><b>${esc(p.titulo)}</b><span class="mu">${esc(me.rol==="admin"?(users.find(u=>u.id===p.owner)?.nombre||"Sin asignar"):"")}</span></div>`).join("")}</div></div>`).join(""):`<p class="mu">Aún no tienes proyectos asignados.</p>`);
a.innerHTML=`<div class="nav"><img src="${L.ent}" alt="Entalpía"><b>PORTAL DE PROYECTOS</b><span class="sp"></span>${me.rol==="admin"?`<button class="btn ghost sm" onclick="view=view==='a'?'p':'a';render()">${view==="a"?"Proyectos":"Administración"}</button>`:""}<button class="btn ghost sm" onclick="lock()">Bloquear</button><button class="btn sm" onclick="out()">Salir</button></div><div class="wrap">${body}</div><div class="foot"><img src="${L.par}" alt=""><span>Industrias I.A. Col · ENTALPIA LABS</span></div>`}
function out(){me=null;open2=false;view="p";render()}
const gate=(n,t,s,f)=>`${logos()}<div class="step"><i class="on"></i><i class="${n>1?"on":""}"></i></div><h3>${t}</h3><span class="mu">${s}</span>${f}<div class="err" id="er"></div><div class="acts"><button class="btn" id="go">Continuar</button><button class="btn ghost" onclick="${n>1?"out();":""}close()">Cancelar</button></div>`;
function ask1(){if(!users.length)return setup();modal(gate(1,"Ingreso de usuarios","Primera validación: usuario y clave de acceso.",`<label>Correo de usuario</label><input id="u" type="email" autocomplete="username"><label>Clave de acceso</label><input id="p1" type="password" autocomplete="current-password">`));
$("#go").onclick=async()=>{if(Date.now()<lockUntil)return $("#er").textContent="Demasiados intentos. Espera unos segundos.";const u=users.find(x=>x.id===key($("#u").value));
if(u&&await H(u.s1,$("#p1").value)===u.h1){fails=0;me=u;ask2()}else{if(++fails>=5){lockUntil=Date.now()+30000;fails=0}$("#er").textContent="Usuario o clave incorrectos."}};
$("#p1").onkeydown=e=>e.key==="Enter"&&$("#go").click()}
function ask2(){if(!me)return;modal(gate(2,"Segunda validación",`Hola ${esc(me.nombre)}. Ingresa tu clave de seguridad para acceder a tu información.`,`<label>Clave de seguridad</label><input id="p2" type="password" autocomplete="off">`));
$("#go").onclick=async()=>{if(Date.now()<lockUntil)return $("#er").textContent="Demasiados intentos. Espera unos segundos.";if(await H(me.s2,$("#p2").value)===me.h2){fails=0;open2=true;close();render();bump()}else{if(++fails>=5){lockUntil=Date.now()+30000;fails=0;out();close();return}$("#er").textContent="Clave de seguridad incorrecta."}};
$("#p2").onkeydown=e=>e.key==="Enter"&&$("#go").click();$("#p2").focus()}
function setup(){modal(`${logos()}<h3>Configuración inicial</h3><span class="mu">Crea la cuenta del administrador del portal.</span><label>Nombre</label><input id="n"><label>Correo</label><input id="u" type="email"><div class="g2"><div><label>Clave de acceso</label><input id="a" type="password"></div><div><label>Clave de seguridad</label><input id="b" type="password"></div></div><div class="err" id="er"></div><div class="acts"><button class="btn" id="go">Crear administrador</button><button class="btn ghost" onclick="close()">Cancelar</button></div>`);
$("#go").onclick=async()=>{const r=await mkUser($("#n").value,$("#u").value,$("#a").value,$("#b").value,"admin");if(r)$("#er").textContent=r;else close()}}
async function mkUser(n,e,a,b,rol){if(!n.trim()||!e.includes("@")||a.length<6||b.length<6)return "Completa los datos; las claves deben tener mínimo 6 caracteres.";if(a===b)return "Las dos claves deben ser distintas.";if(users.find(x=>x.id===key(e)))return "Ese usuario ya existe.";

modal({w:1,h:`<h3>${esc(p.titulo)}</h3><span class="tag">${esc(p.tipo||"Proyecto")} · ${esc(p.estado||"Activo")}</span><div class="sc"><table>${Object.keys(c).filter(k=>c[k]).map(k=>`<tr><th>${esc(k)}</th><td>${esc(c[k])}</td></tr>`).join("")}</table></div>
<h3 style="font-size:17px;margin-top:18px">Enlaces y archivos</h3>${ln.map((l,i)=>`<div class="lk"><a href="${esc(l.u)}" target="_blank" rel="noopener noreferrer">${esc(l.t||l.u)}</a><button class="btn dng sm" onclick="rmL('${id}',${i})">Quitar</button></div>`).join("")||`<span class="mu">Sin enlaces.</span>`}

async function addL(id){const p=projs.find(x=>x.id===id),u=$("#lu").value.trim();if(!/^https?:\/\//i.test(u))return $("#er").textContent="Ingresa una URL que inicie con http:// o https://";
await db.collection("proyectos").doc(id).update({enlaces:[...(p.enlaces||[]),{t:$("#lt").value.trim(),u}]});det(id)}
async function rmL(id,i){const p=projs.find(x=>x.id===id),l=[...(p.enlaces||[])];l.splice(i,1);await db.collection("proyectos").doc(id).update({enlaces:l});det(id)}
function editP(id){const p=projs.find(x=>x.id===id)||{};modal(`<h3>${id?"Editar":"Nuevo"} proyecto</h3><label>Título</label><input id="t" value="${esc(p.titulo)}"><div class="g2"><div><label>Tipo</label><input id="ty" value="${esc(p.tipo||"Redes de gas")}" list="tl"><datalist id="tl"><option>Redes de gas<option>Desarrollo tecnológico</datalist></div><div><label>Estado</label><input id="es" value="${esc(p.estado||"Activo")}"></div></div><label>Usuario asignado</label><select id="ow"><option value="">Sin asignar</option>${users.map(u=>`<option value="${u.id}" ${u.id===p.owner?"selected":""}>${esc(u.nombre)} (${esc(u.email)})</option>`).join("")}</select>
<div class="acts"><button class="btn" id="sv">Guardar</button>${id?`<button class="btn dng" id="dl">Eliminar</button>`:""}<button class="btn ghost" onclick="close()">Cancelar</button></div>`);
$("#sv").onclick=async()=>{if(!$("#t").value.trim())return;const i=id||uid(),d={titulo:$("#t").value.trim(),tipo:$("#ty").value.trim(),estado:$("#es").value.trim(),owner:$("#ow").value};if(id)await db.collection("proyectos").doc(i).update(d);else await db.collection("proyectos").doc(i).set({...d,campos:{},enlaces:[]});close()};

<div class="row"><h3>Usuarios registrados</h3><div class="sc"><table>${users.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.email)}</td><td>${u.rol}</td><td>${u.id!==me.id?`<button class="btn dng sm" onclick="rmU('${u.id}')">Quitar</button>`:""}</td></tr>`).join("")}</table></div>
<div class="g2"><div><label>Nombre</label><input id="n"></div><div><label>Correo</label><input id="e" type="email"></div><div><label>Clave de acceso</label><input id="a" type="password"></div><div><label>Clave de seguridad</label><input id="b" type="password"></div></div><div class="err" id="er2"></div><div class="acts"><button class="btn sm" onclick="addU()">Registrar usuario</button></div></div>
<div class="note">Nota: las claves se guardan cifradas (SHA-256 con sal). Al ser un portal de página, el filtrado por usuario se aplica en el navegador; para información confidencial real se recomienda un servidor propio con autenticación.</div>`}
async function addU(){const r=await mkUser($("#n").value,$("#e").value,$("#a").value,$("#b").value,"usuario");$("#er2").textContent=r||""}
async function rmU(id){if(confirm("¿Quitar usuario?"))await db.collection("usuarios").doc(id).delete()}
function csv(t){const r=[];let f="",row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);f="";r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}return r.filter(x=>x.some(y=>y.trim()))}
document.addEventListener("change",async e=>{if(e.target.id!=="csv")return;const f=e.target.files[0];if(!f)return;const R=csv(await f.text()),h=R[0].map(x=>x.trim().replace(/[.\/\[\]#$]/g,"")),ix=re=>h.findIndex(x=>re.test(x));
const ti=ix(/tipo|categor/i),es=ix(/estado/i),co=ix(/correo|email|usuario/i);let n=0;
for(const r of R.slice(1)){const c={};h.forEach((k,i)=>{if(k&&r[i])c[k]=r[i].trim()});const own=co>=0?key(r[co]||""):"";await db.collection("proyectos").doc(uid()).set({titulo:(r[0]||"Sin título").trim(),tipo:ti>=0?r[ti].trim():"Redes de gas",estado:es>=0?r[es].trim():"Activo",owner:users.find(u=>u.id===own)?own:"",campos:c,enlaces:[]});n++}
$("#er").style.color="var(--ok)";$("#er").textContent=n+" proyecto(s) importados."});

db.collection("proyectos").onSnapshot(s=>{projs=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;render()},()=>{})}else{ready=true;render()}}catch(e){ready=true;render()}})();
render();
