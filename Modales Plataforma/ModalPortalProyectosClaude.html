<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal de Proyectos · Hub de Ingeniería Pioner's</title>
<style>
:root{--bg:#0a0d14;--bg2:#121826;--tx:#e8eefb;--mu:#8fa0bf;--b:#3d8bff;--b2:#7cc8ff;--ln:#26324d;--ok:#3ddc97;--er:#ff6b7a;--m:linear-gradient(135deg,#0a3a95,#3d8bff 38%,#cfe9ff 52%,#2a6fe0 70%,#0a2c75)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif}body{min-height:100vh;background:radial-gradient(1100px 500px at 75% -10%,#12306b55,transparent),var(--bg)}
button,input,select,textarea{font:inherit}
.nav{display:flex;align-items:center;gap:10px;padding:10px 4%;position:sticky;top:0;z-index:5;background:#0a0d14ee;border-bottom:1px solid var(--ln);flex-wrap:wrap}.nav img{height:36px;border-radius:6px}.nav .sp{flex:1}
.nav b{background:var(--m);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border:0;border-radius:6px;padding:9px 16px;color:#fff;background:var(--m);font-weight:700;cursor:pointer;text-shadow:0 1px 2px #0008;box-shadow:inset 0 1px 0 #fff6,0 4px 14px #1d5fd855}.btn:hover{filter:brightness(1.15)}
.ghost{background:#ffffff14;box-shadow:none;border:1px solid var(--ln)}.sm{padding:5px 11px;font-size:13px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:50px 4%}.hero h1{font-size:clamp(28px,4.5vw,48px);line-height:1.1;margin:0 0 12px}
.hero h1 span{background:var(--m);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p,.mu{color:var(--mu)}.hero img{width:100%;border-radius:14px;border:1px solid var(--ln)}
.foot{display:flex;gap:16px;align-items:center;justify-content:center;padding:26px 4%;color:var(--mu);font-size:13px;text-align:center;flex-wrap:wrap}.foot img{height:42px;border-radius:50%}
.wrap{padding:22px 4% 50px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.k{background:linear-gradient(160deg,#1b2a4a,#0e1424);border:1px solid var(--ln);border-radius:10px;padding:14px}.k b{display:block;font-size:30px;background:var(--m);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{background:linear-gradient(160deg,#1b2a4a,#0e1424);border:1px solid var(--ln);border-left:4px solid var(--b);border-radius:8px;padding:14px;cursor:pointer;transition:.2s}.pc:hover{transform:scale(1.03);border-color:var(--b);box-shadow:0 10px 30px #1d5fd866}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#3d8bff22;color:var(--b2)}.bar{height:7px;background:#0b1120;border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--m)}
.mod{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:16px;overflow:auto}
.box{width:min(440px,100%);margin:auto;background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:24px;box-shadow:0 30px 80px #000a}.box.w{width:min(780px,100%)}.box h3{margin:0 0 4px;font-size:21px}.box img.l{height:50px;display:block;margin:0 auto 10px;border-radius:8px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}input,select,textarea{width:100%;background:#0b1120;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:9px}input:focus,select:focus,textarea:focus{outline:2px solid var(--b)}
.err{color:var(--er);font-size:13px;min-height:18px;margin-top:6px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}.ph img{width:100%;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--ln)}
.cm{border-bottom:1px solid var(--ln);padding:6px 0;font-size:14px}.cm small{color:var(--mu)}.sc{overflow-x:auto}a{color:var(--b2)}h4{margin:16px 0 4px}
.dg{display:grid;grid-template-columns:150px 1fr;gap:12px;margin:14px 0}.kk{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.kk .k b{font-size:26px}
.cd{background:linear-gradient(160deg,#1b2a4a,#0e1424);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:12px 0}
.gr{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin:6px 0;font-size:13px;line-height:1.2}.gtk{position:relative;height:28px;background:#0b1120;border-radius:6px}
.gb{position:absolute;top:2px;bottom:2px;border:1px solid var(--b);border-radius:5px;overflow:hidden;background:#12306b55}.gb i{position:absolute;left:0;top:0;bottom:0;background:var(--m);opacity:.9}.gb b{position:relative;font-size:11px;padding-left:6px;line-height:22px}
.gm{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--b2);box-shadow:0 0 8px var(--b2);z-index:2}.gm[data-h]:after{content:"Hoy";position:absolute;top:-16px;left:-9px;font-size:10px;color:var(--b2)}.gt{padding-top:14px}
.fcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.fc{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--tx);font-size:12px;background:#0b1120;border:1px solid var(--ln);border-radius:8px;padding:6px;transition:.2s;word-break:break-word}.fc:hover{border-color:var(--b);transform:translateY(-2px)}
.th{position:relative;height:90px;border-radius:6px;background:linear-gradient(135deg,#12306b,#0a1a3d);display:flex;align-items:center;justify-content:center;overflow:hidden}.th span{font-weight:700;color:var(--b2)}.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chat{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}.bu{max-width:82%;background:#1b2a4a;border-radius:12px 12px 12px 2px;padding:8px 12px;font-size:14px;align-self:flex-start}.bu.me{align-self:flex-end;background:#12408f;border-radius:12px 12px 2px 12px}.bu small{display:block;color:var(--mu);font-size:11px;margin-top:3px}
@media(max-width:760px){.dg{grid-template-columns:1fr}.gr{grid-template-columns:90px 1fr}}
.pw{position:relative}.pw input{padding-right:42px}.pw button{position:absolute;right:4px;top:3px;bottom:3px;border:0;background:none;color:var(--mu);cursor:pointer;font-size:16px}
@media(max-width:760px){.hero,.g2{grid-template-columns:1fr}}

["1. Crear tu cuenta","Entra al portal, pulsa Ingresar y luego Crear cuenta. Escribe tu nombre, tu correo y dos claves distintas de minimo 6 caracteres: la clave de acceso y la clave de seguridad. Usa el boton del ojo para ver lo que escribes y evitar errores. Guarda ambas claves en un lugar seguro y no las compartas."],
["2. Ingresar (doble validacion)","Pulsa Ingresar, escribe tu correo y tu clave de acceso. Luego el portal te pedira la clave de seguridad; solo despues de validarla veras tu informacion. Tras 5 intentos fallidos la cuenta se bloquea por 10 minutos. Si pasas 10 minutos sin actividad, la sesion se cierra sola. Si el administrador bloquea tu cuenta, no podras ingresar hasta que la reactive."],
["3. Crear un proyecto","Dentro del portal pulsa + Nuevo proyecto. Completa titulo, tipo (red de gas, desarrollo tecnologico u otro), cliente, ubicacion y una descripcion con el alcance. Al guardar, el proyecto queda registrado y se crea su carpeta de archivos. Mientras mas completa la informacion, mejor sera el seguimiento."],
["4. Abrir y seguir un proyecto","Cada proyecto aparece como una tarjeta con su estado y barra de avance. Haz clic en la tarjeta para ver el detalle: descripcion, avance, fotos, archivos y comentarios. Solo ves tus propios proyectos."],
["5. Subir fotos y archivos","En el detalle del proyecto usa Subir fotos o archivos. Puedes seleccionar varios a la vez (maximo 20 MB cada uno). Se aceptan imagenes, PDF, Word, Excel, DWG y ZIP. Las fotos se reducen automaticamente para subir mas rapido. Espera a que termine la carga antes de cerrar la ventana."],
["6. Comentarios","En el detalle escribe tu mensaje y pulsa Comentar. Los comentarios quedan con tu nombre y fecha, y los ve el administrador. Usalos para aclarar dudas, enviar novedades o aprobar entregas."],
["7. Indicadores y reportes","En la parte superior veras tarjetas con el total de proyectos, los que estan en proceso, los entregados y el avance promedio. El boton Reporte CSV descarga un archivo con tus proyectos y comentarios, que puedes abrir en Excel."],
["8. Cambiar tus claves","Pulsa Mis claves, escribe tu clave de seguridad actual y las dos nuevas. Hazlo si crees que alguien mas las conoce."],
["9. Administrador: usuarios","Con la cuenta de administrador, el boton Usuarios muestra todas las cuentas. Desde alli puedes editar el nombre, cambiar claves, bloquear o desbloquear y eliminar cuentas. Al eliminar una cuenta, sus proyectos se conservan. La cuenta de administrador no se puede bloquear ni eliminar."],
["10. Administrador: avance y entrega","En el detalle de cada proyecto el administrador actualiza el estado y el porcentaje de avance. El boton Paquetizar y entregar agrupa todos los archivos del proyecto con un resumen de la informacion y los comentarios en un ZIP, lo guarda en la carpeta de Drive, marca el proyecto como Entregado y abre el enlace de descarga. Tambien puede eliminar un proyecto (su carpeta pasa a la papelera de Drive)."],
["11. Participantes e invitados","El dueno del proyecto y el administrador pueden pulsar Participantes e invitados dentro del proyecto. Un participante es un usuario con cuenta: ve el proyecto, comenta y sube archivos. Un invitado es solo un correo: recibe un enlace temporal (1, 3, 7 o 30 dias) y, al abrirlo, escribe su correo para validar el acceso; solo puede ver el avance, el Gantt, los comentarios y descargar archivos. Los enlaces se pueden copiar y revocar en cualquier momento."],
["12. Chat en vivo y avisos","Con un proyecto abierto, los comentarios, archivos y cambios de avance nuevos aparecen solos en pocos segundos, sin recargar. Cuando alguien comenta, el administrador y los demas participantes reciben un correo de aviso (maximo uno cada 2 minutos por proyecto)."],
["13. Recomendaciones","Cierra sesion con Salir al terminar, sobre todo en equipos compartidos. Si algo no funciona, recarga la pagina e intenta de nuevo; si persiste, escribe al administrador. Portal desarrollado por Industrias I.A. Col para el Hub de Ingenieria Pioner's / Parque Tecnologico - ENTALPIA LABS."]
];
function help(){modal({w:1,h:`<h3>Instrucciones de uso</h3><span class="mu">Portal de Proyectos · Hub de Ingeniería Pioner's</span>${GUIA.map(g=>`<h4>${esc(g[0])}</h4><div style="color:var(--mu)">${esc(g[1])}</div>`).join("")}<div class="err" id="er"></div><div class="acts"><button class="btn" id="pdf">Descargar PDF</button><button class="btn ghost" onclick="cerrar()">Cerrar</button></div>`});$("#pdf").onclick=pdf}
function pdf(){const go=()=>{const d=new window.jspdf.jsPDF({unit:"mm",format:"letter"});let y=20;d.setFont("helvetica","bold");d.setFontSize(16);d.text("Instrucciones - Portal de Proyectos",15,y);y+=7;d.setFont("helvetica","normal");d.setFontSize(10);d.text("Hub de Ingenieria Pioner's / Parque Tecnologico - ENTALPIA LABS · Industrias I.A. Col",15,y);y+=10;
GUIA.forEach(g=>{if(y>255){d.addPage();y=20}d.setFont("helvetica","bold");d.setFontSize(12);d.text(g[0],15,y);y+=6;d.setFont("helvetica","normal");d.setFontSize(10);d.splitTextToSize(g[1],180).forEach(l=>{if(y>270){d.addPage();y=20}d.text(l,15,y);y+=5});y+=4});d.save("Instrucciones_Portal_Proyectos.pdf")};
if(window.jspdf)return go();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=go;s.onerror=()=>{$("#er").textContent="No se pudo cargar el generador de PDF. Revisa tu conexión a internet."};document.head.appendChild(s)}
function reg(){modal(`<img class="l" src="${L.pio}" alt=""><h3>Crear cuenta</h3><span class="mu">Regístrate para crear y seguir tus proyectos.</span><label>Nombre completo</label><input id="n" autocomplete="off"><label>Correo</label><input id="u" type="email" autocomplete="off"><div class="g2"><div><label>Clave de acceso</label><input id="a" type="password" autocomplete="new-password"></div><div><label>Clave de seguridad</label><input id="b" type="password" autocomplete="new-password"></div></div><div class="mu" style="font-size:12px;margin-top:6px">Mínimo 6 caracteres cada una y distintas entre sí.</div><div class="err" id="er"></div><div class="acts"><button class="btn" id="go">Crear cuenta</button><button class="btn ghost" onclick="cerrar()">Cancelar</button></div>`);
const go=$("#go");go.onclick=busy(go,async()=>{await api({a:"registro",nombre:$("#n").value,email:$("#u").value,p1:$("#a").value,p2:$("#b").value});ask1("Cuenta creada. Ingresa con tus claves.")})}
async function uact(o){try{await api(o);D=await api({a:"lista"});users()}catch(e){alert(e.message)}}
const ublk=(e,b)=>uact({a:"ajustar",email:e,estado:b?"activo":"bloqueado"});
const udel=e=>confirm("¿Eliminar a "+e+"? Sus proyectos se conservan.")&&uact({a:"eliminar",email:e});
function uedit(e){const n=prompt("Nuevo nombre para "+e,D.u.find(u=>u.email===e)?.nombre||"");if(n)uact({a:"ajustar",email:e,nombre:n})}
async function delP(id){if(!confirm("¿Eliminar el proyecto? Su carpeta de Drive irá a la papelera."))return;try{await api({a:"borrar",id});D=await api({a:"lista"});render();cerrar()}catch(e){$("#er").textContent=e.message}}
function claves(em){const adm=me.rol==="admin";modal(`<h3>Cambiar claves</h3><span class="mu">${em?esc(em):"Tu cuenta"}</span>${adm?"":`<label>Clave de seguridad actual</label><input id="p0" type="password">`}<div class="g2"><div><label>Nueva clave de acceso</label><input id="a" type="password"></div><div><label>Nueva clave de seguridad</label><input id="b" type="password"></div></div><div class="err" id="er"></div><div class="acts"><button class="btn" id="go">Guardar</button><button class="btn ghost" onclick="cerrar()">Cancelar</button></div>`);
const go=$("#go");go.onclick=busy(go,async()=>{await api({a:"claves",email:em,p0:$("#p0")?.value,p1:$("#a").value,p2:$("#b").value});cerrar()})}
function users(){modal(`<h3>Usuarios</h3>${D.u.map(u=>`<div class="cm">${esc(u.nombre)} · ${esc(u.email)} · <small>${u.rol}${u.estado==="bloqueado"?" · BLOQUEADO":""}</small><div class="acts" style="margin-top:6px"><button class="btn ghost sm" onclick="uedit('${esc(u.email)}')">Editar</button><button class="btn ghost sm" onclick="claves('${esc(u.email)}')">Claves</button>${u.rol==="admin"?"":`<button class="btn ghost sm" onclick="ublk('${esc(u.email)}',${u.estado==="bloqueado"})">${u.estado==="bloqueado"?"Desbloquear":"Bloquear"}</button><button class="btn ghost sm" onclick="udel('${esc(u.email)}')">Eliminar</button>`}</div></div>`).join("")}<h4>Registrar usuario</h4><label>Nombre</label><input id="n"><label>Correo</label><input id="u" type="email"><div class="g2"><div><label>Clave de acceso</label><input id="a" type="password"></div><div><label>Clave de seguridad</label><input id="b" type="password"></div></div><div class="err" id="er"></div><div class="acts"><button class="btn" id="go">Registrar</button><button class="btn ghost" onclick="cerrar()">Cerrar</button></div>`);
const go=$("#go");go.onclick=busy(go,async()=>{await api({a:"usuario",nombre:$("#n").value,email:$("#u").value,p1:$("#a").value,p2:$("#b").value});D=await api({a:"lista"});users()})}
render();if(INV)gask();
</script></body></html>
