async function isoTxt(planoId,v){const r=await api({a:"sgcPlanoLeer",planoId,version:v||undefined});if(!window.DecompressionStream)throw Error("Tu navegador no puede descomprimir el plano. Actualízalo.");
const s=atob(r.b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return{r,txt:await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}}
async function isoJson(planoId,v,b){if(b)b.disabled=true;try{const{r,txt}=await isoTxt(planoId,v);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=(r.plano.nombre+" v"+r.versionLeida).replace(/[\\/:*?"<>|]/g,"_")+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){const x=$("#iser")||$("#er");if(x)x.textContent=e.message;else alert(e.message)}if(b)b.disabled=false}
// ---- Mis dibujos: espacio personal de Isoflux (dibujos aún sin proyecto); se pueden pasar a un proyecto con todas sus versiones ----
async function misDibujos(){modal({w:1,h:`<h3>🗂️ Mis dibujos</h3><p class="mu">Dibujos de Isoflux guardados en tu espacio personal del SGC (solo tú los ves). Pásalos a un proyecto cuando exista: conservan sus versiones, su huella SHA-256 y la bitácora.</p><div class="acts" style="justify-content:flex-start"><button class="btn sm" onclick="isoAbrir('MIS')">+ Nuevo dibujo en Isoflux</button></div><div id="misl"><p class="mu">Cargando…</p></div><div class="err" id="iser"></div>`});
try{const r=await api({a:"sgcPlanosListar",proyectoId:"MIS"}),L=r.planos||[],P=(D&&D.p)||[];
$("#misl").innerHTML=L.length?`<div class="fcs" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:10px">${L.map(m=>`<div style="border:1px solid var(--ln);border-radius:10px;overflow:hidden"><div onclick="isoAbrir('MIS','${esc(m.planoId)}')" title="Abrir en Isoflux" style="cursor:pointer;height:110px;background:#0b131f ${m.miniatura?`url('${m.miniatura}') center/cover`:""}"></div><div style="padding:8px 10px"><b>${esc(m.nombre)}</b> <span class="tag">v${m.version}</span><div class="mu" style="font-size:11.5px">${m.nodos} nodos · ${m.tuberias} tuberías · ${esc(String(m.actualizado||"").slice(0,10))}</div>
<div class="acts" style="justify-content:flex-start;margin-top:6px"><button class="btn sm" onclick="isoAbrir('MIS','${esc(m.planoId)}')">Abrir</button><select class="misp" data-pl="${esc(m.planoId)}" style="max-width:150px"><option value="">➜ Pasar a proyecto…</option>${P.map(p=>`<option value="${esc(p.id)}">${esc(p.titulo)}</option>`).join("")}</select></div></div></div>`).join("")}</div>`:`<p class="mu">Aún no tienes dibujos personales. En Isoflux usa ☁️ Guardar ▸ Mis dibujos.</p>`;
document.querySelectorAll(".misp").forEach(sl=>sl.onchange=async()=>{if(!sl.value)return;const t=sl.options[sl.selectedIndex].text;if(!confirm("¿Pasar este dibujo al proyecto «"+t+"»? Conserva sus versiones y queda registrado en la bitácora."))return void(sl.value="");try{await api({a:"sgcPlanoMover",planoId:sl.dataset.pl,proyectoId:sl.value});misDibujos()}catch(e){$("#iser").textContent=e.message;sl.value=""}})}
catch(e){$("#misl").innerHTML=`<p class="mu">${esc(e.message)}</p>`}}
async function isoArchivar(pid,planoId,arch){if(arch&&!confirm("¿Archivar este plano? No se borra: deja de mostrarse en el proyecto y el administrador puede restaurarlo."))return;try{await api({a:"sgcPlanoArchivar",planoId,archivar:arch});planosProyecto(D.p.find(x=>String(x.id)===String(pid)),!arch)}catch(e){$("#iser").textContent=e.message}}
async function isoVigente(pid,planoId,v,b){if(!confirm("¿Definir la versión v"+v+" como vigente? Será la que entra al paquete de entrega. Queda registrado en la bitácora del SGC."))return;if(b)b.disabled=true;try{await api({a:"sgcPlanoVigente",planoId,version:v});isoVersiones(pid,planoId)}catch(e){alert(e.message);if(b)b.disabled=false}}
async function isoVersiones(pid,planoId){try{const r=await api({a:"sgcPlanoVersiones",planoId}),m=r.plano;
modal({w:1,h:`<h3>🕘 ${esc(m.nombre)}</h3><p class="mu">Versión más reciente: v${m.version} · versión vigente: <b>v${r.vigente}</b>${m.vigentePor?` (definida por ${esc(m.vigentePor)})`:""}. Cada fila es un guardado con su huella SHA-256 (control de cambios del SGC). ${r.puedeVigencia?"Como desarrollador del plano puedes definir cuál versión es la vigente.":"Solo el desarrollador del plano ("+esc(m.autor)+") o el administrador definen la versión vigente."}</p>${r.versiones.map(x=>`<div class="lk"><span><b>v${x.version}</b>${x.version===r.vigente?` <span class="tag" style="background:#2fbf6233;color:#7ee2a8">✔ vigente</span>`:""}${x.version===m.version?` <span class="tag">más reciente</span>`:""} · ${fch(x.fecha)} · ${esc(x.autor)}${x.nota?`<br><small class="mu">${esc(x.nota)}</small>`:""}<br><small class="mu">${isoKb(x.bytes)} · SHA-256 ${esc(String(x.sha256).slice(0,16))}…</small></span><span><button class="btn ghost sm" onclick="isoAbrir('${esc(pid)}','${esc(planoId)}',${x.version===m.version?0:x.version})">Abrir</button> <button class="btn ghost sm" onclick="isoJson('${esc(planoId)}',${x.version},this)">⬇ .json</button>${r.puedeVigencia&&x.version!==r.vigente?` <button class="btn sm" onclick="isoVigente('${esc(pid)}','${esc(planoId)}',${x.version},this)">✔ Marcar vigente</button>`:""}</span></div>`).join("")}<div class="err" id="er"></div><div class="acts"><button class="btn ghost" onclick="det('${esc(pid)}')">Volver al proyecto</button></div>`})}catch(e){alert(e.message)}}

render();if(INV)gask();else if(VER)verificar(VER);else if(AUD)audAsk();
</script></body></html>
