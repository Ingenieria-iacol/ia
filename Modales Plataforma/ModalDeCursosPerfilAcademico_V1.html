        // --- COMPONENTE MODAL · ENTORNO DE FORMACIÓN DE ALTA INGENIERÍA ---
        const CourseModal = ({ plan, onClose, onRegister, onPlay }) => {
            const modalRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (modalRef.current && !modalRef.current.contains(event.target)) {
                        onClose();
                    }
                };
                const handleEscape = (event) => {
                    if (event.key === 'Escape') onClose();
                };
                document.addEventListener("mousedown", handleClickOutside);
                document.addEventListener("keydown", handleEscape);
                return () => {
                    document.removeEventListener("mousedown", handleClickOutside);
                    document.removeEventListener("keydown", handleEscape);
                };
            }, [onClose]);

            if (!plan) return null;

            const isComingSoon = plan.status === 'coming_soon';
            const moduleCount = plan.chapters ? plan.chapters.length : 0;

            const specs = [
                { icon: "Gauge", value: `${plan.matchScore}%`, label: "Coincidencia con tu perfil" },
                { icon: "Clock", value: `${plan.hours} h`, label: "Duración total" },
                { icon: "Layers", value: plan.level, label: "Nivel técnico" },
                { icon: "Award", value: plan.type, label: "Modalidad" }
            ];

            return (
                <div className="eng-modal eng-overlay fixed inset-0 z-50 flex justify-center items-start pt-6 sm:pt-14 px-3 sm:px-4 overflow-y-auto custom-scrollbar">
                    <div 
                        ref={modalRef}
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby="course-modal-title"
                        className="eng-panel relative w-full max-w-4xl rounded-2xl overflow-hidden animate-modal mb-10"
                    >
                        <div className="metal-edge absolute top-0 left-0 right-0 z-30"></div>

                        <button 
                            onClick={onClose}
                            aria-label="Cerrar"
                            className="close-btn eng-focus absolute top-4 right-4 z-30 rounded-full p-2"
                        >
                            <Icon name="X" size={20} />
                        </button>

                        {/* HERO */}
                        <div className={`relative h-[22rem] sm:h-[26rem] w-full bg-gradient-to-b ${plan.gradientColor}`}>
                            <img 
                                src={plan.imageUrl} 
                                alt={plan.title}
                                className={`absolute inset-0 w-full h-full object-cover mix-blend-overlay ${isComingSoon ? 'opacity-30 grayscale' : 'opacity-80'}`}
                                onError={(e) => { e.target.style.display = 'none'; }}
                            />
                            <div className="blueprint absolute inset-0 pointer-events-none"></div>
                            <div className="absolute inset-0 bg-gradient-to-r from-[#0c1119]/70 via-transparent to-transparent"></div>
                            <div className="absolute inset-0 bg-gradient-to-t from-[#0c1119] via-[#0c1119]/20 to-black/30"></div>
                            
                            <div className="absolute bottom-0 left-0 p-6 sm:p-10 w-full z-20">
                                <div className="flex flex-wrap items-center gap-2 mb-4">
                                    {isComingSoon && (
                                        <span className="chip-warn text-xs font-bold px-3 py-1 rounded">
                                            Próximamente
                                        </span>
                                    )}
                                    <span className="chip-steel text-xs font-semibold px-3 py-1 rounded">{plan.category}</span>
                                    <span className="chip-steel text-xs font-semibold px-3 py-1 rounded">{plan.year}</span>
                                </div>

                                <h2 id="course-modal-title" className="metal-title text-3xl sm:text-5xl font-black mb-2 leading-[1.08] tracking-tight">
                                    {plan.title}
                                </h2>
                                <p className="text-sm text-[color:var(--steel-300)] flex items-center gap-2">
                                    <Icon name="User" size={14} />
                                    <span>{plan.instructor}</span>
                                </p>
                                
                                <div className="flex flex-wrap gap-3 mt-6">
                                    {isComingSoon ? (
                                        <button disabled className="flex items-center gap-2 bg-[#1a2535] text-[#7f9bbb] border border-[#243245] px-6 py-2.5 rounded-lg font-bold text-lg cursor-not-allowed">
                                            <Icon name="Lock" size={22} /> No Disponible Aún
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => {
                                                if (plan.enrolled) {
                                                    onPlay(plan.url);
                                                } else {
                                                    // Sinergia: Pasamos ID y URL para redirección inmediata
                                                    onRegister(plan.id, plan.url);
                                                }
                                            }}
                                            className={`metal-btn eng-focus flex items-center gap-2 px-7 py-2.5 rounded-lg text-lg ${plan.enrolled ? 'metal-btn-done' : ''}`}
                                        >
                                            {plan.enrolled ? (
                                                <> <Icon name="CheckCircle" size={22} className="animate-bounce" /> ¡Inscrito con éxito! </>
                                            ) : (
                                                <> <Icon name="PlusCircle" size={22} /> Inscribirse </>
                                            )}
                                        </button>
                                    )}

                                    <button aria-label="Agregar a mi lista" className="ghost-btn eng-focus flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-lg">
                                        <Icon name="Plus" size={22} />
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* TABLERO DE INDICADORES */}
                        <div className="spec-strip grid grid-cols-2 md:grid-cols-4">
                            {specs.map((s, i) => (
                                <div key={i} className={`spec-cell px-6 py-4 ${i === 2 ? 'border-l-0 md:border-l' : ''}`}>
                                    <div className="flex items-center gap-2 text-[color:var(--steel-400)] text-xs mb-1">
                                        <Icon name={s.icon} size={14} />
                                        <span>{s.label}</span>
                                    </div>
                                    <div className="spec-value text-xl font-bold leading-tight">{s.value}</div>
                                </div>
                            ))}
                        </div>

                        {/* CUERPO */}
                        <div className="px-6 sm:px-10 py-8 grid grid-cols-1 md:grid-cols-3 gap-10 text-gray-300">
                            <div className="md:col-span-2">
                                <p className="text-[#d3e0ef] text-base leading-relaxed max-w-[68ch]">{plan.description}</p>
                                
                                {isComingSoon && (
                                    <div className="mt-8 border border-[#243245] rounded-lg p-5 bg-[#101722] flex items-start gap-3">
                                        <Icon name="CalendarClock" size={20} className="text-[#7f9bbb] mt-0.5 flex-shrink-0" />
                                        <p className="text-sm text-[#a9bdd3] leading-relaxed">
                                            Este programa se habilitará próximamente. Cuando esté disponible, aquí verás los módulos y podrás inscribirte.
                                        </p>
                                    </div>
                                )}

                                {!isComingSoon && plan.chapters && (
                                    <div className="mt-8 pt-6 border-t border-[#243245]">
                                        <div className="flex justify-between items-end mb-5">
                                            <h3 className="text-xl font-bold text-white">Módulos</h3>
                                            <span className="text-xs text-[#7f9bbb]">{moduleCount} {moduleCount === 1 ? 'módulo' : 'módulos'}</span>
                                        </div>
                                        <ol className="module-rail space-y-1.5">
                                            {plan.chapters.map((chapter, idx) => (
                                                <li key={idx}>
                                                    <div className="module-row group flex items-center gap-4 p-3 rounded-lg cursor-pointer">
                                                        <span className="module-badge w-[43px] h-[43px] rounded-full flex items-center justify-center text-sm font-bold flex-shrink-0 transition-colors">
                                                            {idx + 1}
                                                        </span>
                                                        <div className="flex-1 min-w-0">
                                                            <h4 className="font-semibold text-gray-200 group-hover:text-white text-sm leading-snug">{chapter.title}</h4>
                                                        </div>
                                                        <span className="text-xs text-[#7f9bbb] font-mono flex-shrink-0">{chapter.duration}</span>
                                                        <Icon name="Play" size={14} className="text-[#a9bdd3] opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0" fill="currentColor" />
                                                    </div>
                                                </li>
                                            ))}
                                        </ol>
                                    </div>
                                )}
                            </div>

                            {/* FICHA TÉCNICA */}
                            <aside className="md:col-span-1 text-sm space-y-6">
                                <div className="rounded-xl border border-[#243245] bg-gradient-to-b from-[#151e2b] to-[#101722] p-5 space-y-5">
                                    <div>
                                        <span className="text-[#7f9bbb] block mb-1 text-xs">Instructor</span>
                                        <span className="text-gray-100 font-medium">{plan.instructor}</span>
                                    </div>
                                    <div>
                                        <span className="text-[#7f9bbb] block mb-1 text-xs">Año de publicación</span>
                                        <span className="text-gray-100 font-medium">{plan.year}</span>
                                    </div>
                                    <div>
                                        <span className="text-[#7f9bbb] block mb-2 text-xs">Normas y temas</span>
                                        <div className="flex flex-wrap gap-2">
                                            {plan.tags.map(tag => (<span key={tag} className="tag-steel px-2.5 py-1 rounded text-xs">{tag}</span>))}
                                        </div>
                                    </div>
                                </div>
                            </aside>
                        </div>
                    </div>
                </div>
            );
        };

        // --- FUNCION HELPER PARA MEZCLAR (SHUFFLE) ---
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- APP PRINCIPAL (RESTURADA Y MEJORADA) ---
        function App() {
            const [plans, setPlans] = useState(initialTrainingPlans);
            const [selectedPlan, setSelectedPlan] = useState(null);
            const [typeFilter, setTypeFilter] = useState('Todos');

            // FILTROS Y MEZCLA DE CURSOS ACTIVOS
            const activePlans = useMemo(() => {
                const active = plans.filter(p => p.status === 'active');
                return shuffleArray(active); 
            }, [plans]);

            const typeOptions = ['Todos', ...Array.from(new Set(activePlans.map(p => p.type)))];
            const visiblePlans = typeFilter === 'Todos' ? activePlans : activePlans.filter(p => p.type === typeFilter);

            const upcomingPlans = plans.filter(p => p.status === 'coming_soon');
            const carouselPlans = [...upcomingPlans, ...upcomingPlans]; 

            const handleRegister = (planId, url) => {
                // 1. Actualizamos el estado global
                const updatedPlans = plans.map(p => {
                    if (p.id === planId) return { ...p, enrolled: true, progress: 0 };
                    return p;
                });
                setPlans(updatedPlans);

                // 2. Sincronizamos el plan seleccionado para feedback visual en el modal
                if (selectedPlan && selectedPlan.id === planId) {
                    setSelectedPlan({ ...selectedPlan, enrolled: true, progress: 0 });
                }

                // 3. Pequeña pausa para UX (confirmación visual) antes de navegar
                setTimeout(() => {
                    if (url) {
                        handleNavigation(url);
                    }
                }, 850);
            };

            const handleNavigation = (url) => {
                if (!url) return;
                try {
                    const baseUrl = window.location.href;
                    const targetUrl = new URL(url, baseUrl).href;
                    window.location.href = targetUrl;
                } catch (error) {
                    window.open(url, '_self');
                }
            };

            return (
                <div className="flex flex-col h-screen bg-[#0b0b0b] font-sans text-gray-100 overflow-hidden relative">
                    
                    <header className="flex items-center justify-between px-8 py-5 bg-[#0b0b0b]/95 backdrop-blur border-b border-gray-800 z-30 sticky top-0">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-800 rounded-xl flex items-center justify-center shadow-lg shadow-blue-900/20">
                                <Icon name="LayoutGrid" className="w-6 h-6 text-white" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight leading-none">GasEngineering<span className="text-gray-500 font-normal">Hub</span></h1>
                                <p className="text-xs text-gray-400 mt-1">Portal de Formación Profesional</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            <button onClick={() => handleNavigation('../Modales Plataforma/interfazDeOpcionInicio.html')} className="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-800/50 hover:bg-gray-700 text-gray-300 hover:text-white transition-all border border-gray-700 hover:border-gray-600 group">
                                <Icon name="ArrowLeft" size={18} className="group-hover:-translate-x-1 transition-transform" />
                                <span className="hidden sm:inline font-medium text-sm">Volver al Inicio</span>
                            </button>
                            <div className="flex items-center gap-3 pl-6 border-l border-gray-800">
                                <div className="text-right hidden sm:block">
                                    <p className="text-sm font-semibold">Ing. Estudiante</p>
                                    <p className="text-xs text-green-500">Cuenta Activa</p>
                                </div>
                                <div className="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center font-bold border border-gray-600">IE</div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto custom-scrollbar p-8">
                        <div className="max-w-7xl mx-auto space-y-12">
                            
                            {/* SECCIÓN 1: CURSOS DISPONIBLES */}
                            <section className="catalog">
                                <div className="mb-8 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-5">
                                    <div className="flex items-center gap-4">
                                        <div className="catalog-icon w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <Icon name="BookOpenCheck" size={24} />
                                        </div>
                                        <div>
                                            <h2 className="text-3xl font-bold text-white leading-tight">Cursos Disponibles</h2>
                                            <p className="text-sm text-[#7f9bbb] mt-1">{visiblePlans.length} {visiblePlans.length === 1 ? 'programa' : 'programas'} listos para iniciar</p>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap gap-2" role="group" aria-label="Filtrar por modalidad">
                                        {typeOptions.map(opt => (
                                            <button
                                                key={opt}
                                                onClick={() => setTypeFilter(opt)}
                                                aria-pressed={typeFilter === opt}
                                                className="filter-chip eng-focus px-4 py-1.5 rounded-full text-sm"
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {visiblePlans.map(plan => (
                                        <article 
                                            key={plan.id}
                                            role="button"
                                            tabIndex={0}
                                            aria-label={`Ver programa: ${plan.title}`}
                                            onClick={() => setSelectedPlan(plan)}
                                            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSelectedPlan(plan); } }}
                                            className="course-card group relative flex flex-col rounded-2xl overflow-hidden cursor-pointer"
                                        >
                                            <div className="card-edge absolute top-0 left-0 right-0 z-20"></div>

                                            <div className={`relative h-44 bg-gradient-to-b ${plan.gradientColor} overflow-hidden`}>
                                                <img 
                                                    src={plan.imageUrl} 
                                                    alt={plan.title}
                                                    className="absolute inset-0 w-full h-full object-cover opacity-70 mix-blend-overlay group-hover:scale-105 transition-transform duration-700"
                                                    onError={(e) => { e.target.style.display = 'none'; }}
                                                />
                                                <div className="card-blueprint absolute inset-0 pointer-events-none"></div>
                                                <div className="absolute inset-0 bg-gradient-to-t from-[#101722] via-[#101722]/20 to-transparent"></div>

                                                <div className="absolute top-3 left-3 right-3 flex items-center justify-between gap-2 z-10">
                                                    <span className="card-chip text-xs font-semibold px-2.5 py-1 rounded truncate">{plan.category}</span>
                                                    <span className="card-chip text-xs font-semibold px-2.5 py-1 rounded flex-shrink-0">{plan.type}</span>
                                                </div>
                                            </div>

                                            <div className="flex-1 flex flex-col p-5 pt-3">
                                                <h3 className="text-lg font-bold text-white leading-snug line-clamp-2 mb-1">{plan.title}</h3>
                                                <p className="text-xs text-[#7f9bbb] mb-3 flex items-center gap-1.5">
                                                    <Icon name="User" size={12} />
                                                    <span className="truncate">{plan.instructor}</span>
                                                </p>
                                                <p className="text-sm text-[#a9bdd3] leading-relaxed line-clamp-3 mb-4">{plan.description}</p>

                                                <div className="flex flex-wrap gap-1.5 mt-auto">
                                                    {plan.tags.slice(0, 3).map(tag => (
                                                        <span key={tag} className="tag-steel px-2 py-0.5 rounded text-[11px]">{tag}</span>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="card-readouts grid grid-cols-4 text-center bg-[#0c1119]/60">
                                                <div className="py-3 px-1">
                                                    <div className="text-sm font-bold text-[#d3e0ef]">{plan.hours} h</div>
                                                    <div className="text-[10px] text-[#7f9bbb]">Duración</div>
                                                </div>
                                                <div className="py-3 px-1">
                                                    <div className="text-sm font-bold text-[#d3e0ef] truncate">{plan.level}</div>
                                                    <div className="text-[10px] text-[#7f9bbb]">Nivel</div>
                                                </div>
                                                <div className="py-3 px-1">
                                                    <div className="text-sm font-bold text-[#d3e0ef]">{plan.year}</div>
                                                    <div className="text-[10px] text-[#7f9bbb]">Año</div>
                                                </div>
                                                <div className="card-cta py-3 px-1 flex flex-col items-center justify-center gap-0.5">
                                                    <Icon name="ArrowRight" size={18} className="group-hover:translate-x-1 transition-transform" />
                                                    <div className="text-[10px]">Ver</div>
                                                </div>
                                            </div>
                                        </article>
                                    ))}
                                </div>
                            </section>

                            {/* SECCIÓN 2: PRÓXIMAMENTE (CARRUSEL ROTATIVO RESTAURADO) */}
                            <section className="overflow-hidden">
                                <div className="mb-6 flex items-center gap-3">
                                    <Icon name="CalendarClock" className="text-gray-500" />
                                    <h2 className="text-2xl font-bold text-gray-300">Próximamente</h2>
                                </div>

                                <div className="carousel-container w-full overflow-hidden relative pb-4">
                                    <div className="absolute left-0 top-0 bottom-0 w-20 bg-gradient-to-r from-[#0b0b0b] to-transparent z-10 pointer-events-none"></div>
                                    <div className="absolute right-0 top-0 bottom-0 w-20 bg-gradient-to-l from-[#0b0b0b] to-transparent z-10 pointer-events-none"></div>

                                    <div className="carousel-track py-2">
                                        {carouselPlans.map((plan, index) => (
                                            <div 
                                                key={`${plan.id}-${index}`} 
                                                onClick={() => setSelectedPlan(plan)}
                                                className="relative flex-shrink-0 w-64 h-80 bg-[#151515] rounded-xl border border-gray-800 overflow-hidden cursor-pointer group hover:scale-105 transition-transform duration-300 opacity-60 hover:opacity-100 grayscale hover:grayscale-0"
                                            >
                                                <div className="absolute top-3 right-3 z-20">
                                                    <span className="bg-gray-800/80 backdrop-blur text-gray-300 text-[10px] font-bold px-2 py-1 rounded border border-gray-600">
                                                        PRONTO
                                                    </span>
                                                </div>

                                                <div className={`h-1/2 ${plan.imageColor} relative`}>
                                                    <img 
                                                        src={plan.imageUrl} 
                                                        alt={plan.title}
                                                        className="absolute inset-0 w-full h-full object-cover opacity-50 mix-blend-overlay"
                                                    />
                                                    <div className="absolute inset-0 bg-gradient-to-t from-[#151515] to-transparent"></div>
                                                </div>
                                                
                                                <div className="p-4 h-1/2 flex flex-col relative z-10">
                                                    <div className="text-xs font-bold text-blue-500 mb-1">{plan.category}</div>
                                                    <h3 className="font-bold text-base text-gray-300 leading-tight mb-2 line-clamp-2">
                                                        {plan.title}
                                                    </h3>
                                                    <div className="mt-auto flex items-center gap-2 text-xs text-gray-500">
                                                        <Icon name="Lock" size={12} />
                                                        <span>Disponible 2025</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                        </div>
                    </main>

                    {selectedPlan && (
                        <CourseModal 
                            plan={selectedPlan} 
                            onClose={() => setSelectedPlan(null)}
                            onRegister={handleRegister}
                            onPlay={handleNavigation}
                        />
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
