<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
      body { background-color: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
      .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      .btn-entalpia { background-color: #004a99; color: white; }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div id="contenedor-principal" class="card p-4 mx-auto" style="max-width: 500px;">
        <h2 class="text-center mb-4">Registro Diagnóstico</h2>
        
        <div id="form-registro">
          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez">
          </div>
          <div class="mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" id="correo" class="form-control" placeholder="juan@correo.com">
          </div>
          <button class="btn btn-entalpia w-100" onclick="ejecutarRegistro('plan_diagnostico_01')">Registrarme</button>
        </div>

        <div id="mensaje-respuesta" class="mt-3 text-center"></div>
      </div>
    </div>

    <script>
      // Simulación de los planes que tenías en React para obtener la URL
      const trainingPlans = [
        { id: 'plan_diagnostico_01', url: 'https://tu-pagina-de-destino.com', name: 'Diagnóstico Inicial' }
      ];

      function ejecutarRegistro(planId) {
        const nombre = document.getElementById('nombre').value;
        const correo = document.getElementById('correo').value;
        const btn = document.querySelector('.btn-entalpia');
        
        const urlDelScript = "https://script.google.com/macros/s/AKfycbz-EBrQzLQg13TGnV28EjKt7iUAaiSbmL23QLkjtQ7YR7OB_O8Quga-aupLLDatGQKffw/exec";

        if(!nombre || !correo) return alert("Por favor llena todos los campos");

        btn.disabled = true;
        btn.innerText = "Procesando...";

        const formData = new FormData();
        formData.append('nombre', nombre);
        formData.append('correo', correo);

        fetch(urlDelScript, {
          method: "POST",
          body: formData,
          mode: 'no-cors'
        })
        .then(() => {
          document.getElementById('mensaje-respuesta').innerHTML = 
            `<div class="alert alert-success">¡Registro exitoso! Redirigiendo...</div>`;
          btn.innerText = "Registrado";

          // --- LÓGICA DE REDIRECCIÓN ADAPTADA ---
          // 1. Buscamos el plan para obtener la URL
          const planToRedir = trainingPlans.find(p => p.id === planId);
          
          // 2. Ejecutamos la navegación si existe la URL
          if (planToRedir && planToRedir.url) {
            handleNavigation(planToRedir.url);
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert("Hubo un error al conectar con el servidor.");
          btn.disabled = false;
          btn.innerText = "Registrarme";
        });
      }

      // Función de navegación adaptada a Vanilla JS
      function handleNavigation(url) {
        if (!url) return;
        try {
          const baseUrl = window.location.href;
          const targetUrl = new URL(url, baseUrl).href;
          window.location.href = targetUrl;
        } catch (error) {
          window.location.href = url;
        }
      }
    </script>
  </body>
</html>
