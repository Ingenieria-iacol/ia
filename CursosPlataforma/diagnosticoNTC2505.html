<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
      body { background-color: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
      .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      .btn-entalpia { background-color: #004a99; color: white; }
      .btn-entalpia:hover { background-color: #003366; color: white; }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div id="contenedor-principal" class="card p-4 mx-auto" style="max-width: 500px;">
        <h2 class="text-center mb-4">Registro Diagnóstico</h2>
        
        <div id="form-registro">
          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez">
          </div>
          <div class="mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" id="correo" class="form-control" placeholder="juan@correo.com">
          </div>
          <button class="btn btn-entalpia w-100" id="btn-registro" onclick="ejecutarRegistro()">Registrarme</button>
        </div>

        <div id="mensaje-respuesta" class="mt-3 text-center"></div>
      </div>
    </div>

    <script>
      function ejecutarRegistro() {
        const nombre = document.getElementById('nombre').value;
        const correo = document.getElementById('correo').value;
        const btn = document.getElementById('btn-registro');
        const msgDiv = document.getElementById('mensaje-respuesta');
        
        if(!nombre || !correo) return alert("Por favor llena todos los campos");

        // UI Feedback
        btn.disabled = true;
        btn.innerText = "Procesando...";
        msgDiv.innerHTML = "";

        // Llamada al servidor
        google.script.run
          .withSuccessHandler(function(res) {
            if(res.status === "success") {
              msgDiv.innerHTML = `<div class="alert alert-success">${res.mensaje}</div>`;
              document.getElementById('form-registro').style.display = 'none';
            } else {
              msgDiv.innerHTML = `<div class="alert alert-danger">${res.mensaje}</div>`;
              btn.disabled = false;
              btn.innerText = "Registrarme";
            }
          })
          .withFailureHandler(function(err) {
            msgDiv.innerHTML = `<div class="alert alert-danger">Error de conexión: ${err}</div>`;
            btn.disabled = false;
            btn.innerText = "Registrarme";
          })
          .registrarUsuarioAutomatico(nombre, correo);
      }
    </script>
  </body>
</html>
