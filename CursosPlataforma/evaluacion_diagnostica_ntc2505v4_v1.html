<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
      body { background-color: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
      .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      .btn-entalpia { background-color: #004a99; color: white; }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div id="contenedor-principal" class="card p-4 mx-auto" style="max-width: 500px;">
        <h2 class="text-center mb-4">Registro Diagnóstico</h2>
        
        <div id="form-registro">
          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez">
          </div>
          <div class="mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" id="correo" class="form-control" placeholder="juan@correo.com">
          </div>
          <button class="btn btn-entalpia w-100" onclick="ejecutarRegistro()">Registrarme</button>
        </div>

        <div id="mensaje-respuesta" class="mt-3 text-center"></div>
      </div>
    </div>

    <script>
     function ejecutarRegistro() {
  const nombre = document.getElementById('nombre').value;
  const correo = document.getElementById('correo').value;
  const btn = document.querySelector('.btn-entalpia');
  const mensajeDiv = document.getElementById('mensaje-respuesta');
  
  // REEMPLAZA ESTA URL por la que obtienes en "Implementar" -> "Nueva implementación"
  const urlDelScript = "https://script.google.com/macros/s/TU_ID_AQUÍ/exec"; 

  if(!nombre || !correo) {
    alert("Por favor llena todos los campos");
    return;
  }

  // Estética de carga
  btn.disabled = true;
  btn.innerText = "Procesando...";
  mensajeDiv.innerHTML = "";

  // Construcción de URL con parámetros
  const urlFinal = `${urlDelScript}?nombre=${encodeURIComponent(nombre)}&correo=${encodeURIComponent(correo)}`;

  fetch(urlFinal, {
    method: "POST",
    mode: 'no-cors' // Mantenemos no-cors para evitar bloqueos de navegador en el envío silencioso
  })
  .then(() => {
    // Éxito visual
    mensajeDiv.innerHTML = `
      <div class="alert alert-success">
        ¡Registro enviado con éxito! Revisa la base de datos.
      </div>`;
    btn.innerText = "Registrado";
  })
  .catch(error => {
    console.error('Error:', error);
    alert("Hubo un error al conectar con el servidor.");
    btn.disabled = false;
    btn.innerText = "Registrarme";
  });
}
    </script>
  </body>
</html>
