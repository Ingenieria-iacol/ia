<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muihub | Hub de Ingeniería</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #002855; 
            --accent: #00f2ff;  
            --bg: #0a0e14;      
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #e0e0e0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #001529, #0a0e14);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Perfil de Empresa */
        .header-profile {
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,40,85,1) 0%, rgba(10,14,20,0) 100%);
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: var(--accent);
            border-radius: 20px; /* Estilo App moderna */
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--primary);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.2);
        }

        .company-info h1 { margin: 0; font-size: 1.6rem; letter-spacing: 2px; }
        .company-info p { margin: 5px 0; opacity: 0.6; font-size: 0.85rem; }

        /* Buscador */
        .search-container {
            width: 90%;
            max-width: 460px;
            margin-bottom: 20px;
        }

        #appSearch {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        #appSearch:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.12);
        }

        /* Contenedor de Apps */
        .hub-container {
            width: 90%;
            max-width: 500px;
            flex-grow: 1;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-card:hover {
            border-color: var(--accent);
            background: rgba(0, 242, 255, 0.05);
        }

        .app-icon {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .app-details h3 { margin: 0; font-size: 1rem; }
        .app-details p { margin: 3px 0 0; font-size: 0.75rem; color: var(--accent); opacity: 0.7; }

        /* Botón Salir */
        .logout-btn {
            margin: 20px 0;
            background: transparent;
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            padding: 8px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .logout-btn:hover { background: #ff4d4d; color: white; }

        .footer { font-size: 0.65rem; opacity: 0.3; padding: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <section class="header-profile">
        <div class="avatar">MUI</div>
        <div class="company-info">
            <h1>ENTHALPIA</h1>
            <p>Muihub de Ingeniería</p>
        </div>
    </section>

    <div class="search-container">
        <input type="text" id="appSearch" placeholder="Buscar herramienta o proyecto..." onkeyup="filterApps()">
    </div>

    <main class="hub-container" id="appGrid">
        
        <a href="../inse/Indicador de avance de obra - Nave industrial - Camara Desgasificacion Centelsa.html" class="app-card">
            <div class="app-icon">📊</div>
            <div class="app-details">
                <h3>Indicador Centelsa</h3>
                <p>Avance de Obra - Cámara Desgasificación</p>
            </div>
        </a>

        <a href="../inse/carpeta_compartida_inse.html" class="app-card">
            <div class="app-icon">📁</div>
            <div class="app-details">
                <h3>Portal Carpeta Compartida</h3>
                <p>Gestión Documental INSE</p>
            </div>
        </a>

        <a href="../inse/portal_colgas_inse.html" class="app-card">
            <div class="app-icon">⚡</div>
            <div class="app-details">
                <h3>Portal Colgas</h3>
                <p>Herramientas y Recursos Colgas</p>
            </div>
        </a>

    </main>

    <button class="logout-btn" onclick="exitApp()">CERRAR SESIÓN</button>

    <footer class="footer">
        SISTEMA DE GESTIÓN CENTRALIZADO &copy; 2024
    </footer>

    <script>
        function filterApps() {
            let input = document.getElementById('appSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].querySelector('h3').innerText.toLowerCase();
                let desc = cards[i].querySelector('p').innerText.toLowerCase();
                if (title.includes(input) || desc.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function exitApp() {
            if(confirm("¿Desea cerrar el Muihub de Ingeniería?")) {
                window.location.href = "about:blank"; // Simula salida
            }
        }
    </script>
</body>

</html>
