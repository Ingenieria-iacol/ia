window.estado = {
    view: { x: 0, y: 0, scale: 2.5, angle: Math.PI / 6 }, // Zoom inicial mejorado
    lastMouse: { x: 0, y: 0 },
    isPanning: false,
    isRotating: false,
    showTags: true
};

window.CADMath = {
    isoToScreen: (x, y, z) => {
        const angle = window.estado.view.angle;
        // Rotación básica de la rejilla isométrica
        const nx = x * Math.cos(angle) - y * Math.sin(angle);
        const ny = x * Math.sin(angle) + y * Math.cos(angle);
        return { x: nx * 30, y: (ny * 15) - (z * 40) }; // Escala de visualización
    }
};

window.AppCore = {
    elementos: PLANO_DATA.elementos,
    seleccionado: null,
    centrar: function() {
        // Encontrar límites para auto-centrado
        if (this.elementos.length === 0) return;
        
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        this.elementos.forEach(el => {
            const p = window.CADMath.isoToScreen(el.x, el.y, el.z);
            minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        });

        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        
        window.estado.view.x = (window.innerWidth / 2) - centerX;
        window.estado.view.y = (window.innerHeight / 2) - centerY;
        window.Renderer.actualizar();
    }
};

window.Renderer = {
    actualizar: function() {
        const elLayer = document.getElementById('layer-elements');
        const tagLayer = document.getElementById('layer-tags');
        elLayer.innerHTML = '';
        tagLayer.innerHTML = '';

        window.AppCore.elementos.forEach(el => {
            this.drawPipe(el, elLayer);
            if (window.estado.showTags) this.drawTechnicalTag(el, tagLayer);
        });

        const v = window.estado.view;
        document.getElementById('viewport').setAttribute("transform", `translate(${v.x}, ${v.y}) scale(${v.scale})`);
        document.getElementById('hud-zoom').innerText = Math.round(v.scale * 100);
    },

    drawPipe: function(el, container) {
        const s = window.CADMath.isoToScreen(el.x, el.y, el.z);
        const e = window.CADMath.isoToScreen(el.x + (el.dx||0), el.y + (el.dy||0), el.z + (el.dz||0));
        
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", s.x); line.setAttribute("y1", s.y);
        line.setAttribute("x2", e.x); line.setAttribute("y2", e.y);
        
        // Color por tipo de tramo (vertical vs horizontal)
        const isVert = Math.abs(el.dz || 0) > 0;
        const color = window.AppCore.seleccionado === el.id ? "#0071eb" : (isVert ? "#ff5500" : "#ffd700");
        
        line.setAttribute("stroke", color);
        line.setAttribute("stroke-width", isVert ? "3" : "4");
        line.setAttribute("stroke-linecap", "round");
        line.style.cursor = "pointer";
        line.onclick = (ev) => { ev.stopPropagation(); window.Props.ver(el); };
        container.appendChild(line);
    },

    drawTechnicalTag: function(el, container) {
        const px = el.x + (el.dx || 0) / 2;
        const py = el.y + (el.dy || 0) / 2;
        const pz = el.z + (el.dz || 0) / 2;
        const pos = window.CADMath.isoToScreen(px, py, pz);

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `translate(${pos.x}, ${pos.y - 10})`);
        g.setAttribute("style", "pointer-events:none;");

        const info = el.props.diamNominal ? `${el.props.diamNominal} (${el.props.longitudManual}m)` : `${el.props.longitudManual}m`;

        const txtSub = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txtSub.setAttribute("fill", "#00f2ff");
        txtSub.setAttribute("font-size", "4px");
        txtSub.setAttribute("text-anchor", "middle");
        txtSub.textContent = info;

        g.appendChild(txtSub);
        container.appendChild(g);
    }
};

window.Props = {
    ver: function(el) {
        window.AppCore.seleccionado = el.id;
        window.Renderer.actualizar();
        const card = document.getElementById('prop-card');
        card.style.display = 'block';

        let html = `<div class="prop-title">TRAMO TUBERÍA</div>`;
        html += `<div class="prop-row"><label>ID Interno</label><div class="prop-val">${el.id}</div></div>`;
        html += `<div class="prop-row"><label>Cota Inicial (X,Y,Z)</label><div class="prop-val">${el.x}, ${el.y}, ${el.z}</div></div>`;
        html += `<div class="prop-row"><label>Diámetro</label><div class="prop-val">${el.props.diamNominal || 'N/A'}</div></div>`;
        html += `<div class="prop-row"><label>Longitud</label><div class="prop-val">${el.props.longitudManual} m</div></div>`;
        
        document.getElementById('prop-content').innerHTML = html;
    },
    cerrar: function() {
        document.getElementById('prop-card').style.display = 'none';
        window.AppCore.seleccionado = null;
        window.Renderer.actualizar();
    }
};

// Interacción
const svg = document.getElementById('canvas');
svg.onmousedown = (e) => {
    window.estado.lastMouse = { x: e.clientX, y: e.clientY };
    if (e.button === 0) window.estado.isPanning = true;
    if (e.button === 2) window.estado.isRotating = true;
};
window.onmousemove = (e) => {
    const dx = e.clientX - window.estado.lastMouse.x;
    const dy = e.clientY - window.estado.lastMouse.y;
    if (window.estado.isPanning) { window.estado.view.x += dx; window.estado.view.y += dy; }
    if (window.estado.isRotating) { window.estado.view.angle += dx * 0.01; window.Renderer.actualizar(); }
    window.estado.lastMouse = { x: e.clientX, y: e.clientY };
    if (window.estado.isPanning) window.Renderer.actualizar();
};
window.onmouseup = () => { window.estado.isPanning = false; window.estado.isRotating = false; };
svg.onwheel = (e) => { e.preventDefault(); window.estado.view.scale *= (e.deltaY > 0 ? 0.9 : 1.1); window.Renderer.actualizar(); };
svg.oncontextmenu = (e) => e.preventDefault();

window.UI = {
    toggleTags: () => { window.estado.showTags = !window.estado.showTags; window.Renderer.actualizar(); }
};

window.onload = () => {
    window.AppCore.centrar();
};
</script>
